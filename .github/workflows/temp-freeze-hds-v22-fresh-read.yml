name: temp-freeze-hds-v22-fresh-read
on:
  push:
    branches: [dev/schema-integration]
    paths: ['.github/workflows/temp-freeze-hds-v22-fresh-read.yml']
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze independent HDS V2.2 fresh read
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          sp=Path('00_START_HERE/CURRENT_STATE.json')
          s=json.loads(sp.read_text(encoding='utf-8')); a=s['audit']
          a['deep_read_needs_visual_review']=27
          a['deep_read_textual_fresh_read_completed']=27
          a['deep_read_in_progress']=1
          a['deep_read_current_document_id']='HDS_V2.2'
          a['deep_read_previous_document_id']='HDS_V2.1'
          a['next_natural_deep_read_document_id']='HDS_V2.2'
          a['hds_v2_2_deep_read_report']='docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.2.md'
          a['hds_v2_2_source_pin']={
            'sha256':'bf62b7a8b6cfdf654181b48da2d85a805118687c7463a46fadfd32679c9b7577',
            'size_bytes':802399,
            'evidence_run':'33266549282',
            'pinned_at_utc':'2026-08-29T17:47:37Z',
            'pdf_authority':'official_public_VDV_writing',
            'service_authority_status':'non_xsd_dns_sd_http_profile'
          }
          a['hds_v2_2_visual_evidence']={
            'pinned_byte_render_run':'33266588436',
            'render_job':'99137608617',
            'artifact_id':'9718826204',
            'pages_reviewed':[7,8,9,10,11],
            'status':'targeted_visible_review_complete_independent_fresh_read'
          }
          a['hds_v2_2_authority']={
            'dedicated_service_xsd':False,
            'official_release_tag_checked':'VDV-301-2.2',
            'official_release_tag_commit':'f283697124750d12189b960b302b399769bad530',
            'service_model':'non_xsd_dns_sd_http_profile',
            'dns_sd_service_name':'HtmlDisplayService',
            'dns_sd_transport':'_http._tcp',
            'dns_sd_txt_keys':['content','url'],
            'content_endpoint_source':'TXT url',
            'xsd_boundary':'No HDS XML contract is inferred or selected.'
          }
          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          dp=Path('audit_registry/deep_read_registry_delta_hds_v22_2026-08-29.json')
          d=json.loads(dp.read_text(encoding='utf-8'))
          h=d['document_updates']['HDS_V2.2']
          h['state']='fresh_read_visible_review_complete_pending_historical_reconciliation'
          h['fresh_read_started']='2026-08-29'
          h['textual_fresh_read_complete']=True
          h['historical_context_note']='The broader historical HDS block had already been seen during the prior V2.1 reconciliation. For this V2.2 pass, no historical V2.2 statement was used as factual authority: all V2.2 observations below were independently re-derived from the pinned V2.2 bytes before V2.2 reconciliation.'
          h['historical_v22_profile_not_used_as_source_during_fresh_read']=True
          h['visual_evidence']={
            'interactive_screenshot_result':'cache_miss_fallback_used',
            'pinned_byte_render_run':'33266588436',
            'render_job':'99137608617',
            'artifact_id':'9718826204',
            'artifact_zip_sha256':'54ae8617da6f26f31a855925f54af0059d7dec1001c0932ed75f4bee4d6e1267',
            'fulltext_sha256':'c0db2e41ddaf56ac90b8f2e51957ed2190923e859ad5754ea4db989d79ea745d',
            'pages_reviewed':[7,8,9,10,11],
            'page_png_sha256':{
              '7':'1d7064db8f4ebf5d7e37d9dd177bd9af8a37e49f6deaf688debefbef2851e39f',
              '8':'5f3899e84db643ec680e1048ae9dc630f5d474cf189cf93c4dcd3f276e145956',
              '9':'42d98d492e9cae5784f05c4d53630d8c45766589e5e6962eaa7c0b17e52e7d06',
              '10':'fd4ddefa0ac65aaa24ad1af763feac6dd44d12a73d20dada8f3968ed9826a251',
              '11':'4f6e8bc0707ae42598dbdb6cce92d1847978e66e55ed5a9a4aaae0099e332d98'
            },
            'status':'visible_review_complete_for_independent_fresh_read'
          }
          h['fresh_observations']=[
            'The publication again states that HtmlDisplayService defines no own protocol and uses DNS-SD plus HTTP/browser delivery.',
            'V2.2 publishes service name HtmlDisplayService over _http._tcp.',
            'The V2.2 TXT record contains content and url.',
            'TXT url contains the access URL and may also contain query or fragment components.',
            'TXT content remains project-specific and not standardized by the publication.',
            'Multiple URLs require separate DNS-SD entries with corresponding content names.',
            'SRV port is still published but explicitly has no meaning for the content access address; SRV host identifies the publishing device.',
            'The publication imposes no HTTP-content requirements beyond browser/provider interoperability being agreed between suppliers.',
            'The V2.2 version history explicitly records new TXT url replacing host, port and path for access-address construction.',
            'The official VDV-301-2.2 tag contains no dedicated HtmlDisplayService service XSD.'
          ]
          h['active_falsification']=[
            'Potential contradiction rejected: version-history wording that url replaces host/port/path does not mean SRV host/port records disappear; the main profile still lists them and assigns publisher/discovery-only roles.',
            'Potential hidden-XSD inference rejected: foreword wording about specific data structures is insufficient to establish an XML contract, and no dedicated HDS schema exists in the exact official tag.'
          ]
          h['fresh_findings']=[]
          h['historical_reconciliation']='pending_after_V2.2_fresh_read_freeze'
          dp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          report='''# HTMLDisplayService V2.2 — Deep Read Pass 2\n\nStatus: independent V2.2 source read and targeted visible review complete; V2.2 historical reconciliation pending.\n\n## Source and authority\n\n- Official publication: VDV-Schrift 301-2-17, HTMLDisplayService V2.2, 08/2019.\n- Official URL: https://www.vdv.de/301-2-17-sdes-v2-2-htmldisplayservice.pdfx\n- Pinned SHA-256: `bf62b7a8b6cfdf654181b48da2d85a805118687c7463a46fadfd32679c9b7577`\n- Size: `802399` bytes.\n- Pin run: `33266549282`.\n- Official release tag checked: `VDV-301-2.2` / commit `f283697124750d12189b960b302b399769bad530`.\n- No dedicated HtmlDisplayService XSD exists in that exact official tag or in the integration root pool.\n- Service authority: **non-XSD DNS-SD/HTTP profile**.\n\n## Visual evidence\n\nThe interactive PDF screenshot path returned cache miss. Exact pinned-byte fallback was therefore used.\n\n- Render/read run: `33266588436`\n- Job: `99137608617`\n- Artifact: `9718826204`\n- Artifact digest: `54ae8617da6f26f31a855925f54af0059d7dec1001c0932ed75f4bee4d6e1267`\n- Extracted full-text SHA-256: `c0db2e41ddaf56ac90b8f2e51957ed2190923e859ad5754ea4db989d79ea745d`\n- Visibly reviewed pages: 7, 8, 9, 10, 11.\n\n## Independence boundary\n\nThe broader historical HDS audit had already been viewed during the preceding V2.1 reconciliation. For this V2.2 pass, those historical V2.2 statements were not used as factual authority. The V2.2 facts below were independently re-derived from the pinned V2.2 source before performing V2.2 reconciliation.\n\n## Independent V2.2 observations\n\n1. HDS remains a DNS-SD/HTTP/browser profile and the text again states that it defines no own protocol.\n2. DNS-SD service name: `HtmlDisplayService`; protocol label: `_http._tcp`.\n3. TXT entries are `content` and `url`.\n4. `url` contains the access URL and may include query and fragment components.\n5. `content` is project-specific and not standardized.\n6. Multiple content URLs are published as separate DNS-SD entries.\n7. SRV `Port` remains published but is explicitly said to have no meaning for the content address. `Host` identifies the publishing device.\n8. The HTTP content itself is intentionally not standardized by this service publication.\n9. The V2.2 version history explicitly records `url` as a new TXT entry replacing `host`, `port` and `path` for access-address construction.\n\n## Active falsification\n\nA superficial reading of the version history could suggest that SRV host/port are removed in V2.2. This is disproved by the main V2.2 discovery table, which still publishes both; the prose limits their role and makes TXT `url` the content address.\n\nThe foreword says the publication describes HDS and its specific data structures. This wording is not promoted into an XML/XSD claim: the exact release inventory has no dedicated HDS schema and the concrete service definition is DNS-SD/HTTP.\n\n## Fresh finding result\n\nNo new unique V2.2 finding is promoted from the independent fresh read. The V2.2 profile change is normative version-specific behavior, not by itself a defect.\n\n## Next gate\n\nReconcile the already-existing HDS historical register against this frozen V2.2 source. Do not back-apply V2.1 `content + path` endpoint reconstruction to V2.2.\n'''
          Path('docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.2.md').write_text(report,encoding='utf-8')

          for p in [sp,dp]: json.loads(p.read_text(encoding='utf-8'))
          PY
      - name: Commit V2.2 freeze and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add 00_START_HERE/CURRENT_STATE.json audit_registry/deep_read_registry_delta_hds_v22_2026-08-29.json docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.2.md
          git rm .github/workflows/temp-freeze-hds-v22-fresh-read.yml
          if git diff --cached --name-only | grep -E '\.xsd$'; then exit 1; fi
          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git commit -m 'Freeze independent HTMLDisplayService V2.2 fresh read'
          git push origin HEAD:dev/schema-integration
