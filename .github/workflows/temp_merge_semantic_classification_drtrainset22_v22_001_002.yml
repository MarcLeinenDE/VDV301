name: temp-merge-semantic-classification-drtrainset22-v22-001-002

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drtrainset22_v22_001_002.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drtrainset22-v22-001-002:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2
      - name: Verify exact prestate and TrainSet V2.2 navigation boundary
        shell: bash
        run: |
          set -euo pipefail
          STAGED_BASE=503aa4a6cb5f615cc4bb9996e16abb6dafaf07fe
          CLEAN_BASE=60f7c764d102d3a553116c8039a8ce17bb6baaf9
          test "$(git rev-parse HEAD^)" = "$STAGED_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drtrainset22_v22_001_002.yml"
          test "$(git hash-object audit_registry/semantic_classification_blocks/DRTRAINSET22_V22_001_002_v0.1.json)" = "f0207aaf8fe58f0c200011baf8d28b6485205e26"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "c1cb5a135cd5d7b18b048e3ce7c857951de4f6d5"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/drtrainset22_revalidation_evidence_2026-09-06.json)" = "0fc04a70fdeb90a09f36124adae39d0ae4822acf"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTRAINSET22_2026-09-06.md)" = "a72c4f1890887ac94839f6bb9c969803a618559d"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.2.md)" = "61850045c26fb2a848c4670f1418fdb809ab475c"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          target={'DRTRAINSET22-001','DRTRAINSET22-002'}
          reg=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert reg['progress']['classified_count']==126
          assert reg['progress']['remaining_count']==66
          assert reg['progress']['latest_block']=='DRTRAINSET21_V21_003'
          assert not ({e['finding_id'] for e in reg['entries']} & target)
          prov=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          states={e['finding_id']:e['revalidation_state'] for e in prov['inventory']['entries'] if e['finding_id'] in target}
          assert states=={'DRTRAINSET22-001':'context_verified','DRTRAINSET22-002':'context_verified'}, states
          ev=json.loads(Path('audit_registry/drtrainset22_revalidation_evidence_2026-09-06.json').read_text())
          assert ev['evidence_id']=='EV-149' and ev['result']=='PASS'
          assert ev['authority']['source_id']=='TRAINSET_V2.2'
          assert ev['authority']['pdf_sha256']=='c1946694a1809933a9a4a23adff1c551effdb0a2fbc6a7f7f68faec0b0c7bd6e'
          assert ev['authority']['semantic_authority_lane']=='byte-pinned official PDF/document navigation'
          assert ev['authority']['xsd_semantic_authority_required'] is False
          assert ev['executable_context']['terminal_state_requires_xml_execution'] is False
          block=json.loads(Path('audit_registry/semantic_classification_blocks/DRTRAINSET22_V22_001_002_v0.1.json').read_text())
          assert block['block_id']=='DRTRAINSET22_V22_001_002'
          assert [e['finding_id'] for e in block['entries']]==['DRTRAINSET22-001','DRTRAINSET22-002']
          for e in block['entries']:
              assert e['normative_authority']=='contextual_only'
              assert e['primary_surface']=='pdf'
              assert e['defect_assessment']=='confirmed_pdf_defect'
              assert e['sdk_behavior']=='no_runtime_diagnostic'
              assert e['runtime_match']['state']=='not_applicable'
              assert 'documentation_only' in e['validation_effect']
              assert 'no_runtime_effect' in e['validation_effect']
          print('PASSED: exact DRTRAINSET22-001/002 prestate and documentation-only authority boundary')
          PY
          git diff --exit-code
      - name: Verify EV-149 same-document navigation evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ev=json.loads(Path('audit_registry/drtrainset22_revalidation_evidence_2026-09-06.json').read_text())
          m=ev['matched_physical_pages']
          assert m['DRTRAINSET22-001']=={'german_overview':9,'english_overview':10,'table_of_contents':6}
          assert m['DRTRAINSET22-002']['correct_6_5_2_unsubscribe_structure']==35
          assert m['DRTRAINSET22-002']['correct_6_5_3_RetrieveTripRef']==36
          assert m['DRTRAINSET22-002']['UnsubscribeTripRef_stale_6_5_1']==38
          assert m['DRTRAINSET22-002']['RetrieveTripInformation_stale_6_5_1']==38
          assert m['DRTRAINSET22-002']['UnsubscribeTripInformation_stale_6_5_1']==40
          for fid in ('DRTRAINSET22-001','DRTRAINSET22-002'):
              r=ev['finding_results'][fid]
              assert r['recommended_terminal_state']=='context_verified'
              assert r['classification']=='pdf_cross_reference_error_candidate'
              assert r['executable_effect'] is False
          assert ev['full_xsd_pool']=={'count':50,'result':'PASS','role':'repository-regression-only'}
          print('PASSED: EV-149 same-document positive controls prove navigation-only defects')
          PY
      - name: Merge two-finding block and validate registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRTRAINSET22_V22_001_002_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRTRAINSET22_V22_001_002; classified=128 remaining=64" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 128 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert r['progress']['classified_count']==128
          assert r['progress']['remaining_count']==64
          assert r['progress']['latest_block']=='DRTRAINSET22_V22_001_002'
          assert r['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRTRAINSET22_V22_001_002_v0.1.json'
          assert r['progress']['reviewed_blocks'][-1]=='DRTRAINSET22_V22_001_002'
          ids={e['finding_id'] for e in r['entries']}
          assert {'DRTRAINSET22-001','DRTRAINSET22-002'} <= ids
          print('PASSED: DRTRAINSET22 poststate 128/192')
          PY
      - name: Persist exact two-finding boundary
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=60f7c764d102d3a553116c8039a8ce17bb6baaf9
          git rm .github/workflows/temp_merge_semantic_classification_drtrainset22_v22_001_002.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'.github/workflows/temp_merge_semantic_classification_drtrainset22_v22_001_002.yml','audit_registry/finding_semantic_classification_v0.1.json'}
          assert staged==expected,(staged,expected)
          changed=set(subprocess.check_output(['git','diff','--name-only','60f7c764d102d3a553116c8039a8ce17bb6baaf9'],text=True).splitlines())
          expected_changed={'audit_registry/finding_semantic_classification_v0.1.json','audit_registry/semantic_classification_blocks/DRTRAINSET22_V22_001_002_v0.1.json'}
          assert changed==expected_changed,(changed,expected_changed)
          print('PASSED: persistent boundary is master registry + DRTRAINSET22 block only')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRTRAINSET22 semantic classification"
          git push origin HEAD:dev/schema-integration
