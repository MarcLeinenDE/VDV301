name: TEMP source locator CE005 CE010

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_source_locator_ce_005_010.yml
      - audit_registry/finding_source_locators_v0.1.json
      - audit_registry/finding_source_locators_v0.1.schema.json
      - audit_registry/finding_semantic_classification_v0.1.json
      - audit_registry/pdf_source_registry_v0.1.json
      - audit_registry/pdf_source_pins_v0.1.json
      - audit_registry/source_locator_review_blocks/CE_005_010_v0.1.json
      - docs/pdf_xsd_semantic_audit/SOURCE_LOCATOR_REVIEW_CE_005_010_2026-09-25.md
      - sdk_manifest/manifest_v0.1.json
      - sdk_manifest/known_issues_runtime_mapping_v0.1.json
      - 00_START_HERE/CURRENT_STATE.json
      - tools/validate_finding_source_locators_v0_1.py
      - tools/validate_sdk_manifest_v0_1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check lxml jsonschema

      - name: Validate canonical source-locator manifest
        run: python tools/validate_finding_source_locators_v0_1.py

      - name: Verify CE pilot locator matrix and exact XSD components
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          ROOT=Path(".")
          NS={"xs":"http://www.w3.org/2001/XMLSchema"}
          m=json.loads((ROOT/"audit_registry/finding_source_locators_v0.1.json").read_text())
          by={e["finding_id"]:e for e in m["entries"]}

          assert set(by)=={"CE-005","CE-006","CE-007","CE-008","CE-009","CE-010"}
          assert m["counts"]=={
              "semantic_finding_count":192,
              "locator_entry_count":6,
              "coverage_complete_count":6,
              "coverage_partial_count":0,
              "remaining_finding_count":186,
          }
          assert sum(len(e["coverage"]) for e in m["entries"])==23

          expected_versions={
              "CE-005":{"2.0","2.1","2.2","2.3","2.4"},
              "CE-006":{"2.2","2.3","2.4"},
              "CE-007":{"1.0","2.0","2.1","2.2","2.3","2.4"},
              "CE-008":{"2.2","2.3","2.4"},
              "CE-009":{"2.2","2.3","2.4"},
              "CE-010":{"2.2","2.3","2.4"},
          }
          for fid,versions in expected_versions.items():
              got={c["version"] for c in by[fid]["coverage"]}
              assert got==versions,(fid,got)

          expected_pages={
              ("CE-005","2.0"):{29},("CE-005","2.1"):{31},("CE-005","2.2"):{33},("CE-005","2.3"):{34},("CE-005","2.4"):{36,37},
              ("CE-006","2.2"):{37},("CE-006","2.3"):{38},("CE-006","2.4"):{41},
              ("CE-007","1.0"):{27,29},("CE-007","2.0"):{35,37},("CE-007","2.1"):{37,39},("CE-007","2.2"):{39,41},("CE-007","2.3"):{40,42},("CE-007","2.4"):{43,45},
              ("CE-008","2.2"):{46},("CE-008","2.3"):{47},("CE-008","2.4"):{50},
              ("CE-009","2.2"):{43},("CE-009","2.3"):{44},("CE-009","2.4"):{47},
              ("CE-010","2.2"):{45},("CE-010","2.3"):{46},("CE-010","2.4"):{49},
          }
          expected_tables={
              ("CE-005","2.0"):{"Table 57"},("CE-005","2.1"):{"Table 57"},("CE-005","2.2"):{"Table 58"},("CE-005","2.3"):{"Table 58"},("CE-005","2.4"):{"Table 57"},
              ("CE-006","2.2"):{"Table 70"},("CE-006","2.3"):{"Table 70"},("CE-006","2.4"):{"Table 69"},
              ("CE-007","1.0"):{"Table 74","Table 85","Table 86"},
              ("CE-007","2.0"):{"Table 79","Table 89","Table 90"},
              ("CE-007","2.1"):{"Table 79","Table 89","Table 90"},
              ("CE-007","2.2"):{"Table 80","Table 90","Table 91"},
              ("CE-007","2.3"):{"Table 80","Table 90","Table 91"},
              ("CE-007","2.4"):{"Table 79","Table 89","Table 90"},
              ("CE-008","2.2"):{"Table 103","Table 104"},("CE-008","2.3"):{"Table 103","Table 104"},("CE-008","2.4"):{"Table 102","Table 103"},
              ("CE-009","2.2"):{"Table 95"},("CE-009","2.3"):{"Table 95"},("CE-009","2.4"):{"Table 94"},
              ("CE-010","2.2"):{"Table 101"},("CE-010","2.3"):{"Table 101"},("CE-010","2.4"):{"Table 100"},
          }
          for fid,e in by.items():
              for c in e["coverage"]:
                  key=(fid,c["version"])
                  pages={p for loc in c["pdf_locators"] for p in loc["printed_pages"]}
                  tables={loc["table"] for loc in c["pdf_locators"] if loc["table"]}
                  assert pages==expected_pages[key],(key,pages)
                  assert tables==expected_tables[key],(key,tables)
                  assert all(loc["source_id"]==f"COMMON_V{c['version']}" for loc in c["pdf_locators"])
                  if c["version"]=="2.4":
                      assert c["authority"]=="candidate_integration",key
                  else:
                      assert c["authority"]=="official_release",key
                  for x in c["xsd_locators"]:
                      tree=etree.parse(str(ROOT/x["file"]))
                      nodes=tree.xpath(x["xpath_hint"],namespaces=NS)
                      assert nodes,(fid,c["version"],x["file"],x["xpath_hint"])
                      if x.get("value"):
                          assert any(n.get("value")==x["value"] for n in nodes),(fid,c["version"],x["value"])

          # V2.3 enum findings must use the real V2.2 dependency file, never a synthetic V2.3 enum file.
          for fid in ("CE-006","CE-007","CE-008","CE-009","CE-010"):
              c=next(x for x in by[fid]["coverage"] if x["version"]=="2.3")
              assert {x["file"] for x in c["xsd_locators"]}=={"IBIS-IP_Enumerations_V2.2.xsd"},fid

          # Corrected post-closure version boundaries remain explicit.
          assert [x["version"] for x in by["CE-005"]["scope_claims"]]==["Common V2.0-V2.3","Common V2.4"]
          assert [x["version"] for x in by["CE-006"]["scope_claims"]]==["Enumerations V2.2-V2.3","Enumerations V2.4"]

          print("CE_SOURCE_LOCATOR_MATRIX_OK entries=6 lanes=23")
          PY

      - name: Validate semantic registry
        run: python tools/validate_finding_semantic_classification.py

      - name: Validate deterministic Known-Issues mapping
        run: python tools/validate_known_issues_runtime_mapping_v0_1.py

      - name: Validate SDK manifest integration
        run: python tools/validate_sdk_manifest_v0_1.py

      - name: Root XSD regression gate
        run: python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Verify XSD working tree remains clean
        run: git diff --exit-code -- '*.xsd'
