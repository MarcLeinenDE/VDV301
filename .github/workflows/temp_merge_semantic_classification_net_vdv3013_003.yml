name: temp-merge-semantic-classification-net-vdv3013-003

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_merge_semantic_classification_net_vdv3013_003.yml

permissions:
  contents: write

jobs:
  merge-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact prestate and NET-003 authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "082e5348d212c57650d8f6a22b645f740e576e7e"
          test "$(git rev-parse HEAD^^)" = "5de21900c1046819aa5f87c8fcef88b759877057"
          test "$(git hash-object audit_registry/semantic_classification_blocks/NET_VDV3013_003_v0.1.json)" = "0023eeab2c927ba08ca40a1788080080cd53d3a0"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "65c7d593be3641588d98ca05b92b9ecef97f0c00"
          test "$(git hash-object audit_registry/network_vdv301_3_revalidation_evidence_2026-09-08.json)" = "efed3d0ad85aa40551a5d36c5310d1a477deae51"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_NETWORK_2026-09-08.md)" = "1e780f09bb235b1388aa02e274d4c85640976bd1"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"

          python - <<'PY'
          import json
          from pathlib import Path

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/NET_VDV3013_003_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          evidence=json.loads(Path('audit_registry/network_vdv301_3_revalidation_evidence_2026-09-08.json').read_text())

          assert registry['progress']['classified_count']==143
          assert registry['progress']['remaining_count']==49
          assert registry['progress']['latest_block']=='NET_VDV3013_001_002'
          assert 'NET-003' not in {e['finding_id'] for e in registry['entries']}

          assert block['block_id']=='NET_VDV3013_003'
          assert [e['finding_id'] for e in block['entries']]==['NET-003']
          e=block['entries'][0]
          assert e['normative_authority']=='contextual_only'
          assert e['primary_issue_kind']=='documentation_spelling'
          assert e['defect_assessment']=='confirmed_pdf_defect'
          assert e['sdk_behavior']=='no_runtime_diagnostic'
          assert e['runtime_match']['state']=='not_applicable'
          assert e['version_scope'][0]['authority']=='documentation_only'
          assert e['version_scope'][0]['xsd_profile'] is None

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['NET-003']['revalidation_state']=='context_verified'
          assert frozen['NET-003']['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_NETWORK_2026-09-08.md'

          assert evidence['evidence_id']=='EV-154'
          assert evidence['result']=='PASS'
          assert evidence['executable_evidence']['applicable'] is False
          f=evidence['finding_results']['NET-003']
          assert f['observed_wrong']=='IEE 802.3'
          assert f['correct_spelling_elsewhere_same_writing'] is True
          assert evidence['authority']['validation_lane']=='physical/network/protocol documentation; intentionally no XSD lane'
          assert evidence['full_xsd_pool']['count']==50
          assert evidence['full_xsd_pool']['role']=='regression/no-mutation guard only'
          print('PASSED: exact 143/192 prestate and NET-003 documentation-only authority boundary verified')
          PY

      - name: Snapshot XSD pool before semantic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256

      - name: Merge NET-003 block and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/NET_VDV3013_003_v0.1.json
          python tools/validate_finding_semantic_classification.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert registry['progress']['classified_count']==144
          assert registry['progress']['remaining_count']==48
          assert registry['progress']['latest_block']=='NET_VDV3013_003'
          assert registry['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/NET_VDV3013_003_v0.1.json'
          e={x['finding_id']:x for x in registry['entries']}['NET-003']
          assert e['primary_issue_kind']=='documentation_spelling'
          assert e['defect_assessment']=='confirmed_pdf_defect'
          assert e['sdk_behavior']=='no_runtime_diagnostic'
          print('PASSED: merged registry is exactly 144/192 and NET-003 semantics are preserved')
          PY

      - name: Validate all 50 root XSDs and prove no schema mutation
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Persist only NET-003 block and master registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp_merge_semantic_classification_net_vdv3013_003.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          mapfile -t changed < <(git diff --name-only 5de21900c1046819aa5f87c8fcef88b759877057 | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'audit_registry/finding_semantic_classification_v0.1.json'
          test "${changed[1]}" = 'audit_registry/semantic_classification_blocks/NET_VDV3013_003_v0.1.json'
          git commit -m 'audit: merge NET-003 semantic classification'
          git push origin HEAD:dev/schema-integration
