name: temp-trainset-v22-render

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf
      - name: Render pinned TrainSet V2.2 pages
        run: |
          python tools/render_vdv_pdf_pages.py \
            --source-id TRAINSET_V2.2 \
            --pages 9,24,25,29,31,34,35,38,40,51 \
            --dpi 180 \
            --out-dir trainset-v22-review
      - uses: actions/upload-artifact@v4
        with:
          name: trainset-v22-review
          path: trainset-v22-review/
          if-no-files-found: error
