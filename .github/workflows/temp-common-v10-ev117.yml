name: Temporary Common V1.0 EV-117

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-common-v10-ev117.yml

permissions:
  contents: read

jobs:
  ev117:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lxml
        run: python -m pip install --disable-pip-version-check lxml

      - name: Run EV-117 after corrected InternationalTextType probe
        run: python tools/validate_common_v10_ev117.py
