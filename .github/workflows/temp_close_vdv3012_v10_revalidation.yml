name: TEMP close VDV301-2 V1.0 revalidation subblock

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_close_vdv3012_v10_revalidation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-vdv3012-v10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned VDV301-2 V1.0 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request

          source_id = 'VDV301-2_V1.0_DE'
          sources = json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text(encoding='utf-8'))
          pins = json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text(encoding='utf-8'))
          source = next(x for x in sources['sources'] if x['source_id'] == source_id)
          pin = next(x for x in pins['sources'] if x['source_id'] == source_id)
          request = urllib.request.Request(
              source['official_url'],
              headers={
                  'User-Agent': 'VDV301-Audit-EV129-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
              },
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          digest = hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert digest == pin['expected_sha256'], (digest, pin['expected_sha256'])
          assert len(data) == int(pin['expected_size_bytes']), (len(data), pin['expected_size_bytes'])
          target = Path('local_sources/vdv_pdfs') / source['local_filename']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={digest} size={len(data)}')
          PY

      - name: EV-129 exact revalidation gate
        shell: bash
        env:
          EV129_OUTPUT_DIR: artifacts/ev129
        run: |
          set -euo pipefail
          python tools/run_vdv3012_v10_ev129.py

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Pre-closure immutable and mutation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/vdv3012_v10_revalidation_evidence_2026-09-03.json)" = "2d3d39c2ac5c374a7e43dd768e101c6ead83e44b"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_DR3012_003_V10_IDENTIFIER_TYPE_2026-09-03.md)" = "7d79087ad3d850af16a6571f2c7a82b1350a8218"
          test "$(git hash-object IBIS-IP_SystemDocumentationService_v1.0.xsd)" = "8995c4a230bf81d5e47b9313ee7725ff3cd4b7b5"
          test "$(git hash-object IBIS-IP_SystemManagementService_V1.0.xsd)" = "2d32630a0f1981e980e6a466e3f6a69136410f24"
          git diff --exit-code -- '*.xsd'
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo 'Unexpected tracked changes before closure:'
            git status --short
            git diff --exit-code
            exit 1
          fi
          echo PRE_CLOSURE_GUARD_OK

      - name: Write VDV301-2 V1.0 closure state
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_vdv3012_v10_revalidation_block.py

      - name: Remove temporary workflow plumbing and generated caches
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temp_validate_vdv3012_v10_ev129.yml \
            .github/workflows/temp_close_vdv3012_v10_revalidation.yml
          rm -rf tools/__pycache__ artifacts/ev129
          rm -f local_sources/vdv_pdfs/VDV301-2_V1.0_DE.pdf

      - name: Verify closure delta allowlist and immutable authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/vdv3012_v10_revalidation_evidence_2026-09-03.json)" = "2d3d39c2ac5c374a7e43dd768e101c6ead83e44b"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_DR3012_003_V10_IDENTIFIER_TYPE_2026-09-03.md)" = "7d79087ad3d850af16a6571f2c7a82b1350a8218"
          git diff --exit-code -- '*.xsd'
          python - <<'PY'
          import subprocess
          allowed = {
              '00_START_HERE/CURRENT_STATE.json',
              'audit_registry/finding_revalidation_registry_v0.1.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3012_V10_2026-09-03.md',
              '.github/workflows/temp_validate_vdv3012_v10_ev129.yml',
              '.github/workflows/temp_close_vdv3012_v10_revalidation.yml',
          }
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          observed = set()
          for raw in out.splitlines():
              path = raw[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              observed.add(path)
          unexpected = sorted(observed - allowed)
          required = {
              '00_START_HERE/CURRENT_STATE.json',
              'audit_registry/finding_revalidation_registry_v0.1.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3012_V10_2026-09-03.md',
          }
          missing = sorted(required - observed)
          if unexpected or missing:
              raise SystemExit(f'closure allowlist failure unexpected={unexpected} missing={missing} observed={sorted(observed)}')
          print('CLOSURE_ALLOWLIST_OK', sorted(observed))
          PY

      - name: Verify post-closure state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text(encoding='utf-8'))
          state = json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text(encoding='utf-8'))
          frozen = json.loads(Path('audit_registry/finding_inventory_frozen_2026-09-03.json').read_text(encoding='utf-8'))
          entries = reg['inventory']['entries']
          by_id = {x['finding_id']: x for x in entries}
          terminal = sum(1 for x in entries if x['revalidation_state'] != 'pending')
          pending = sum(1 for x in entries if x['revalidation_state'] == 'pending')
          assert len(entries) == 192 and frozen['entry_count'] == 192
          assert terminal == 67 and pending == 125
          assert reg['next_revalidation_block'] == 'VDV301-2'
          assert reg['revalidation_blocks']['VDV301-2_V1.0']['state'] == 'completed'
          assert by_id['DR3012-003']['revalidation_state'] == 'executable_confirmed'
          assert by_id['DR3012V20-001']['revalidation_state'] == 'pending'
          audit = state['audit']
          assert audit['finding_revalidation_completed_findings'] == 67
          assert audit['finding_revalidation_pending_findings'] == 125
          assert audit['finding_revalidation_latest_completed_block'] == 'VDV301-2_V1.0'
          assert audit['finding_revalidation_next_block'] == 'VDV301-2'
          assert audit['vdv3012_v10_revalidation']['next_subblock'] == 'VDV301-2_BASE_V2.0'
          print('POST_CLOSURE_STATE_OK terminal=67 pending=125 next=VDV301-2/BASE_V2.0')
          PY

      - name: Commit closure atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Marc Leinen'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git add -A
          git commit -m 'audit: revalidate VDV301-2 V1.0 finding subblock [skip ci]'
          git push origin HEAD:dev/schema-integration
