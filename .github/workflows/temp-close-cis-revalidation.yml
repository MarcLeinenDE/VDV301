name: temp-close-cis-revalidation

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-close-cis-revalidation.yml

permissions:
  contents: write

jobs:
  close-cis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Guard branch and XSD baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cdf6acb0ea35a6e024bb1297e1214b20a715978e HEAD
          test -z "$(git diff --name-only cdf6acb0ea35a6e024bb1297e1214b20a715978e..HEAD -- '*.xsd')"
          find . -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd.before
          python -m pip install --disable-pip-version-check lxml

      - name: Materialize historical CIS V1.1 working family
        shell: bash
        run: |
          set -euo pipefail
          git remote add vdv-upstream https://github.com/VDVde/VDV301.git
          git fetch --no-tags --depth=1 vdv-upstream 0a5228a768c7d710c40f5f99fbdce2e544d19883
          mkdir -p /tmp/cis_v11
          for f in IBIS-IP_CustomerInformationService_V1.1.xsd IBIS-IP_common_V1.1.xsd IBIS-IP_Enumerations_V1.1.xsd; do
            git show FETCH_HEAD:$f > /tmp/cis_v11/$f
          done

      - name: EV-125 executable revalidation
        shell: bash
        env:
          CIS_V11_DIR: /tmp/cis_v11
        run: |
          set -euo pipefail
          python tools/validate_cis_ev125.py | tee /tmp/ev125.log

      - name: Write closure records after PASS
        shell: bash
        env:
          EV_RUN_ID: ${{ github.run_id }}
          EV_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python tools/close_cis_revalidation_ev125.py

      - name: Final gates and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          find . -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd.after
          cmp /tmp/xsd.before /tmp/xsd.after
          rm .github/workflows/temp-close-cis-revalidation.yml
          rm tools/close_cis_revalidation_ev125.py

          allow='^(00_START_HERE/CURRENT_STATE.json|audit_registry/finding_revalidation_registry_v0.1.json|audit_registry/pdf_source_pins_v0.1.json|audit_registry/revalidation_evidence_ev125_cis_block_2026-09-03.json|docs/pdf_xsd_semantic_audit/05c_cis_v1_1_mapping.md|docs/pdf_xsd_semantic_audit/05g_cis_findings_and_v2_0_v2_2_v2_3_closure.md|docs/pdf_xsd_semantic_audit/CIS_HISTORICAL_XSD_INTEGRATION_DECISION.md|docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_CIS_2026-09-03.md|docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_CIS_V11_PROVENANCE_2026-09-03.md|docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_CIS_REVALIDATION_2026-09-03.md|tools/close_cis_revalidation_ev125.py|.github/workflows/temp-close-cis-revalidation.yml)$'
          bad=$(git status --porcelain | sed 's/^...//' | grep -Ev "$allow" || true)
          test -z "$bad" || { echo 'Unexpected changed paths:'; echo "$bad"; exit 1; }

          git add -A -- 00_START_HERE/CURRENT_STATE.json audit_registry/finding_revalidation_registry_v0.1.json audit_registry/pdf_source_pins_v0.1.json audit_registry/revalidation_evidence_ev125_cis_block_2026-09-03.json docs/pdf_xsd_semantic_audit/05c_cis_v1_1_mapping.md docs/pdf_xsd_semantic_audit/05g_cis_findings_and_v2_0_v2_2_v2_3_closure.md docs/pdf_xsd_semantic_audit/CIS_HISTORICAL_XSD_INTEGRATION_DECISION.md docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_CIS_2026-09-03.md docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_CIS_V11_PROVENANCE_2026-09-03.md docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_CIS_REVALIDATION_2026-09-03.md tools/close_cis_revalidation_ev125.py .github/workflows/temp-close-cis-revalidation.yml

          staged=$(git diff --cached --name-only)
          test -z "$(printf '%s\n' "$staged" | grep -E '\.xsd$' || true)"
          test -z "$(printf '%s\n' "$staged" | grep -Ev "$allow" || true)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit: revalidate CIS finding block'
          git push origin HEAD:dev/schema-integration
