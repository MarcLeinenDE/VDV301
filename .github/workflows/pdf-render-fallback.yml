name: VDV PDF pinned visual fallback
on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Pinned PDF source id from audit_registry
        required: true
        default: VDV301-2_BASE_V2.1
        type: string
      pages:
        description: 1-based PDF pages (ranges supported)
        required: true
        default: 88-102
        type: string
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/pdf-render-fallback.yml
permissions:
  contents: read
jobs:
  render-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned-source renderer
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Render exact-byte verified original pages
        env:
          SOURCE_ID: ${{ github.event.inputs.source_id || 'VDV301-2_BASE_V2.1' }}
          PDF_PAGES: ${{ github.event.inputs.pages || '88-102' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/render_vdv_pdf_pages.py --source-id "$SOURCE_ID" --pages "$PDF_PAGES" --dpi 160 --out-dir audit-render
      - name: Print document-body navigation report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, fitz, hashlib
          from pathlib import Path
          m=json.loads(Path("audit-render/render_manifest.json").read_text())
          src=json.loads(Path("audit_registry/pdf_source_registry_v0.1.json").read_text())
          source=next(x for x in src["sources"] if x["source_id"]==m["source_id"])
          req=urllib.request.Request(source["official_url"],headers={"User-Agent":"VDV301-Audit-PDFRenderer/0.1"})
          raw=urllib.request.urlopen(req, timeout=120).read()
          assert hashlib.sha256(raw).hexdigest()==m["source_sha256"]
          doc=fitz.open(stream=raw,filetype="pdf")
          report=[]
          for item in m["pages"]:
              index=item["page"]
              page=doc.load_page(index-1)
              lines=[s.strip() for s in page.get_text().splitlines() if s.strip()]
              relevant=[s for s in lines if any(w in s for w in ("DeviceManagementService","Subscribe","Unsubscribe","ActivateDevice","DeactivateDevice","Tabelle","Table","Operationen"))]
              report.append(dict(pdf_page=index,first_lines=lines[:9],matching_lines=relevant[:40]))
          Path("audit-render/page_navigation.json").write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps({"verified_sha256":m["source_sha256"],"pdf_pages":len(doc),"navigation":report},ensure_ascii=False))
          PY
      - name: Upload exact-source visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: vdv-pdf-render-fallback
          path: audit-render/
          retention-days: 90
          if-no-files-found: error
