name: Temp validate DRTRAINSET21 EV-148

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_validate_drtrainset21_ev148.yml
      - tools/validate_drtrainset21_revalidation_ev148.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF and XSD tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install lxml

      - name: Snapshot root XSD hashes
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256

      - name: Fetch exact byte-pinned TRAINSET V2.1 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          sid='TRAINSET_V2.1'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==sid)
          pin=next(x for x in pins['sources'] if x['source_id']==sid)
          assert source['official_url']=='https://www.vdv.de/vdv-301-2-14-v2-1-sds-trainsetservices.pdfx'
          assert source['local_filename']=='TRAINSET_V2.1.pdf'
          assert pin['expected_sha256']=='8eb53f2e960d125382e22d9c58dff8685c041001cf39a87ed4d12bb266bbe12e'
          assert int(pin['expected_size_bytes'])==1708401
          assert str(pin['evidence_run_id'])=='33226637254'
          for attempt in range(4):
              try:
                  req=urllib.request.Request(source['official_url'],headers={
                      'User-Agent':'VDV301-Audit-EV148/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                      'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(2*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          if sha != pin['expected_sha256'] or len(data) != int(pin['expected_size_bytes']):
              raise AssertionError(
                  f'OFFICIAL_SOURCE_BYTES_CHANGED current_sha={sha} current_size={len(data)} '
                  f'pinned_sha={pin["expected_sha256"]} pinned_size={pin["expected_size_bytes"]} '
                  f'original_pin_run={pin["evidence_run_id"]}')
          assert data.startswith(b'%PDF-')
          target=Path('local_sources/vdv_pdfs')/source['local_filename']
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {sid} sha256={sha} size={len(data)}')
          PY

      - name: Run EV-148 on exact V2.1 PDF and XSD counter-context
        run: python tools/validate_drtrainset21_revalidation_ev148.py --repo-root . --output-dir artifacts/ev148

      - name: Re-run EV-109 exact TrainSet V2.1 executable context
        run: python tools/validate_trainset_v21_ev109.py

      - name: Run complete XSD pool as repository regression guard
        run: python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Verify immutable boundaries and evidence separation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.1.md)" = "6d5680f438e7e592aaf1d056e39224e7c2a3f2d9"
          test "$(git rev-parse HEAD:tools/validate_trainset_v21_ev109.py)" = "f88208bff7e39bb38a86a310dc121f486984f807"
          test "$(git rev-parse HEAD:IBIS-IP_TrainSetInformationService_V2.1.xsd)" = "897f373e31b76aa23d8bc206854b042524e4c102"
          test "$(git rev-parse HEAD:IBIS-IP_TrainSetManagementService_V2.1.xsd)" = "add9d1cb37e5759ff7a77855b239108d38373206"
          test "$(git rev-parse HEAD:IBIS-IP_TrainSetDataService_V2.1.xsd)" = "c2cdb73fcae265a2e4e0349ac6072e3548e36d8b"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          test -z "$(git diff --name-only | grep -E '\.xsd$' || true)"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/ev148/ev148_results.json').read_text())
          scope=['DRTRAINSET21-001','DRTRAINSET21-002','DRTRAINSET21-003']
          assert r['evidence_id']=='EV-148' and r['result']=='PASS'
          assert r['scope']==scope
          assert r['recommended_terminal_states']=={fid:'context_verified' for fid in scope}
          assert r['authority']['pdf_sha256']=='8eb53f2e960d125382e22d9c58dff8685c041001cf39a87ed4d12bb266bbe12e'
          assert r['authority']['pdf_size_bytes']==1708401
          assert r['fresh_visual_physical_pages']==[6,9,10,44]
          assert r['executable_evidence']['required_for_terminal_state'] is False
          assert r['manual_visual_review_status']=='pending_human_inspection_of_EV148_artifact_before_registry_closure'
          assert r['xsd_mutated'] is False and r['frozen_inventory_mutated'] is False
          print('EV-148 immutable-boundary and evidence-separation verification PASS')
          PY

      - name: Upload EV-148 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drtrainset21-ev148
          path: artifacts/ev148
          if-no-files-found: error
          retention-days: 90
