name: temp-trainset-v21-render

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Render byte-pinned TrainSet V2.1 pages
        run: |
          python tools/render_vdv_pdf_pages.py \
            --source-id TRAINSET_V2.1 \
            --pages 9,24-39,44,49 \
            --dpi 180 \
            --out-dir audit-results/trainset-v21-renders

      - name: Upload visual review evidence
        uses: actions/upload-artifact@v4
        with:
          name: trainset-v21-visual-review
          path: audit-results/trainset-v21-renders/
          if-no-files-found: error
