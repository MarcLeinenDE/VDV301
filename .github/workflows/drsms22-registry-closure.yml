name: DRSMS22 registry closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/drsms22-registry-closure.yml
      - audit_registry/drsms22_revalidation_evidence_2026-09-06.json

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Snapshot immutable XSD pool
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/drsms22_revalidation_evidence_2026-09-06.json)" = "df753dd77cee29c832d1f8b44320c49297df6e6f"

      - name: Fetch exact byte-pinned SMS V2.2 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          sid='SMS_V2.2'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==sid)
          pin=next(x for x in pins['sources'] if x['source_id']==sid)
          for attempt in range(4):
              try:
                  req=urllib.request.Request(source['official_url'],headers={'User-Agent':'VDV301-Audit-EV146-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(2*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert sha==pin['expected_sha256']=='996f639a81cb91ad20a8e78b6213e7c85d41ff0ec42caba4208d6c4652b140f4'
          assert len(data)==int(pin['expected_size_bytes'])==847416
          target=Path('local_sources/vdv_pdfs')/source['local_filename']
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print('SMS_V22_PDF_PIN_OK',sha,len(data),source['local_filename'])
          PY

      - name: Re-run EV-146 and full XSD pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_drsms22_revalidation_ev146.py --repo-root . --output-dir artifacts/ev146-closure
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Close DRSMS22 block atomically
        shell: bash
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}
          CLOSURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json,os
          from pathlib import Path

          rp=Path('audit_registry/finding_revalidation_registry_v0.1.json')
          sp=Path('00_START_HERE/CURRENT_STATE.json')
          ep=Path('audit_registry/drsms22_revalidation_evidence_2026-09-06.json')
          report=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRSMS22_2026-09-06.md')
          d=json.loads(rp.read_text(encoding='utf-8'))
          s=json.loads(sp.read_text(encoding='utf-8'))
          e=json.loads(ep.read_text(encoding='utf-8'))
          run_id=os.environ['CLOSURE_RUN_ID']; run_url=os.environ['CLOSURE_RUN_URL']

          scope=['DRSMS22-001','DRSMS22-002','DRSMS22-003','DRSMS22-004']
          states={fid:'context_verified' for fid in scope}

          assert e['evidence_id']=='EV-146' and e['result']=='PASS'
          assert e['scope']==scope
          assert e['successful_run_id']=='34026822637' and e['successful_job_id']=='101469161311'
          assert e['head_sha']=='21369ec625823fe0425193a19d3ff42b3833270a'
          assert e['artifact_id']=='9987318510'
          assert e['artifact_digest']=='sha256:181ff01b16dae43ec2826299e6f14717aef1668d66491b6051ae07661ee607f6'
          assert e['authority']['source_id']=='SMS_V2.2'
          assert e['authority']['pdf_sha256']=='996f639a81cb91ad20a8e78b6213e7c85d41ff0ec42caba4208d6c4652b140f4'
          assert e['prior_executable_evidence']['evidence_id']=='EV-116'
          assert e['prior_executable_evidence']['rerun_result']=='PASS'
          assert e['full_xsd_pool']=={'count':50,'result':'PASS'}
          assert e['immutable_guards']['xsd_mutated'] is False
          assert e['immutable_guards']['frozen_inventory_mutated'] is False
          assert {k:v['recommended_terminal_state'] for k,v in e['finding_results'].items()}==states

          inv=d['inventory']; entries=inv['entries']
          assert inv['state']=='frozen' and inv['entry_count']==192 and len(entries)==192
          assert d['next_revalidation_block']=='DRSMS22'
          pre_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          pre_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (pre_terminal,pre_pending)==(110,82),(pre_terminal,pre_pending)
          by={x['finding_id']:x for x in entries}
          for fid in scope:
              assert by[fid]['revalidation_state']=='pending'
              assert by[fid]['terminal_state_source'] is None
              by[fid]['revalidation_state']='context_verified'
              by[fid]['terminal_state_source']=str(report)

          post_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          post_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (post_terminal,post_pending)==(114,78),(post_terminal,post_pending)

          first_pending=next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')
          assert first_pending=='DRTIME10-001', first_pending
          assert all(by[f]['revalidation_state']=='pending' for f in ['DRTIME10-001','DRTIME10-002','DRTIME10-003'])
          next_block='DRTIME10'
          next_subblock='TIME_V1.0_DRTIME10'
          d['next_revalidation_block']=next_block

          blocks=d['revalidation_blocks']
          assert 'SMS_V2.2_DRSMS22' not in blocks
          assert blocks['DOOR_V2.1_DRS']['state']=='completed'
          prior_drs=copy.deepcopy(blocks['DOOR_V2.1_DRS'])
          prior_network=copy.deepcopy(blocks['Network_V2.0'])
          blocks['SMS_V2.2_DRSMS22']={
            'date':'2026-09-06',
            'state':'completed',
            'parent_block':'DRSMS22',
            'scope_kind':'frozen_deep_read_findings_subblock',
            'source_id':'SMS_V2.2',
            'publication':'VDV-Schrift 301-2-18, SystemMonitoringService V2.2, 08/2019',
            'authority_lane':'byte-pinned official SMS V2.2 PDF plus exact official VDV-301-2.2 SystemMonitoringService/Common/Enumerations family; latest-wins forbidden',
            'pdf_sha256':'996f639a81cb91ad20a8e78b6213e7c85d41ff0ec42caba4208d6c4652b140f4',
            'pdf_size_bytes':847416,
            'sms_xsd_blob':'d8d3011965fcf7c5c15ecd6f0d7e917a3f9e6d3c',
            'common_v2_2_blob':'468fee6d177e7185dbcd5d3f90cfb114e29e01ae',
            'enumerations_v2_2_blob':'2a23b512379b18e8f122ac1272cef8229fb86283',
            'latest_xsd_wins':False,
            'evidence_id':'EV-146',
            'evidence_run_id':'34026822637',
            'evidence_job_id':'101469161311',
            'evidence_head_sha':'21369ec625823fe0425193a19d3ff42b3833270a',
            'artifact_id':'9987318510',
            'artifact_digest':'sha256:181ff01b16dae43ec2826299e6f14717aef1668d66491b6051ae07661ee607f6',
            'evidence_record':str(ep),
            'closure_run_id':run_id,
            'closure_run_url':run_url,
            'fresh_visual_pages':[5,9,10,11,12,13],
            'prior_executable_evidence_id':'EV-116',
            'prior_executable_evidence_run_id':'33269006407',
            'prior_executable_evidence_job_id':'99144006184',
            'ev116_rerun_under_ev146':'PASS',
            'findings':states,
            'choice_notation_guard':'SMS a/b -1:1 is XML choice notation, not negative cardinality; no cardinality finding promoted',
            'active_disproof_result':'extraction-artifact, device-semantics, alternate-service-name and missing-structure counter-hypotheses rejected by exact source/XSD context',
            'executable_evidence_applicability':'documentation-only findings; EV-116 rerun retained as authority support',
            'terminal_state_source':str(report),
            'xsd_mutation':False,
            'frozen_inventory_mutation':False,
            'existing_DOOR_V2.1_DRS_block_mutated':False,
            'existing_Network_V2.0_block_mutated':False,
            'next_block':next_block,
            'next_subblock':next_subblock
          }
          assert blocks['DOOR_V2.1_DRS']==prior_drs
          assert blocks['Network_V2.0']==prior_network

          a=s['audit']
          assert a['finding_inventory_count']==192
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(110,82)
          assert a['finding_revalidation_next_block']=='DRSMS22'
          assert a['finding_revalidation_current_block']=='DOOR_V2.1_DRS'
          assert a['finding_revalidation_latest_completed_block']=='DOOR_V2.1_DRS'
          assert a['latest_revalidation_evidence_id']=='EV-145'
          assert 'drsms22_revalidation' not in a
          a['finding_revalidation_completed_findings']=114
          a['finding_revalidation_pending_findings']=78
          a['finding_revalidation_current_block']='SMS_V2.2_DRSMS22'
          a['finding_revalidation_latest_completed_block']='SMS_V2.2_DRSMS22'
          a['finding_revalidation_next_block']=next_block
          a['finding_revalidation_latest_terminal_state_source']=str(report)
          a['latest_revalidation_evidence_id']='EV-146'
          a['drsms22_revalidation']={
            'status':'complete',
            'completed_at_run':run_id,
            'evidence_id':'EV-146',
            'evidence_run_id':'34026822637',
            'evidence_job_id':'101469161311',
            'evidence_head_sha':'21369ec625823fe0425193a19d3ff42b3833270a',
            'artifact_id':'9987318510',
            'artifact_digest':'sha256:181ff01b16dae43ec2826299e6f14717aef1668d66491b6051ae07661ee607f6',
            'terminal_states':states,
            'prior_executable_evidence':'EV-116',
            'ev116_rerun_under_ev146':'PASS',
            'report':str(report),
            'next_block':next_block,
            'next_subblock':next_subblock,
            'xsd_mutation':False,
            'frozen_inventory_mutation':False
          }

          rp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          report.write_text(f'''# Finding Revalidation — DRSMS22 / SystemMonitoringService V2.2\n\nDate: 2026-09-06  \nScope: `DRSMS22-001`, `DRSMS22-002`, `DRSMS22-003`, `DRSMS22-004`  \nEvidence: `EV-146`, successful evidence run `34026822637`, job `101469161311`  \nEvidence commit: `21369ec625823fe0425193a19d3ff42b3833270a`  \nClosure run: `{run_id}`\n\n## Authority route\n\nOfficial byte-pinned VDV-Schrift 301-2-18 SystemMonitoringService V2.2 PDF (`996f639a81cb91ad20a8e78b6213e7c85d41ff0ec42caba4208d6c4652b140f4`, 847416 bytes) plus the exact official VDV-301-2.2 schema family: `IBIS-IP_SystemMonitoringService_V2.2.xsd` blob `d8d3011965fcf7c5c15ecd6f0d7e917a3f9e6d3c`, `IBIS-IP_common_V2.2.xsd` blob `468fee6d177e7185dbcd5d3f90cfb114e29e01ae`, and `IBIS-IP_Enumerations_V2.2.xsd` blob `2a23b512379b18e8f122ac1272cef8229fb86283`. Latest-XSD-wins is forbidden.\n\nEV-146 freshly rendered pages 5, 9, 10, 11, 12 and 13 at 180 DPI, retained both layout and raw text extraction, checked the exact Common ServiceState semantics, reran EV-116, and reran the complete 50-XSD pool.\n\n## DRSMS22-001 — context_verified\n\nPage 5 visibly contains the broken list-of-figures bookmark output `Fehler! Textmarke nicht definiert.`. Fresh rendering and extraction reject the hypothesis that this is an extraction-only artifact. Documentation-generation defect only.\n\n## DRSMS22-002 — context_verified\n\nPages 10-11 use device wording in ServiceStatus prose. The exact Common V2.2 `ServiceIdentificationWithStateStructure` contains `ServiceIdentification` plus `ServiceState` and no `DeviceState`, rejecting the hypothesis that the wording expresses alternate device-oriented semantics. Documentation semantic/copy-paste error only.\n\n## DRSMS22-003 — context_verified\n\nPage 12 prints `SystemManagmentService`; page 13 prints the correct `SystemManagementService`. The alternate-name hypothesis is rejected. Editorial spelling error only.\n\n## DRSMS22-004 — context_verified\n\nPage 9 contains both `UnsubscribeRequestStructure` and `UnsubscribeResponseStructure` for `UnsubscribeServiceStatus`, but the isolated operation-table segment omits the visible `Req.` / `Resp.` labels present on neighboring rows. The structures are not missing; the finding is specifically the table-label omission.\n\n## Guarded non-findings\n\nThe SMS response-table `a/b -1:1` notation remains VDV XML-choice notation and is not treated as negative cardinality. The generic Common Subscribe/Unsubscribe structures remain valid authority context and are not promoted into a service-local missing-operation defect.\n\n## Closure\n\nEV-146 PASS; closure rerun PASS; EV-116 rerun PASS; all 50 XSDs PASS; frozen 192-finding inventory unchanged; no XSD mutation. Revalidation count is now **114/192 terminal, 78 pending**. The first remaining pending frozen finding is `DRTIME10-001`; next block is `DRTIME10` (`TIME_V1.0_DRTIME10`).\n''',encoding='utf-8')
          print('DRSMS22_CLOSE_WRITE_OK terminal=114 pending=78 next=DRTIME10')
          PY

      - name: Cleanup, verify allowlist, commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/ev146-closure local_sources/vdv_pdfs/SMS_V2.2.pdf tools/__pycache__
          rm .github/workflows/temp_validate_drsms22_ev146.yml
          rm .github/workflows/drsms22-registry-closure.yml

          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test -z "$(git diff --name-only | grep -E '\.xsd$' || true)"

          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          s=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          by={x['finding_id']:x for x in d['inventory']['entries']}
          scope=['DRSMS22-001','DRSMS22-002','DRSMS22-003','DRSMS22-004']
          assert all(by[f]['revalidation_state']=='context_verified' for f in scope)
          assert d['revalidation_blocks']['SMS_V2.2_DRSMS22']['state']=='completed'
          assert d['next_revalidation_block']=='DRTIME10'
          first=next(x['finding_id'] for x in d['inventory']['entries'] if x['revalidation_state']=='pending')
          assert first=='DRTIME10-001'
          a=s['audit']
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(114,78)
          assert a['finding_revalidation_next_block']=='DRTIME10'
          assert a['finding_revalidation_latest_completed_block']=='SMS_V2.2_DRSMS22'
          assert a['latest_revalidation_evidence_id']=='EV-146'

          allowed={
            '.github/workflows/temp_validate_drsms22_ev146.yml',
            '.github/workflows/drsms22-registry-closure.yml',
            'audit_registry/finding_revalidation_registry_v0.1.json',
            '00_START_HERE/CURRENT_STATE.json',
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRSMS22_2026-09-06.md'
          }
          changed=set(subprocess.check_output(['git','status','--porcelain'],text=True).splitlines())
          paths={line[3:] for line in changed if len(line)>=4}
          assert paths==allowed,(paths,allowed)
          print('DRSMS22_POST_CLOSURE_CONSISTENCY_PASS')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: close DRSMS22 revalidation block [skip ci]'
          git push origin HEAD:dev/schema-integration
