name: temp-close-vls-ev165

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_close_vls_ev165.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  close-vls:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/schema-integration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check lxml==6.1.2

      - name: Verify exact closure inputs and snapshot immutable XSDs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/close_vls_revalidation_block.py)" = "0ec4a921d8bba5ea7b6de7185b9cf95f2eff89c7"
          test "$(git hash-object tools/validate_vls_revalidation_ev165.py)" = "dc806353e912ae69cc2eb3d8cc04d380c9b8c7da"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "62a3ecdd3f77c25dc6ed8e6754bc351db824ebb5"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "1c496ec0e0f3a45c0120650adf4df1a62659b225"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/vls-close-xsd-before.sha256
          git diff --exit-code

      - name: Verify successful EV-165 evidence online
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/34839986276" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/34839986276" --jq .head_sha)" = "b22d3d2840b68b62f5135ba8a583dc5fe63e496f"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10345886539" --jq .digest)" = "sha256:20d85319cc0d8014102abaf9ce6bf985c5510d59d631403030f172be5c5c90b7"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10345886539" --jq .expired)" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33111119723" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9662552176" --jq .digest)" = "sha256:b97d2e4506ffd63b8ff7985765131826d409e32769fb3a08193084134ca00ec0"

      - name: Verify exact upstream V2.0 and historical V1.0 authority
        shell: bash
        run: |
          set -euo pipefail
          git remote remove audit-upstream 2>/dev/null || true
          git remote add audit-upstream https://github.com/VDVde/VDV301.git
          git fetch --no-tags audit-upstream refs/tags/VDV-301-2.0
          test "$(git rev-parse FETCH_HEAD^{commit})" = "f2569a91f0a7c737a0ca7c0280b28ad223d7ee08"
          test "$(git rev-parse FETCH_HEAD:IBIS-IP_VideoLiveService_V2.0.xsd)" = "d8c52f5de9ef3f5915524fef12da11eabf0ca041"
          test "$(git rev-parse FETCH_HEAD:IBIS-IP_common_V2.0.xsd)" = "8608e3dcd665c197c34da7f6ec6af5a3758da164"
          test "$(git rev-parse FETCH_HEAD:IBIS-IP_Enumerations_V2.0.xsd)" = "27e3c183b00381d959622d13c10543123af8eef6"
          git fetch --no-tags audit-upstream refs/tags/VDV-301-1.0
          test "$(git rev-parse FETCH_HEAD^{commit})" = "f5b53785f703e898632603eec3bfa3555a79fdba"
          ! git ls-tree -r --name-only FETCH_HEAD | grep -Eq '(^|/)IBIS-IP_VideoLiveService_V1\.0\.xsd$'
          ! git show FETCH_HEAD:IBIS_IP_V1.0.xsd | grep -q 'VideoLiveService'

      - name: Reacquire exact official VLS PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence_sources evidence_out
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "https://www.vdv.de/301-2-11-sds.pdfx" -o evidence_sources/VLS_V1.0.pdf
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "https://www.vdv.de/301-2-11-sdes-v2-0-video-live-service.pdfx" -o evidence_sources/VLS_V2.0.pdf
          test "$(stat -c '%s' evidence_sources/VLS_V1.0.pdf)" = "1166329"
          test "$(sha256sum evidence_sources/VLS_V1.0.pdf | awk '{print $1}')" = "f535673427ff8f495102e1fc7723ca157408949b981572c4342b862f6d9c2a3c"
          test "$(stat -c '%s' evidence_sources/VLS_V2.0.pdf)" = "1218788"
          test "$(sha256sum evidence_sources/VLS_V2.0.pdf | awk '{print $1}')" = "d75a543c138f21c4ad370925ca7f306bcde7d692ce793ddc1d51bdcf6032787b"

      - name: Verify visual evidence metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33202961159" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9698490677" --jq .digest)" = "sha256:1e251087156601d70d6e33fd5b0d37c2085fba859f251104346530c10a732ddf"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33203162588" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9698569098" --jq .digest)" = "sha256:f15725fdd204162e0e122628a2ccdfc0fa3b9ceb74f6d70ecaba7e141b3b49b6"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33203850390" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9698836620" --jq .digest)" = "sha256:1a3ecf292eb99968a56aaf7e1c12d0395907250ebdf7eef913b87e74f42dbbbf"

      - name: Rerun EV-103 and EV-165
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_video_v20_compositors.py | tee evidence_out/ev103-rerun.log
          grep -Fq "PASSED: EV-103 video compositor behaviour confirmed" evidence_out/ev103-rerun.log
          python tools/validate_vls_revalidation_ev165.py \
            --vls-v10-pdf evidence_sources/VLS_V1.0.pdf \
            --vls-v20-pdf evidence_sources/VLS_V2.0.pdf \
            --output evidence_out/vls_ev165_evidence.json \
            | tee evidence_out/ev165-rerun.log
          grep -Fq "PASSED: EV-165 VLS aggregate evidence gate" evidence_out/ev165-rerun.log

      - name: Run complete 50-root-XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py | tee evidence_out/xsd-pool.log
          grep -Fq "PASSED" evidence_out/xsd-pool.log
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50

      - name: Prepare atomic VLS closure
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/close_vls_revalidation_block.py | tee evidence_out/closure-writer.log
          grep -Fq "PASSED: VLS closure files prepared; expected poststate 181/11 -> VRS-001" evidence_out/closure-writer.log

      - name: Enforce exact three-path mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence_out evidence_sources
          git status --porcelain=v1 --untracked-files=all
          git status --porcelain=v1 --untracked-files=all | cut -c4- | sort > /tmp/actual-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          00_START_HERE/CURRENT_STATE.json
          audit_registry/finding_revalidation_registry_v0.1.json
          docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VLS_2026-09-14.md
          EOF
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

      - name: Verify exact poststate and immutability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          terminal = {"context_verified","executable_confirmed","contextual_not_defect","withdrawn","unresolved","superseded"}
          expected = {
              "VLS-001":"context_verified",
              "VLS-002":"executable_confirmed",
              "VLS-003":"context_verified",
              "VLS-004":"context_verified",
              "VLS-005":"context_verified",
          }
          reg = json.loads(Path("audit_registry/finding_revalidation_registry_v0.1.json").read_text())
          entries = reg["inventory"]["entries"]
          byid = {x["finding_id"]: x for x in entries}
          assert len(entries) == len(byid) == 192
          assert sum(x["revalidation_state"] in terminal for x in entries) == 181
          assert sum(x["revalidation_state"] == "pending" for x in entries) == 11
          assert next(x["finding_id"] for x in entries if x["revalidation_state"] == "pending") == "VRS-001"
          assert reg["next_revalidation_block"] == "VRS"
          assert reg["revalidation_blocks"]["VLS"]["state"] == "completed"
          assert reg["revalidation_blocks"]["VLS"]["artifact_digest"] == "sha256:20d85319cc0d8014102abaf9ce6bf985c5510d59d631403030f172be5c5c90b7"
          for fid, state in expected.items():
              assert byid[fid]["revalidation_state"] == state
          current = json.loads(Path("00_START_HERE/CURRENT_STATE.json").read_text())["audit"]
          assert current["finding_revalidation_completed_findings"] == 181
          assert current["finding_revalidation_pending_findings"] == 11
          assert current["finding_revalidation_next_block"] == "VRS"
          assert current["finding_revalidation_latest_completed_block"] == "VLS"
          assert current["latest_revalidation_evidence_id"] == "EV-165"
          assert Path("docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VLS_2026-09-14.md").is_file()
          print("POSTSTATE PASS: 181/11 -> VRS-001")
          PY
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          sha256sum ./*.xsd | sort -k2 > /tmp/vls-close-xsd-after.sha256
          cmp /tmp/vls-close-xsd-before.sha256 /tmp/vls-close-xsd-after.sha256

      - name: Commit and push atomic VLS closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00_START_HERE/CURRENT_STATE.json \
                  audit_registry/finding_revalidation_registry_v0.1.json \
                  docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VLS_2026-09-14.md
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "audit: close VLS revalidation without schema mutation"
          git push origin HEAD:dev/schema-integration
