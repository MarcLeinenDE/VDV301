name: TEMP close COMMON V2.2 revalidation subblock

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_close_common_v22_revalidation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-common-v22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned COMMON V2.2 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request
          source_id = 'COMMON_V2.2'
          sources = json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text(encoding='utf-8'))
          pins = json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text(encoding='utf-8'))
          source = next(x for x in sources['sources'] if x['source_id'] == source_id)
          pin = next(x for x in pins['sources'] if x['source_id'] == source_id)
          request = urllib.request.Request(source['official_url'], headers={
              'User-Agent': 'VDV301-Audit-EV138-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          actual_hash = hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual_hash == pin['expected_sha256'], (actual_hash, pin['expected_sha256'])
          assert len(data) == int(pin['expected_size_bytes']), (len(data), pin['expected_size_bytes'])
          target = Path('local_sources/vdv_pdfs') / source['local_filename']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual_hash} size={len(data)}')
          PY

      - name: Re-run EV-138 exact evidence gate
        shell: bash
        env:
          EV138_OUTPUT_DIR: artifacts/ev138-closure
        run: |
          set -euo pipefail
          python tools/validate_common_v22_revalidation_ev138.py

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Pre-closure immutable and mutation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/common_v22_revalidation_evidence_2026-09-04.json)" = "f13574bb0e5ec0ec850ed4c22bbd323cc6b54c68"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.2.md)" = "38e3c3f0f96486acf7aea40652398e00f575a1b4"
          test "$(git hash-object audit_registry/deep_read_findings_delta_common_v22_2026-09-02.json)" = "6b0208d153761bef6e0cbf0041888251b99cdca4"
          test "$(git hash-object IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"
          test "$(git hash-object IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"
          test "$(git hash-object tools/validate_common_v22_ev120.py)" = "ca6aa03c50f7f63057e46623df639da77a1b67d7"
          test "$(git hash-object tools/validate_common_v22_revalidation_ev138.py)" = "d488d829a14b16fa8a49ff6749b2e189089a560b"
          test "$(git hash-object tools/close_common_v22_revalidation_block.py)" = "10929091c895574d7b10da83d99ac1cf9424fdc9"
          git diff --exit-code -- '*.xsd'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Write COMMON V2.2 closure state
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_common_v22_revalidation_block.py

      - name: Remove temporary workflow plumbing and generated caches
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_validate_common_v22_ev138.yml
          rm -f .github/workflows/temp_close_common_v22_revalidation.yml
          rm -rf artifacts/ev138-closure
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Verify closure delta allowlist and immutable authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/common_v22_revalidation_evidence_2026-09-04.json)" = "f13574bb0e5ec0ec850ed4c22bbd323cc6b54c68"
          test "$(git hash-object IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"
          test "$(git hash-object IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"
          git diff --exit-code -- '*.xsd'
          python - <<'PY'
          import subprocess
          allowed = {
              'audit_registry/finding_revalidation_registry_v0.1.json',
              '00_START_HERE/CURRENT_STATE.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_COMMON_V22_2026-09-04.md',
              '.github/workflows/temp_validate_common_v22_ev138.yml',
              '.github/workflows/temp_close_common_v22_revalidation.yml',
          }
          lines = subprocess.check_output(['git','status','--porcelain','--untracked-files=all'], text=True).splitlines()
          changed = {line[3:] for line in lines if len(line) >= 4}
          unexpected = changed - allowed
          assert not unexpected, f'unexpected closure delta: {sorted(unexpected)}'
          required = {
              'audit_registry/finding_revalidation_registry_v0.1.json',
              '00_START_HERE/CURRENT_STATE.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_COMMON_V22_2026-09-04.md',
          }
          assert required <= changed, f'missing required closure delta: {sorted(required-changed)}'
          print('ALLOWLIST_OK', sorted(changed))
          PY

      - name: Verify post-closure state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          state = json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          entries = reg['inventory']['entries']
          by_id = {x['finding_id']: x for x in entries}
          terminal = sum(x.get('revalidation_state') != 'pending' for x in entries)
          pending = sum(x.get('revalidation_state') == 'pending' for x in entries)
          assert (terminal, pending) == (94, 98), (terminal, pending)
          assert by_id['DRCOM22-001']['revalidation_state'] == 'executable_confirmed'
          assert by_id['DRCOM23-001']['revalidation_state'] == 'pending'
          block = reg['revalidation_blocks']['COMMON_V2.2']
          assert block['next_block'] == 'COMMON'
          assert block['next_subblock'] == 'COMMON_V2.3'
          assert reg['next_revalidation_block'] == 'COMMON'
          audit = state['audit']
          assert audit['finding_revalidation_completed_findings'] == 94
          assert audit['finding_revalidation_pending_findings'] == 98
          assert audit['finding_revalidation_latest_completed_block'] == 'COMMON_V2.2'
          assert audit['common_v22_revalidation']['next_subblock'] == 'COMMON_V2.3'
          assert json.loads(Path('audit_registry/finding_inventory_frozen_2026-09-03.json').read_text())['entry_count'] == 192
          print('POST_STATE_OK terminal=94 pending=98 next=COMMON_V2.3')
          PY

      - name: Commit closure atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Marc Leinen"
          git config user.email "34336531+MarcLeinenDE@users.noreply.github.com"
          git add -A
          git commit -m "audit: revalidate COMMON V2.2 finding subblock [skip ci]"
          git push origin HEAD:dev/schema-integration
