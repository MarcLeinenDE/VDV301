name: HDS registry closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/hds-registry-closure.yml
      - audit_registry/hds_revalidation_evidence_2026-09-07.json

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Fetch exact official upstream release tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/VDVde/VDV301.git \
            refs/tags/VDV-301-2.1:refs/tags/VDV-301-2.1 \
            refs/tags/VDV-301-2.2:refs/tags/VDV-301-2.2
          test "$(git rev-parse refs/tags/VDV-301-2.1)" = "585e0bea34b64887db4276f1c94d5f3e78f06c66"
          test "$(git rev-parse refs/tags/VDV-301-2.2)" = "f283697124750d12189b960b302b399769bad530"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XSD tooling
        run: |
          python -m pip install --disable-pip-version-check lxml

      - name: Snapshot immutable state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/hds_revalidation_evidence_2026-09-07.json)" = "75d2717f88f80c2852d9392a79409acdc7648e58"
          test "$(git rev-parse HEAD:tools/validate_hds_revalidation_ev151.py)" = "6b4f77c21c85b11d109a0a3e9fa71528e08ef66a"
          test "$(git rev-parse HEAD:tools/validate_discovery_runtime_rv002.py)" = "946488b2b7d08d681089ec5bbbfd6558dab57e35"
          test "$(git rev-parse HEAD:tools/runtime_discovery_profile.py)" = "4473b913ad4576982789b2791b44e2cf1cba0c8d"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(wc -l < /tmp/xsd-before.sha256)" -eq 50

      - name: Fetch exact byte-pinned HDS PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          ids = ["HDS_V2.1", "HDS_V2.2", "HDS_V2.2a"]
          sources = json.loads(Path("audit_registry/pdf_source_registry_v0.1.json").read_text())
          pins = json.loads(Path("audit_registry/pdf_source_pins_v0.1.json").read_text())
          sb = {x["source_id"]: x for x in sources["sources"]}
          pb = {x["source_id"]: x for x in pins["sources"]}
          target_dir = Path("local_sources/vdv_pdfs")
          target_dir.mkdir(parents=True, exist_ok=True)
          for sid in ids:
              source, pin = sb[sid], pb[sid]
              data = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(
                          source["official_url"],
                          headers={
                              "User-Agent": "VDV301-Audit-EV151-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)",
                              "Accept": "application/pdf,application/octet-stream;q=0.9,*/*;q=0.1",
                          },
                      )
                      with urllib.request.urlopen(req, timeout=90) as response:
                          data = response.read()
                      break
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 * (attempt + 1))
              assert data is not None and data.startswith(b"%PDF-")
              assert hashlib.sha256(data).hexdigest() == pin["expected_sha256"]
              assert len(data) == int(pin["expected_size_bytes"])
              (target_dir / source["local_filename"]).write_bytes(data)
              print("PIN_OK", sid, pin["expected_sha256"], len(data))
          PY

      - name: Re-run EV-151, RV-002 and repository XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ev151-closure
          python -m py_compile tools/runtime_discovery_profile.py tools/validate_discovery_runtime_rv002.py tools/validate_hds_revalidation_ev151.py
          python tools/validate_hds_revalidation_ev151.py --repo-root . --output-dir artifacts/ev151-closure
          python tools/validate_discovery_runtime_rv002.py
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Close HDS block atomically
        shell: bash
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}
          CLOSURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          rp = Path("audit_registry/finding_revalidation_registry_v0.1.json")
          sp = Path("00_START_HERE/CURRENT_STATE.json")
          ep = Path("audit_registry/hds_revalidation_evidence_2026-09-07.json")
          report = Path("docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_HDS_2026-09-07.md")
          d = json.loads(rp.read_text(encoding="utf-8"))
          s = json.loads(sp.read_text(encoding="utf-8"))
          e = json.loads(ep.read_text(encoding="utf-8"))
          run_id = os.environ["CLOSURE_RUN_ID"]
          run_url = os.environ["CLOSURE_RUN_URL"]

          assert e["evidence_id"] == "EV-151" and e["result"] == "PASS"
          assert e["scope"] == ["HDS-001"]
          assert e["successful_run_id"] == "34091867070"
          assert e["successful_job_id"] == "101646862752"
          assert e["head_sha"] == "9f84047937e66236c1741dfe8a35ac124f1ca758"
          assert e["artifact_id"] == "10007106356"
          assert e["artifact_digest"] == "sha256:90bc7a5e12af1fb65abd7d4c5d97748e3f2153fd3ab6297d7616c300c4a786ca"
          assert e["finding_results"]["HDS-001"]["recommended_terminal_state"] == "context_verified"
          assert e["finding_results"]["HDS-001"]["validation_behavior"] == "discovery_http_profile_not_service_xsd"
          assert e["runtime_evidence"]["rerun_result"] == "PASS"
          assert e["runtime_evidence"]["live_network_claim"] is False
          assert e["authority"]["HDS_V2.1"]["official_upstream_tag_commit"] == "585e0bea34b64887db4276f1c94d5f3e78f06c66"
          assert e["authority"]["HDS_V2.2"]["official_upstream_tag_commit"] == "f283697124750d12189b960b302b399769bad530"
          assert e["authority"]["HDS_V2.2a"]["dedicated_upstream_tag_exists"] is False
          assert all(not e["authority"][x]["dedicated_hds_xsd"] for x in ["HDS_V2.1","HDS_V2.2","HDS_V2.2a"])
          assert e["full_xsd_pool"] == {"count": 50, "result": "PASS", "role": "repository-regression-only"}
          assert e["immutable_guards"]["frozen_inventory_blob"] == "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          assert e["immutable_guards"]["frozen_inventory_mutated"] is False
          assert e["immutable_guards"]["xsd_mutated"] is False
          assert e["infrastructure_note"]["substantive_finding_contradiction"] is False
          assert e["infrastructure_note"]["behavior_changed"] is False

          inv = d["inventory"]
          entries = inv["entries"]
          assert inv["state"] == "frozen" and inv["entry_count"] == 192 and len(entries) == 192
          assert d["next_revalidation_block"] == "HDS"
          pre_terminal = sum(x["revalidation_state"] != "pending" for x in entries)
          pre_pending = sum(x["revalidation_state"] == "pending" for x in entries)
          assert (pre_terminal, pre_pending) == (126, 66), (pre_terminal, pre_pending)

          by = {x["finding_id"]: x for x in entries}
          hds = by["HDS-001"]
          assert hds["revalidation_state"] == "pending"
          assert hds["terminal_state_source"] is None
          hds["revalidation_state"] = "context_verified"
          hds["terminal_state_source"] = str(report)

          post_terminal = sum(x["revalidation_state"] != "pending" for x in entries)
          post_pending = sum(x["revalidation_state"] == "pending" for x in entries)
          assert (post_terminal, post_pending) == (127, 65), (post_terminal, post_pending)
          first_pending = next(x["finding_id"] for x in entries if x["revalidation_state"] == "pending")
          assert first_pending == "JIS-001", first_pending

          next_block = "JIS"
          next_subblock = "JIS"
          d["next_revalidation_block"] = next_block
          blocks = d["revalidation_blocks"]
          key = "HDS_V21_V22_V22A_HDS001"
          assert key not in blocks
          blocks[key] = {
              "date": "2026-09-07",
              "state": "completed",
              "parent_block": "HDS",
              "scope_kind": "frozen_cross_version_non_xsd_profile_finding",
              "source_ids": ["HDS_V2.1", "HDS_V2.2", "HDS_V2.2a"],
              "authority_lane": "three byte-pinned official HDS publications plus exact upstream V2.1/V2.2 release inventories and deterministic RV-002 profile evidence",
              "service_model": "intentional_non_xsd_dns_sd_http_profile",
              "evidence_id": "EV-151",
              "evidence_run_id": "34091867070",
              "evidence_job_id": "101646862752",
              "evidence_head_sha": "9f84047937e66236c1741dfe8a35ac124f1ca758",
              "artifact_id": "10007106356",
              "artifact_digest": "sha256:90bc7a5e12af1fb65abd7d4c5d97748e3f2153fd3ab6297d7616c300c4a786ca",
              "evidence_record": str(ep),
              "closure_run_id": run_id,
              "closure_run_url": run_url,
              "findings": {"HDS-001": "context_verified"},
              "runtime_evidence": "RV-002 rerun PASS; deterministic only, no live-network claim",
              "dedicated_hds_xsd": False,
              "xsd_mutation": False,
              "frozen_inventory_mutation": False,
              "next_block": next_block,
              "next_subblock": next_subblock,
              "terminal_state_source": str(report),
          }

          a = s["audit"]
          assert a["finding_inventory_count"] == 192
          assert (a["finding_revalidation_completed_findings"], a["finding_revalidation_pending_findings"]) == (126, 66)
          assert a["finding_revalidation_next_block"] == "HDS"
          assert a["finding_revalidation_current_block"] == "TVS_V2.1_DRTVS21"
          assert a["finding_revalidation_latest_completed_block"] == "TVS_V2.1_DRTVS21"
          assert a["latest_revalidation_evidence_id"] == "EV-150"
          assert "hds_revalidation" not in a

          a["finding_revalidation_completed_findings"] = 127
          a["finding_revalidation_pending_findings"] = 65
          a["finding_revalidation_current_block"] = key
          a["finding_revalidation_latest_completed_block"] = key
          a["finding_revalidation_next_block"] = next_block
          a["finding_revalidation_latest_terminal_state_source"] = str(report)
          a["latest_revalidation_evidence_id"] = "EV-151"
          a["hds_revalidation"] = {
              "status": "complete",
              "completed_at_run": run_id,
              "evidence_id": "EV-151",
              "evidence_run_id": "34091867070",
              "evidence_job_id": "101646862752",
              "evidence_head_sha": "9f84047937e66236c1741dfe8a35ac124f1ca758",
              "artifact_id": "10007106356",
              "artifact_digest": "sha256:90bc7a5e12af1fb65abd7d4c5d97748e3f2153fd3ab6297d7616c300c4a786ca",
              "terminal_states": {"HDS-001": "context_verified"},
              "service_model": "intentional_non_xsd_dns_sd_http_profile",
              "runtime_evidence": "RV-002 rerun PASS",
              "live_network_claim": False,
              "next_block": next_block,
              "next_subblock": next_subblock,
              "xsd_mutation": False,
              "frozen_inventory_mutation": False,
          }

          report_text = '# Finding Revalidation — HDS / HTMLDisplayService V2.1, V2.2, V2.2a\n\nDate: 2026-09-07  \nScope: `HDS-001`  \nEvidence: `EV-151`, successful run `34091867070`, job `101646862752`  \nEvidence commit: `9f84047937e66236c1741dfe8a35ac124f1ca758`  \nClosure run: `{run_id}`\n\n## Authority route\n\n`HDS-001` is a non-XSD service-modelling finding. The exact byte-pinned official publications for HTMLDisplayService V2.1, V2.2 and V2.2a were re-fetched and hash/size checked. The exact official upstream `VDV-301-2.1` and `VDV-301-2.2` release inventories were also checked and contain no dedicated HTMLDisplayService service XSD. V2.2a has no dedicated upstream release tag and the 50-root integration pool likewise contains no HDS service XSD.\n\nThe absence of such a schema is therefore intentional, not a missing-schema defect. HDS routes to a version-specific DNS-SD/HTTP profile validator.\n\n## HDS-001 — context_verified\n\nThe three canonical Deep Reads independently establish the same authority boundary and retain the version differences instead of applying latest-wins:\n\n- V2.1: `_http._tcp`, TXT `content + path`, endpoint from SRV target/port plus TXT path.\n- V2.2: canonical `_http._tcp`, TXT `content + url`, endpoint from TXT `url`; SRV host/port are not reconstructed into the content URL.\n- V2.2a: `_ibisip_http._tcp` is the documented transition/future label while `_http._tcp` remains accepted with a deprecated/future-not-recommended note; endpoint remains TXT `url`.\n\nRV-002 was rerun successfully and confirms these deterministic discovery/endpoint rules. It performs no live DNS/mDNS or HTTP reachability and no such claim is made.\n\n## Disproof and regression guards\n\nThe strongest contrary hypothesis — that a hidden or omitted HDS XML contract exists — was actively checked against the exact V2.1/V2.2 upstream release inventories, the current integration XSD pool and the authoritative HDS publications. It was rejected. The complete 50-root-XSD regression pool also passed unchanged.\n\nThe first EV-151 attempt (`34091700946`) failed only because the fork checkout did not locally contain the upstream release-tag refs. The repair fetched and pinned the exact official upstream tag commits before the inventory check; no HDS behavior, finding classification, XSD or frozen inventory was changed.\n\n## Closure\n\nEV-151 PASS; RV-002 rerun PASS; all 50 root XSDs PASS; all three official HDS PDF pins PASS; frozen 192-finding inventory unchanged; no XSD mutation. Revalidation count is now **127/192 terminal, 65 pending**. The first remaining pending finding is `JIS-001`; next block is `JIS`.\n'.format(run_id=run_id)
          rp.write_text(json.dumps(d, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          sp.write_text(json.dumps(s, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          report.write_text(report_text, encoding="utf-8")
          print("HDS_CLOSURE_STATE_OK", post_terminal, post_pending, first_pending)
          PY

      - name: Verify allowlist, remove temporary workflows, commit and push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-final.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-final.sha256

          rm .github/workflows/temp_validate_hds_ev151.yml
          rm .github/workflows/hds-registry-closure.yml

          git add \
            audit_registry/finding_revalidation_registry_v0.1.json \
            00_START_HERE/CURRENT_STATE.json \
            docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_HDS_2026-09-07.md \
            .github/workflows/temp_validate_hds_ev151.yml \
            .github/workflows/hds-registry-closure.yml

          python - <<'PY'
          import subprocess
          expected = sorted([
              ".github/workflows/hds-registry-closure.yml",
              ".github/workflows/temp_validate_hds_ev151.yml",
              "00_START_HERE/CURRENT_STATE.json",
              "audit_registry/finding_revalidation_registry_v0.1.json",
              "docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_HDS_2026-09-07.md",
          ])
          actual = sorted(subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines())
          assert actual == expected, (actual, expected)
          assert not any(x.lower().endswith(".xsd") for x in actual)
          assert "audit_registry/finding_inventory_frozen_2026-09-03.json" not in actual
          print("CLOSURE_ALLOWLIST_OK")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: close HDS revalidation block [skip ci]"
          git push origin HEAD:dev/schema-integration
