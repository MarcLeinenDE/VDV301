name: temp-gate-known-issues-runtime-mapping-baseline

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_known_issues_runtime_mapping_baseline.yml

permissions:
  contents: read

jobs:
  gate-runtime-mapping-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact runtime-mapping baseline prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c8aa351439d1b6993454f637423cee7863367b3e"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "7ebc8c98120ae7b1740629729037c05cef4b0f38"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.schema.json)" = "520530f345c199432f10c11c8ab3acca817ec903"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "0f5bf0c9c1bfdd11a15a89ec2b396bc393e11692"
          test "$(git hash-object tools/generate_known_issues_runtime_mapping_v0_1.py)" = "827abf198280d171693da0563cdeaf2fba6fc259"
          test "$(git hash-object tools/validate_known_issues_runtime_mapping_v0_1.py)" = "5f6c85c4787501324e0a1b84a7a7e076c821be24"

      - name: Validate declarative mapping baseline
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_known_issues_runtime_mapping_v0_1.py

      - name: Verify no executable matcher activation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          m=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          assert m['state']=='reviewed_inventory'
          assert m['counts']['reviewed_mapping_count']==30
          assert m['counts']['implemented_count']==0
          assert all(x['implementation_state']=='reviewed_not_implemented' for x in m['mappings'])
          assert m['policy']['trigger_descriptions_are_not_executable_matchers'] is True
          assert m['policy']['implementation_requires_separate_profile_specific_validation'] is True
          assert m['policy']['normative_xsd_result_must_not_be_overridden'] is True
          print('PASSED: reviewed runtime mappings are declarative only; implemented=0')
          PY
          python tools/validate_sdk_manifest_v0_1.py

      - name: Validate all 50 root XSDs and prove read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: runtime-mapping baseline gate complete; repository remains unmodified"
