name: TEMP validate VDV301-2 General Conventions V2.2 EV-132

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_validate_vdv3012_gc22_ev132.yml
      - tools/validate_vdv3012_gc22_ev132.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned VDV301-2 GC V2.2 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request
          source_id = 'VDV301-2_GC_V2.2'
          sources = json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text(encoding='utf-8'))
          pins = json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text(encoding='utf-8'))
          source = next(x for x in sources['sources'] if x['source_id'] == source_id)
          pin = next(x for x in pins['sources'] if x['source_id'] == source_id)
          request = urllib.request.Request(source['official_url'], headers={
              'User-Agent': 'VDV301-Audit-EV132/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          actual = hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual == pin['expected_sha256'], (actual, pin['expected_sha256'])
          assert len(data) == int(pin['expected_size_bytes']), (len(data), pin['expected_size_bytes'])
          target = Path('local_sources/vdv_pdfs') / source['local_filename']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual} size={len(data)}')
          PY

      - name: Render targeted visible evidence pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ev132/pages artifacts/ev132/text
          for p in 5 6 13 25 27 31 33 52 62 64 66 70; do
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 150 \
              local_sources/vdv_pdfs/VDV301-2_GC_V2.2.pdf \
              "artifacts/ev132/pages/page-$p"
            pdftotext -f "$p" -l "$p" -layout \
              local_sources/vdv_pdfs/VDV301-2_GC_V2.2.pdf \
              "artifacts/ev132/text/page-$p.txt"
          done

      - name: Run EV-132
        shell: bash
        env:
          EV132_OUTPUT_DIR: artifacts/ev132
        run: |
          set -euo pipefail
          python tools/validate_vdv3012_gc22_ev132.py

      - name: Build evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum local_sources/vdv_pdfs/VDV301-2_GC_V2.2.pdf > artifacts/ev132/pdf.sha256
          find artifacts/ev132 -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifacts/ev132/manifest.sha256
          cat artifacts/ev132/ev132_result.json
          cat artifacts/ev132/manifest.sha256

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Verify no tracked mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          git diff --exit-code -- '*.xsd'
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo 'Unexpected tracked changes:'
            git status --short
            git diff --exit-code
            exit 1
          fi

      - name: Upload EV-132 evidence
        uses: actions/upload-artifact@v4
        with:
          name: vdv3012-gc22-ev132
          path: artifacts/ev132
          if-no-files-found: error
          retention-days: 90
