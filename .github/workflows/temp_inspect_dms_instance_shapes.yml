name: TEMP inspect DMS instance shapes

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_inspect_dms_instance_shapes.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check lxml
      - name: Inspect exact declarations needed for instance tests
        shell: bash
        run: |
          python - <<'PY'
          from lxml import etree
          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          for path in ['IBIS-IP_common_V2.0.xsd','IBIS-IP_common_V2.1.xsd','IBIS-IP_common_V2.2.xsd','IBIS-IP_common_V2.4.xsd']:
              root=etree.parse(path).getroot()
              ct=root.xpath("./xs:complexType[@name='MessageStructure']",namespaces=NS)[0]
              print('\n',path,'MessageStructure')
              for e in ct.xpath('./xs:sequence/xs:element',namespaces=NS):
                  print(e.get('name'),e.get('type'),e.get('minOccurs','1'),e.get('maxOccurs','1'))
          for path in ['IBIS-IP_Enumerations_V2.0.xsd','IBIS-IP_Enumerations_V2.1.xsd','IBIS-IP_Enumerations_V2.2.xsd','IBIS-IP_Enumerations_V2.4.xsd']:
              root=etree.parse(path).getroot()
              st=root.xpath("./xs:simpleType[@name='MessageTypeEnumeration']",namespaces=NS)[0]
              vals=st.xpath('.//xs:enumeration/@value',namespaces=NS)
              print('\n',path,'MessageTypeEnumeration',vals)
          for path in ['IBIS-IP_DeviceManagementService_V2.1.xsd','IBIS-IP_DeviceManagementService_V2.2.xsd','IBIS-IP_DeviceManagementService_V2.4.xsd']:
              root=etree.parse(path).getroot()
              ct=root.xpath("./xs:complexType[@name='DeviceManagementService.InstallUpdateRequestStructure']",namespaces=NS)[0]
              print('\n',path,'InstallUpdateRequestStructure')
              for e in ct.xpath('./xs:sequence/xs:element',namespaces=NS):
                  print(e.get('name'),e.get('type'),e.get('minOccurs','1'),e.get('maxOccurs','1'))
              ds=root.xpath("./xs:complexType[@name='DeviceStatusStructure']",namespaces=NS)[0]
              print(path,'DeviceStatusStructure')
              for e in ds.xpath('./xs:sequence/xs:element',namespaces=NS):
                  print(e.get('name'),e.get('type'),e.get('minOccurs','1'),e.get('maxOccurs','1'))
          PY
