name: temp-gate-runtime-mapping-review-pcs-v21-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_pcs_v21.yml

permissions:
  contents: read

jobs:
  gate-pcs-v21-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7acb779e465f4c3c3f92fd397ac8465cb43e4721"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "5c9176e130269c84329f363e15fa616c5d743e27"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "affa7f1b16371b895f51baa716a0ec784373c8e8"
          test "$(git hash-object sdk_manifest/README.md)" = "fe7df060647b3e10db78c9612c543f0dc1eb73fd"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "ee65aaa1ce0390bf5eb5049b1dd32b51a76781e7"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "6b84f871e0411649669fb9a0a3ee496cf084bb27"

      - name: Validate synchronized runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':18,'not_applicable':113,'not_designed':1,'reviewed':60}
          assert r['counts']=={
              'reviewed_mapping_count':60,
              'implemented_count':0,
              'semantic_candidate_count':18,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='PCS_V21_PCS_001'
          print('PASSED: PCS V2.1 closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: PCS V2.1 runtime-mapping closure gate complete"
