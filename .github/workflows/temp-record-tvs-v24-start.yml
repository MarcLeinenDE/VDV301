name: temp-record-tvs-v24-start

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record V2.4 source and authority start
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('audit_registry/pdf_source_pins_v0.1.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert not any(x['source_id'] == 'TVS_V2.4' for x in d['sources'])
          d['run_id'] = '33264912909'
          d['sources'].append({
              'source_id': 'TVS_V2.4',
              'expected_sha256': 'e7caca3de444b3eca15d539572cd4b896e56e5bb608b4827211b51be0ad56c51',
              'expected_size_bytes': 864860,
              'pinned_at_utc': '2026-08-29T17:10:21Z',
              'deep_read_source_ready': True,
              'evidence_run_id': '33264912909'
          })
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          delta = {
            'delta_version': '0.1',
            'date': '2026-08-29',
            'base_registry': 'audit_registry/deep_read_registry_v0.1.json',
            'document_updates': {
              'TVS_V2.4': {
                'state': 'source_pinned_authority_established_pending_fresh_read',
                'official_url': 'https://www.vdv.de/301-2-16-sde-v2.4-ticketvalidationservice.pdfx',
                'publication': 'VDV-Schrift 301-2-16, TicketValidationService V2.4',
                'fresh_read_started': None,
                'historical_findings_opened_during_fresh_read': False,
                'source_pin': {
                  'sha256': 'e7caca3de444b3eca15d539572cd4b896e56e5bb608b4827211b51be0ad56c51',
                  'size_bytes': 864860,
                  'pin_registry': 'audit_registry/pdf_source_pins_v0.1.json',
                  'evidence_run': '33264912909',
                  'pinned_at_utc': '2026-08-29T17:10:21Z'
                },
                'authority_status': {
                  'official_pdf': 'official_public_VDV_writing',
                  'official_release_tag_for_2_4_exists': False,
                  'upstream_tags_checked': ['VDV-301-1.0','VDV-301-2.0','VDV-301-2.1','VDV-301-2.2','VDV-301-2.3'],
                  'upstream_master_head': '14880bb33beec5c5dffe96315b730bd6c094a585',
                  'upstream_master_head_date': '2023-01-04T11:37:03Z',
                  'upstream_master_service_file': 'IBIS-IP_TicketValidationService_V2.4.xsd',
                  'upstream_master_service_blob': '291f41518fd48cd9dcc9f285cf9b5fec7dd72159',
                  'upstream_master_service_includes': ['IBIS-IP_common_V2.4.xsd','IBIS-IP_Enumerations_V2.2.xsd'],
                  'upstream_master_common_v2_4_present': False,
                  'upstream_master_enums_v2_2_blob': '2a23b512379b18e8f122ac1272cef8229fb86283',
                  'upstream_merge_prs': [23,26],
                  'upstream_master_family_status': 'merged_but_dependency_incomplete_not_release_tagged'
                },
                'selected_deep_read_xsd_comparison_family': {
                  'authority_class': 'candidate_integration',
                  'service_file': 'IBIS-IP_TicketValidationService_V2.4.xsd',
                  'service_blob': '34b18b8c874e325dd923b366a72bb0ebee32e59e',
                  'common_file': 'IBIS-IP_common_V2.4.xsd',
                  'common_blob': '1946fd37e29ced605654f49ea3d98cd2fbbdc8e4',
                  'enumerations_file': 'IBIS-IP_Enumerations_V2.4.xsd',
                  'enumerations_blob': '2afed8cf23afa91db92b0f043cc5b4ad428b0f25',
                  'integration_commit': 'c9c086ac07f7e9bdb271c54f7a274e3cf0d03749',
                  'integration_commit_message': 'Integrate public schema candidate files',
                  'service_change_in_integration_commit': 'Enumerations include changed from V2.2 to V2.4',
                  'rule': 'Use this complete family for technical PDF/XSD comparison only as candidate/integration authority. Do not describe success as official V2.4 release XSD conformance.'
                },
                'evidence_gate': 'docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md',
                'fresh_read_rule': 'Do not open historical TVS V2.4 findings, including TVS-001, until the independent V2.4 PDF fresh read and targeted visible review are frozen.'
              }
            }
          }
          Path('audit_registry/deep_read_registry_delta_tvs_v24_2026-08-29.json').write_text(json.dumps(delta, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          handoff = '''# Audit handoff delta - TVS V2.4 start - 2026-08-29\n\nTVS V2.4 has been started document-first. Historical V2.4 findings remain closed.\n\n## Official PDF source\n\n```text\nURL: https://www.vdv.de/301-2-16-sde-v2.4-ticketvalidationservice.pdfx\nsha256: e7caca3de444b3eca15d539572cd4b896e56e5bb608b4827211b51be0ad56c51\nsize: 864860\npin run: 33264912909\npinned: 2026-08-29T17:10:21Z\n```\n\n## V2.4 XSD authority boundary\n\nNo upstream `VDV-301-2.4` tag exists. Tags currently stop at `VDV-301-2.3`.\n\nUpstream master head is `14880bb33beec5c5dffe96315b730bd6c094a585`, merge of PR #26 on 2023-01-04. It contains `IBIS-IP_TicketValidationService_V2.4.xsd` blob `291f41518fd48cd9dcc9f285cf9b5fec7dd72159`, which includes Common V2.4 and Enumerations V2.2. Current upstream master does not contain the referenced Common V2.4 file, so that master family is dependency-incomplete and cannot be treated like a release-tagged exact family.\n\nFor Deep Read technical comparison, `dev/schema-integration` contains a complete candidate/integration family:\n\n```text\nTVS V2.4     34b18b8c874e325dd923b366a72bb0ebee32e59e\nCommon V2.4  1946fd37e29ced605654f49ea3d98cd2fbbdc8e4\nEnums V2.4   2afed8cf23afa91db92b0f043cc5b4ad428b0f25\n```\n\nThe service include was changed from Enums V2.2 to Enums V2.4 in integration commit `c9c086ac07f7e9bdb271c54f7a274e3cf0d03749` (`Integrate public schema candidate files`). This family is candidate/integration authority only.\n\n## Next\n\n1. Fresh-read the exact pinned V2.4 PDF without opening historical TVS findings.\n2. Render material pages from pinned bytes and inspect visibly.\n3. Freeze independent observations.\n4. Only then open/reconcile V2.4 history, especially TVS-001.\n5. Add executable candidate/integration evidence if needed, with explicit authority guard.\n\nNo XSD change or upstream action is authorized.\n'''
          Path('docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_TVS_V24_START_2026-08-29.md').write_text(handoff, encoding='utf-8')

          # guards
          json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          json.loads(Path('audit_registry/deep_read_registry_delta_tvs_v24_2026-08-29.json').read_text())
          PY
      - name: Commit start and remove temporary workflows
        run: |
          set -euo pipefail
          git add audit_registry/pdf_source_pins_v0.1.json audit_registry/deep_read_registry_delta_tvs_v24_2026-08-29.json docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_TVS_V24_START_2026-08-29.md
          git rm .github/workflows/temp-tvs-v24-source-pin.yml .github/workflows/temp-record-tvs-v24-start.yml
          git diff --cached --name-status
          if git diff --cached --name-only | grep -E '\.xsd$'; then exit 1; fi
          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git commit -m 'Pin and start TVS V2.4 deep read'
          git push origin HEAD:dev/schema-integration
