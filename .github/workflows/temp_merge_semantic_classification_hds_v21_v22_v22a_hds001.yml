name: temp-merge-semantic-classification-hds-v21-v22-v22a-hds001

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_merge_semantic_classification_hds_v21_v22_v22a_hds001.yml

permissions:
  contents: write

jobs:
  merge-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact prestate and HDS authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8428bc260415fc970650528aac8269b9b4bc1d5e"
          test "$(git rev-parse HEAD^^)" = "51f21f09c8811abc170ee0435f09fcda3b20593c"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "ba781751bcb5a256d8824b6d0caae01b42b3de1f"
          test "$(git hash-object audit_registry/semantic_classification_blocks/HDS_V21_V22_V22A_HDS001_v0.1.json)" = "6e4cd07a3bbd7075aa06612eeaa3af704e7a6a08"
          test "$(git hash-object audit_registry/hds_revalidation_evidence_2026-09-07.json)" = "75d2717f88f80c2852d9392a79409acdc7648e58"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_HDS_2026-09-07.md)" = "a258279358a128519656f10e2f85bba2d9e1e7f9"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.1.md)" = "a71603fd2f1c1ad177da23722d07ee36af5eea87"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.2.md)" = "bcee902b1bde7fdd7a705dac4dcabc35f6c1700f"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.2a.md)" = "938e44a85256dcffba7e7201c00b6a1254e6d5b0"
          test "$(git hash-object tools/validate_discovery_runtime_rv002.py)" = "946488b2b7d08d681089ec5bbbfd6558dab57e35"
          test "$(git hash-object tools/runtime_discovery_profile.py)" = "4473b913ad4576982789b2791b44e2cf1cba0c8d"
          test "$(git hash-object tools/runtime_http_profile.py)" = "937a50223a5e4545ce3d33f4f0d8b0ce05b1cb4d"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          block = json.loads(Path('audit_registry/semantic_classification_blocks/HDS_V21_V22_V22A_HDS001_v0.1.json').read_text())
          baseline = json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          evidence = json.loads(Path('audit_registry/hds_revalidation_evidence_2026-09-07.json').read_text())

          assert registry['progress']['classified_count'] == 132
          assert registry['progress']['remaining_count'] == 60
          assert registry['progress']['latest_block'] == 'DRTVS21_V21_001_004'
          existing = {e['finding_id']: e for e in registry['entries']}
          assert 'HDS-001' not in existing

          assert block['block_id'] == 'HDS_V21_V22_V22A_HDS001'
          assert block['source_baseline_payload_sha256'] == 'd5bf14df302d57a0fc3d71792e1cb00583fafd3e9c7efd19721fd0de353dd576'
          assert [e['finding_id'] for e in block['entries']] == ['HDS-001']
          h = block['entries'][0]
          assert h['normative_authority'] == 'no_strict_xsd_profile'
          assert h['primary_issue_kind'] == 'intentional_design_misread'
          assert h['defect_assessment'] == 'intentional_design'
          assert h['sdk_behavior'] == 'no_runtime_diagnostic'
          assert h['runtime_match']['state'] == 'reviewed'
          assert [v['version'] for v in h['version_scope']] == ['V2.1','V2.2','V2.2a']
          assert all(v['xsd_profile'] is None for v in h['version_scope'])

          frozen = {e['finding_id']: e for e in baseline['inventory']['entries']}
          assert baseline['state'] == 'frozen'
          assert baseline['baseline_payload_sha256'] == 'd5bf14df302d57a0fc3d71792e1cb00583fafd3e9c7efd19721fd0de353dd576'
          assert frozen['HDS-001']['revalidation_state'] == 'context_verified'
          assert frozen['HDS-001']['terminal_state_source'] == 'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_HDS_2026-09-07.md'

          assert evidence['evidence_id'] == 'EV-151'
          assert evidence['result'] == 'PASS'
          assert evidence['successful_run_id'] == '34091867070'
          assert evidence['successful_job_id'] == '101646862752'
          assert evidence['head_sha'] == '9f84047937e66236c1741dfe8a35ac124f1ca758'
          assert evidence['finding_results']['HDS-001']['recommended_terminal_state'] == 'context_verified'
          assert evidence['finding_results']['HDS-001']['validation_behavior'] == 'discovery_http_profile_not_service_xsd'
          assert evidence['authority']['HDS_V2.1']['dedicated_hds_xsd'] is False
          assert evidence['authority']['HDS_V2.2']['dedicated_hds_xsd'] is False
          assert evidence['authority']['HDS_V2.2a']['dedicated_hds_xsd'] is False
          assert evidence['runtime_evidence']['rerun_result'] == 'PASS'
          assert evidence['runtime_evidence']['live_network_claim'] is False
          assert evidence['full_xsd_pool']['count'] == 50
          assert evidence['full_xsd_pool']['result'] == 'PASS'
          print('PASSED: exact 132/192 prestate and HDS-001 non-XSD authority boundary verified')
          PY

      - name: Re-run current-safe HDS discovery profile evidence
        run: python tools/validate_discovery_runtime_rv002.py

      - name: Snapshot XSD pool before semantic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256

      - name: Merge HDS-001 block and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/HDS_V21_V22_V22A_HDS001_v0.1.json
          python tools/validate_finding_semantic_classification.py
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert registry['progress']['classified_count'] == 133
          assert registry['progress']['remaining_count'] == 59
          assert registry['progress']['latest_block'] == 'HDS_V21_V22_V22A_HDS001'
          assert registry['progress']['latest_block_file'] == 'audit_registry/semantic_classification_blocks/HDS_V21_V22_V22A_HDS001_v0.1.json'
          by_id = {e['finding_id']: e for e in registry['entries']}
          h = by_id['HDS-001']
          assert h['normative_authority'] == 'no_strict_xsd_profile'
          assert h['primary_surface'] == 'contextual'
          assert h['primary_issue_kind'] == 'intentional_design_misread'
          assert h['defect_assessment'] == 'intentional_design'
          assert h['confidence'] == 'confirmed'
          assert h['validation_effect'] == ['code_generation_or_discovery_affected']
          assert h['sdk_behavior'] == 'no_runtime_diagnostic'
          assert h['runtime_match']['state'] == 'reviewed'
          assert '_http._tcp' in h['diagnostic']['de']['long']
          assert '_ibisip_http._tcp' in h['diagnostic']['en']['long']
          print('PASSED: merged registry is exactly 133/192 and HDS-001 semantics are preserved')
          PY

      - name: Validate all 50 root XSDs and prove no schema mutation
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          echo 'PASSED: all 50 root XSDs compile and are byte-identical before/after semantic merge'

      - name: Persist only HDS block and master registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp_merge_semantic_classification_hds_v21_v22_v22a_hds001.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          mapfile -t changed < <(git diff --name-only 51f21f09c8811abc170ee0435f09fcda3b20593c | sort)
          printf 'Durable cumulative diff:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'audit_registry/finding_semantic_classification_v0.1.json'
          test "${changed[1]}" = 'audit_registry/semantic_classification_blocks/HDS_V21_V22_V22A_HDS001_v0.1.json'
          git status --short
          git commit -m 'audit: merge HDS-001 semantic classification'
          git push origin HEAD:dev/schema-integration
