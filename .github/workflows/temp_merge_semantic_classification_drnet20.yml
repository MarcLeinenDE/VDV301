name: temp-merge-semantic-classification-drnet20

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drnet20.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drnet20:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2
      - name: Verify immutable prestate
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=7dbadf50bb84e1a48eb934ab7d7bc690629619d8
          test "$(git rev-parse HEAD^)" = "$CLEAN_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drnet20.yml"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "ea4f2f9179f35e88795b5a9df93a9b372b8db65d"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/network_v20_revalidation_evidence_2026-09-06.json)" = "7f0bd1ef502333b2811de6ce4e0dabff8c840bba"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_NETWORK_V20_2026-09-06.md)" = "7c81b20947e3846f918ccd452901cbd8da40e70e"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/VDV301-3_02-2020.md)" = "ddb4f49da1e3afa55920e50f9e74e554748f1378"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test ! -e audit_registry/semantic_classification_blocks/DRNET20_v0.1.json
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          target={'DRNET20-001','DRNET20-002','DRNET20-003'}
          m=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert m['progress']['classified_count']==109
          assert m['progress']['remaining_count']==83
          assert m['progress']['latest_block']=='DRDOOR21'
          assert not ({e['finding_id'] for e in m['entries']} & target)
          p=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          states={e['finding_id']:e['revalidation_state'] for e in p['inventory']['entries'] if e['finding_id'] in target}
          assert states=={fid:'context_verified' for fid in target}, states
          ev=json.loads(Path('audit_registry/network_v20_revalidation_evidence_2026-09-06.json').read_text())
          assert ev['evidence_id']=='EV-144' and ev['result']=='PASS' and set(ev['scope'])==target
          a=ev['authority']
          assert a['source_id']=='VDV301-3_02-2020'
          assert a['validation_lane']=='physical_network_protocol_profile'
          assert a['xsd_required'] is False
          assert a['latest_external_protocol_version_wins'] is False
          assert a['pdf_sha256']=='edfedf36eeb18075b45bf5224f0da6500cdd489438091f18bada42f9668c2a99'
          print('PASSED: DRNET20 prestate 109/192 and EV-144 authority boundary')
          PY
          git diff --exit-code
      - name: Verify exact PDF bytes and finding anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          sid='VDV301-3_02-2020'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==sid)
          pin=next(x for x in pins['sources'] if x['source_id']==sid)
          for attempt in range(4):
              try:
                  req=urllib.request.Request(source['official_url'],headers={'User-Agent':'VDV301-Semantic-DRNET20/0.1','Accept':'application/pdf,*/*;q=0.1'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(2*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert sha=='edfedf36eeb18075b45bf5224f0da6500cdd489438091f18bada42f9668c2a99'
          assert sha==pin['expected_sha256'] and len(data)==558005 and len(data)==int(pin['expected_size_bytes'])
          target=Path('local_sources/vdv_pdfs')/source['local_filename']
          target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          print('PIN_OK',sha,len(data))
          PY
          mkdir -p /tmp/drnet20
          for p in 7 8 10 17 18 19 29; do pdftotext -layout -f "$p" -l "$p" local_sources/vdv_pdfs/VDV301-3_02-2020.pdf "/tmp/drnet20/$p.txt"; done
          python - <<'PY'
          from pathlib import Path
          import re
          def pg(n): return re.sub(r'\s+',' ',Path(f'/tmp/drnet20/{n}.txt').read_text(errors='replace')).lower()
          assert '1000base-x' in pg(10) and '1 gbase-t' in pg(10)
          assert '1000base-x' in pg(17) and '1 gbase-t' in pg(17)
          assert 'sicherheitsrelevant' in pg(7)
          assert 'safety' in pg(8) and 'security' in pg(8)
          assert 'connection methodes' in pg(18)
          assert 'not describede' in pg(19)
          assert 'ieee 802.3af/at/bt' in pg(29)
          print('PASSED: exact DRNET20 PDF anchors')
          PY
      - name: Materialize exact DRNET20 block
        shell: bash
        env:
          DRNET20_BLOCK_ZLIB_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,os,zlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(os.environ['DRNET20_BLOCK_ZLIB_B64']))
          p=Path('audit_registry/semantic_classification_blocks/DRNET20_v0.1.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(raw)
          print('WROTE',p,len(raw))
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('audit_registry/semantic_classification_blocks/DRNET20_v0.1.json').read_text())
          assert b['block_id']=='DRNET20'
          assert [e['finding_id'] for e in b['entries']]==['DRNET20-001','DRNET20-002','DRNET20-003']
          for e in b['entries']:
              assert e['review_state']=='manually_reviewed'
              assert e['normative_authority']=='contextual_only'
              assert e['primary_surface']=='pdf'
              assert e['defect_assessment']=='confirmed_pdf_defect'
              assert e['sdk_behavior']=='no_runtime_diagnostic'
              assert e['runtime_match']['state']=='not_applicable'
              assert e['version_scope'][0]['authority']=='documentation_only'
              assert e['version_scope'][0]['xsd_profile'] is None
          assert b['entries'][2]['primary_issue_kind']=='editorial_residue'
          print('PASSED: exact DRNET20 documentation-only block')
          PY
      - name: Merge and validate
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRNET20_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRNET20; classified=112 remaining=80" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 112 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert r['progress']['classified_count']==112 and r['progress']['remaining_count']==80
          assert r['progress']['latest_block']=='DRNET20'
          assert r['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRNET20_v0.1.json'
          assert r['progress']['reviewed_blocks'][-1]=='DRNET20'
          print('PASSED: DRNET20 poststate 112/192')
          PY
      - name: Persist exact boundary
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=7dbadf50bb84e1a48eb934ab7d7bc690629619d8
          rm -rf local_sources/vdv_pdfs/VDV301-3_02-2020.pdf /tmp/drnet20 || true
          git rm .github/workflows/temp_merge_semantic_classification_drnet20.yml
          git add audit_registry/finding_semantic_classification_v0.1.json audit_registry/semantic_classification_blocks/DRNET20_v0.1.json
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'.github/workflows/temp_merge_semantic_classification_drnet20.yml','audit_registry/finding_semantic_classification_v0.1.json','audit_registry/semantic_classification_blocks/DRNET20_v0.1.json'}
          assert staged==expected,(staged,expected)
          changed=set(subprocess.check_output(['git','diff','--name-only','7dbadf50bb84e1a48eb934ab7d7bc690629619d8'],text=True).splitlines())
          assert changed=={'audit_registry/finding_semantic_classification_v0.1.json','audit_registry/semantic_classification_blocks/DRNET20_v0.1.json'},changed
          print('PASSED: persistent boundary registry + DRNET20 block only')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRNET20 semantic classification"
          git push origin HEAD:dev/schema-integration
