name: temp-gate-runtime-mapping-review-common-v22-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_common_v22.yml

permissions:
  contents: read

jobs:
  gate-common-v22-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2abe180ea9a1feab48eae653d776e7c54dea7a66"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "045b070c915e3a40256c2070c1c85cfc57b8928d"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "d74977f2d0e0e6c27e287d02d101748c3ce29502"
          test "$(git hash-object sdk_manifest/README.md)" = "d17478a2cbe050b5d5a35ff927a9f7be2ff1a3d4"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "8d05d5a017aa68003a9ea7aefbcec77965fd1e69"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "79d8905ad3aa3d0983cfb1b19f0f357360732762"

      - name: Validate synchronized runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':26,'not_applicable':113,'not_designed':1,'reviewed':52}
          assert r['counts']=={
              'reviewed_mapping_count':52,
              'implemented_count':0,
              'semantic_candidate_count':26,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='COMMON_V22_DRCOM22_001'
          print('PASSED: Common V2.2 closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: Common V2.2 runtime-mapping closure gate complete"
