name: temp-gate-runtime-mapping-review-common-v22

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_common_v22.yml

permissions:
  contents: read

jobs:
  gate-common-v22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact review prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "89fa4ca27b8efbbfbdd91b87bd253102ff363622"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "8d05d5a017aa68003a9ea7aefbcec77965fd1e69"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "79d8905ad3aa3d0983cfb1b19f0f357360732762"
          test "$(git hash-object sdk_manifest/runtime_mapping_review_blocks/COMMON_V22_DRCOM22_001_v0.1.json)" = "008d24bae6ae274b8507332ec2f2cb3bbd1ba5aa"
          test "$(git hash-object IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"
          test "$(git hash-object IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"

      - name: Validate semantic registry and deterministic runtime mapping
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py

      - name: Rerun preserved EV-120
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_common_v22_ev120.py

      - name: Verify focused NetexMode boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from lxml import etree

          sem=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          mapping=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          block=json.loads(Path('sdk_manifest/runtime_mapping_review_blocks/COMMON_V22_DRCOM22_001_v0.1.json').read_text())
          by={e['finding_id']:e for e in sem['entries']}
          m={x['finding_id']:x for x in mapping['mappings']}['DRCOM22-001']

          assert by['DRCOM22-001']['runtime_match']['state']=='reviewed'
          assert m['activation_class']=='xsd_valid_advisory'
          assert m['required_precondition']=='xsd_result_valid'
          assert m['result_effect']=='decorate_existing_valid'
          assert m['implementation_state']=='reviewed_not_implemented'
          assert m['authority_guard']=='selected_xsd_result_remains_normative'
          assert mapping['counts']=={
              'reviewed_mapping_count':52,
              'implemented_count':0,
              'semantic_candidate_count':26,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          root=etree.parse('IBIS-IP_common_V2.2.xsd').getroot()
          netex=root.find("xs:complexType[@name='NetexMode']",NS)
          assert netex is not None
          choices=netex.findall('./xs:sequence/xs:choice',NS)
          assert len(choices)==2
          assert all(c.get('minOccurs')=='0' for c in choices)
          assert [e.get('name') for e in choices[0].findall('xs:element',NS)]==['PtMainMode','PrivateMainMode']
          assert [g.get('ref') for g in choices[1].findall('xs:group',NS)]==['PtSubmodeChoiceGroup','PrivateSubmodeChoiceGroup']

          XS='http://www.w3.org/2001/XMLSchema'
          harness=f'''<xs:schema xmlns:xs="{XS}" elementFormDefault="qualified">
            <xs:include schemaLocation="IBIS-IP_common_V2.2.xsd"/>
            <xs:element name="N" type="NetexMode"/>
          </xs:schema>'''
          with tempfile.NamedTemporaryFile('w',suffix='.xsd',dir='.',encoding='utf-8',delete=False) as fh:
              fh.write(harness); hp=Path(fh.name)
          try:
              schema=etree.XMLSchema(etree.parse(str(hp)))
          finally:
              hp.unlink(missing_ok=True)

          assert schema.validate(etree.fromstring(b'<N/>'))
          assert schema.validate(etree.fromstring(b'<N><PtMainMode>AirSubmode</PtMainMode><AirSubmode>unknown</AirSubmode></N>'))

          rb=block['entries'][0]
          assert any('must not impose the PDF one-of requirement as an additional validator rule' in g for g in rb['guards'])
          assert any('must not invent a VDV-301-2.2 release tag or alternate schema authority' in g for g in rb['guards'])
          print('PASSED: Common V2.2 NetexMode runtime boundary verified')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: Common V2.2 NetexMode runtime-mapping gate complete"
