name: temp-tvs-v21-ev112

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: read

jobs:
  ev112:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check lxml
      - name: Run EV-112
        run: python tools/validate_tvs_v21_ev112.py
