name: Temporary finalize Common V2.0 Deep Read

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-finalize-common-v20.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run deterministic closure finalizer
        run: python tools/temp_finalize_common_v20.py

      - name: Validate closure boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              '00_START_HERE/CURRENT_STATE.json',
              'audit_registry/deep_read_registry_delta_common_v20_2026-08-30.json',
              'audit_registry/deep_read_findings_delta_common_v20_2026-08-30.json',
              'audit_registry/finding_revalidation_registry_v0.1.json',
          ]
          for p in paths:
              json.loads(Path(p).read_text(encoding='utf-8'))
              print('OK JSON', p)
          PY
          if git status --porcelain | awk '{print $2}' | grep -E '\.xsd$'; then
            echo 'ERROR: XSD modification detected'
            exit 1
          fi

      - name: Remove temporary finalizer files
        shell: bash
        run: |
          set -euo pipefail
          rm tools/temp_finalize_common_v20.py
          rm .github/workflows/temp-finalize-common-v20.yml

      - name: Commit closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Marc Leinen'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -E '\.xsd$'; then
            echo 'ERROR: staged XSD modification detected'
            exit 1
          fi
          git diff --cached --check
          git status --short
          git commit -m 'Deep-read Common V2.0 and confirm EV-118'
          git push origin HEAD:dev/schema-integration
