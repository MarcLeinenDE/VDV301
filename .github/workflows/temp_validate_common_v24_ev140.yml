name: TEMP validate COMMON V2.4 EV-140

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_validate_common_v24_ev140.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned COMMON V2.4 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          source_id='COMMON_V2.4'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==source_id)
          pin=next(x for x in pins['sources'] if x['source_id']==source_id)
          req=urllib.request.Request(source['official_url'],headers={'User-Agent':'VDV301-Audit-EV140/0.1 (+https://github.com/MarcLeinenDE/VDV301)','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
          with urllib.request.urlopen(req,timeout=90) as response: data=response.read()
          actual=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual==pin['expected_sha256'],(actual,pin['expected_sha256'])
          assert len(data)==int(pin['expected_size_bytes']),(len(data),pin['expected_size_bytes'])
          target=Path('local_sources/vdv_pdfs')/source['local_filename']; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual} size={len(data)}')
          PY

      - name: Run EV-140 Common V2.4 revalidation gate
        shell: bash
        env:
          EV140_OUTPUT_DIR: artifacts/ev140
        run: |
          set -euo pipefail
          python tools/validate_common_v24_revalidation_ev140.py

      - name: Render all EV-140 evidence pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ev140/pages artifacts/ev140/text
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 180 \
              local_sources/vdv_pdfs/COMMON_V2.4.pdf "artifacts/ev140/pages/page-$p"
            pdftotext -f "$p" -l "$p" -layout \
              local_sources/vdv_pdfs/COMMON_V2.4.pdf "artifacts/ev140/text/page-$p.txt"
          done < artifacts/ev140/render_pages.txt

      - name: Build evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum local_sources/vdv_pdfs/COMMON_V2.4.pdf > artifacts/ev140/pdf.sha256
          find artifacts/ev140 -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifacts/ev140/manifest.sha256
          cat artifacts/ev140/ev140_result.json
          cat artifacts/ev140/render_pages.txt
          cat artifacts/ev140/manifest.sha256

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Verify no tracked mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.4_FRESH_2026-09-03.md)" = "1a2f58c60152e14a61257d21a8c2cd4533f2696e"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.4.md)" = "5800c06781b17775f6763a918568d3e5712210c5"
          test "$(git hash-object audit_registry/deep_read_findings_delta_common_v24_2026-09-03.json)" = "9744612c607e63659d574c13500cfc611f239f39"
          test "$(git hash-object IBIS-IP_common_V2.4.xsd)" = "1946fd37e29ced605654f49ea3d98cd2fbbdc8e4"
          test "$(git hash-object IBIS-IP_Enumerations_V2.4.xsd)" = "2afed8cf23afa91db92b0f043cc5b4ad428b0f25"
          test "$(git hash-object tools/validate_common_v24_ev122.py)" = "acbca8a808e623030c2ff48bc2e3f3e336cb5f11"
          test "$(git hash-object tools/validate_common_v24_revalidation_ev140.py)" = "75633e50c7de5a469acab226084603dbc0906ae2"
          git diff --exit-code -- '*.xsd'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload EV-140 evidence
        uses: actions/upload-artifact@v4
        with:
          name: common-v24-ev140
          path: artifacts/ev140
          if-no-files-found: error
          retention-days: 90
