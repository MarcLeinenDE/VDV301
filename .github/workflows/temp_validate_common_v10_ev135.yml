name: TEMP validate COMMON V1.0 EV-135
# rerun with frozen visual-page fallback provenance for DRCOM10-002

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_validate_common_v10_ev135.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned COMMON V1.0 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request
          source_id = 'COMMON_V1.0'
          sources = json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text(encoding='utf-8'))
          pins = json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text(encoding='utf-8'))
          source = next(x for x in sources['sources'] if x['source_id'] == source_id)
          pin = next(x for x in pins['sources'] if x['source_id'] == source_id)
          request = urllib.request.Request(source['official_url'], headers={
              'User-Agent': 'VDV301-Audit-EV135/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          actual_hash = hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual_hash == pin['expected_sha256'], (actual_hash, pin['expected_sha256'])
          assert len(data) == int(pin['expected_size_bytes']), (len(data), pin['expected_size_bytes'])
          target = Path('local_sources/vdv_pdfs') / source['local_filename']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual_hash} size={len(data)}')
          PY

      - name: Run EV-135 Common V1.0 revalidation gate
        shell: bash
        env:
          EV135_OUTPUT_DIR: artifacts/ev135
        run: |
          set -euo pipefail
          python tools/run_common_v10_revalidation_ev135.py

      - name: Render all EV-135 evidence pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ev135/pages artifacts/ev135/text
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 180 \
              local_sources/vdv_pdfs/COMMON_V1.0.pdf \
              "artifacts/ev135/pages/page-$p"
            pdftotext -f "$p" -l "$p" -layout \
              local_sources/vdv_pdfs/COMMON_V1.0.pdf \
              "artifacts/ev135/text/page-$p.txt"
          done < artifacts/ev135/render_pages.txt

      - name: Build evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum local_sources/vdv_pdfs/COMMON_V1.0.pdf > artifacts/ev135/pdf.sha256
          find artifacts/ev135 -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifacts/ev135/manifest.sha256
          cat artifacts/ev135/ev135_result.json
          test -f artifacts/ev135/page_fallbacks.json && cat artifacts/ev135/page_fallbacks.json || true
          cat artifacts/ev135/render_pages.txt
          cat artifacts/ev135/manifest.sha256

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Verify no tracked mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/deep_read_findings_delta_common_v10_2026-08-30.json)" = "da56c957f654c47207908f9a6e0808ecf9928ea1"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(git hash-object tools/validate_common_v10_ev117.py)" = "5d2b69aabd8de7b69575d6f98e6b6517c4d66fb4"
          git diff --exit-code -- '*.xsd'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload EV-135 evidence
        uses: actions/upload-artifact@v4
        with:
          name: common-v10-ev135
          path: artifacts/ev135
          if-no-files-found: error
          retention-days: 90
