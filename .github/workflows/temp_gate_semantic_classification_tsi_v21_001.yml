name: temp-gate-semantic-classification-tsi-v21-001

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_tsi_v21_001.yml

permissions:
  contents: read

jobs:
  gate-tsi-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact TSI prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "53eba5d2166f9ddf55ae4988e7efcda15b4781bf"
          test "$(git hash-object audit_registry/semantic_classification_blocks/TSI_V21_001_v0.1.json)" = "86553e6d85c69735c561e9251128937e2347953f"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "4ad87f224e1ded75545644034ecdc7c1e3a13a2a"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSI_2026-09-14.md)" = "be62868279f3cb0104ca728f207e6fb5ccd918ae"
          test "$(git hash-object IBIS-IP_TrainSetInformationService_V2.1.xsd)" = "897f373e31b76aa23d8bc206854b042524e4c102"
          test "$(git hash-object IBIS-IP_TrainSetInformationService_V2.2.xsd)" = "7ab1f8f892bfcea2a8b8a055f07de92c143356f9"

      - name: Verify TSI-001 cardinality boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/TSI_V21_001_v0.1.json').read_text())

          assert registry['progress']['classified_count']==166
          assert registry['progress']['remaining_count']==26
          assert registry['progress']['latest_block']=='TSD_V21_V22_001_003'
          assert [e['finding_id'] for e in block['entries']]==['TSI-001']

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['TSI-001']['revalidation_state']=='executable_confirmed'
          assert frozen['TSI-001']['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSI_2026-09-14.md'

          e=block['entries'][0]
          assert e['primary_issue_kind']=='cardinality_mismatch'
          assert e['defect_assessment']=='cross_artifact_mismatch'
          assert e['sdk_behavior']=='error_with_advisory'
          assert e['runtime_match']['state']=='candidate'

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          v21=etree.parse('IBIS-IP_TrainSetInformationService_V2.1.xsd')
          etree.XMLSchema(v21)
          elems=v21.xpath(
              "/xs:schema/xs:complexType[@name='TrainSetInformationService.GetTrainSetCompositionResponseStructure']/xs:sequence/xs:element",
              namespaces=NS
          )
          assert [x.get('name') for x in elems]==[
              'CoachType','CoachNumber','FrontCabin','RearCabin',
              'CoachPositionInTrainSet','CoupledSide','CoachState'
          ]
          assert all(x.get('maxOccurs','1')=='1' for x in elems)

          v22=etree.parse('IBIS-IP_TrainSetInformationService_V2.2.xsd')
          etree.XMLSchema(v22)
          single=v22.xpath(
              "/xs:schema/xs:complexType[@name='TrainSetInformationService.GetTrainSetCompositionResponseStructure']/xs:sequence/xs:element[@name='SingleCoach']",
              namespaces=NS
          )
          assert len(single)==1
          assert single[0].get('type')=='SingleCoachInATrainSet'
          assert single[0].get('maxOccurs')=='unbounded'

          terminal=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSI_2026-09-14.md').read_text()
          assert 'EV-161' in terminal and '34822675019' in terminal and '34822926605' in terminal
          assert 'one flat record validates' in terminal
          assert 'second documented coach record is rejected' in terminal
          print('PASSED: TSI-001 V2.1 cardinality mismatch and V2.2 correction-history boundary verified')
          PY

      - name: Simulate merge and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py \
            --block audit_registry/semantic_classification_blocks/TSI_V21_001_v0.1.json \
            --output /tmp/tsi-merged.json
          python tools/validate_finding_semantic_classification.py --registry /tmp/tsi-merged.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/tsi-merged.json',encoding='utf-8'))
          assert r['progress']['classified_count']==167
          assert r['progress']['remaining_count']==25
          assert r['progress']['latest_block']=='TSI_V21_001'
          e={x['finding_id']:x for x in r['entries']}['TSI-001']
          assert e['sdk_behavior']=='error_with_advisory'
          assert e['runtime_match']['state']=='candidate'
          print('PASSED: simulated TSI registry is exactly 167/192')
          PY

      - name: Validate all 50 root XSDs and prove read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: TSI semantic gate complete"
