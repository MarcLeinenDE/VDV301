name: Network V2.0 registry closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/network-v20-registry-closure.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Snapshot immutable XSD pool
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/network_v20_revalidation_evidence_2026-09-06.json)" = "7f0bd1ef502333b2811de6ce4e0dabff8c840bba"

      - name: Fetch exact Network PDF and IEEE context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          sid='VDV301-3_02-2020'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==sid)
          pin=next(x for x in pins['sources'] if x['source_id']==sid)
          for attempt in range(4):
              try:
                  req=urllib.request.Request(source['official_url'],headers={'User-Agent':'VDV301-Audit-EV144-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(2*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert sha==pin['expected_sha256']=='edfedf36eeb18075b45bf5224f0da6500cdd489438091f18bada42f9668c2a99'
          assert len(data)==int(pin['expected_size_bytes'])==558005
          target=Path('local_sources/vdv_pdfs')/source['local_filename']
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print('NETWORK_PDF_PIN_OK',sha,len(data))
          PY
          mkdir -p artifacts/ev144-closure/external
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 90 -A 'VDV301-Audit-EV144-Closure/0.1' \
            https://www.ieee802.org/3/publication/index.html -o artifacts/ev144-closure/external/ieee-publication.html
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 90 -A 'VDV301-Audit-EV144-Closure/0.1' \
            https://www.ieee802.org/3/interp/index.html -o artifacts/ev144-closure/external/ieee-interpretations.html

      - name: Re-run EV-144 and full XSD pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_network_v20_revalidation_ev144.py \
            --repo-root . \
            --output-dir artifacts/ev144-closure \
            --ieee-publication-html artifacts/ev144-closure/external/ieee-publication.html \
            --ieee-interpretations-html artifacts/ev144-closure/external/ieee-interpretations.html
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Close Network block atomically
        shell: bash
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}
          CLOSURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json,os
          from pathlib import Path

          rp=Path('audit_registry/finding_revalidation_registry_v0.1.json')
          sp=Path('00_START_HERE/CURRENT_STATE.json')
          ep=Path('audit_registry/network_v20_revalidation_evidence_2026-09-06.json')
          report=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_NETWORK_V20_2026-09-06.md')
          d=json.loads(rp.read_text(encoding='utf-8'))
          s=json.loads(sp.read_text(encoding='utf-8'))
          e=json.loads(ep.read_text(encoding='utf-8'))
          run_id=os.environ['CLOSURE_RUN_ID']; run_url=os.environ['CLOSURE_RUN_URL']

          assert e['evidence_id']=='EV-144' and e['result']=='PASS'
          assert e['successful_run_id']=='34025645375' and e['successful_job_id']=='101466007321'
          assert e['artifact_id']=='9986959255'
          assert e['artifact_digest']=='sha256:7d135ae12aab3a9ff8f307390545c177afea9f4dde25eafb63e44ea2310b5af4'
          assert e['authority']['xsd_required'] is False
          assert e['immutable_guards']['xsd_mutated'] is False
          assert e['immutable_guards']['frozen_inventory_mutated'] is False

          inv=d['inventory']; entries=inv['entries']
          assert inv['state']=='frozen' and inv['entry_count']==192 and len(entries)==192
          assert d['next_revalidation_block']=='Network'
          pre_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          pre_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (pre_terminal,pre_pending)==(103,89),(pre_terminal,pre_pending)
          by={x['finding_id']:x for x in entries}
          scope=['DRNET20-001','DRNET20-002','DRNET20-003']
          for fid in scope:
              assert by[fid]['revalidation_state']=='pending'
              assert by[fid]['terminal_state_source'] is None
              by[fid]['revalidation_state']='context_verified'
              by[fid]['terminal_state_source']=str(report)

          post_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          post_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (post_terminal,post_pending)==(106,86),(post_terminal,post_pending)

          # Derive the next block from the frozen inventory order, do not guess it.
          first_pending=next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')
          assert first_pending=='DRS-001', first_pending
          assert all(by[f]['revalidation_state']=='pending' for f in ['DRS-001','DRS-002','DRS-003','DRS-004'])
          next_block='DRS'
          next_subblock='DOOR_V2.1_DRS'
          d['next_revalidation_block']=next_block

          blocks=d['revalidation_blocks']
          assert 'Network_V2.0' not in blocks
          assert blocks['DOOR_V2.1']['state']=='completed'
          door_before=copy.deepcopy(blocks['DOOR_V2.1'])
          blocks['Network_V2.0']={
            'date':'2026-09-06',
            'state':'completed',
            'parent_block':'Network',
            'scope_kind':'frozen_deep_read_findings_subblock',
            'source_id':'VDV301-3_02-2020',
            'publication':'VDV-Schrift 301-3, Netzwerkinfrastruktur / Network infrastructure, 02/2020',
            'authority_lane':'byte-pinned official VDV 301-3 PDF; physical/network/protocol profile; no XSD lane; IEEE sources are interpretation/falsification context only',
            'pdf_sha256':'edfedf36eeb18075b45bf5224f0da6500cdd489438091f18bada42f9668c2a99',
            'pdf_size_bytes':558005,
            'pdf_page_count':37,
            'xsd_required':False,
            'latest_external_protocol_version_wins':False,
            'fresh_read_freeze_commit':'f359aa0160d2f8a0834db9274a4ecf0a18321dea',
            'prior_visual_run':'33270251357',
            'prior_visual_job':'99147343832',
            'prior_visual_artifact':'9719880284',
            'prior_visual_artifact_digest':'sha256:2cc403407a354af07c2dfc1cc78666e0f16fc753af6eebfaf090b0300214d930',
            'evidence_id':'EV-144',
            'evidence_run_id':'34025645375',
            'evidence_job_id':'101466007321',
            'artifact_id':'9986959255',
            'artifact_digest':'sha256:7d135ae12aab3a9ff8f307390545c177afea9f4dde25eafb63e44ea2310b5af4',
            'evidence_record':str(ep),
            'closure_run_id':run_id,
            'closure_run_url':run_url,
            'fresh_visual_pages':[7,8,10,17,18,19,29],
            'findings':{fid:'context_verified' for fid in scope},
            'deduplication_boundary':'historical NET-003 remains the separate page-11 IEE 802.3 item and is not merged into DRNET20-003',
            'active_disproof_result':'CAT6/55m, Figure/Table 2/3, empty version history, XSD-gap and RV-002-as-physical-conformance hypotheses rejected or held below finding threshold',
            'executable_evidence_reason_not_applicable':'All three frozen DRNET20 findings are documentation/terminology/editorial findings in a non-XSD network profile and do not define XML accept/reject behavior.',
            'terminal_state_source':str(report),
            'xsd_mutation':False,
            'frozen_inventory_mutation':False,
            'existing_DOOR_V2.1_block_mutated':False,
            'next_block':next_block,
            'next_subblock':next_subblock
          }
          assert blocks['DOOR_V2.1']==door_before

          a=s['audit']
          assert a['finding_inventory_count']==192
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(103,89)
          assert a['finding_revalidation_next_block']=='Network'
          assert a['finding_revalidation_current_block']=='DOOR_V2.1'
          assert a['finding_revalidation_latest_completed_block']=='DOOR_V2.1'
          assert 'network_v20_revalidation' not in a
          a['finding_revalidation_completed_findings']=106
          a['finding_revalidation_pending_findings']=86
          a['finding_revalidation_current_block']='Network_V2.0'
          a['finding_revalidation_latest_completed_block']='Network_V2.0'
          a['finding_revalidation_next_block']=next_block
          a['finding_revalidation_latest_terminal_state_source']=str(report)
          a['latest_revalidation_evidence_id']='EV-144'
          a['network_v20_revalidation']={
            'status':'complete',
            'completed_at_run':run_id,
            'evidence_id':'EV-144',
            'evidence_run_id':'34025645375',
            'evidence_job_id':'101466007321',
            'artifact_id':'9986959255',
            'artifact_digest':'sha256:7d135ae12aab3a9ff8f307390545c177afea9f4dde25eafb63e44ea2310b5af4',
            'terminal_states':{fid:'context_verified' for fid in scope},
            'report':str(report),
            'next_block':next_block,
            'next_subblock':next_subblock,
            'xsd_mutation':False,
            'frozen_inventory_mutation':False
          }

          rp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          report.write_text(f'''# Finding Revalidation — Network V2.0 / VDV 301-3 02/2020\n\nDate: 2026-09-06  \nScope: `DRNET20-001`, `DRNET20-002`, `DRNET20-003`  \nEvidence: `EV-144`, successful evidence run `34025645375`, job `101466007321`  \nClosure run: `{run_id}`\n\n## Authority route\n\nOfficial VDV 301-3 Network Infrastructure 02/2020 PDF, byte pin `edfedf36eeb18075b45bf5224f0da6500cdd489438091f18bada42f9668c2a99`, 558005 bytes, 37 pages. This document uses the physical/network/protocol profile lane and intentionally has no XSD lane. IEEE material is used only as terminology interpretation/falsification context; it does not replace VDV authority.\n\nThe prior all-page visual evidence is run `33270251357`, job `99147343832`, artifact `9719880284`. EV-144 freshly rendered pages 7, 8, 10, 17, 18, 19 and 29 and bound their hashes into `audit_registry/network_v20_revalidation_evidence_2026-09-06.json`.\n\n## DRNET20-001 — context_verified\n\nThe copper-cabling sections on pages 10 and 17 recommend `1000Base-X`, while their own adjacent table specifies `1 GBase-T`. The internal VDV contradiction is the primary evidence. IEEE public material confirms Clause 40 as 1000BASE-T and independently exposes distinct 1000BASE-X/1000BASE-T terminology; this is interpretation context only. No executable XML effect exists.\n\n## DRNET20-002 — context_verified\n\nPages 7 and 8 establish the functional-safety boundary as `sicherheitsrelevant` / `safety-relevant`, while the English Figure 1 caption switches to `security-relevant`. Safety and security are not treated as interchangeable here. Documentation/translation defect only.\n\n## DRNET20-003 — context_verified\n\nPages 18, 19 and 29 retain grouped non-executable editorial residue (`Connection methodes`, `Not describede`, and the `in de IEEE 802.3af/at/bt` wording). Historical `NET-003` remains separately deduplicated as the page-11 `IEE 802.3` item and is not merged into this frozen finding.\n\n## Active disproof / boundaries\n\nThe CAT6/55 m sentence is not promoted as an independent defect because its immediate 10GBASE-T context supports the scoped reading. Mixed Figure/Table 2/3 labels, the empty first-edition version history and absence of an XSD are not promoted. RV-002 remains adjacent deterministic DNS-SD classifier evidence only and is not physical/network-media conformance evidence.\n\n## Closure\n\nEV-144 PASS; closure rerun PASS; all 50 XSDs PASS; frozen 192-finding inventory unchanged; no XSD mutation. Revalidation count is now **106/192 terminal, 86 pending**. The first remaining pending frozen finding is `DRS-001`; next block is `DRS` (`DOOR_V2.1_DRS`).\n''',encoding='utf-8')
          print('NETWORK_CLOSE_WRITE_OK terminal=106 pending=86 next=DRS')
          PY

      - name: Cleanup, verify allowlist, commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/ev144-closure local_sources/vdv_pdfs/VDV301-3_02-2020.pdf tools/__pycache__
          rm .github/workflows/temp_validate_network_v20_ev144.yml
          rm .github/workflows/network-v20-registry-closure.yml
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-final.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-final.sha256
          test -z "$(git status --short | awk '{print $2}' | grep -E '\.xsd$' || true)"
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/network-v20-registry-closure.yml' '.github/workflows/temp_validate_network_v20_ev144.yml' '00_START_HERE/CURRENT_STATE.json' 'audit_registry/finding_revalidation_registry_v0.1.json' 'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_NETWORK_V20_2026-09-06.md' | sort)"
          test "$changed" = "$expected"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          s=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          by={x['finding_id']:x for x in d['inventory']['entries']}
          assert all(by[f]['revalidation_state']=='context_verified' for f in ['DRNET20-001','DRNET20-002','DRNET20-003'])
          assert d['revalidation_blocks']['Network_V2.0']['state']=='completed'
          assert d['next_revalidation_block']=='DRS'
          first=next(x['finding_id'] for x in d['inventory']['entries'] if x['revalidation_state']=='pending')
          assert first=='DRS-001'
          a=s['audit']
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(106,86)
          assert a['finding_revalidation_next_block']=='DRS'
          assert a['finding_revalidation_latest_completed_block']=='Network_V2.0'
          print('POST-CLOSURE CONSISTENCY PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: close Network V2.0 revalidation block [skip ci]'
          git push origin HEAD:dev/schema-integration
