name: temp-merge-semantic-classification-jis-v10-003-004

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_merge_semantic_classification_jis_v10_003_004.yml

permissions:
  contents: write

jobs:
  merge-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact prestate, EV-152 and JIS-003/004 boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a20e36f91200c91dab00791dab1d936aacd69e6a"
          test "$(git rev-parse HEAD^^)" = "7af72b2cd9d36fae6e077025c87fa4518d014e96"
          test "$(git hash-object audit_registry/semantic_classification_blocks/JIS_V10_003_004_v0.1.json)" = "f55dcd93f623477d0037add550b0ea35c7c0132c"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "80645bf33357b4147fb02e603dfb6583d8798f97"
          test "$(git hash-object audit_registry/jis_revalidation_evidence_2026-09-08.json)" = "d08ac5748240373fa83b6f92272a69ad8011d8fc"
          test "$(git hash-object IBIS-IP_JourneyInformationService_V1.0.xsd)" = "8c303db5a9c0548d66b90174d9c329d33092ad24"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"

          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/JIS_V10_003_004_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          evidence=json.loads(Path('audit_registry/jis_revalidation_evidence_2026-09-08.json').read_text())

          assert registry['progress']['classified_count']==135
          assert registry['progress']['remaining_count']==57
          assert registry['progress']['latest_block']=='JIS_V10_001_002'
          existing={e['finding_id']:e for e in registry['entries']}
          assert 'JIS-003' not in existing and 'JIS-004' not in existing

          assert [e['finding_id'] for e in block['entries']]==['JIS-003','JIS-004']
          j3,j4=block['entries']
          assert j3['defect_assessment']=='cross_artifact_mismatch'
          assert j3['sdk_behavior']=='error_with_advisory'
          assert j3['runtime_match']['state']=='candidate'
          assert j4['defect_assessment']=='confirmed_pdf_defect'
          assert j4['sdk_behavior']=='no_runtime_diagnostic'
          assert j4['runtime_match']['state']=='not_applicable'

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['JIS-003']['revalidation_state']=='executable_confirmed'
          assert frozen['JIS-004']['revalidation_state']=='context_verified'
          assert evidence['finding_results']['JIS-003']['positive_one_line'] is True
          assert evidence['finding_results']['JIS-003']['negative_two_lines'] is False
          assert evidence['finding_results']['JIS-004']['validation_behavior']=='documentation label only; XSD operation is unchanged'

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          doc=etree.parse('IBIS-IP_JourneyInformationService_V1.0.xsd')
          all_line=doc.xpath("//xs:complexType[@name='JourneyInformationService.AllLineInformationData']",namespaces=NS)
          assert len(all_line)==1
          line=all_line[0].xpath("./xs:sequence/xs:element[@name='LineInformation']",namespaces=NS)
          assert len(line)==1
          assert line[0].get('type')=='LineInformationStructure'
          assert line[0].get('minOccurs') is None
          assert line[0].get('maxOccurs') is None

          req=doc.xpath("/xs:schema/xs:element[@name='JourneyInformationService.RetrieveAllRoutesPerLineRequest']",namespaces=NS)
          assert len(req)==1 and req[0].get('type')=='JourneyInformationService.RetrieveAllRoutesPerLineRequestStructure'
          typ=doc.xpath("//xs:complexType[@name='JourneyInformationService.RetrieveAllRoutesPerLineRequestStructure']",namespaces=NS)
          assert len(typ)==1
          lr=typ[0].xpath("./xs:sequence/xs:element[@name='LineRef']",namespaces=NS)
          assert len(lr)==1 and lr[0].get('type')=='IBIS-IP.NMTOKEN'
          print('PASSED: exact 135/192 prestate and current JIS-003/004 XSD boundary verified')
          PY

      - name: Snapshot XSD pool before semantic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256

      - name: Merge JIS-003/004 block and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/JIS_V10_003_004_v0.1.json
          python tools/validate_finding_semantic_classification.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert registry['progress']['classified_count']==137
          assert registry['progress']['remaining_count']==55
          assert registry['progress']['latest_block']=='JIS_V10_003_004'
          by_id={e['finding_id']:e for e in registry['entries']}
          assert by_id['JIS-003']['sdk_behavior']=='error_with_advisory'
          assert by_id['JIS-003']['runtime_match']['state']=='candidate'
          assert by_id['JIS-004']['sdk_behavior']=='no_runtime_diagnostic'
          assert by_id['JIS-004']['runtime_match']['state']=='not_applicable'
          print('PASSED: merged registry is exactly 137/192 and JIS-003/004 semantics are preserved')
          PY

      - name: Validate all 50 root XSDs and prove no schema mutation
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Persist only JIS-003/004 block and master registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp_merge_semantic_classification_jis_v10_003_004.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          mapfile -t changed < <(git diff --name-only 7af72b2cd9d36fae6e077025c87fa4518d014e96 | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'audit_registry/finding_semantic_classification_v0.1.json'
          test "${changed[1]}" = 'audit_registry/semantic_classification_blocks/JIS_V10_003_004_v0.1.json'
          git commit -m 'audit: merge JIS-003 and JIS-004 semantic classification'
          git push origin HEAD:dev/schema-integration
