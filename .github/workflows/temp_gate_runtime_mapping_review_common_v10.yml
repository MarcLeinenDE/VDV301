name: temp-gate-runtime-mapping-review-common-v10-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_common_v10.yml

permissions:
  contents: read

jobs:
  gate-common-v10-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dac9d57f1212c7a1fc07bb77347c413797f6d637"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "f1e8005256c04bd358080f0ee2a5011d1ae65fd8"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "d5dedd487b37aa3cf952c49a2b9f2c1379f08521"
          test "$(git hash-object sdk_manifest/README.md)" = "0b339a56bf34bdc72f2cf91d4c384322b0de801e"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "77fb96af12bb8e267c4890e4ff45e1bdbbe66b49"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "f095e2956c9acc4bd643fcbce732e45ab0904afe"

      - name: Validate synchronized runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':32,'not_applicable':113,'not_designed':1,'reviewed':46}
          assert r['counts']=={
              'reviewed_mapping_count':46,
              'implemented_count':0,
              'semantic_candidate_count':32,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='COMMON_V10_DRCOM10_002_005'
          print('PASSED: Common V1.0 closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: Common V1.0 runtime-mapping closure gate complete"
