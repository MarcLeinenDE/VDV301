name: TEMP validate DMS EV-127 instance boundaries

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_validate_dms_boundaries.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check lxml
      - run: python tools/validate_dms_instance_boundaries_ev127.py
