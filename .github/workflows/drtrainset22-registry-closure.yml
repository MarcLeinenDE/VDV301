name: DRTRAINSET22 registry closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/drtrainset22-registry-closure.yml
      - audit_registry/drtrainset22_revalidation_evidence_2026-09-06.json

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF and XSD tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Snapshot immutable XSD pool
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/drtrainset22_revalidation_evidence_2026-09-06.json)" = "0fc04a70fdeb90a09f36124adae39d0ae4822acf"
          test "$(git rev-parse HEAD:docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.2.md)" = "61850045c26fb2a848c4670f1418fdb809ab475c"
          test "$(git rev-parse HEAD:tools/validate_drtrainset22_revalidation_ev149.py)" = "8bbc3a96b3cee03ee2f75b8424fe1ec513ea4920"

      - name: Fetch exact byte-pinned TRAINSET V2.2 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          sid='TRAINSET_V2.2'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==sid)
          pin=next(x for x in pins['sources'] if x['source_id']==sid)
          assert source['official_url']=='https://www.vdv.de/301-2-14-sdes-v2-2-trainsetservices.pdfx'
          assert source['local_filename']=='TRAINSET_V2.2.pdf'
          assert pin['expected_sha256']=='c1946694a1809933a9a4a23adff1c551effdb0a2fbc6a7f7f68faec0b0c7bd6e'
          assert int(pin['expected_size_bytes'])==1744296
          assert str(pin['evidence_run_id'])=='33239594518'
          for attempt in range(4):
              try:
                  req=urllib.request.Request(source['official_url'],headers={
                      'User-Agent':'VDV301-Audit-EV149-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                      'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(2*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert sha==pin['expected_sha256']
          assert len(data)==int(pin['expected_size_bytes'])
          target=Path('local_sources/vdv_pdfs')/source['local_filename']
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print('TRAINSET_V22_PDF_PIN_OK',sha,len(data))
          PY

      - name: Re-run EV-149 and repository XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_drtrainset22_revalidation_ev149.py --repo-root . --output-dir artifacts/ev149-closure
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Close DRTRAINSET22 block atomically
        shell: bash
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}
          CLOSURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json,os
          from pathlib import Path

          rp=Path('audit_registry/finding_revalidation_registry_v0.1.json')
          sp=Path('00_START_HERE/CURRENT_STATE.json')
          ep=Path('audit_registry/drtrainset22_revalidation_evidence_2026-09-06.json')
          report=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTRAINSET22_2026-09-06.md')
          d=json.loads(rp.read_text(encoding='utf-8'))
          s=json.loads(sp.read_text(encoding='utf-8'))
          e=json.loads(ep.read_text(encoding='utf-8'))
          run_id=os.environ['CLOSURE_RUN_ID']; run_url=os.environ['CLOSURE_RUN_URL']

          scope=['DRTRAINSET22-001','DRTRAINSET22-002']
          states={fid:'context_verified' for fid in scope}

          assert e['evidence_id']=='EV-149' and e['result']=='PASS'
          assert e['scope']==scope
          assert e['successful_run_id']=='34029942365'
          assert e['successful_job_id']=='101477508993'
          assert e['head_sha']=='1f15247b85bad29808f086b69b03ea89df30bd85'
          assert e['artifact_id']=='9988263849'
          assert e['artifact_digest']=='sha256:3bdc68e04a41da03d6d8b84bcc42cf846f58c49ef79a1266741bfa904f08e04e'
          assert e['authority']['source_id']=='TRAINSET_V2.2'
          assert e['authority']['pdf_sha256']=='c1946694a1809933a9a4a23adff1c551effdb0a2fbc6a7f7f68faec0b0c7bd6e'
          assert e['authority']['pdf_size_bytes']==1744296
          assert e['authority']['deep_read_blob']=='61850045c26fb2a848c4670f1418fdb809ab475c'
          assert e['authority']['semantic_authority_lane']=='byte-pinned official PDF/document navigation'
          assert e['authority']['xsd_semantic_authority_required'] is False
          assert e['fresh_visual_evidence']['status']=='PASS'
          assert sorted(map(int,e['fresh_visual_evidence']['physical_pages'].keys()))==[6,9,10,35,36,38,40]
          assert e['matched_physical_pages']['DRTRAINSET22-002']=={
            'UnsubscribeTripRef_stale_6_5_1':38,
            'RetrieveTripInformation_stale_6_5_1':38,
            'UnsubscribeTripInformation_stale_6_5_1':40,
            'correct_6_5_2_unsubscribe_structure':35,
            'correct_6_5_3_RetrieveTripRef':36}
          assert e['executable_context']['terminal_state_requires_xml_execution'] is False
          assert e['full_xsd_pool']=={'count':50,'result':'PASS','role':'repository-regression-only'}
          assert e['immutable_guards']['xsd_mutated'] is False
          assert e['immutable_guards']['frozen_inventory_mutated'] is False
          assert {k:v['recommended_terminal_state'] for k,v in e['finding_results'].items()}==states

          inv=d['inventory']; entries=inv['entries']
          assert inv['state']=='frozen' and inv['entry_count']==192 and len(entries)==192
          assert d['next_revalidation_block']=='DRTRAINSET22'
          pre_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          pre_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (pre_terminal,pre_pending)==(120,72),(pre_terminal,pre_pending)
          by={x['finding_id']:x for x in entries}
          for fid in scope:
              assert by[fid]['revalidation_state']=='pending'
              assert by[fid]['terminal_state_source'] is None
              by[fid]['revalidation_state']='context_verified'
              by[fid]['terminal_state_source']=str(report)

          post_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          post_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (post_terminal,post_pending)==(122,70),(post_terminal,post_pending)

          first_pending=next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')
          assert first_pending=='DRTVS21-001', first_pending
          assert all(by[f]['revalidation_state']=='pending' for f in ['DRTVS21-001','DRTVS21-002','DRTVS21-003','DRTVS21-004'])
          next_block='DRTVS21'
          next_subblock='TVS_V2.1_DRTVS21'
          d['next_revalidation_block']=next_block

          blocks=d['revalidation_blocks']
          assert 'TRAINSET_V2.2_DRTRAINSET22' not in blocks
          assert blocks['TRAINSET_V2.1_DRTRAINSET21']['state']=='completed'
          assert blocks['TIME_V1.0_DRTIME10']['state']=='completed'
          prior_v21=copy.deepcopy(blocks['TRAINSET_V2.1_DRTRAINSET21'])
          prior_time=copy.deepcopy(blocks['TIME_V1.0_DRTIME10'])
          blocks['TRAINSET_V2.2_DRTRAINSET22']={
            'date':'2026-09-06',
            'state':'completed',
            'parent_block':'DRTRAINSET22',
            'scope_kind':'frozen_deep_read_findings_subblock',
            'source_id':'TRAINSET_V2.2',
            'publication':'VDV 301-2-14 TrainSet Services V2.2, 08/2019',
            'authority_lane':'byte-pinned official TrainSet V2.2 PDF/document navigation; XSD semantic authority is not required for these two cross-reference findings',
            'pdf_sha256':'c1946694a1809933a9a4a23adff1c551effdb0a2fbc6a7f7f68faec0b0c7bd6e',
            'pdf_size_bytes':1744296,
            'original_pin_evidence_run_id':'33239594518',
            'deep_read_blob':'61850045c26fb2a848c4670f1418fdb809ab475c',
            'evidence_id':'EV-149',
            'evidence_run_id':'34029942365',
            'evidence_job_id':'101477508993',
            'evidence_head_sha':'1f15247b85bad29808f086b69b03ea89df30bd85',
            'artifact_id':'9988263849',
            'artifact_digest':'sha256:3bdc68e04a41da03d6d8b84bcc42cf846f58c49ef79a1266741bfa904f08e04e',
            'evidence_record':str(ep),
            'closure_run_id':run_id,
            'closure_run_url':run_url,
            'fresh_visual_physical_pages':[6,9,10,35,36,38,40],
            'visual_status':'closed_by_fresh_byte_pinned_render_and_manual_inspection',
            'xsd_semantic_authority_required':False,
            'xsd_pool_role':'repository-regression-only',
            'findings':states,
            'terminal_state_source':str(report),
            'xsd_mutation':False,
            'frozen_inventory_mutation':False,
            'next_block':next_block,
            'next_subblock':next_subblock
          }
          assert blocks['TRAINSET_V2.1_DRTRAINSET21']==prior_v21
          assert blocks['TIME_V1.0_DRTIME10']==prior_time

          a=s['audit']
          assert a['finding_inventory_count']==192
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(120,72)
          assert a['finding_revalidation_next_block']=='DRTRAINSET22'
          assert a['finding_revalidation_current_block']=='TRAINSET_V2.1_DRTRAINSET21'
          assert a['finding_revalidation_latest_completed_block']=='TRAINSET_V2.1_DRTRAINSET21'
          assert a['latest_revalidation_evidence_id']=='EV-148'
          assert 'drtrainset22_revalidation' not in a
          a['finding_revalidation_completed_findings']=122
          a['finding_revalidation_pending_findings']=70
          a['finding_revalidation_current_block']='TRAINSET_V2.2_DRTRAINSET22'
          a['finding_revalidation_latest_completed_block']='TRAINSET_V2.2_DRTRAINSET22'
          a['finding_revalidation_next_block']=next_block
          a['finding_revalidation_latest_terminal_state_source']=str(report)
          a['latest_revalidation_evidence_id']='EV-149'
          a['drtrainset22_revalidation']={
            'status':'complete',
            'completed_at_run':run_id,
            'evidence_id':'EV-149',
            'evidence_run_id':'34029942365',
            'evidence_job_id':'101477508993',
            'evidence_head_sha':'1f15247b85bad29808f086b69b03ea89df30bd85',
            'artifact_id':'9988263849',
            'artifact_digest':'sha256:3bdc68e04a41da03d6d8b84bcc42cf846f58c49ef79a1266741bfa904f08e04e',
            'terminal_states':states,
            'fresh_visual_physical_pages':[6,9,10,35,36,38,40],
            'visual_status':'closed',
            'xsd_semantic_authority_required':False,
            'xsd_pool_role':'repository-regression-only',
            'report':str(report),
            'next_block':next_block,
            'next_subblock':next_subblock,
            'xsd_mutation':False,
            'frozen_inventory_mutation':False
          }

          rp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          report.write_text(f'''# Finding Revalidation — DRTRAINSET22 / TrainSet Services V2.2\n\nDate: 2026-09-06  \nScope: `DRTRAINSET22-001`, `DRTRAINSET22-002`  \nEvidence: `EV-149`, successful evidence run `34029942365`, job `101477508993`  \nEvidence commit: `1f15247b85bad29808f086b69b03ea89df30bd85`  \nClosure run: `{run_id}`\n\n## Authority route\n\nOfficial byte-pinned VDV 301-2-14 TrainSet Services V2.2 PDF (`c1946694a1809933a9a4a23adff1c551effdb0a2fbc6a7f7f68faec0b0c7bd6e`, 1,744,296 bytes), original pin run `33239594518`. The Deep Read is blob `61850045c26fb2a848c4670f1418fdb809ab475c`. Both findings are same-document navigation/cross-reference findings; XSD semantics are not required for their terminal state. The complete 50-XSD pool was rerun only as a repository regression/immutability guard.\n\n## Visual evidence\n\nEV-149 rendered the exact pinned source at 180 DPI. Physical pages 6, 9, 10, 35, 36, 38 and 40 were manually inspected after the successful run and match the permanent evidence-record hashes.\n\n## DRTRAINSET22-001 — context_verified\n\nPages 9 and 10 visibly point the examples explaining interaction of the different services to section 9.1. Page 6 visibly identifies 9.1 as the driving-direction re-initialisation subsection and section 10 as `Examples`. The strongest counter-hypothesis was retained from the V2.1 review: 9.1 itself does contain an example-style re-initialisation scenario. However, overview item 4 already assigns re-initialisation to sections 7 and 9, while item 5 separately introduces service-interaction examples, and the same publication has a dedicated section 10 containing those examples. The 9.1 pointer is therefore a cross-reference error.\n\n## DRTRAINSET22-002 — context_verified\n\nPage 38 visibly says `UnsubscribeTripRef` uses `TrainSetUnsubscribeRequestStructure` described in section 6.5.1 and, in the next operation, says `RetrieveTripRef (cf. 6.5.1)`. Page 40 visibly repeats the 6.5.1 pointer for the `UnsubscribeTripInformation` request. Same-document positive controls reject a stable/historical-number interpretation: page 35 visibly defines `Specific TrainSetUnsubscribeRequestStructure` at 6.5.2 and page 36 visibly defines `Operation RetrieveTripRef` at 6.5.3. These are stale navigation references, not schema rules.\n\n## Closure\n\nEV-149 PASS; closure rerun PASS; all 50 root XSDs PASS as repository-regression evidence; frozen 192-finding inventory unchanged; no XSD mutation. Revalidation count is now **122/192 terminal, 70 pending**. The first remaining pending finding is `DRTVS21-001`; next block is `DRTVS21` (`TVS_V2.1_DRTVS21`).\n''',encoding='utf-8')
          print('DRTRAINSET22_CLOSE_WRITE_OK terminal=122 pending=70 next=DRTVS21')
          PY

      - name: Cleanup, verify allowlist, commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/ev149-closure local_sources/vdv_pdfs/TRAINSET_V2.2.pdf tools/__pycache__
          rm .github/workflows/temp_validate_drtrainset22_ev149.yml
          rm .github/workflows/drtrainset22-registry-closure.yml

          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test -z "$(git diff --name-only | grep -E '\.xsd$' || true)"

          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          s=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          by={x['finding_id']:x for x in d['inventory']['entries']}
          scope=['DRTRAINSET22-001','DRTRAINSET22-002']
          assert all(by[f]['revalidation_state']=='context_verified' for f in scope)
          assert d['revalidation_blocks']['TRAINSET_V2.2_DRTRAINSET22']['state']=='completed'
          assert d['next_revalidation_block']=='DRTVS21'
          first=next(x['finding_id'] for x in d['inventory']['entries'] if x['revalidation_state']=='pending')
          assert first=='DRTVS21-001'
          a=s['audit']
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(122,70)
          assert a['finding_revalidation_next_block']=='DRTVS21'
          assert a['finding_revalidation_latest_completed_block']=='TRAINSET_V2.2_DRTRAINSET22'
          assert a['latest_revalidation_evidence_id']=='EV-149'

          allowed={
            '.github/workflows/temp_validate_drtrainset22_ev149.yml',
            '.github/workflows/drtrainset22-registry-closure.yml',
            'audit_registry/finding_revalidation_registry_v0.1.json',
            '00_START_HERE/CURRENT_STATE.json',
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTRAINSET22_2026-09-06.md'
          }
          changed=set(subprocess.check_output(['git','status','--porcelain'],text=True).splitlines())
          paths={line[3:] for line in changed if len(line)>=4}
          assert paths==allowed,(paths,allowed)
          print('DRTRAINSET22_POST_CLOSURE_CONSISTENCY_PASS')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: close DRTRAINSET22 revalidation block [skip ci]'
          git push origin HEAD:dev/schema-integration
