name: temp-common-v24-ev122

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - '.github/workflows/temp-common-v24-ev122.yml'

permissions:
  contents: read

jobs:
  ev122:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Install lxml
        run: python -m pip install --disable-pip-version-check lxml
      - name: Run EV-122
        run: python tools/validate_common_v24_ev122.py
