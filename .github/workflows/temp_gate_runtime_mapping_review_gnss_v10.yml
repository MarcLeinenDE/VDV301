name: temp-gate-runtime-mapping-review-gnss-v10-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_gnss_v10.yml

permissions:
  contents: read

jobs:
  gate-gnss-v10-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "168f9a874c6fa83dc2b4f7cd1914cd0e1b17b90d"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "7d1dde7b6fb5d90a4fe39f32c1242b1d12195ca7"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "aa6d21d303b3fbb2f3e17119f3d194e21f2ef264"
          test "$(git hash-object sdk_manifest/README.md)" = "8a6caf6145a403efbd3aa5f2cc7ab09ad3e518f0"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "d35b663fdbb5a358c42bfa4b3de80cf3b18bde33"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "beb82867cd54f657943b27f8e5ab75a632a93e81"

      - name: Validate synchronized runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':19,'not_applicable':113,'not_designed':1,'reviewed':59}
          assert r['counts']=={
              'reviewed_mapping_count':59,
              'implemented_count':0,
              'semantic_candidate_count':19,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='LOCATION_GNSS_V10_LS_001'
          print('PASSED: GNSS V1.0 closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: GNSS V1.0 runtime-mapping closure gate complete"
