name: TEMP pin Location Services V1.0 PDFs

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_pin_location_services_v10.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF evidence tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify immutable audit and XSD authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse 7fad145f528205ef5c40e58a3a23374379b08189:docs/pdf_xsd_semantic_audit/07_location_services_historical_start.md)" = "37c6258d55c38b70f0215b0d9a853f6a83040565"
          test "$(git rev-parse 7fad145f528205ef5c40e58a3a23374379b08189:docs/pdf_xsd_semantic_audit/07a_location_services_v1_0_pdf_xsd_first_pass.md)" = "6c7219d535eaa8ea966a73ebd3b8c881835b926e"
          test "$(git rev-parse 7fad145f528205ef5c40e58a3a23374379b08189:docs/pdf_xsd_semantic_audit/07b_location_services_findings_and_closure.md)" = "b54fb0bfd061109570c7156536a2bdf301a263c9"
          test "$(git rev-parse 7fad145f528205ef5c40e58a3a23374379b08189:docs/pdf_xsd_semantic_audit/LOCATION_SERVICES_FINDINGS_REGISTER_ADDENDUM.md)" = "c1e8c7e6f6bfd8179006931b043ffffca122b475"
          test "$(git rev-parse HEAD:IBIS-IP_BeaconLocationService_V1.0.xsd)" = "791e2889f2baa4779ab66ae9e77038ff1b4be915"
          test "$(git rev-parse HEAD:IBIS-IP_DistanceLocationService_V1.0.xsd)" = "e6fdc418b6ddaba75d3fbe8f048d1c6d70e023b6"
          test "$(git rev-parse HEAD:IBIS-IP_GNSSLocationService_V1.0.xsd)" = "a74a22079af25cdd028a3e519019d9b3326d9971"
          test "$(git rev-parse HEAD:IBIS-IP_NetworkLocationService_V1.0.xsd)" = "bd1f83df2dfa83f36666a3ab3df4457242b387e9"
          test "$(git rev-parse HEAD:IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git rev-parse HEAD:IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(wc -l < /tmp/xsd-before.sha256)" -eq 50

      - name: Fetch current official Location Services V1.0 bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ls-v10-pin/pages artifacts/ls-v10-pin/text local_sources/vdv_pdfs
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          expected = {
              'BLS_V1.0': ('https://www.vdv.de/301-2-2sds-v1-0.pdfx', 'BLS_V1.0.pdf'),
              'DLS_V1.0': ('https://www.vdv.de/301-2-4sds-v1-0.pdfx', 'DLS_V1.0.pdf'),
              'GNSS_V1.0': ('https://www.vdv.de/301-2-5sds-v1-0.pdfx', 'GNSS_V1.0.pdf'),
              'NLS_V1.0': ('https://www.vdv.de/301-2-7sds-v1-0.pdfx', 'NLS_V1.0.pdf'),
          }
          registry = json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text(encoding='utf-8'))
          by_id = {x['source_id']: x for x in registry['sources']}
          results = []
          for source_id, (expected_url, expected_filename) in expected.items():
              source = by_id[source_id]
              assert source['official_url'] == expected_url
              assert source['local_filename'] == expected_filename
              data = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(
                          source['official_url'],
                          headers={
                              'User-Agent': 'VDV301-Audit-LS-Pin/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
                          },
                      )
                      with urllib.request.urlopen(req, timeout=90) as response:
                          data = response.read()
                      break
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 * (attempt + 1))
              assert data is not None and data.startswith(b'%PDF-'), f'{source_id}: downloaded content is not PDF'
              sha = hashlib.sha256(data).hexdigest()
              target = Path('local_sources/vdv_pdfs') / source['local_filename']
              target.write_bytes(data)
              result = {
                  'source_id': source_id,
                  'official_url': source['official_url'],
                  'local_filename': source['local_filename'],
                  'sha256': sha,
                  'size_bytes': len(data),
                  'retrieved_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
                  'pdf_signature_ok': True,
                  'registry_mutated': False,
              }
              results.append(result)
              print(f"LS_PIN_CANDIDATE source={source_id} sha256={sha} size={len(data)}")
          Path('artifacts/ls-v10-pin/pin-results.json').write_text(json.dumps({'sources': results}, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Extract and render finding evidence pages
        shell: bash
        run: |
          set -euo pipefail
          render_page () {
            src="$1"; label="$2"; page="$3"
            pdftoppm -f "$page" -l "$page" -singlefile -png -r 180 \
              "local_sources/vdv_pdfs/$src" "artifacts/ls-v10-pin/pages/${label}-page-${page}"
            pdftotext -f "$page" -l "$page" -layout \
              "local_sources/vdv_pdfs/$src" "artifacts/ls-v10-pin/text/${label}-page-${page}-layout.txt"
            pdftotext -f "$page" -l "$page" -raw \
              "local_sources/vdv_pdfs/$src" "artifacts/ls-v10-pin/text/${label}-page-${page}-raw.txt"
          }
          render_page BLS_V1.0.pdf BLS 7
          render_page BLS_V1.0.pdf BLS 8
          render_page DLS_V1.0.pdf DLS 7
          render_page GNSS_V1.0.pdf GNSS 7
          render_page NLS_V1.0.pdf NLS 7
          for pdf in BLS_V1.0.pdf DLS_V1.0.pdf GNSS_V1.0.pdf NLS_V1.0.pdf; do
            pdfinfo "local_sources/vdv_pdfs/$pdf" > "artifacts/ls-v10-pin/${pdf%.pdf}.pdfinfo.txt"
            sha256sum "local_sources/vdv_pdfs/$pdf" >> artifacts/ls-v10-pin/pdfs.sha256
          done
          find artifacts/ls-v10-pin -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifacts/ls-v10-pin/manifest.sha256
          cat artifacts/ls-v10-pin/pin-results.json
          cat artifacts/ls-v10-pin/pdfs.sha256

      - name: Verify repository remained immutable
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          git diff --exit-code -- '*.xsd'

      - name: Upload Location Services V1.0 pin evidence
        uses: actions/upload-artifact@v4
        with:
          name: ls-v10-pdf-pin
          path: artifacts/ls-v10-pin
          if-no-files-found: error
          retention-days: 90
