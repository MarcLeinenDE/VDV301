name: temp-gate-runtime-mapping-review-dms-block

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_dms_block.yml

permissions:
  contents: read

jobs:
  gate-dms-runtime-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact DMS runtime-review prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9217ee9cf53e0b76daf98383ce48ab3193d164b5"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "434f59c7ce9250ad6391a5dacc0745089408801d"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "f3b13129cbf181288f3c86ee2c09a46d04d11c0f"
          test "$(git hash-object sdk_manifest/runtime_mapping_review_blocks/DMS_005_007_DRDMS22_004_v0.1.json)" = "785829049852cefc7739b62b62310ca44cc2f772"
          test "$(git hash-object IBIS-IP_DeviceManagementService_V2.2.xsd)" = "c589e9f9d9b9a0f60309a275ec36b76b8c5d1f1d"
          test "$(git hash-object tools/validate_dms_instance_boundaries_ev127.py)" = "4afb5a605ef359f96eefab72f6e21a24383441c9"

      - name: Validate registries and deterministic mapping
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py

      - name: Verify DMS exact identifiers and operation family
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          semantic=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          mapping=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          block=json.loads(Path('sdk_manifest/runtime_mapping_review_blocks/DMS_005_007_DRDMS22_004_v0.1.json').read_text())
          by={e['finding_id']:e for e in semantic['entries']}
          mapped={m['finding_id']:m for m in mapping['mappings']}

          for fid in ('DMS-005','DMS-006','DMS-007','DRDMS22-004'):
              assert by[fid]['runtime_match']['state']=='reviewed'
              assert mapped[fid]['implementation_state']=='reviewed_not_implemented'
              assert mapped[fid]['authority_guard']=='selected_xsd_result_remains_normative'

          assert mapped['DMS-005']['activation_class']=='resolver_or_profile_warning'
          assert mapped['DMS-006']['activation_class']=='xsd_invalid_advisory'
          assert mapped['DMS-006']['required_precondition']=='xsd_result_invalid'
          assert mapped['DMS-007']['activation_class']=='resolver_or_profile_warning'
          assert mapped['DRDMS22-004']['activation_class']=='informational'
          assert mapping['counts']=={
              'reviewed_mapping_count':39,
              'implemented_count':0,
              'semantic_candidate_count':39,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          tree=etree.parse('IBIS-IP_DeviceManagementService_V2.2.xsd')
          etree.XMLSchema(tree)

          globals_=set(tree.xpath('/xs:schema/xs:element/@name',namespaces=NS))
          assert 'DeviceManagementService.GetDeviceStatusInformationResponseData' in globals_
          assert 'DeviceManagementService.DeviceStatusInformationResponseData' not in globals_

          group=set(tree.xpath("/xs:schema/xs:group[@name='DeviceManagementServiceGroup']//xs:element/@name",namespaces=NS))
          assert 'DeviceManagementService.GetUpdateHistoryRequest' in group
          assert not any('GetUpdateStates' in x for x in group)
          assert 'DeviceManagementService.GetDeviceErrorMessagesRequest' in group
          assert 'DeviceManagementService.GetDeviceErrorMessagesResponse' in group
          assert not any('GetDeviceErrorMessageRequest' == x or 'GetDeviceErrorMessageResponse' == x for x in group)

          status=tree.xpath("/xs:schema/xs:complexType[@name='DeviceStatusStructure']",namespaces=NS)
          assert len(status)==1
          members=status[0].xpath(".//xs:element/@name",namespaces=NS)
          assert 'DeviceStatusImpact' in members and 'DeviceStatusPriority' in members

          rb={e['finding_id']:e for e in block['entries']}
          assert any('must require XSD INVALID' in g for g in rb['DMS-006']['guards'])
          assert all(any('alias' in g.lower() for g in rb[fid]['guards']) for fid in ('DMS-005','DMS-007','DRDMS22-004'))
          print('PASSED: DMS exact identifier/cardinality review guards verified')
          PY

      - name: Rerun EV-127 DMS instance boundaries
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_dms_instance_boundaries_ev127.py

      - name: Validate SDK and XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_sdk_manifest_v0_1.py
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: DMS runtime-mapping review gate complete; repository remains unmodified"
