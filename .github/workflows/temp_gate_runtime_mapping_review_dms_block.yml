name: temp-gate-runtime-mapping-review-dms-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_dms_block.yml

permissions:
  contents: read

jobs:
  gate-dms-runtime-review-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f59742080ae23faccead6633b4ab9a49fd6d8a68"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "cc961963008070744954dd7a42889d59e0d4816d"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "9be1d592e2b08c4f978b6c76b852fc0613148cac"
          test "$(git hash-object sdk_manifest/README.md)" = "4ec6af7e07b7c60dd526035cb588bfc6ec364407"
          test "$(git hash-object tools/validate_sdk_manifest_v0_1.py)" = "4bcd7bca1f4865dc3a3cd7fd32162fa5211d2a41"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "434f59c7ce9250ad6391a5dacc0745089408801d"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "f3b13129cbf181288f3c86ee2c09a46d04d11c0f"

      - name: Validate DMS reviewed mapping and manifest consistency
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':39,'not_applicable':113,'not_designed':1,'reviewed':39}
          assert r['counts']=={
              'reviewed_mapping_count':39,
              'implemented_count':0,
              'semantic_candidate_count':39,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='DMS_005_007_DRDMS22_004'
          print('PASSED: DMS closure counters and latest block are consistent')
          PY

      - name: Rerun DMS evidence and prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_dms_instance_boundaries_ev127.py
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: DMS runtime-mapping closure gate complete"
