          # EVIDENCE policy
          p=ROOT/'docs/pdf_xsd_semantic_audit/EVIDENCE_ID_POLICY.md'; t=p.read_text(encoding='utf-8')
          marker='EV-114  TicketValidationService V2.3 official-route/candidate authority guard and inherited V2.2 executable boundary\n'
          assert marker in t
          t=t.replace(marker,marker+'EV-115  TicketValidationService V2.4 candidate/integration ShortHaul inventory + recurring type/rename behavior evidence\n',1)
          t=t.replace('Correct wording at the current state: "EV-001, EV-002 and EV-101 through EV-114".','Correct wording at the current state: "EV-001, EV-002 and EV-101 through EV-115".',1)
          anchor='Semantic equality must never promote the V2.3-named candidate file to historical official release authority.\n```'
          assert anchor in t
          ev='''Semantic equality must never promote the V2.3-named candidate file to historical official release authority.\n\nEV-115:\nNo VDV-301-2.4 release tag exists. Current upstream master contains TVS V2.4 blob 291f41518fd48cd9dcc9f285cf9b5fec7dd72159 but not its referenced Common V2.4 dependency. EV-115 therefore executes only the complete candidate/integration family:\n  TicketValidationService V2.4 34b18b8c874e325dd923b366a72bb0ebee32e59e\n  Common V2.4                  1946fd37e29ced605654f49ea3d98cd2fbbdc8e4\n  Enums V2.4                   2afed8cf23afa91db92b0f043cc5b4ad428b0f25\nIt confirms TVS-001 (ShortHaul global response exists but is omitted from TicketValidationServiceOperations), validates the ShortHaul global response, and confirms the recurring RouteDeviation/NMTOKEN/CurrentLine/CurrentTariffStop behavior.\nEV-115 PASS is candidate/integration evidence and must never be described as official-release V2.4 XSD conformance.\n```'''
          t=t.replace(anchor,ev,1); p.write_text(t,encoding='utf-8')

          # TicketValidation findings register
          p=ROOT/'docs/pdf_xsd_semantic_audit/TICKET_VALIDATION_SERVICE_FINDINGS_REGISTER_ADDENDUM.md'; t=p.read_text(encoding='utf-8')
          t=t.replace('TVS V2.1, V2.2 and V2.3 have now also been independently re-read and their in-scope findings processed under the current Evidence Gate.','TVS V2.1 through V2.4 have now been independently re-read and their in-scope findings processed under the current Evidence Gate.',1)
          old='State: open XSD internal-consistency candidate; **not revalidated by the TVS V2.1/V2.2/V2.3 Deep Reads because its scope is V2.4**.'
          assert old in t
          t=t.replace(old,'State: `upstream_master_structurally_confirmed_and_candidate_integration_executable_confirmed_EV-115` under the current Evidence Gate. No V2.4 release tag exists; executable evidence is candidate/integration authority.',1)
          t=t.replace('Next action: revalidate under the current Evidence Gate in the correct V2.4 authority/context before any SDK or official-facing decision.','Next action: no deterministic structural evidence is pending. Preserve the unresolved release-authority boundary; do not present EV-115 as official V2.4 release conformance.',1)
          t=t.replace('V2.4 historical scope remains subject to per-version revalidation.','V2.4 is candidate/integration executable-confirmed by EV-115 with upstream-master declaration correspondence; no release-tagged V2.4 family exists.',1)
          t=t.replace('Next action: no V2.1/V2.2/V2.3 deterministic evidence is pending. Revalidate V2.4 independently before freezing the multi-version historical statement as SDK knowledge.','Next action: no deterministic TVS-002 evidence is pending. Preserve per-version authority labels when freezing SDK knowledge.',1)
          t=t.replace('V2.4 historical scope remains subject to per-version revalidation.','V2.4 is candidate/integration executable-confirmed by EV-115 with official-PDF context and upstream-master declaration correspondence.',1)
          t=t.replace('Next action: no V2.2/V2.3 deterministic evidence is pending. Revalidate V2.4 independently; no XSD modification is proposed.','Next action: no deterministic TVS-003 evidence is pending; no XSD modification is proposed.',1)
          t=t.replace('version_scope: V2.1-V2.3 PDFs','version_scope: V2.1-V2.4 PDFs')
          t=t.replace('State: `context_verified` for V2.1, V2.2 and V2.3, with exact-XSD-side support from EV-112/EV-113/EV-114 as applicable.','State: `context_verified` for V2.1 through V2.4, with XSD-side support from EV-112 through EV-115 as authority permits.',1)
          t=t.replace('State: `context_verified` for V2.1, V2.2 and V2.3.','State: `context_verified` for V2.1 through V2.4.',1)
          closing='The broader historical TicketValidation inventory is not frozen by the V2.1/V2.2/V2.3 closures. V2.4 must independently apply the current Evidence Gate.'
          assert closing in t
          sec='''## V2.4 Evidence-Gate closure boundary\n\n```text\nTVS-001       upstream-master structurally confirmed + candidate/integration executable-confirmed EV-115\nTVS-002       V2.4 candidate/integration executable-confirmed EV-115; upstream master declaration corresponds\nTVS-003       V2.4 candidate/integration executable-confirmed EV-115 with official-PDF context\nDRTVS21-001  V2.4 scope executable-confirmed against candidate/integration Common/TVS by EV-115; two visible PDF occurrences\nDRTVS21-002  V2.4 scope context-verified with EV-115 XSD support\nDRTVS21-003  V2.4 scope context-verified\nDRTVS21-004  not scope-extended\nnew V2.4-only IDs: none after deduplication\n```\n\nAuthority boundary:\n\n```text\nofficial PDF: VDV-Schrift 301-2-16 V2.4, 01/2023\nrelease tag VDV-301-2.4: absent\nupstream master TVS V2.4: merged, structurally confirms TVS-001, but current dependency family is incomplete because referenced Common V2.4 is absent\ncomplete executable comparison family: candidate/integration TVS/Common/Enums V2.4 in dev/schema-integration\nEV-115: candidate/integration evidence only; not official-release conformance\n```\n\nThe TicketValidationService Deep Read sequence V2.1-V2.4 is now complete. The overall audit finding baseline is still not frozen; mandatory post-Deep-Read legacy finding revalidation remains binding.'''
          t=t.replace(closing,sec,1); p.write_text(t,encoding='utf-8')

          # validation backlog
          p=ROOT/'docs/pdf_xsd_semantic_audit/validation_backlog.md'; t=p.read_text(encoding='utf-8')
          t=t.replace('Status: deterministic repository validation includes EV-114 for TicketValidationService V2.3 authority/routing and inherited executable boundary.','Status: deterministic repository validation includes EV-115 for TicketValidationService V2.4 candidate/integration structure and behavior, with an explicit non-release authority guard.',1)
          marker='EV-114           run 33264437557  PASS  TVS V2.3 official-route/candidate authority guard + inherited V2.2 executable boundary\n'
          assert marker in t
          t=t.replace(marker,marker+'EV-115           run 33265239836  PASS  candidate/integration TVS V2.4 ShortHaul inventory + recurring type/rename behavior; NOT official-release conformance\n',1)
          t=t.replace('EV-110 through EV-114 are targeted additive tests','EV-110 through EV-115 are targeted additive tests',1)
          anchor='Official V2.3 release routing must select the V2.2-named official service XSD family.\nDo not select the branch V2.3-named candidate merely because its filename appears newer.\nCurrent semantic equality between the two service files does not collapse provenance classes.\n```'
          assert anchor in t
          guard='''Official V2.3 release routing must select the V2.2-named official service XSD family.\nDo not select the branch V2.3-named candidate merely because its filename appears newer.\nCurrent semantic equality between the two service files does not collapse provenance classes.\n\nEV-115 / TVS V2.4:\nNo V2.4 release tag exists. Upstream master TVS V2.4 is dependency-incomplete at current head; EV-115 executes the complete candidate/integration V2.4 family only.\nIt confirms TVS-001 and the recurring TVS type/name boundaries but MUST NOT be reported as official-release V2.4 XSD conformance.\n```'''
          t=t.replace(anchor,guard,1)
          before='## 9. Mandatory legacy finding revalidation before baseline freeze'
          assert before in t
          section='''## 8b. TicketValidationService V2.4 evidence status\n\nThe official V2.4 PDF was byte-pinned and independently fresh-read before reopening historical V2.4 findings.\n\n```text\nPDF sha256: e7caca3de444b3eca15d539572cd4b896e56e5bb608b4827211b51be0ad56c51\nPDF size: 864860\npin run: 33264912909\nvisual render run: 33265061000\npages visibly reviewed: 4, 10, 14-19 material subset\n```\n\nAuthority split:\n\n```text\nVDV-301-2.4 release tag: absent\nupstream master TVS V2.4 blob: 291f41518fd48cd9dcc9f285cf9b5fec7dd72159\nupstream master Common V2.4 dependency: absent at current head\ncomplete candidate/integration family:\n  TVS    34b18b8c874e325dd923b366a72bb0ebee32e59e\n  Common 1946fd37e29ced605654f49ea3d98cd2fbbdc8e4\n  Enums  2afed8cf23afa91db92b0f043cc5b4ad428b0f25\n```\n\nEV-115 run `33265239836` PASS confirms TVS-001 on the complete candidate family, validates the ShortHaul global root, and confirms RouteDeviation/NMTOKEN/CurrentLine/CurrentTariffStop behavior. Upstream master separately structurally confirms the ShortHaul global-root / operation-group omission.\n\nNo new V2.4-only finding ID was needed. TVS V2.4 remains `needs_visual_review`, not `exhaustive_read`.\n\n'''
          t=t.replace(before,section+before,1)
          t=t.replace('fresh-read TVS_V2.4\n-> continue remaining Deep Reads','fresh-read HDS_V2.1\n-> continue remaining Deep Reads',1)
          t=t.replace('TVS V2.3 official routing must use the official V2.2-named service XSD from tag VDV-301-2.3 and must not latest-wins select the branch V2.3 candidate\n','TVS V2.3 official routing must use the official V2.2-named service XSD from tag VDV-301-2.3 and must not latest-wins select the branch V2.3 candidate\nTVS V2.4 must preserve the release-authority split: no V2.4 tag; upstream master family incomplete; candidate/integration EV-115 results must stay candidate-labelled\n',1)
          p.write_text(t,encoding='utf-8')

          # Deep Read report
          report='''# Deep Read - TicketValidationService V2.4\n\nDocument ID: `TVS_V2.4`\n\nStatus: `needs_visual_review`\n\nDate: 2026-08-29\n\n## Official PDF source\n\n```text\nURL: https://www.vdv.de/301-2-16-sde-v2.4-ticketvalidationservice.pdfx\nsha256: e7caca3de444b3eca15d539572cd4b896e56e5bb608b4827211b51be0ad56c51\nsize: 864860 bytes\npin run: 33264912909\npinned_at_utc: 2026-08-29T17:10:21Z\n```\n\nThe PDF is official VDV documentation. Chapter 3 explicitly states that the XSD is master when description and XSD differ.\n\n## V2.4 authority split\n\nThere is no upstream `VDV-301-2.4` release tag. Current upstream master head `14880bb33beec5c5dffe96315b730bd6c094a585` contains TVS V2.4 blob `291f41518fd48cd9dcc9f285cf9b5fec7dd72159`, merged through PRs #23/#26. It references Common V2.4 + Enumerations V2.2, but current upstream master does not contain the referenced Common V2.4 file. Therefore the current upstream-master family is dependency-incomplete and is not treated like an exact release-tag family.\n\nFor executable Deep-Read comparison the complete candidate/integration family is:\n\n```text\nIBIS-IP_TicketValidationService_V2.4.xsd  34b18b8c874e325dd923b366a72bb0ebee32e59e\nIBIS-IP_common_V2.4.xsd                   1946fd37e29ced605654f49ea3d98cd2fbbdc8e4\nIBIS-IP_Enumerations_V2.4.xsd             2afed8cf23afa91db92b0f043cc5b4ad428b0f25\n```\n\nThis family is candidate/integration authority only. EV-115 success is not official-release V2.4 conformance.\n\n## Independent fresh-read method\n\nThe PDF was fresh-read before historical V2.4 findings were opened. Interactive screenshots returned cache miss. Exact pinned bytes were rendered with the repository fallback. The independent pre-history state was permanently frozen at commit `f50e347a0584c751e3a4f84eecea687eff051fda`.\n\n## Visual evidence\n\n```text\nrender run: 33265061000\nrender job: 99133563822\nartifact: 9718391355\nartifact digest: sha256:03a308e9ac1f792ec074020a633e83ab58973c90573e982b58e4731466f72781\nrendered pages: 4, 10-19\nvisibly reviewed material pages: 4, 10, 14, 15, 16, 17, 18, 19\ndpi: 180\n```\n\nTargeted review only; not exhaustive.\n\n## Fresh observations before historical reconciliation\n\n- The foreword explicitly says V2.4 adds the short-haul operation and “requires new XSD 2.4”.\n- German/English operation overviews still use CurrentStopPoint-era names, while adding GetCurrentShortHaulStops.\n- German/English functional-sequence prose still says SubscribeCurrentStop.\n- Chapter 3.1 is GetCurrentTariffStop but response/table labels and list of tables still say GetCurrentStopPointResponse / CurrentStopPointData.\n- CurrentTripRef is printed as IBIS-IP.NMToken in both CurrentTariffStopData and the new ShortHaul data.\n- GetCurrentLine again prints TicketValidationServiceCurrentLineData without the service-name separator dot.\n- VehicleData.RouteDeviation is printed with RouteDirectionEnumeration.\n- The new GetCurrentShortHaulStops section visibly defines the new response and CurrentShortHaulStopsData, with CurrentTariffStop 0:* and CurrentTripRef 0:1.\n- Version history introduces GetCurrentShortHaulStops and retains the earlier CurrentTariffStop rename/correction history.\n- Visible -1:1 entries are VDV choice notation, not invalid cardinality.\n\n## Historical reconciliation\n\n### TVS-001 - ShortHaul response omitted from TicketValidationServiceOperations\n\nThe official PDF provides independent context that GetCurrentShortHaulStops is a real new V2.4 operation and requires XSD 2.4.\n\nCurrent upstream master TVS V2.4 structurally declares `TicketValidationService.GetCurrentShortHaulStopsResponse` and its response/data structures, but omits that global response from `TicketValidationServiceOperations`. Its current dependency family is incomplete, so no upstream-master compile claim is made.\n\nEV-115 independently confirms on the complete candidate/integration family:\n\n```text\nShortHaul global response exists\nShortHaul response/data structures exist\nShortHaul response omitted from TicketValidationServiceOperations\nShortHaul global response error branch -> valid\nCurrentTariffStop in ShortHaul data -> 0:*\nCurrentTripRef -> IBIS-IP.NMTOKEN\n```\n\nState: `upstream_master_structurally_confirmed_and_candidate_integration_executable_confirmed_EV-115`.\n\n### TVS-002 - RouteDeviation type mismatch\n\nOfficial V2.4 PDF visibly prints `RouteDirectionEnumeration`; upstream master service and candidate/integration service declare `RouteDeviationEnumeration`. EV-115 confirms candidate V2.4 enum separation: `onroute` valid, `Forward` invalid as RouteDeviation.\n\nState: `candidate_integration_executable_confirmed_EV-115_with_upstream_master_declaration_correspondence`.\n\n### TVS-003 - stale CurrentStopPoint names\n\nOfficial V2.4 PDF visibly retains CurrentStopPoint-era overview/response/table names despite CurrentTariffStop detailed naming and version history. Upstream master service and candidate service use the CurrentTariffStop root. EV-115 validates the new root and rejects the stale root.\n\nState: `candidate_integration_executable_confirmed_EV-115_with_official_pdf_context`.\n\n### DRTVS21-001..003 scope\n\nDRTVS21-001 recurs twice in V2.4 (`IBIS-IP.NMToken`); EV-115 confirms exact candidate type `IBIS-IP.NMTOKEN` and rejects the PDF spelling as an unavailable type. DRTVS21-002 and DRTVS21-003 also recur and are context-verified with the same boundaries used in earlier versions.\n\nNo new V2.4-only finding ID is necessary after deduplication.\n\n## EV-115 provenance\n\n```text\nevidence: EV-115\nchecker: tools/validate_tvs_v24_ev115.py\nrun: 33265239836\njob: 99134041204\ntested temporary head: 3abb516526328690f2ab4d8d93d7d2efc2a61468\nresult: PASS\nauthority: candidate/integration only\n```\n\nThe checker itself prints an authority guard and the temporary workflow was removed after execution. No XSD was modified.\n\n## Completion\n\n```text\ntextual fresh read: complete\ntargeted visible review: complete for material pages\nexhaustive visual review: no\nDeep Read state: needs_visual_review\n```\n\nThe TicketValidationService V2.1-V2.4 Deep Read sequence is complete. No remediation or upstream action is authorized by this block.\n\nNext natural target: `HDS_V2.1`.\n'''
