  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate TVS V2.4 closure
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT=Path('.')
          EV_RUN='33265239836'
          EV_JOB='99134041204'

          # Finalize registry delta
          p=ROOT/'audit_registry/deep_read_registry_delta_tvs_v24_2026-08-29.json'
