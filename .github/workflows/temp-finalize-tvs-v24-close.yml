          u=d['document_updates']['TVS_V2.4']
          assert u['state']=='fresh_read_complete_pending_historical_reconciliation'
          u['state']='needs_visual_review'
          u['historical_reconciliation_complete']=True
          u['historical_reconciliation']={
            'TVS-001':'upstream_master_structurally_confirmed_and_candidate_integration_executable_confirmed_EV-115',
            'TVS-002':'candidate_integration_executable_confirmed_EV-115_with_upstream_master_declaration_correspondence',
            'TVS-003':'candidate_integration_executable_confirmed_EV-115_with_official_pdf_context',
            'DRTVS21-001':'V2.4_scope_candidate_integration_executable_confirmed_EV-115',
            'DRTVS21-002':'V2.4_scope_context_verified_with_EV-115_xsd_support',
            'DRTVS21-003':'V2.4_scope_context_verified',
            'new_unique_finding_ids':[]
          }
          u['executable_evidence']={
            'evidence_id':'EV-115',
            'checker':'tools/validate_tvs_v24_ev115.py',
            'run':EV_RUN,
            'job':EV_JOB,
            'tested_temporary_head':'3abb516526328690f2ab4d8d93d7d2efc2a61468',
            'result':'PASS',
            'authority_class':'candidate_integration',
            'authority_guard':'PASS is not official-release V2.4 XSD conformance.'
          }
          u['upstream_master_structural_crosscheck']={
            'service_blob':'291f41518fd48cd9dcc9f285cf9b5fec7dd72159',
