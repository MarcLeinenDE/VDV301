          e['latest_targeted_xsd_evidence_run']=EV_RUN
          e['latest_pdf_source_pin_run']='33264912909'
          e['latest_pdf_visual_render_run']='33265061000'
          e['tvs_v2_4_candidate_executable_evidence']='EV-115 / '+EV_RUN
          d['next_actions']=[
            'Start HDS_V2.1 with its own byte pin of the official PDF.',
