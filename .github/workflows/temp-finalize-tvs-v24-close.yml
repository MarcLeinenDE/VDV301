          a['latest_deep_read_registry_delta']='audit_registry/deep_read_registry_delta_tvs_v24_2026-08-29.json'
          a['latest_deep_read_findings_delta']='audit_registry/deep_read_findings_delta_tvs_v24_2026-08-29.json'
          a['tvs_v2_4_deep_read_report']='docs/pdf_xsd_semantic_audit/deep_read/TVS_V2.4.md'
          a['tvs_v2_4_source_pin']={'sha256':'e7caca3de444b3eca15d539572cd4b896e56e5bb608b4827211b51be0ad56c51','size_bytes':864860,'evidence_run':'33264912909','pinned_at_utc':'2026-08-29T17:10:21Z','pdf_authority':'official_public_VDV_writing','xsd_authority_status':'split_upstream_master_dependency_incomplete_plus_candidate_integration_complete_family'}
          a['tvs_v2_4_authority']={
            'release_tag_exists':False,
            'upstream_master_head':'14880bb33beec5c5dffe96315b730bd6c094a585',
            'upstream_master_service_blob':'291f41518fd48cd9dcc9f285cf9b5fec7dd72159',
            'upstream_master_common_v2_4_present':False,
            'candidate_service_blob':'34b18b8c874e325dd923b366a72bb0ebee32e59e',
            'candidate_common_blob':'1946fd37e29ced605654f49ea3d98cd2fbbdc8e4',
            'candidate_enumerations_blob':'2afed8cf23afa91db92b0f043cc5b4ad428b0f25',
            'candidate_integration_commit':'c9c086ac07f7e9bdb271c54f7a274e3cf0d03749',
            'rule':'Candidate executable evidence must not be described as official-release V2.4 conformance.'
          }
          a['tvs_v2_4_visual_evidence']={'pinned_byte_render_run':'33265061000','render_job':'99133563822','artifact_id':'9718391355','pages_reviewed':[4,10,14,15,16,17,18,19],'status':'targeted_visible_review_complete_for_recorded_findings_not_exhaustive'}
          a['tvs_v2_4_findings']={
            'TVS-001':'upstream_master_structurally_confirmed_and_candidate_integration_executable_confirmed_EV-115',
            'TVS-002':'candidate_integration_executable_confirmed_EV-115',
            'TVS-003':'candidate_integration_executable_confirmed_EV-115_with_official_pdf_context',
            'DRTVS21-001':'V2.4_scope_candidate_integration_executable_confirmed_EV-115',
            'DRTVS21-002':'V2.4_scope_context_verified_with_EV-115_xsd_support',
            'DRTVS21-003':'V2.4_scope_context_verified',
            'new_unique_finding_ids':[]
          }
