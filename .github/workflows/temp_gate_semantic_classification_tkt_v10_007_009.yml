name: temp-gate-semantic-classification-tkt-v10-007-009

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_tkt_v10_007_009.yml

permissions:
  contents: read

jobs:
  gate-tkt-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact TKT-007-009 prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b77bafe2783cbd6fa91277408e041acd8d018582"
          test "$(git hash-object audit_registry/semantic_classification_blocks/TKT_V10_007_009_v0.1.json)" = "e2b79b83bc1ac1836769369ff69ac61ee2218eb8"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "7ea9f7628cae77f05e80f38bec10861ad35352b7"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TKT_2026-09-14.md)" = "3518127a74ccafbb28d642cae876d4bbe7f68878"
          test "$(git hash-object IBIS-IP_TicketInformationService_V1.0.xsd)" = "3fda66d872ab0d1c511247f13e715cf3ad56afe7"

      - name: Verify TKT-007-009 semantic boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/TKT_V10_007_009_v0.1.json').read_text())

          assert registry['progress']['classified_count']==158
          assert registry['progress']['remaining_count']==34
          assert registry['progress']['latest_block']=='TKT_V10_004_006'
          assert [e['finding_id'] for e in block['entries']]==['TKT-007','TKT-008','TKT-009']

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['TKT-007']['revalidation_state']=='context_verified'
          assert frozen['TKT-008']['revalidation_state']=='executable_confirmed'
          assert frozen['TKT-009']['revalidation_state']=='context_verified'

          t7,t8,t9=block['entries']
          assert t7['primary_issue_kind']=='wrong_structure_reference'
          assert t7['sdk_behavior']=='no_runtime_diagnostic'
          assert t7['runtime_match']['state']=='not_applicable'
          assert t8['primary_issue_kind']=='identifier_typo'
          assert t8['sdk_behavior']=='error_with_advisory'
          assert t8['runtime_match']['state']=='candidate'
          assert t9['primary_issue_kind']=='identifier_typo'
          assert t9['sdk_behavior']=='no_runtime_diagnostic'
          assert t9['runtime_match']['state']=='not_applicable'

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          tree=etree.parse('IBIS-IP_TicketInformationService_V1.0.xsd')

          choice=tree.xpath("//xs:complexType[@name='TicketingService.GetValidationResultResponseStructure']//xs:choice/xs:element/@name",namespaces=NS)
          assert choice==['ValidationResultData','OperationErrorMessage']
          seq=tree.xpath("//xs:complexType[@name='TicketingService.ValidationResultDataStructure']/xs:sequence/xs:element/@name",namespaces=NS)
          assert seq==['TimeStamp','ValidationResult']

          group=tree.xpath("//xs:group[@name='CardApplikationValidation']/xs:sequence/xs:element/@name",namespaces=NS)
          assert group==['CardApplStatusCode','CardApplikationInformation']

          names=set(tree.xpath('//@name',namespaces=NS))
          assert not any(n.startswith('TicketingSevice') for n in names if isinstance(n,str))

          terminal=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TKT_2026-09-14.md').read_text()
          assert 'TKT-007' in terminal and 'TKT-008' in terminal and 'TKT-009' in terminal
          assert 'CardApplikationInformation' in terminal
          print('PASSED: TKT-007..009 semantic boundaries verified')
          PY

      - name: Simulate merge and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py \
            --block audit_registry/semantic_classification_blocks/TKT_V10_007_009_v0.1.json \
            --output /tmp/tkt-007-009-merged.json
          python tools/validate_finding_semantic_classification.py \
            --registry /tmp/tkt-007-009-merged.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/tkt-007-009-merged.json',encoding='utf-8'))
          assert r['progress']['classified_count']==161
          assert r['progress']['remaining_count']==31
          assert r['progress']['latest_block']=='TKT_V10_007_009'
          print('PASSED: simulated TKT-007..009 registry is exactly 161/192')
          PY

      - name: Validate all 50 root XSDs and prove read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: TKT-007..009 semantic gate complete"
