name: TEMP validate TKT EV-158

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_validate_tkt_ev158.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tkt-ev158:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical audit branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Install evidence tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Assert immutable audit authority and capture XSD hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "287e3bbcf4130567b288b1d039e8f576b668012b"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "a911f050fa5e7affc3d03ec9f2b21c68c848d364"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md)" = "969cce8b14b50ded2ca5eb745674b894428ecf1a"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/TICKETING_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "5f526763b2c68beb58b40922b52b6f0c7c9b554b"
          test "$(git hash-object tools/validate_tkt_revalidation_ev158.py)" = "3540706aa24ed3f6b8632fd0f62a8776d2e1862f"
          test "$(git hash-object IBIS-IP_TicketInformationService_V1.0.xsd)" = "3fda66d872ab0d1c511247f13e715cf3ad56afe7"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          cp /tmp/xsd-before.sha256 /tmp/xsd-before.saved

      - name: Re-acquire exact official TicketingService PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/tkt_ev158/pages
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 VDV301-audit-EV158' \
            'https://www.vdv.de/301-2-9sds-v1-0.pdfx' \
            -o evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf
          test "$(sha256sum evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf | awk '{print $1}')" = "96241226c7a25b0384527dd3de5fcd9448c8e75f38bfb4ffd7b607680bfc6b43"
          test "$(stat --printf='%s' evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf)" = "627099"
          test "$(pdfinfo evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf | awk '/^Pages:/ {print $2}')" = "16"
          pdftotext -layout evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf evidence/tkt_ev158/document.txt
          test "$(sha256sum evidence/tkt_ev158/document.txt | awk '{print $1}')" = "8f23aa2b8c7c12b601ca603a4154624c66989acf36642ae64cf119ef0b268ca8"
          pdftoppm -png -r 160 -f 7 -l 12 \
            evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf \
            evidence/tkt_ev158/pages/tkt

      - name: Materialize exact official upstream release contexts
        shell: bash
        run: |
          set -euo pipefail
          old=evidence/tkt_ev158/upstream/vdv301-1.0
          later=evidence/tkt_ev158/upstream/vdv301-2.0
          mkdir -p "$old" "$later"
          base10='https://raw.githubusercontent.com/VDVde/VDV301/f5b53785f703e898632603eec3bfa3555a79fdba'
          base20='https://raw.githubusercontent.com/VDVde/VDV301/f2569a91f0a7c737a0ca7c0280b28ad223d7ee08'
          for f in IBIS-IP_TicketInformationService_V1.0.xsd IBIS-IP_common_V1.0.xsd IBIS-IP_Enumerations_V1.0.xsd IBIS_IP_V1.0.xsd; do
            curl --fail --location --retry 3 "$base10/$f" -o "$old/$f"
          done
          for f in IBIS-IP_TicketInformationService_V1.0.xsd IBIS-IP_common_V1.0.xsd IBIS-IP_Enumerations_V1.0.xsd; do
            curl --fail --location --retry 3 "$base20/$f" -o "$later/$f"
          done
          test "$(git hash-object "$old/IBIS-IP_TicketInformationService_V1.0.xsd")" = "017ca64666e25d757fc0cde1f1be817f06a743fc"
          test "$(git hash-object "$old/IBIS-IP_common_V1.0.xsd")" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object "$old/IBIS-IP_Enumerations_V1.0.xsd")" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(git hash-object "$old/IBIS_IP_V1.0.xsd")" = "41289eaed2674a169fdf77a10a2eff293c76d5c4"
          test "$(git hash-object "$later/IBIS-IP_TicketInformationService_V1.0.xsd")" = "3fda66d872ab0d1c511247f13e715cf3ad56afe7"
          test "$(git hash-object "$later/IBIS-IP_common_V1.0.xsd")" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object "$later/IBIS-IP_Enumerations_V1.0.xsd")" = "a9bea5bc73003ed91ded8519db06c32c4067831d"

      - name: Run EV-158 validator
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/validate_tkt_revalidation_ev158.py
          python tools/validate_tkt_revalidation_ev158.py \
            --repo-root . \
            --pdf evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf \
            --upstream-v10-dir evidence/tkt_ev158/upstream/vdv301-1.0 \
            --upstream-v20-dir evidence/tkt_ev158/upstream/vdv301-2.0 \
            --output-dir evidence/tkt_ev158

      - name: Run full 50-XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests | tee evidence/tkt_ev158/full_xsd_pool.txt

      - name: Verify immutable repository state after EV-158
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "287e3bbcf4130567b288b1d039e8f576b668012b"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "a911f050fa5e7affc3d03ec9f2b21c68c848d364"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.saved /tmp/xsd-after.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/tkt_ev158/ev158_result.json')
          d=json.loads(p.read_text())
          assert d['evidence_id']=='EV-158'
          assert d['result']=='PASS'
          assert d['prestate']['terminal']==146 and d['prestate']['pending']==46
          assert d['expected_poststate']['terminal']==155 and d['expected_poststate']['pending']==37
          assert set(d['scope'])=={f'TKT-{i:03d}' for i in range(1,10)}
          print('EV-158 result envelope OK')
          PY

      - name: Upload TKT EV-158 evidence
        uses: actions/upload-artifact@v4
        with:
          name: tkt-ev158
          path: evidence/tkt_ev158
          if-no-files-found: error

      - name: Verify validation run left repository clean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence/tkt_ev158 tools/__pycache__
          test -z "$(git status --porcelain)"
