name: temp-gate-semantic-classification-sub-v10-v24-001-002

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_sub_v10_v24_001_002.yml

permissions:
  contents: read

jobs:
  gate-sub-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact SUB classification prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "186fad2fc514710605d4d8e44d80c86b8f65b3ac"
          test "$(git rev-parse HEAD^^)" = "747c7ab6bc1cc6e118c576d984b7138bdbf2b0b1"
          test "$(git rev-parse HEAD^^^)" = "85e1aa9027f4a283b61ee9580da2d275f7bd077b"
          test "$(git hash-object audit_registry/semantic_classification_blocks/SUB_V10_V24_001_002_v0.1.json)" = "f2195926fcee122c0301852aad0393ca5f61df49"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "8e6ab3600a99e0373535ccd45774d781a46b1e80"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_SUB_2026-09-10.md)" = "a359450e4d0860edd72f052e40eb755412f616e3"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/VDV301-2_BASE_V2.0.md)" = "0df1ddf7861073dc93a16fbd7d1605e7fe1bd0b6"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/VDV301-2_BASE_V2.1.md)" = "38fb34ead4ec4b316af85590b9fbfb99f14fa761"

      - name: Verify frozen states and exact XSD authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/SUB_V10_V24_001_002_v0.1.json').read_text())

          assert registry['progress']['classified_count']==150
          assert registry['progress']['remaining_count']==42
          assert registry['progress']['latest_block']=='SMS_V22_003_004'
          assert [e['finding_id'] for e in block['entries']]==['SUB-001','SUB-002']

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['SUB-001']['revalidation_state']=='context_verified'
          assert frozen['SUB-002']['revalidation_state']=='contextual_not_defect'
          for fid in ('SUB-001','SUB-002'):
              assert frozen[fid]['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_SUB_2026-09-10.md'

          s1,s2=block['entries']
          assert s1['defect_assessment']=='confirmed_pdf_defect'
          assert s1['sdk_behavior']=='no_runtime_diagnostic'
          assert s1['runtime_match']['state']=='not_applicable'
          assert s2['defect_assessment']=='non_defect'
          assert s2['sdk_behavior']=='no_runtime_diagnostic'
          assert s2['runtime_match']['state']=='not_applicable'

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          for version in ('V1.0','V2.0','V2.1'):
              tree=etree.parse(f'IBIS-IP_common_{version}.xsd')
              types=set(tree.xpath('//xs:complexType/@name',namespaces=NS))
              assert 'UnsubscribeRequestStructure' in types
              assert 'UnsubscribeResponseStructure' in types
              assert 'TerminateSubscribeRequestStructure' not in types
              assert 'TerminateSubscribeResponseStructure' not in types

          def group_names(path,name):
              tree=etree.parse(path)
              etree.XMLSchema(tree)
              return tree.xpath(f"//xs:group[@name='{name}']/xs:sequence/xs:element/@name",namespaces=NS)

          sd=group_names('IBIS-IP_SystemDocumentationService_V2.0.xsd','SystemDocumentationServiceGroup')
          sm=group_names('IBIS-IP_SystemManagementService_V1.0.xsd','SystemManagementServiceGroup')
          dms=group_names('IBIS-IP_DeviceManagementService_V2.1.xsd','DeviceManagementServiceGroup')
          assert len(sd)==5
          assert len(sm)==2
          assert 'DeviceManagementService.SubscribeDeviceInformationRequest' in dms
          assert 'DeviceManagementService.UnsubscribeDeviceInformationRequest' in dms
          assert 'DeviceManagementService.SubscribeDeviceStatusRequest' in dms
          assert 'DeviceManagementService.UnsubscribeDeviceStatusRequest' in dms

          terminal=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_SUB_2026-09-10.md').read_text()
          assert 'EV-157' in terminal
          assert '34487918692' in terminal
          assert '34488450123' in terminal
          print('PASSED: frozen SUB states and exact authority boundaries verified')
          PY

      - name: Simulate merge and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py \
            --block audit_registry/semantic_classification_blocks/SUB_V10_V24_001_002_v0.1.json \
            --output /tmp/sub-merged-registry.json
          python tools/validate_finding_semantic_classification.py \
            --registry /tmp/sub-merged-registry.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/sub-merged-registry.json',encoding='utf-8'))
          assert r['progress']['classified_count']==152
          assert r['progress']['remaining_count']==40
          assert r['progress']['latest_block']=='SUB_V10_V24_001_002'
          by={e['finding_id']:e for e in r['entries']}
          assert by['SUB-001']['primary_issue_kind']=='structure_name_mismatch'
          assert by['SUB-002']['primary_issue_kind']=='intentional_design_misread'
          print('PASSED: simulated registry is exactly 152/192')
          PY

      - name: Validate all 50 root XSDs and prove read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: SUB semantic gate complete; repository remains unmodified"
