name: temp-close-disc-revalidation
# retry after deterministic PDF text-layer hardening

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-close-disc-revalidation.yml

permissions:
  contents: write

jobs:
  close-disc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Snapshot immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum audit_registry/finding_inventory_frozen_2026-09-03.json | awk '{print $1}' > /tmp/frozen.before
          python - <<'PY' > /tmp/xsd.before
          import hashlib
          from pathlib import Path
          h = hashlib.sha256()
          for p in sorted(Path('.').rglob('*.xsd')):
              if '.git' in p.parts:
                  continue
              b = p.read_bytes()
              h.update(str(p).encode())
              h.update(b'\0')
              h.update(hashlib.sha256(b).digest())
          print(h.hexdigest())
          PY
      - name: Run EV-126
        run: python tools/validate_disc_ev126.py
      - name: Apply DISC closure
        run: python tools/temp_close_disc_revalidation.py --ev-run-id "$GITHUB_RUN_ID"
      - name: Validate closure state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          by_id = {e['finding_id']: e for e in reg['inventory']['entries']}
          for fid in ('DISC-001','DISC-002','DISC-003'):
              assert by_id[fid]['revalidation_state'] == 'context_verified', (fid, by_id[fid])
          terminal = {'context_verified','executable_confirmed','contextual_not_defect','withdrawn','unresolved','superseded'}
          completed = sum(e['revalidation_state'] in terminal for e in reg['inventory']['entries'])
          pending = len(reg['inventory']['entries']) - completed
          assert completed == 50, completed
          assert pending == 142, pending
          assert reg['next_revalidation_block'] == 'DMS'
          pins = json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          assert len(pins['sources']) == 40, len(pins['sources'])
          state = json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())['audit']
          assert state['finding_revalidation_completed_findings'] == 50
          assert state['finding_revalidation_pending_findings'] == 142
          assert state['finding_revalidation_next_block'] == 'DMS'
          assert state['pdf_sources_byte_pinned'] == 40
          print('DISC_CLOSURE_STATE_OK')
          PY
          test "$(sha256sum audit_registry/finding_inventory_frozen_2026-09-03.json | awk '{print $1}')" = "$(cat /tmp/frozen.before)"
          python - <<'PY' > /tmp/xsd.after
          import hashlib
          from pathlib import Path
          h = hashlib.sha256()
          for p in sorted(Path('.').rglob('*.xsd')):
              if '.git' in p.parts:
                  continue
              b = p.read_bytes()
              h.update(str(p).encode())
              h.update(b'\0')
              h.update(hashlib.sha256(b).digest())
          print(h.hexdigest())
          PY
          test "$(cat /tmp/xsd.before)" = "$(cat /tmp/xsd.after)"
          git diff --check
      - name: Remove temporary DISC helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-close-disc-revalidation.yml
          git rm .github/workflows/temp-disc-source-pin.yml
          git rm tools/temp_close_disc_revalidation.py
      - name: Enforce diff allowlist and no-XSD gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              '00_START_HERE/CURRENT_STATE.json',
              'audit_registry/finding_revalidation_registry_v0.1.json',
              'audit_registry/pdf_source_pins_v0.1.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DISC_2026-09-03.md',
              'docs/pdf_xsd_semantic_audit/NETWORK_DISCOVERY_FINDINGS_REGISTER_ADDENDUM.md',
              '.github/workflows/temp-close-disc-revalidation.yml',
              '.github/workflows/temp-disc-source-pin.yml',
              'tools/temp_close_disc_revalidation.py',
          }
          tracked = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          untracked = set(filter(None, subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines()))
          got = tracked | untracked
          assert got == expected, f'allowlist mismatch\nexpected={sorted(expected)}\ngot={sorted(got)}'
          assert not any(p.lower().endswith('.xsd') for p in got), got
          print('DISC_CLOSURE_DIFF_OK')
          PY
          git diff --check
      - name: Commit closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "audit: revalidate DISC finding block [skip ci]"
          git push origin HEAD:dev/schema-integration
