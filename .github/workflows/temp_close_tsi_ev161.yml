name: TEMP close TSI EV-161

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_close_tsi_ev161.yml

permissions:
  contents: write
  actions: read

jobs:
  close-tsi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical audit branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils unzip
          python -m pip install --disable-pip-version-check lxml

      - name: Assert exact pre-closure authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "a6105a349483a94998e83772b9eafe5d8aaf7089"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "7a42990e4e1d3dad9f19bcc92e77f203a25d12ac"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md)" = "969cce8b14b50ded2ca5eb745674b894428ecf1a"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/TRAIN_SET_SERVICES_FINDINGS_REGISTER_ADDENDUM.md)" = "8b1ac3db4c3603d04cca9001c82d7f4de6b5459e"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.1.md)" = "6d5680f438e7e592aaf1d056e39224e7c2a3f2d9"
          test "$(git hash-object tools/validate_tsi_revalidation_ev161.py)" = "a1c2f14af2fb73115c5c50397e6730395568bbb9"
          test "$(git hash-object tools/close_tsi_revalidation_block.py)" = "108d9c473b191b64d6a96f4dfb236a3dd4c04fac"
          test "$(git hash-object tools/validate_trainset_v21_ev109.py)" = "f88208bff7e39bb38a86a310dc121f486984f807"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object IBIS-IP_TrainSetInformationService_V2.1.xsd)" = "897f373e31b76aa23d8bc206854b042524e4c102"
          test "$(git hash-object IBIS-IP_TrainSetInformationService_V2.2.xsd)" = "7ab1f8f892bfcea2a8b8a055f07de92c143356f9"

      - name: Verify pinned EV-161 and source evidence online
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34822675019 > /tmp/ev161-run.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34822675019/jobs > /tmp/ev161-jobs.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34822675019/artifacts > /tmp/ev161-artifacts.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900 > /tmp/source-run.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900/jobs > /tmp/source-jobs.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900/artifacts > /tmp/source-artifacts.json
          python - <<'PY'
          import json
          ev=json.load(open('/tmp/ev161-run.json'))
          jobs=json.load(open('/tmp/ev161-jobs.json'))['jobs']
          arts=json.load(open('/tmp/ev161-artifacts.json'))['artifacts']
          assert ev['conclusion']=='success'
          assert ev['head_sha']=='c6ee1be2ef346ab5ea61615f6d29de0ea24b06d8'
          j=[x for x in jobs if x['id']==103907586878]
          assert len(j)==1 and j[0]['conclusion']=='success'
          a=[x for x in arts if x['id']==10339022101]
          assert len(a)==1 and a[0]['name']=='tsi-ev161-evidence'
          assert a[0]['digest']=='sha256:705aa436963a49f4478099f884b63d19d14f02f79a18c3cde89603ecb31fced8'
          assert a[0]['expired'] is False
          src=json.load(open('/tmp/source-run.json'))
          sjobs=json.load(open('/tmp/source-jobs.json'))['jobs']
          sarts=json.load(open('/tmp/source-artifacts.json'))['artifacts']
          assert src['conclusion']=='success'
          assert src['head_sha']=='20785d8ee41e812a5902d49b6d4b800ef238e311'
          sj=[x for x in sjobs if x['id']==103888867262]
          assert len(sj)==1 and sj[0]['conclusion']=='success'
          sa=[x for x in sarts if x['id']==10336466475]
          assert len(sa)==1 and sa[0]['name']=='tsd-ev160-source'
          assert sa[0]['digest']=='sha256:30089b9d4f2c86dd57f8bb184844a428ee08e91b0d327517c84f6689ea231bfb'
          assert sa[0]['expired'] is False
          print('OK pinned EV-161 and reused TrainSet source evidence')
          PY
          rm -rf /tmp/tsi-source
          mkdir -p /tmp/tsi-source
          gh run download 34816735900 --repo MarcLeinenDE/VDV301 --name tsd-ev160-source --dir /tmp/tsi-source
          test -f /tmp/tsi-source/manifest.json
          test -f /tmp/tsi-source/pdfs/TRAINSET_V2.1.pdf

      - name: Fetch exact official VDV release contexts
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'upstream-v21 585e0bea34b64887db4276f1c94d5f3e78f06c66 a8472530e840f7b365f6ba1075bfc09758ebda21' \
            'upstream-v22 f283697124750d12189b960b302b399769bad530 2dbde53864ef07319016b419ff6951f6e90e79dc'
          do
            set -- $spec
            dir="$1"; commit="$2"; tree="$3"
            git init "/tmp/$dir"
            git -C "/tmp/$dir" remote add origin https://github.com/VDVde/VDV301.git
            git -C "/tmp/$dir" fetch --depth=1 origin "$commit"
            git -C "/tmp/$dir" checkout --detach FETCH_HEAD
            test "$(git -C "/tmp/$dir" rev-parse HEAD)" = "$commit"
            test "$(git -C "/tmp/$dir" rev-parse HEAD^{tree})" = "$tree"
          done
          test "$(git -C /tmp/upstream-v21 hash-object IBIS-IP_TrainSetInformationService_V2.1.xsd)" = "897f373e31b76aa23d8bc206854b042524e4c102"
          test "$(git -C /tmp/upstream-v21 hash-object IBIS-IP_common_V2.0.xsd)" = "8608e3dcd665c197c34da7f6ec6af5a3758da164"
          test "$(git -C /tmp/upstream-v22 hash-object IBIS-IP_TrainSetInformationService_V2.2.xsd)" = "7ab1f8f892bfcea2a8b8a055f07de92c143356f9"
          test "$(git -C /tmp/upstream-v22 hash-object IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"

      - name: Re-acquire exact official TrainSet V2.1 PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tsi-closure
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 VDV301-audit-EV161-closure' \
            'https://www.vdv.de/vdv-301-2-14-v2-1-sds-trainsetservices.pdfx' \
            -o /tmp/tsi-closure/TRAINSET_V2.1.pdf
          test "$(sha256sum /tmp/tsi-closure/TRAINSET_V2.1.pdf | awk '{print $1}')" = "8eb53f2e960d125382e22d9c58dff8685c041001cf39a87ed4d12bb266bbe12e"
          test "$(stat --printf='%s' /tmp/tsi-closure/TRAINSET_V2.1.pdf)" = "1708401"
          test "$(pdfinfo /tmp/tsi-closure/TRAINSET_V2.1.pdf | awk '/^Pages:/ {print $2}')" = "51"

      - name: Snapshot complete XSD pool before closure
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > /tmp/tsi-xsd-before.sha256
          test "$(wc -l < /tmp/tsi-xsd-before.sha256)" -eq 50

      - name: Rerun EV-109, EV-161 and complete XSD pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_trainset_v21_ev109.py > /tmp/ev109.log
          grep -q 'PASSED: TSI-001 V2.1 multi-coach modelling limitation executable-confirmed' /tmp/ev109.log
          rm -rf /tmp/ev161-closure
          python tools/validate_tsi_revalidation_ev161.py \
            --repo-root . \
            --source-evidence-dir /tmp/tsi-source \
            --pdf /tmp/tsi-closure/TRAINSET_V2.1.pdf \
            --output-dir /tmp/ev161-closure > /tmp/ev161.log
          grep -q 'PASSED: EV-161 TSI-001 revalidation gate' /tmp/ev161.log
          python tools/validate_xsd_pool.py --repo-root . > /tmp/tsi-xsd-pool.log
          grep -q '^PASSED$' /tmp/tsi-xsd-pool.log

      - name: Apply TSI closure writer
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/close_tsi_revalidation_block.py

      - name: Verify poststate, immutability and strict allowlist
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > /tmp/tsi-xsd-after.sha256
          cmp /tmp/tsi-xsd-before.sha256 /tmp/tsi-xsd-after.sha256
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(git hash-object IBIS-IP_TrainSetInformationService_V2.1.xsd)" = "897f373e31b76aa23d8bc206854b042524e4c102"
          test "$(git hash-object IBIS-IP_TrainSetInformationService_V2.2.xsd)" = "7ab1f8f892bfcea2a8b8a055f07de92c143356f9"
          python - <<'PY'
          import json, subprocess
          expected={
            'audit_registry/finding_revalidation_registry_v0.1.json',
            '00_START_HERE/CURRENT_STATE.json',
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSI_2026-09-14.md',
          }
          lines=subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          changed={line[3:] for line in lines if line.strip()}
          assert changed==expected, (changed, expected)
          reg=json.load(open('audit_registry/finding_revalidation_registry_v0.1.json'))
          entries=reg['inventory']['entries']
          term={'context_verified','executable_confirmed','contextual_not_defect','withdrawn','unresolved','superseded'}
          assert sum(x['revalidation_state'] in term for x in entries)==162
          assert sum(x['revalidation_state']=='pending' for x in entries)==30
          assert next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')=='TSM-001'
          assert reg['next_revalidation_block']=='TSM'
          assert reg['revalidation_blocks']['TSI']['artifact_digest']=='sha256:705aa436963a49f4478099f884b63d19d14f02f79a18c3cde89603ecb31fced8'
          state=json.load(open('00_START_HERE/CURRENT_STATE.json'))['audit']
          assert state['finding_revalidation_completed_findings']==162
          assert state['finding_revalidation_pending_findings']==30
          assert state['finding_revalidation_next_block']=='TSM'
          assert state['finding_revalidation_latest_completed_block']=='TSI'
          print('OK exact TSI poststate and path allowlist')
          PY
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          test -z "$(find . -type d -name '__pycache__' -print -quit)"

      - name: Commit and push atomic TSI closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            audit_registry/finding_revalidation_registry_v0.1.json \
            00_START_HERE/CURRENT_STATE.json \
            docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSI_2026-09-14.md
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            00_START_HERE/CURRENT_STATE.json \
            audit_registry/finding_revalidation_registry_v0.1.json \
            docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSI_2026-09-14.md | sort)"
          test "$staged" = "$expected"
          git diff --cached --check
          git commit -m 'audit: close TSI revalidation without schema mutation'
          git push origin HEAD:dev/schema-integration
