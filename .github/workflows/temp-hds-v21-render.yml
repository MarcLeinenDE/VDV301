name: temp-hds-v21-render

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix source evidence run id
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          run='33265498869'
          p=Path('audit_registry/pdf_source_pins_v0.1.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          item=next(x for x in d['sources'] if x['source_id']=='HDS_V2.1')
          assert item['evidence_run_id']=='SELF_RUN_ID_PENDING_LOG_CAPTURE'
          item['evidence_run_id']=run
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          q=Path('audit_registry/deep_read_registry_delta_hds_v21_2026-08-29.json')
          r=json.loads(q.read_text(encoding='utf-8'))
          pin=r['document_updates']['HDS_V2.1']['source_pin']
          assert pin['evidence_run']=='SELF_RUN_ID_PENDING_LOG_CAPTURE'
          pin['evidence_run']=run
          q.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf
      - name: Render exact pinned HDS V2.1 pages
        run: python tools/render_vdv_pdf_pages.py --source-id HDS_V2.1 --pages 7-10 --out-dir rendered_hds_v21 --dpi 180
      - uses: actions/upload-artifact@v4
        with:
          name: hds-v21-rendered-pages
          path: rendered_hds_v21/
          if-no-files-found: error
      - name: Commit run-id fix and remove temporary workflow
        run: |
          set -euo pipefail
          git add audit_registry/pdf_source_pins_v0.1.json audit_registry/deep_read_registry_delta_hds_v21_2026-08-29.json
          git rm .github/workflows/temp-hds-v21-render.yml
          if git diff --cached --name-only | grep -E '\.xsd$'; then exit 1; fi
          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git commit -m 'Record HDS V2.1 pin provenance and visual render'
          git push origin HEAD:dev/schema-integration
