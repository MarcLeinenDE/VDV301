name: temp-merge-semantic-classification-drcom20

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drcom20.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drcom20:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify immutable prestate
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=233e681cfcd27ec9530317fece306543aa02ad96
          test "$(git rev-parse HEAD^)" = "$CLEAN_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drcom20.yml"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "0fb95ff2dd408e5c8b8cc56dc0f780e67a6a9ca6"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_COMMON_V20_2026-09-04.md)" = "d6ccb26406748b191cfaf62ac6198ddf1833648e"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.0.md)" = "dd436b990a4a80d7c0c2768181a1c3d27befd049"
          test ! -e audit_registry/semantic_classification_blocks/DRCOM20_v0.1.json
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PYSTATE'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count'] == 97
          assert r['progress']['remaining_count'] == 95
          assert r['progress']['reviewed_blocks'] == ['ARA','ARCH','BG','CE','CIS','DISC','DMS','DR3011','DR3012','DRARA24','DRCOM10']
          assert r['progress']['latest_block'] == 'DRCOM10'
          assert r['progress']['latest_block_file'] == 'audit_registry/semantic_classification_blocks/DRCOM10_v0.1.json'
          ids={e['finding_id'] for e in r['entries']}
          assert 'DRCOM20-001' not in ids
          print('PASSED: DRCOM20 semantic prestate is exactly 97/192')
          PYSTATE
          git diff --exit-code

      - name: Materialize exact DRCOM20 block
        shell: bash
        env:
          DRCOM20_BLOCK_ZLIB_B64: ""
        run: |
          set -euo pipefail
          mkdir -p audit_registry/semantic_classification_blocks
          python - <<'PYBLOCK'
          import base64, os, zlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode(os.environ['DRCOM20_BLOCK_ZLIB_B64'], validate=True))
          Path('audit_registry/semantic_classification_blocks/DRCOM20_v0.1.json').write_bytes(data)
          PYBLOCK
          test "$(sha256sum audit_registry/semantic_classification_blocks/DRCOM20_v0.1.json | awk '{print $1}')" = "6522269661cea2f92e06e407527dbeeda85948cde4261f9a7a2092f0e07263b1"
          python - <<'PYCHECK'
          import json
          from pathlib import Path
          b=json.loads(Path('audit_registry/semantic_classification_blocks/DRCOM20_v0.1.json').read_text(encoding='utf-8'))
          assert b['block_id'] == 'DRCOM20'
          assert [e['finding_id'] for e in b['entries']] == ['DRCOM20-001']
          e=b['entries'][0]
          assert e['normative_authority'] == 'selected_xsd'
          assert e['review_state'] == 'sdk_ready'
          assert e['primary_issue_kind'] == 'wrong_type_reference'
          print('PASSED: exact DRCOM20 executable primitive/wrapper block')
          PYCHECK

      - name: Merge and validate DRCOM20 classification
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRCOM20_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRCOM20; classified=98 remaining=94" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 98 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Verify final tree boundary and persist
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=233e681cfcd27ec9530317fece306543aa02ad96
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          python - <<'PYPOST'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count'] == 98
          assert r['progress']['remaining_count'] == 94
          assert r['progress']['reviewed_blocks'] == ['ARA','ARCH','BG','CE','CIS','DISC','DMS','DR3011','DR3012','DRARA24','DRCOM10','DRCOM20']
          assert r['progress']['latest_block'] == 'DRCOM20'
          assert r['progress']['latest_block_file'] == 'audit_registry/semantic_classification_blocks/DRCOM20_v0.1.json'
          print('PASSED: DRCOM20 semantic poststate is exactly 98/192')
          PYPOST
          git diff --check
          rm -f .github/workflows/temp_merge_semantic_classification_drcom20.yml
          git add -A
          python - <<'PYDIFF'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only','233e681cfcd27ec9530317fece306543aa02ad96'], text=True).splitlines()
          assert names == [
              'audit_registry/finding_semantic_classification_v0.1.json',
              'audit_registry/semantic_classification_blocks/DRCOM20_v0.1.json',
          ], names
          print('PASSED: final tree differs from DRCOM10 clean prestate only by DRCOM20 block and semantic registry')
          PYDIFF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRCOM20 semantic classification"
          git push origin HEAD:dev/schema-integration
