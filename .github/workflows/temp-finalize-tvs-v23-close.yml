name: temp-finalize-tvs-v23-close

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download validated closure artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/tvs-v23-close
          mkdir -p /tmp/tvs-v23-close
          gh run download 33264643505 --repo "$GITHUB_REPOSITORY" --name tvs-v23-close-files --dir /tmp/tvs-v23-close
          cp -a /tmp/tvs-v23-close/. .
      - name: Apply final editorial guards and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('docs/pdf_xsd_semantic_audit/TICKET_VALIDATION_SERVICE_FINDINGS_REGISTER_ADDENDUM.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              'not revalidated by the TVS V2.1/V2.2 Deep Reads because its scope is V2.4',
              'not revalidated by the TVS V2.1/V2.2/V2.3 Deep Reads because its scope is V2.4',
              1,
          )
          t = t.replace(
              'V2.2 contains minor prose/caption residue as well, but this generic editorial item is not automatically scope-extended',
              'V2.2 and V2.3 contain minor prose/caption residue as well, but this generic editorial item is not automatically scope-extended',
              1,
          )
          p.write_text(t, encoding='utf-8')

          json_paths = [
              '00_START_HERE/CURRENT_STATE.json',
              'audit_registry/deep_read_registry_delta_tvs_v23_2026-08-29.json',
              'audit_registry/deep_read_findings_delta_tvs_v23_2026-08-29.json',
              'audit_registry/finding_revalidation_registry_v0.1.json',
          ]
          for path in json_paths:
              json.loads(Path(path).read_text(encoding='utf-8'))
              print('JSON_OK', path)

          state = json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text(encoding='utf-8'))
          assert state['audit']['deep_read_previous_document_id'] == 'TVS_V2.3'
          assert state['audit']['next_natural_deep_read_document_id'] == 'TVS_V2.4'
          assert state['audit']['pdf_sources_byte_pinned'] == 19
          assert state['evidence']['xsd_ev_completed'][-1] == 'EV-114'
          assert state['evidence']['latest_targeted_xsd_evidence_run'] == '33264437557'
          print('STATE_GUARDS_OK')
          PY
      - name: Commit exact closure set and remove temporary workflows
        run: |
          set -euo pipefail
          allowed=(
            '00_START_HERE/CURRENT_STATE.json'
            'audit_registry/deep_read_registry_delta_tvs_v23_2026-08-29.json'
            'audit_registry/deep_read_findings_delta_tvs_v23_2026-08-29.json'
            'audit_registry/finding_revalidation_registry_v0.1.json'
            'docs/pdf_xsd_semantic_audit/EVIDENCE_ID_POLICY.md'
            'docs/pdf_xsd_semantic_audit/TICKET_VALIDATION_SERVICE_FINDINGS_REGISTER_ADDENDUM.md'
            'docs/pdf_xsd_semantic_audit/validation_backlog.md'
            'docs/pdf_xsd_semantic_audit/deep_read/TVS_V2.3.md'
            'docs/pdf_xsd_semantic_audit/24m_executable_validation_tvs_v23.md'
            'docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_TVS_V23_DEEP_READ_2026-08-29.md'
          )
          git add -- "${allowed[@]}"
          git rm .github/workflows/temp-build-tvs-v23-close.yml .github/workflows/temp-finalize-tvs-v23-close.yml

          python - <<'PY'
          import subprocess
          allowed = {
            '00_START_HERE/CURRENT_STATE.json',
            'audit_registry/deep_read_registry_delta_tvs_v23_2026-08-29.json',
            'audit_registry/deep_read_findings_delta_tvs_v23_2026-08-29.json',
            'audit_registry/finding_revalidation_registry_v0.1.json',
            'docs/pdf_xsd_semantic_audit/EVIDENCE_ID_POLICY.md',
            'docs/pdf_xsd_semantic_audit/TICKET_VALIDATION_SERVICE_FINDINGS_REGISTER_ADDENDUM.md',
            'docs/pdf_xsd_semantic_audit/validation_backlog.md',
            'docs/pdf_xsd_semantic_audit/deep_read/TVS_V2.3.md',
            'docs/pdf_xsd_semantic_audit/24m_executable_validation_tvs_v23.md',
            'docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_TVS_V23_DEEP_READ_2026-08-29.md',
          }
          deleted_workflows = {
            '.github/workflows/temp-build-tvs-v23-close.yml',
            '.github/workflows/temp-finalize-tvs-v23-close.yml',
          }
          out = subprocess.check_output(['git','diff','--cached','--name-status'], text=True)
          print(out)
          seen_allowed=set(); seen_deleted=set()
          for line in out.splitlines():
              status, path = line.split('\t',1)
              if path in allowed:
                  assert status in {'A','M'}, (status,path)
                  seen_allowed.add(path)
              elif path in deleted_workflows:
                  assert status == 'D', (status,path)
                  seen_deleted.add(path)
              else:
                  raise AssertionError(f'unexpected staged path: {status} {path}')
              assert not path.endswith('.xsd')
          assert seen_allowed == allowed, (allowed-seen_allowed)
          assert seen_deleted == deleted_workflows, (deleted_workflows-seen_deleted)
          print('STAGED_SET_OK')
          PY

          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git commit -m 'Deep-read TicketValidationService V2.3 and confirm EV-114'
          git push origin HEAD:dev/schema-integration
