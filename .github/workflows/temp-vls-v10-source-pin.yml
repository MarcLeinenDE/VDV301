name: temp-vls-v10-source-pin

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Fetch and hash official VideoLiveService V1.0 PDF
        shell: bash
        run: |
          mkdir -p audit-results
          python - <<'PY'
          import hashlib, json, urllib.request
          from datetime import datetime, timezone

          url = 'https://www.vdv.de/301-2-11-sds.pdfx'
          req = urllib.request.Request(url, headers={
              'User-Agent': 'VDV301-Audit-SourceFetcher/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
          })
          with urllib.request.urlopen(req, timeout=90) as response:
              data = response.read()
          if not data.startswith(b'%PDF-'):
              raise SystemExit('downloaded content is not PDF')
          record = {
              'source_id': 'VLS_V1.0',
              'official_url': url,
              'expected_sha256': hashlib.sha256(data).hexdigest(),
              'expected_size_bytes': len(data),
              'pinned_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'deep_read_source_ready': True,
          }
          with open('audit-results/vls-v10-source-pin.json','w',encoding='utf-8') as fh:
              json.dump(record, fh, indent=2)
              fh.write('\n')
          print(json.dumps(record, sort_keys=True))
          PY

      - name: Upload pin evidence
        uses: actions/upload-artifact@v4
        with:
          name: vls-v10-source-pin
          path: audit-results/vls-v10-source-pin.json
          if-no-files-found: error
