name: temp-trainset-ev110

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: read

jobs:
  ev110:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check lxml
      - name: Run EV-110
        run: python tools/validate_trainset_tsd002_ev110.py
