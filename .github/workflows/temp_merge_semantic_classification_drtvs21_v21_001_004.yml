name: temp-merge-semantic-classification-drtvs21-v21-001-004

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_merge_semantic_classification_drtvs21_v21_001_004.yml

permissions:
  contents: write

jobs:
  merge-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact prestate and evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ad99d975a1c1b148774d2f753d2b379a5a913283"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "87b29db6f5e6e3b0548e878d949adfd7d8d02281"
          test "$(git hash-object audit_registry/drtvs21_revalidation_evidence_2026-09-07.json)" = "79a9d5c2c2861071e942435d4fc9afaf61ef27f4"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTVS21_2026-09-07.md)" = "c67482f72ec792f30f071858cfd38268aed82e22"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TVS_V2.1.md)" = "d658d818833bfe7a436f92708ff4ec89402b51b3"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_DRTVS21_003_V21_XSD_SUPPORT_2026-09-07.md)" = "0921fc741e132ad7f0c9fcc8cebeaa8fa4eb09a4"
          test "$(git hash-object tools/validate_tvs_v21_ev112.py)" = "ac95c53ac1ca1900f51df0b06fe3f0ed623700f5"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object IBIS-IP_TicketValidationService_V2.1.xsd)" = "f6497e6469b82ee19b185c4de749d13a7ca60bed"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          registry = json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          block = json.loads(Path('audit_registry/semantic_classification_blocks/DRTVS21_V21_001_004_v0.1.json').read_text())
          baseline = json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          evidence_text = Path('audit_registry/drtvs21_revalidation_evidence_2026-09-07.json').read_text()
          correction = Path('docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_DRTVS21_003_V21_XSD_SUPPORT_2026-09-07.md').read_text()

          assert registry['progress']['classified_count'] == 128
          assert registry['progress']['remaining_count'] == 64
          assert registry['progress']['latest_block'] == 'DRTRAINSET22_V22_001_002'
          existing = {e['finding_id']: e for e in registry['entries']}
          target = ['DRTVS21-001','DRTVS21-002','DRTVS21-003','DRTVS21-004']
          assert not any(fid in existing for fid in target)
          assert 'TVS-002' in existing
          tvs002 = json.dumps(existing['TVS-002'], sort_keys=True, ensure_ascii=False).encode()
          Path('/tmp/tvs002.sha256').write_text(hashlib.sha256(tvs002).hexdigest())

          assert block['block_id'] == 'DRTVS21_V21_001_004'
          assert block['source_baseline_payload_sha256'] == 'd5bf14df302d57a0fc3d71792e1cb00583fafd3e9c7efd19721fd0de353dd576'
          assert [e['finding_id'] for e in block['entries']] == target
          assert 'TVS-002' not in [e['finding_id'] for e in block['entries']]

          frozen = {e['finding_id']: e for e in baseline['inventory']['entries']}
          assert baseline['state'] == 'frozen'
          assert baseline['baseline_payload_sha256'] == 'd5bf14df302d57a0fc3d71792e1cb00583fafd3e9c7efd19721fd0de353dd576'
          expected_states = {
              'DRTVS21-001': 'executable_confirmed',
              'DRTVS21-002': 'context_verified',
              'DRTVS21-003': 'context_verified',
              'DRTVS21-004': 'context_verified',
          }
          for fid, state in expected_states.items():
              assert frozen[fid]['revalidation_state'] == state, (fid, frozen[fid]['revalidation_state'])

          for needle in [
              'EV-150', '34087850644', '101635233786', '34088402374',
              '676c05d7615f2f2ce95ec4eb085428cb0c970a4226809566e8968200df69988d',
              'IBIS-IP_TicketValidationService_V2.1.xsd', 'IBIS-IP_common_V1.0.xsd',
              'IBIS-IP_Enumerations_V1.0.xsd', 'PASS'
          ]:
              assert needle in evidence_text, needle

          assert 'Neither `TicketValidationService.SubscribeCurrentStopPoint` nor `TicketValidationService.SubscribeCurrentStop`' in correction
          assert 'same-document PDF evidence' in correction
          print('PASSED: exact 128/192 prestate, DRTVS21 scope, EV-150 evidence and correction boundary verified')
          PY

      - name: Re-run current-safe executable TVS V2.1 boundary
        run: python tools/validate_tvs_v21_ev112.py

      - name: Snapshot XSD pool before semantic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256

      - name: Merge DRTVS21 block and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRTVS21_V21_001_004_v0.1.json
          python tools/validate_finding_semantic_classification.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          registry = json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert registry['progress']['classified_count'] == 132
          assert registry['progress']['remaining_count'] == 60
          assert registry['progress']['latest_block'] == 'DRTVS21_V21_001_004'
          assert registry['progress']['latest_block_file'] == 'audit_registry/semantic_classification_blocks/DRTVS21_V21_001_004_v0.1.json'
          by_id = {e['finding_id']: e for e in registry['entries']}
          for fid in ['DRTVS21-001','DRTVS21-002','DRTVS21-003','DRTVS21-004']:
              assert fid in by_id
          assert by_id['DRTVS21-003']['normative_authority'] == 'contextual_only'
          assert by_id['DRTVS21-003']['runtime_match']['state'] == 'not_applicable'
          assert by_id['DRTVS21-001']['sdk_behavior'] == 'no_runtime_diagnostic'
          assert by_id['DRTVS21-002']['defect_assessment'] == 'likely_pdf_defect'
          assert by_id['DRTVS21-004']['primary_issue_kind'] == 'documentation_spelling'
          tvs002 = json.dumps(by_id['TVS-002'], sort_keys=True, ensure_ascii=False).encode()
          assert hashlib.sha256(tvs002).hexdigest() == Path('/tmp/tvs002.sha256').read_text()
          print('PASSED: merged registry is exactly 132/192; TVS-002 unchanged; DRTVS21 semantics preserved')
          PY

      - name: Validate all 50 root XSDs and prove no schema mutation
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          echo 'PASSED: all 50 root XSDs compile and are byte-identical before/after semantic merge'

      - name: Persist only DRTVS21 block and master registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp_merge_semantic_classification_drtvs21_v21_001_004.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          mapfile -t changed < <(git diff --name-only 7d2cc1a98db1267ca3377a8eea5bfa1d66922ddb | sort)
          printf 'Durable cumulative diff:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'audit_registry/finding_semantic_classification_v0.1.json'
          test "${changed[1]}" = 'audit_registry/semantic_classification_blocks/DRTVS21_V21_001_004_v0.1.json'
          git status --short
          git commit -m 'audit: merge DRTVS21 semantic classification'
          git push origin HEAD:dev/schema-integration
