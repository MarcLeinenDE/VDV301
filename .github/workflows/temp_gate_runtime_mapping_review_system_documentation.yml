name: temp-gate-runtime-mapping-review-system-documentation-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_system_documentation.yml

permissions:
  contents: read

jobs:
  gate-system-documentation-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4001aaae84ee56f4bf33de8aeae667d73770b965"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "63e06d3d8220e222b99b5be5630a363acf859e01"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "4b126fe34fd32443aaf3e133cd31a6a470fa5cb8"
          test "$(git hash-object sdk_manifest/README.md)" = "d42581a248f6e1f609256533f35b62c4ebad4c1d"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "fdeacc3c79ad5527f9a6ca3124eb22753f3903a6"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "f14a61291c27069a1d3c3be0dc0ab18c20511fdb"

      - name: Validate registries and synchronized SDK manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':36,'not_applicable':113,'not_designed':1,'reviewed':42}
          assert r['counts']=={
              'reviewed_mapping_count':42,
              'implemented_count':0,
              'semantic_candidate_count':36,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='SYSTEM_DOCUMENTATION_DR3012_003_V20_003_004'
          print('PASSED: SystemDocumentation closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: SystemDocumentation runtime-mapping closure gate complete"
