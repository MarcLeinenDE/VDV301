name: temp-gate-runtime-mapping-review-system-documentation

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_system_documentation.yml

permissions:
  contents: read

jobs:
  gate-system-documentation-runtime-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact review prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "524f1ad1b9eafea5fc922907f56d1606493448a9"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "fdeacc3c79ad5527f9a6ca3124eb22753f3903a6"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "f14a61291c27069a1d3c3be0dc0ab18c20511fdb"
          test "$(git hash-object sdk_manifest/runtime_mapping_review_blocks/SYSTEM_DOCUMENTATION_DR3012_003_V20_003_004_v0.1.json)" = "dd3468048da2ad59c2029a5cc533b16ae6da6c73"
          test "$(git hash-object IBIS-IP_SystemDocumentationService_v1.0.xsd)" = "8995c4a230bf81d5e47b9313ee7725ff3cd4b7b5"
          test "$(git hash-object IBIS-IP_SystemDocumentationService_V2.0.xsd)" = "ab959dddbfa2b8ca420af1b079501f94cff38051"

      - name: Validate semantic registry and deterministic runtime mapping
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py

      - name: Verify exact V1.0 and V2.0 SystemDocumentation boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          semantic=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          mapping=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          block=json.loads(Path('sdk_manifest/runtime_mapping_review_blocks/SYSTEM_DOCUMENTATION_DR3012_003_V20_003_004_v0.1.json').read_text())
          by={e['finding_id']:e for e in semantic['entries']}
          mapped={m['finding_id']:m for m in mapping['mappings']}

          for fid in ('DR3012-003','DR3012V20-003','DR3012V20-004'):
              assert by[fid]['runtime_match']['state']=='reviewed'
              assert mapped[fid]['implementation_state']=='reviewed_not_implemented'
              assert mapped[fid]['authority_guard']=='selected_xsd_result_remains_normative'

          assert mapped['DR3012-003']['activation_class']=='xsd_invalid_advisory'
          assert mapped['DR3012-003']['required_precondition']=='xsd_result_invalid'
          assert mapped['DR3012V20-003']['activation_class']=='xsd_invalid_advisory'
          assert mapped['DR3012V20-003']['required_precondition']=='xsd_result_invalid'
          assert mapped['DR3012V20-004']['activation_class']=='resolver_or_profile_warning'
          assert mapping['counts']=={
              'reviewed_mapping_count':42,
              'implemented_count':0,
              'semantic_candidate_count':36,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}

          v10=etree.parse('IBIS-IP_SystemDocumentationService_v1.0.xsd')
          etree.XMLSchema(v10)
          r10=v10.getroot()
          syscfg10=r10.xpath("/xs:schema/xs:complexType[@name='SystemDocumentationService.SystemConfigurationData']/xs:sequence/xs:element[@name='HeartbeatIntervall']",namespaces=NS)
          store10=r10.xpath("/xs:schema/xs:complexType[@name='SystemDocumentationService.StoreSystemConfigurationRequestStructure']/xs:sequence/xs:element[@name='HeartbeatIntervall']",namespaces=NS)
          assert len(syscfg10)==1 and syscfg10[0].get('type')=='IBIS-IP.double'
          assert len(store10)==1 and store10[0].get('type')=='IBIS-IP.duration'
          assert not r10.xpath(".//xs:element[@name='HertbeatIntervall']",namespaces=NS)
          assert not r10.xpath(".//xs:element[@name='HeartbeatInterval']",namespaces=NS)

          v20=etree.parse('IBIS-IP_SystemDocumentationService_V2.0.xsd')
          etree.XMLSchema(v20)
          r20=v20.getroot()
          syscfg20=r20.xpath("/xs:schema/xs:complexType[@name='SystemDocumentationService.SystemConfigurationData']/xs:sequence/xs:element[@name='HeartbeatInterval']",namespaces=NS)
          store20=r20.xpath("/xs:schema/xs:complexType[@name='SystemDocumentationService.StoreSystemConfigurationRequestStructure']/xs:sequence/xs:element[@name='HeartbeatInterval']",namespaces=NS)
          assert len(syscfg20)==1 and syscfg20[0].get('type')=='IBIS-IP.duration'
          assert len(store20)==1 and store20[0].get('type')=='IBIS-IP.duration'
          assert not r20.xpath(".//xs:element[@name='HertbeatIntervall']",namespaces=NS)
          assert not r20.xpath(".//xs:element[@name='HeartbeatIntervall']",namespaces=NS)
          assert r20.xpath("./xs:group[@name='SystemDocumentationServiceGroup']",namespaces=NS)

          rb={e['finding_id']:e for e in block['entries']}
          assert any('must not normalize to V2.0 HeartbeatInterval' in g for g in rb['DR3012-003']['guards'])
          assert any('must not back-normalize to the V1.0 identifier' in g for g in rb['DR3012V20-003']['guards'])
          assert any('must not register SystemDocumenationService as an alias' in g for g in rb['DR3012V20-004']['guards'])
          print('PASSED: SystemDocumentation V1.0/V2.0 exact runtime boundaries verified')
          PY

      - name: Restore exact pinned PDF bytes for historical evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request

          source_registry=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pin_registry=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          sources={s['source_id']:s for s in source_registry['sources']}
          pins={s['source_id']:s for s in pin_registry['sources']}
          targets=('VDV301-2_V1.0_DE','VDV301-2_BASE_V2.0')
          cache=Path('local_sources/vdv_pdfs')
          cache.mkdir(parents=True,exist_ok=True)

          for source_id in targets:
              src=sources[source_id]
              pin=pins[source_id]
              req=urllib.request.Request(
                  src['official_url'],
                  headers={'User-Agent':'VDV301-SystemDocumentation-Runtime-Gate/0.1','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'},
              )
              with urllib.request.urlopen(req,timeout=90) as response:
                  data=response.read()
              assert data.startswith(b'%PDF-'), source_id
              assert len(data)==int(pin['expected_size_bytes']), (source_id,len(data))
              digest=hashlib.sha256(data).hexdigest()
              assert digest==pin['expected_sha256'], (source_id,digest)
              target=cache/src['local_filename']
              target.write_bytes(data)
              print(f"OK {source_id} sha256={digest}")
          PY

      - name: Rerun focused historical evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_vdv3012_v10_ev129.py
          python tools/validate_vdv3012_v20_ev130.py

      - name: Prove root XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: SystemDocumentation runtime-mapping review gate complete"
