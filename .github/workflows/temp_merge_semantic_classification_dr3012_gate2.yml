name: temp-merge-semantic-classification-dr3012-final

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_dr3012_gate2.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-dr3012:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify immutable prestate and payload chunks
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=74d69cb56176d2f4ba4ac57d569da0104e3d489d
          test "$(git rev-parse HEAD^)" = "cdfda7ecd3a3d8c9c8c8d9efa5a3a1395582bc25"
          git merge-base --is-ancestor "$CLEAN_BASE" HEAD
          python - <<'PY'
          import subprocess
          expected = sorted([
              '.github/dr3012_payload_01.b64',
              '.github/dr3012_payload_02.b64',
              '.github/dr3012_payload_03.b64',
              '.github/dr3012_payload_04.b64',
              '.github/dr3012_payload_05.b64',
              '.github/workflows/temp_merge_semantic_classification_dr3012.yml',
              '.github/workflows/temp_merge_semantic_classification_dr3012_gate2.yml',
          ])
          names = subprocess.check_output([
              'git','diff','--name-only','74d69cb56176d2f4ba4ac57d569da0104e3d489d','HEAD'
          ], text=True).splitlines()
          assert sorted(names) == expected, names
          print('PASSED: only DR3012 temporary transport/gate files differ from clean prestate')
          PY
          test "$(git hash-object .github/dr3012_payload_01.b64)" = "878ba84a5d7e4eb15b4ef0fd60373e1d8825070e"
          test "$(git hash-object .github/dr3012_payload_02.b64)" = "05573b4efdde918b2700b79526be2278860cf2f7"
          test "$(git hash-object .github/dr3012_payload_03.b64)" = "20b8e32f3e710f849acfe0002292a70799ea58db"
          test "$(git hash-object .github/dr3012_payload_04.b64)" = "ef6d36f5583705145002e08ebf626b30f0126719"
          test "$(git hash-object .github/dr3012_payload_05.b64)" = "2f23811cb84b534670ea080b91e87b29a8935310"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "c64ce2bdd699f7d060e3a52651e10f5ad83bac05"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3012_V10_2026-09-03.md)" = "b4f88a71f6eb59b6cdc40defdd0185f80b5677a6"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3012_V20_2026-09-03.md)" = "c1fdcc62da65695baf805ccdebc0833f6bcf235f"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3012_V21_2026-09-03.md)" = "4d674e2d8e9c3404001560f1d4ea4c8befc2597d"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3012_GC22_2026-09-03.md)" = "1a6d9bde9695a587d0522b9bf780d5511def3b9b"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3012_GC23_2026-09-04.md)" = "d902ecd6264fb4a26a50b7e4567fb0a82a7066ae"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3012_GC24_2026-09-04.md)" = "aa6f298997d4cb3177af1864b99572a4c2f11e1a"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_DR3012_003_V10_IDENTIFIER_TYPE_2026-09-03.md)" = "7d79087ad3d850af16a6571f2c7a82b1350a8218"
          test ! -e audit_registry/semantic_classification_blocks/DR3012_v0.1.json
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count'] == 64
          assert r['progress']['remaining_count'] == 128
          assert r['progress']['reviewed_blocks'] == ['ARA','ARCH','BG','CE','CIS','DISC','DMS','DR3011']
          assert r['progress']['latest_block'] == 'DR3011'
          assert r['progress']['latest_block_file'] == 'audit_registry/semantic_classification_blocks/DR3011_v0.1.json'
          target={
            'DR3012-001','DR3012-002','DR3012-003','DR3012-004','DR3012-005','DR3012-006','DR3012-007',
            'DR3012GC22-001','DR3012GC22-002','DR3012GC23-001',
            'DR3012GC24-001','DR3012GC24-002','DR3012GC24-003','DR3012GC24-004','DR3012GC24-005',
            'DR3012V20-001','DR3012V20-002','DR3012V20-003','DR3012V20-004','DR3012V20-005','DR3012V20-006','DR3012V20-007','DR3012V20-008','DR3012V21-001'
          }
          present={e['finding_id'] for e in r['entries']}
          assert not target.intersection(present)
          print('PASSED: DR3012 semantic prestate is exactly 64/192')
          PY
          git diff --exit-code

      - name: Reconstruct and verify exact DR3012 block
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit_registry/semantic_classification_blocks
          cat \
            .github/dr3012_payload_01.b64 \
            .github/dr3012_payload_02.b64 \
            .github/dr3012_payload_03.b64 \
            .github/dr3012_payload_04.b64 \
            .github/dr3012_payload_05.b64 > /tmp/dr3012_payload.b64
          test "$(sha256sum /tmp/dr3012_payload.b64 | awk '{print $1}')" = "b4450f6269a0ada6710d580793ac7800ce558c241f4e92204be99f563a25ca05"
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload=Path('/tmp/dr3012_payload.b64').read_bytes()
          data=zlib.decompress(base64.b64decode(payload, validate=True))
          Path('audit_registry/semantic_classification_blocks/DR3012_v0.1.json').write_bytes(data)
          PY
          test "$(sha256sum audit_registry/semantic_classification_blocks/DR3012_v0.1.json | awk '{print $1}')" = "d083b49a0956840fcb5d65969c8d0efdf2f113c00141a6205dbe8f9342b34e9c"
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('audit_registry/semantic_classification_blocks/DR3012_v0.1.json').read_text(encoding='utf-8'))
          expected={
            'DR3012-001','DR3012-002','DR3012-003','DR3012-004','DR3012-005','DR3012-006','DR3012-007',
            'DR3012GC22-001','DR3012GC22-002','DR3012GC23-001',
            'DR3012GC24-001','DR3012GC24-002','DR3012GC24-003','DR3012GC24-004','DR3012GC24-005',
            'DR3012V20-001','DR3012V20-002','DR3012V20-003','DR3012V20-004','DR3012V20-005','DR3012V20-006','DR3012V20-007','DR3012V20-008','DR3012V21-001'
          }
          assert b['block_id'] == 'DR3012'
          assert len(b['entries']) == 24
          assert {e['finding_id'] for e in b['entries']} == expected
          for e in b['entries']:
              if e['finding_id'] in {'DR3012GC24-001','DR3012GC24-004'}:
                  assert e['normative_authority'] == 'no_strict_xsd_profile'
                  assert e['sdk_behavior'] == 'unsupported_profile'
                  assert any(v['authority'] == 'candidate_integration' for v in e['version_scope'])
          print('PASSED: exact 24-entry DR3012 block reconstructed with candidate/release boundary')
          PY

      - name: Merge and validate DR3012 classification
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py \
            --block audit_registry/semantic_classification_blocks/DR3012_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DR3012; classified=88 remaining=104" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 88 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Verify final tree boundary and persist
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=74d69cb56176d2f4ba4ac57d569da0104e3d489d
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count'] == 88
          assert r['progress']['remaining_count'] == 104
          assert r['progress']['reviewed_blocks'] == ['ARA','ARCH','BG','CE','CIS','DISC','DMS','DR3011','DR3012']
          assert r['progress']['latest_block'] == 'DR3012'
          assert r['progress']['latest_block_file'] == 'audit_registry/semantic_classification_blocks/DR3012_v0.1.json'
          entries=[e for e in r['entries'] if e['finding_id'].startswith('DR3012')]
          assert len(entries) == 24
          print('PASSED: DR3012 semantic poststate is exactly 88/192')
          PY
          git diff --check
          rm -f \
            .github/dr3012_payload_01.b64 \
            .github/dr3012_payload_02.b64 \
            .github/dr3012_payload_03.b64 \
            .github/dr3012_payload_04.b64 \
            .github/dr3012_payload_05.b64 \
            .github/workflows/temp_merge_semantic_classification_dr3012.yml \
            .github/workflows/temp_merge_semantic_classification_dr3012_gate2.yml
          git add -A
          python - <<'PY'
          import subprocess
          names=subprocess.check_output([
              'git','diff','--cached','--name-only','74d69cb56176d2f4ba4ac57d569da0104e3d489d'
          ], text=True).splitlines()
          assert names == [
              'audit_registry/finding_semantic_classification_v0.1.json',
              'audit_registry/semantic_classification_blocks/DR3012_v0.1.json',
          ], names
          print('PASSED: final tree differs from clean prestate only by DR3012 block and semantic registry')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DR3012 semantic classification"
          git push origin HEAD:dev/schema-integration
