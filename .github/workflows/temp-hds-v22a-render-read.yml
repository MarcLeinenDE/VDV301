name: temp-hds-v22a-render-read
on:
  push:
    branches: [dev/schema-integration]
    paths: ['.github/workflows/temp-hds-v22a-render-read.yml']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct HDS V2.2a source pin run id
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          run='33266884196'
          pp=Path('audit_registry/pdf_source_pins_v0.1.json'); p=json.loads(pp.read_text(encoding='utf-8'))
          x=[x for x in p['sources'] if x['source_id']=='HDS_V2.2a']; assert len(x)==1; x[0]['evidence_run_id']=run
          pp.write_text(json.dumps(p,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          dp=Path('audit_registry/deep_read_registry_delta_hds_v22a_2026-08-29.json'); d=json.loads(dp.read_text(encoding='utf-8'))
          d['document_updates']['HDS_V2.2a']['source_pin']['evidence_run']=run
          dp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf
      - name: Render exact pinned HDS V2.2a pages
        run: python tools/render_vdv_pdf_pages.py --source-id HDS_V2.2a --pages 7-14 --out-dir hds_v22a_read --dpi 180
      - name: Extract full text from exact pinned HDS V2.2a source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request, pymupdf
          url='https://www.vdv.de/301-2-17-sdes-v2-2a-htmldisplayservice.pdfx'; expected='f3da1994e719572ba1689aea2448b9533faf9e8fbe42720b9e737b98edd8b0f8'
          req=urllib.request.Request(url,headers={'User-Agent':'VDV301-audit-source-pin/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r: data=r.read()
          assert hashlib.sha256(data).hexdigest()==expected
          doc=pymupdf.open(stream=data,filetype='pdf'); out=[]
          for i,p in enumerate(doc,1): out += [f'===== PDF PAGE {i} =====\n',p.get_text('text'),'\n']
          fp=Path('hds_v22a_read/HDS_V2.2a_fulltext.txt'); fp.write_text(''.join(out),encoding='utf-8')
          print('HDS_V22A_PAGE_COUNT',len(doc)); print('HDS_V22A_FULLTEXT_SHA256',hashlib.sha256(fp.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hds-v22a-pinned-read
          path: hds_v22a_read/
          if-no-files-found: error
      - name: Commit pin provenance correction and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git add audit_registry/pdf_source_pins_v0.1.json audit_registry/deep_read_registry_delta_hds_v22a_2026-08-29.json
          git rm .github/workflows/temp-hds-v22a-render-read.yml
          if git diff --cached --name-only | grep -E '\.xsd$'; then exit 1; fi
          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git commit -m 'Record HDS V2.2a pin provenance and visual render'
          git push origin HEAD:dev/schema-integration
