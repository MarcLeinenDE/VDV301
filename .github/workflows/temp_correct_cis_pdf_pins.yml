name: temp-correct-cis-pdf-pins

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_correct_cis_pdf_pins.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  correct-cis-pins:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/cis-pin-xsd-before.sha256
          git diff --exit-code

      - name: Verify and download original CIS pin evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/33736316368 --jq .conclusion)" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9885887536 --jq .digest)" = "sha256:8a514d33d5c9f23408a14dd1302366845b319027e280773407a2188c27b23cfe"
          rm -rf /tmp/cis-pinned-read
          mkdir -p /tmp/cis-pinned-read
          gh run download 33736316368 -n cis-pinned-read -D /tmp/cis-pinned-read
          test -f /tmp/cis-pinned-read/CIS_V1.1/CIS_V1.1.pdf
          test -f /tmp/cis-pinned-read/CIS_V2.0/CIS_V2.0.pdf
          test -f /tmp/cis-pinned-read/CIS_V2.2/CIS_V2.2.pdf
          test -f /tmp/cis-pinned-read/CIS_V2.3/CIS_V2.3.pdf

      - name: Correct CIS pin entries from exact evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/cis-pinned-read')
          registry_path = Path('audit_registry/pdf_source_pins_v0.1.json')
          report_path = Path('docs/pdf_xsd_semantic_audit/PDF_SOURCE_PIN_CORRECTION_CIS_2026-09-14.md')

          expected = {
              'CIS_V1.1': ('f9d63dd1f2e417691913e57a9c7121c90b4e781cbcd1328be681695975f59739', 809729, 'cb6d9c80f9869eb6a6ee76a357997dfdb2ea18379b99122f000a0d1916b79f50', 25),
              'CIS_V2.0': ('d4a4a0ab89b1dfbf47a2d69e5bd73ec511bb515fff0c147794087ed0ebbecf3d', 810529, 'e1266d67e4948ec30d53cdd6c00dabed24b7bed3819a68a18c956c51c429078c', 25),
              'CIS_V2.2': ('789abcd3ea9b42ef7393b09484bfd5257e20a069dbd7d1ca99409fc80a5e76f0', 951233, 'c0bc1c8be902a9c60e7b51a96a9cc6e9dcd387906035f30bb2c2e5b424245c31', 26),
              'CIS_V2.3': ('b9e057a96dfbd824e18b4ace0958a6f80f62cd853ad6360bc2c76ea5db837f87', 480140, 'b8179881d2121cacfdd6ac173712e5f433aefd43eeca0afb6a0ae3c1969cedf4', 27),
          }

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          by_id = {entry['source_id']: entry for entry in registry['sources']}
          rows = []
          for source_id, (want_pdf_sha, want_size, want_text_sha, want_pages) in expected.items():
              folder = root / source_id
              pdf = folder / f'{source_id}.pdf'
              fulltext = folder / 'fulltext.txt'
              pdfinfo = (folder / 'pdfinfo.txt').read_text(encoding='utf-8', errors='replace')
              got_pages = int(next(line.split(':', 1)[1].strip() for line in pdfinfo.splitlines() if line.startswith('Pages:')))
              got = (sha256(pdf), pdf.stat().st_size, sha256(fulltext), got_pages)
              want = (want_pdf_sha, want_size, want_text_sha, want_pages)
              if got != want:
                  raise SystemExit(f'{source_id}: evidence artifact mismatch: got={got} want={want}')

              entry = by_id[source_id]
              if str(entry.get('evidence_run_id')) != '33736316368':
                  raise SystemExit(f'{source_id}: unexpected evidence run {entry.get("evidence_run_id")}')
              old = (
                  entry.get('expected_sha256'),
                  entry.get('expected_size_bytes'),
                  entry.get('fulltext_sha256'),
                  entry.get('rendered_pages'),
              )
              entry['expected_sha256'] = want_pdf_sha
              entry['expected_size_bytes'] = want_size
              entry['fulltext_sha256'] = want_text_sha
              entry['rendered_pages'] = want_pages
              entry['pin_note'] = 'Corrected 2026-09-14 from exact original CIS pin evidence artifact; prior registry values were inconsistent with run 33736316368 artifact 9885887536.'
              entry['correction_evidence_run_id'] = '33736316368'
              entry['correction_evidence_job_id'] = '100587592810'
              entry['correction_artifact_id'] = '9885887536'
              entry['correction_artifact_digest'] = 'sha256:8a514d33d5c9f23408a14dd1302366845b319027e280773407a2188c27b23cfe'
              rows.append((source_id, old, want))

          registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          lines = [
              '# CIS PDF source-pin correction — 2026-09-14',
              '',
              'Status: **evidence-backed registry correction**. This is not a new source pin and does not replace the original official-source evidence.',
              '',
              'The original successful CIS pin run `33736316368`, job `100587592810`, artifact `9885887536` (digest `sha256:8a514d33d5c9f23408a14dd1302366845b319027e280773407a2188c27b23cfe`) contains PDF bytes, extracted full text, page renders and hash manifests. The values previously stored in `pdf_source_pins_v0.1.json` for the four CIS sources did not match that artifact. The artifact and the original run log agree with each other.',
              '',
              '| Source | Prior registry PDF SHA / bytes | Correct evidence PDF SHA / bytes | Fulltext SHA / pages |',
              '|---|---|---|---|',
          ]
          for source_id, old, want in rows:
              lines.append(f'| `{source_id}` | `{old[0]}` / `{old[1]}` | `{want[0]}` / `{want[1]}` | `{want[2]}` / `{want[3]}` |')
          lines += [
              '',
              'Correction rule: existing source evidence is preserved; only the machine-readable registry values are reconciled to the exact immutable evidence artifact. No XSD, frozen finding inventory, finding terminal state or source PDF is modified.',
              '',
          ]
          report_path.write_text('\n'.join(lines), encoding='utf-8')
          PY

      - name: Enforce exact correction scope
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort -k2 > /tmp/cis-pin-xsd-after.sha256
          cmp /tmp/cis-pin-xsd-before.sha256 /tmp/cis-pin-xsd-after.sha256
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            'audit_registry/pdf_source_pins_v0.1.json'
            'docs/pdf_xsd_semantic_audit/PDF_SOURCE_PIN_CORRECTION_CIS_2026-09-14.md'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          git diff --check
          git diff --exit-code -- '*.xsd' audit_registry/finding_inventory_frozen_2026-09-03.json audit_registry/finding_revalidation_registry_v0.1.json 00_START_HERE/CURRENT_STATE.json

      - name: Commit and push CIS pin correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit_registry/pdf_source_pins_v0.1.json docs/pdf_xsd_semantic_audit/PDF_SOURCE_PIN_CORRECTION_CIS_2026-09-14.md
          git diff --cached --check
          git commit -m 'audit: correct CIS PDF pins from original evidence'
          git push origin HEAD:dev/schema-integration
