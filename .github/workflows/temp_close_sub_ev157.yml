name: TEMP close SUB EV-157

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_close_sub_ev157.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  close-sub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install closure evidence tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check lxml
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify immutable SUB closure prestate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/finding_revalidation_registry_v0.1.json)" = "650dc6a45f47e01cef2e5e05f48614e0c5afe819"
          test "$(git rev-parse HEAD:00_START_HERE/CURRENT_STATE.json)" = "612b9217244e7bbb49a09c8f4d94b9036e388dc4"
          test "$(git rev-parse HEAD:audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git rev-parse HEAD:audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(git rev-parse HEAD:audit_registry/deep_read_findings_v0.1.json)" = "f016defa3148400834378ac99ca33b30937f2571"
          test "$(git rev-parse HEAD:audit_registry/deep_read_findings_delta_gc_v24_2026-08-28.json)" = "2fd4eb48195c27312c73f665d4365bb28ca3a791"
          test "$(git rev-parse HEAD:tools/validate_sub_revalidation_ev157.py)" = "b68091fdc2713c56718d9313187f56d9eef3c9cd"
          test "$(git rev-parse HEAD:tools/close_sub_revalidation_block.py)" = "292410f4f25d89b230842e4cb1d757a526888c33"
          test "$(git rev-parse HEAD:tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"

      - name: Verify pinned source-acquisition and EV-157 runs online
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo='MarcLeinenDE/VDV301'
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'VDV301-SUB-Closure/0.1'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.load(r)
          checks=[
              ('source',34486504933,'1fdb64f7333fa229db17aeae8b722b2e43c83a3f',10155848626,'sub-ev157-source-pin','sha256:8318472f56fe7c33d85bc5cda3bc02df5cfed7f987dacb832eaa4798a1ff2d4a'),
              ('ev157',34487918692,'2f58012b2d6c8b7165d6c283821407fa534d193b',10156457016,'sub-ev157-evidence','sha256:25bf3344ba21c7a98eea97e48d5f637191a91a96bd9132993808691089eabe12'),
          ]
          for label,run_id,head,artifact_id,name,digest in checks:
              run=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
              assert run['status']=='completed' and run['conclusion']=='success', (label,run['status'],run['conclusion'])
              assert run['head_sha']==head, (label,run['head_sha'])
              arts=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts')['artifacts']
              art=next((a for a in arts if a['id']==artifact_id and a['name']==name),None)
              assert art is not None, (label,'artifact missing')
              assert not art['expired'], (label,'artifact expired')
              assert art.get('digest')==digest, (label,art.get('digest'),digest)
              print('PINNED_RUN_OK',label,run_id,artifact_id,digest)
          PY

      - name: Re-pin official Base Services PDF bytes
        run: |
          set -euo pipefail
          rm -rf /tmp/sub-closure
          mkdir -p /tmp/sub-closure/pdfs /tmp/sub-closure/result
          python - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          sources={
            'VDV301-2_BASE_V2.0':('https://www.vdv.de/301-2-sds-v-2-0.pdfx','fc67ed1c028cfc3815fbd03dd10e7027f0babbc21145da930289b93527e77f37',2374295),
            'VDV301-2_BASE_V2.1':('https://www.vdv.de/301-2-sds-v2-1-basicservices.pdfx','685fdca55dbb4f525390bad6bdbb00700be78a408dc4c2fa770b094edf4afe0a',2671005),
          }
          for sid,(url,sha,size) in sources.items():
              data=None
              for attempt in range(5):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'VDV301-SUB-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                      with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                      break
                  except Exception:
                      if attempt == 4: raise
                      time.sleep(2*(attempt+1))
              assert data is not None and data.startswith(b'%PDF-'), sid
              actual=hashlib.sha256(data).hexdigest()
              assert actual==sha and len(data)==size, (sid,actual,len(data))
              Path('/tmp/sub-closure/pdfs',sid+'.pdf').write_bytes(data)
              print('PDF_REPIN_OK',sid,actual,len(data))
          PY

      - name: Re-run EV-157 and complete root XSD pool
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/sub-closure/xsd-before.txt
          python tools/validate_sub_revalidation_ev157.py \
            --repo-root . \
            --base-v20 /tmp/sub-closure/pdfs/VDV301-2_BASE_V2.0.pdf \
            --base-v21 /tmp/sub-closure/pdfs/VDV301-2_BASE_V2.1.pdf \
            --output-dir /tmp/sub-closure/result
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/sub-closure/xsd-after.txt
          cmp /tmp/sub-closure/xsd-before.txt /tmp/sub-closure/xsd-after.txt

      - name: Apply fail-closed SUB registry closure
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/MarcLeinenDE/VDV301/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_sub_revalidation_block.py

      - name: Verify atomic closure diff and immutable XSD/frozen inputs
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          cmp /tmp/sub-closure/xsd-before.txt /tmp/sub-closure/xsd-after.txt
          actual=$(git status --porcelain | cut -c4- | sort)
          expected=$(printf '%s\n' \
            '00_START_HERE/CURRENT_STATE.json' \
            'audit_registry/finding_revalidation_registry_v0.1.json' \
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_SUB_2026-09-10.md' | sort)
          test "$actual" = "$expected" || { echo 'Unexpected closure diff:'; printf '%s\n' "$actual"; exit 1; }
          python - <<'PY'
          import json
          reg=json.load(open('audit_registry/finding_revalidation_registry_v0.1.json',encoding='utf-8'))
          entries=reg['inventory']['entries']
          terminal={'context_verified','field_validated','executable_confirmed','contextual_not_defect','withdrawn','unresolved','superseded'}
          assert sum(e['revalidation_state'] in terminal for e in entries)==146
          assert sum(e['revalidation_state']=='pending' for e in entries)==46
          assert next(e['finding_id'] for e in entries if e['revalidation_state']=='pending')=='TKT-001'
          assert reg['next_revalidation_block']=='TKT'
          state=json.load(open('00_START_HERE/CURRENT_STATE.json',encoding='utf-8'))['audit']
          assert state['finding_revalidation_completed_findings']==146
          assert state['finding_revalidation_pending_findings']==46
          assert state['finding_revalidation_next_block']=='TKT'
          assert state['finding_revalidation_latest_completed_block']=='SUB'
          print('POSTSTATE_OK 146/192 terminal 46 pending next=TKT first=TKT-001')
          PY

      - name: Commit atomic SUB closure
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_START_HERE/CURRENT_STATE.json \
                  audit_registry/finding_revalidation_registry_v0.1.json \
                  docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_SUB_2026-09-10.md
          git diff --cached --name-only
          git commit -m 'audit: close SUB revalidation without schema mutation'
          git push origin HEAD:dev/schema-integration
          echo "CLOSURE_COMMIT=$(git rev-parse HEAD)"
