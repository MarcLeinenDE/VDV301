name: temp-gate-runtime-mapping-review-doorstate-v21-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_doorstate_v21.yml

permissions:
  contents: read

jobs:
  gate-doorstate-v21-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ffed1dbdf3712fe9da2f8d594e09a11389fdb6d3"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "514e6dfcc96781ec0fd51a4d7b30438b9b1aa184"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "f8cd37240d1bfe3420b1699c5fecf4c76420226c"
          test "$(git hash-object sdk_manifest/README.md)" = "96a55dd103aa4d82fca020e92160f545a6651cf5"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "1ab898ed4fcecb4526873faf873829bde3f5dd23"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "9e83fb2d3f4c952a4d5cbcfc4b072bbee819cc69"

      - name: Validate synchronized runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':22,'not_applicable':113,'not_designed':1,'reviewed':56}
          assert r['counts']=={
              'reviewed_mapping_count':56,
              'implemented_count':0,
              'semantic_candidate_count':22,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='DOORSTATE_V21_RUNTIME_REVIEW'
          print('PASSED: DoorStateService closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: DoorStateService runtime-mapping closure gate complete"
