name: temp-close-common-v22

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - tools/temp_close_common_v22.py
      - .github/workflows/temp-close-common-v22.yml
      - .github/tmp/common_v22_closure_*.b64

permissions:
  contents: write

jobs:
  close-common-v22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Apply closure
        run: |
          set -euo pipefail
          python tools/temp_close_common_v22.py
          rm -f .github/tmp/common_v22_closure_*.b64

      - name: Validate closure diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '\.xsd$'; then
            echo "XSD change detected"
            exit 1
          fi
          python - <<'PY'
          import subprocess
          got=set(subprocess.check_output(["git","diff","--name-only"], text=True).splitlines())
          expected={
            ".github/workflows/temp-common-v22-ev120.yml",
            ".github/workflows/temp-close-common-v22.yml",
            "tools/temp_close_common_v22.py",
            ".github/tmp/common_v22_closure_00.b64",
            ".github/tmp/common_v22_closure_01.b64",
            ".github/tmp/common_v22_closure_02.b64",
            ".github/tmp/common_v22_closure_03.b64",
            ".github/tmp/common_v22_closure_04.b64",
            ".github/tmp/common_v22_closure_05.b64",
            ".github/tmp/common_v22_closure_06.b64",
            "00_START_HERE/CURRENT_STATE.json",
            "audit_registry/deep_read_registry_delta_common_v22_2026-09-02.json",
            "audit_registry/deep_read_findings_delta_common_v22_2026-09-02.json",
            "docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.2.md",
            "docs/pdf_xsd_semantic_audit/COMMON_FINDINGS_REGISTER_ADDENDUM.md",
            "docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_COMMON_V22_DEEP_READ_2026-09-02.md",
          }
          assert got == expected, (sorted(got), sorted(expected))
          print("COMMON_V22_CLOSURE_DIFF_OK")
          PY

      - name: Commit closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/temp-common-v22-ev120.yml \
            .github/workflows/temp-close-common-v22.yml \
            tools/temp_close_common_v22.py \
            .github/tmp/common_v22_closure_00.b64 \
            .github/tmp/common_v22_closure_01.b64 \
            .github/tmp/common_v22_closure_02.b64 \
            .github/tmp/common_v22_closure_03.b64 \
            .github/tmp/common_v22_closure_04.b64 \
            .github/tmp/common_v22_closure_05.b64 \
            .github/tmp/common_v22_closure_06.b64 \
            00_START_HERE/CURRENT_STATE.json \
            audit_registry/deep_read_registry_delta_common_v22_2026-09-02.json \
            audit_registry/deep_read_findings_delta_common_v22_2026-09-02.json \
            docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.2.md \
            docs/pdf_xsd_semantic_audit/COMMON_FINDINGS_REGISTER_ADDENDUM.md \
            docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_COMMON_V22_DEEP_READ_2026-09-02.md
          git diff --cached --check
          git commit -m "audit: close COMMON V2.2 deep read"
          git push origin HEAD:dev/schema-integration
