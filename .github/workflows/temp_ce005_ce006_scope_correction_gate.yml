name: TEMP CE005 CE006 scope correction gate

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_ce005_ce006_scope_correction_gate.yml
      - audit_registry/finding_semantic_classification_v0.1.json
      - sdk_manifest/known_issues_runtime_mapping_v0.1.json
      - sdk_manifest/manifest_v0.1.json
      - 00_START_HERE/CURRENT_STATE.json
      - docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_CE005_CE006_VERSION_SCOPE_2026-09-25.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check lxml jsonschema

      - name: Verify corrected CE-005 CE-006 scopes and invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"
          test "$(git hash-object IBIS-IP_common_V2.4.xsd)" = "1946fd37e29ced605654f49ea3d98cd2fbbdc8e4"
          test "$(git hash-object IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"
          test "$(git hash-object IBIS-IP_Enumerations_V2.4.xsd)" = "2afed8cf23afa91db92b0f043cc5b4ad428b0f25"

          python - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path
          from lxml import etree

          def blob_sha(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()

          sem_path=Path("audit_registry/finding_semantic_classification_v0.1.json")
          map_path=Path("sdk_manifest/known_issues_runtime_mapping_v0.1.json")
          sem=json.loads(sem_path.read_text())
          mapping=json.loads(map_path.read_text())
          by={e["finding_id"]:e for e in sem["entries"]}
          maps={m["finding_id"]:m for m in mapping["mappings"]}

          assert len(sem["entries"])==192
          counts=Counter(e["runtime_match"]["state"] for e in sem["entries"])
          assert counts==Counter({"not_applicable":115,"reviewed":77}),counts
          assert len(mapping["mappings"])==77
          assert mapping["counts"]=={
              "reviewed_mapping_count":77,
              "implemented_count":0,
              "semantic_candidate_count":0,
              "semantic_not_designed_count":0,
              "semantic_not_applicable_count":115,
          }

          ce5=by["CE-005"]
          ce6=by["CE-006"]
          assert ce5["runtime_match"]["state"]=="reviewed"
          assert ce6["runtime_match"]["state"]=="reviewed"
          assert ce5["defect_assessment"]=="cross_artifact_mismatch"
          assert ce5["primary_issue_kind"]=="cardinality_mismatch"
          assert ce5["sdk_behavior"]=="error_with_advisory"
          assert ce6["defect_assessment"]=="cross_artifact_mismatch"
          assert ce6["primary_issue_kind"]=="semantic_contradiction"
          assert ce6["sdk_behavior"]=="valid_with_advisory"

          assert ce5["version_scope"]==[
              {
                  "version":"Common V2.0-V2.3",
                  "authority":"official_release",
                  "xsd_profile":"exact selected Common XSD per version",
                  "note":"Post-closure scope correction 2026-09-25: historical closure supports CE-005 from V2.0 through V2.3. The ambiguous V1.x publication is not used to extend this finding."
              },
              {
                  "version":"Common V2.4",
                  "authority":"candidate_integration",
                  "xsd_profile":"IBIS-IP_common_V2.4.xsd",
                  "note":"Selected candidate/integration V2.4 lane retains the same bounded named-field modelling; it is not promoted to official-release authority."
              }
          ]
          assert ce6["version_scope"]==[
              {
                  "version":"Enumerations V2.2-V2.3",
                  "authority":"official_release",
                  "xsd_profile":"IBIS-IP_Enumerations_V2.2.xsd",
                  "note":"V2.2 introduces DeviceStateEnumeration.warning while the V2.2 PDF table omits it; Common V2.3 reuses the exact Enumerations V2.2 dependency pool and its PDF table also omits warning."
              },
              {
                  "version":"Enumerations V2.4",
                  "authority":"candidate_integration",
                  "xsd_profile":"IBIS-IP_Enumerations_V2.4.xsd",
                  "note":"Selected candidate/integration V2.4 enumeration still contains warning while the official V2.4 PDF table omits it."
              }
          ]

          # Diagnostic must no longer falsely describe CE-006 as V2.4-only.
          assert "V2.2" in ce6["diagnostic"]["de"]["long"]
          assert "V2.3" in ce6["diagnostic"]["de"]["long"]
          assert "V2.4" in ce6["diagnostic"]["de"]["long"]
          assert "V2.2" in ce6["diagnostic"]["en"]["long"]
          assert "V2.3" in ce6["diagnostic"]["en"]["long"]
          assert "V2.4" in ce6["diagnostic"]["en"]["long"]

          # Mapping provenance must remain an exact projection of semantic scope.
          assert set(maps)=={e["finding_id"] for e in sem["entries"] if e["runtime_match"]["state"]=="reviewed"}
          for fid,m in maps.items():
              assert m["profile_scope"]==by[fid]["version_scope"],fid
              assert m["authority_guard"]=="selected_xsd_result_remains_normative"
              assert m["implementation_state"]=="reviewed_not_implemented"

          assert mapping["source_semantic_registry"]["git_blob"]==blob_sha(sem_path)

          XS="http://www.w3.org/2001/XMLSchema"
          NS={"xs":XS}
          for filename in ["IBIS-IP_Enumerations_V2.2.xsd","IBIS-IP_Enumerations_V2.4.xsd"]:
              t=etree.parse(filename)
              vals=t.xpath("/xs:schema/xs:simpleType[@name='DeviceStateEnumeration']/xs:restriction/xs:enumeration/@value",namespaces=NS)
              assert "warning" in vals,(filename,vals)

          for filename in ["IBIS-IP_common_V2.2.xsd","IBIS-IP_common_V2.4.xsd"]:
              t=etree.parse(filename)
              elems=t.xpath("/xs:schema/xs:complexType[@name='TripInformationStructure']/xs:sequence/xs:element[starts-with(@name,'AdditionalTextMessage')]",namespaces=NS)
              assert elems,(filename,"no AdditionalTextMessage elements")
              for el in elems:
                  assert el.get("maxOccurs") is None,(filename,el.get("name"),el.get("maxOccurs"))

          print("CE005_CE006_SCOPE_CORRECTION_OK",dict(counts),blob_sha(sem_path))
          PY

      - name: Re-run Common V2.0 evidence
        run: python tools/validate_common_v20_ev118.py
      - name: Re-run Common V2.1 evidence
        run: python tools/validate_common_v21_ev119.py
      - name: Re-run Common V2.2 evidence
        run: python tools/validate_common_v22_ev120.py
      - name: Re-run Common V2.3 evidence
        run: python tools/validate_common_v23_ev121.py
      - name: Re-run Common V2.4 candidate evidence
        run: python tools/validate_common_v24_ev122.py

      - name: Validate semantic classification
        run: python tools/validate_finding_semantic_classification.py
      - name: Validate deterministic Known-Issues mapping
        run: python tools/validate_known_issues_runtime_mapping_v0_1.py
      - name: Validate SDK manifest consistency
        run: python tools/validate_sdk_manifest_v0_1.py
      - name: Root XSD regression gate
        run: python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
      - name: Verify XSD working tree remains clean
        run: git diff --exit-code -- '*.xsd'
