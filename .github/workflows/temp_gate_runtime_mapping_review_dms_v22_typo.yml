name: temp-gate-runtime-mapping-review-dms-v22-typo

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_dms_v22_typo.yml

permissions:
  contents: read

jobs:
  gate-dms-v22-typo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact review prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9a4585d2b882f80d816bdb4738035be8b76a6a96"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "dca923c3ba4954e78eea219229f0a2a0c2e08520"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "e8f864f51c20c90c0bd175bfdea3580004eb052a"
          test "$(git hash-object sdk_manifest/runtime_mapping_review_blocks/DMS_V22_DRDMS22_003_v0.1.json)" = "08730ef5f70009c68714ed0e5cd2185b7bb2181a"
          test "$(git hash-object IBIS-IP_DeviceManagementService_V2.2.xsd)" = "c589e9f9d9b9a0f60309a275ec36b76b8c5d1f1d"

      - name: Validate semantic registry and deterministic runtime mapping
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py

      - name: Rerun preserved EV-107
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_dms_v22_deep_read_ev107.py

      - name: Verify focused update-status enum boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from lxml import etree

          sem=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          mapping=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          block=json.loads(Path('sdk_manifest/runtime_mapping_review_blocks/DMS_V22_DRDMS22_003_v0.1.json').read_text())
          by={e['finding_id']:e for e in sem['entries']}
          m={x['finding_id']:x for x in mapping['mappings']}['DRDMS22-003']

          assert by['DRDMS22-003']['runtime_match']['state']=='reviewed'
          assert m['activation_class']=='xsd_invalid_advisory'
          assert m['required_precondition']=='xsd_result_invalid'
          assert m['result_effect']=='decorate_existing_invalid'
          assert m['implementation_state']=='reviewed_not_implemented'
          assert m['authority_guard']=='selected_xsd_result_remains_normative'
          assert mapping['counts']=={
              'reviewed_mapping_count':53,
              'implemented_count':0,
              'semantic_candidate_count':25,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          root=etree.parse('IBIS-IP_DeviceManagementService_V2.2.xsd').getroot()
          enum=root.find("xs:simpleType[@name='UpdateStatusEnumeration']",NS)
          assert enum is not None
          values={e.get('value') for e in enum.findall('.//xs:enumeration',NS)}
          assert 'InstallationSuccessful' in values
          assert 'InstallationSuccessfull' not in values

          XS='http://www.w3.org/2001/XMLSchema'
          harness=f'''<xs:schema xmlns:xs="{XS}" elementFormDefault="qualified">
            <xs:include schemaLocation="IBIS-IP_DeviceManagementService_V2.2.xsd"/>
            <xs:element name="ProbeUpdateStatus" type="UpdateStatusEnumeration"/>
          </xs:schema>'''
          with tempfile.NamedTemporaryFile('w',suffix='.xsd',dir='.',encoding='utf-8',delete=False) as fh:
              fh.write(harness); hp=Path(fh.name)
          try:
              schema=etree.XMLSchema(etree.parse(str(hp)))
          finally:
              hp.unlink(missing_ok=True)

          assert schema.validate(etree.fromstring(b'<ProbeUpdateStatus>InstallationSuccessful</ProbeUpdateStatus>'))
          assert not schema.validate(etree.fromstring(b'<ProbeUpdateStatus>InstallationSuccessfull</ProbeUpdateStatus>'))

          rb=block['entries'][0]
          assert any('must not accept, normalize, or register InstallationSuccessfull as an enum alias' in g for g in rb['guards'])
          assert any('must not generalize spelling correction to other enum tokens' in g for g in rb['guards'])
          print('PASSED: DMS V2.2 update-status typo runtime boundary verified')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: DMS V2.2 update-status typo runtime-mapping gate complete"
