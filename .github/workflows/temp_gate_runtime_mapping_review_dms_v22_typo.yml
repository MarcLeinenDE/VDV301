name: temp-gate-runtime-mapping-review-dms-v22-typo-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_dms_v22_typo.yml

permissions:
  contents: read

jobs:
  gate-dms-v22-typo-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "aa6dce8076a3e17b59860b3c8a665c3b8a2d8678"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6dcd8bedded63bc1b6483fac6e16cf4dc493abe4"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "1601d564e46f9bb8c3542d3378a4c9647e5d6168"
          test "$(git hash-object sdk_manifest/README.md)" = "bf761d190f11146703214148464c6c70f0ac39fc"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "dca923c3ba4954e78eea219229f0a2a0c2e08520"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "e8f864f51c20c90c0bd175bfdea3580004eb052a"

      - name: Validate synchronized runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':25,'not_applicable':113,'not_designed':1,'reviewed':53}
          assert r['counts']=={
              'reviewed_mapping_count':53,
              'implemented_count':0,
              'semantic_candidate_count':25,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='DMS_V22_DRDMS22_003'
          print('PASSED: DMS V2.2 typo closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: DMS V2.2 typo runtime-mapping closure gate complete"
