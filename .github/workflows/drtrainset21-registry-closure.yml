name: DRTRAINSET21 registry closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/drtrainset21-registry-closure.yml
      - audit_registry/drtrainset21_revalidation_evidence_2026-09-06.json

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF and XSD tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Snapshot immutable XSD pool
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/drtrainset21_revalidation_evidence_2026-09-06.json)" = "5378874f7948527a76d18a313b1c8879dd2ec981"
          test "$(git rev-parse HEAD:docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.1.md)" = "6d5680f438e7e592aaf1d056e39224e7c2a3f2d9"
          test "$(git rev-parse HEAD:tools/validate_trainset_v21_ev109.py)" = "f88208bff7e39bb38a86a310dc121f486984f807"
          test "$(git rev-parse HEAD:IBIS-IP_TrainSetInformationService_V2.1.xsd)" = "897f373e31b76aa23d8bc206854b042524e4c102"
          test "$(git rev-parse HEAD:IBIS-IP_TrainSetManagementService_V2.1.xsd)" = "add9d1cb37e5759ff7a77855b239108d38373206"
          test "$(git rev-parse HEAD:IBIS-IP_TrainSetDataService_V2.1.xsd)" = "c2cdb73fcae265a2e4e0349ac6072e3548e36d8b"

      - name: Fetch exact byte-pinned TRAINSET V2.1 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          sid='TRAINSET_V2.1'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==sid)
          pin=next(x for x in pins['sources'] if x['source_id']==sid)
          assert source['official_url']=='https://www.vdv.de/vdv-301-2-14-v2-1-sds-trainsetservices.pdfx'
          assert source['local_filename']=='TRAINSET_V2.1.pdf'
          assert pin['expected_sha256']=='8eb53f2e960d125382e22d9c58dff8685c041001cf39a87ed4d12bb266bbe12e'
          assert int(pin['expected_size_bytes'])==1708401
          assert str(pin['evidence_run_id'])=='33226637254'
          for attempt in range(4):
              try:
                  req=urllib.request.Request(source['official_url'],headers={
                      'User-Agent':'VDV301-Audit-EV148-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                      'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(2*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert sha==pin['expected_sha256']
          assert len(data)==int(pin['expected_size_bytes'])
          target=Path('local_sources/vdv_pdfs')/source['local_filename']
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print('TRAINSET_V21_PDF_PIN_OK',sha,len(data))
          PY

      - name: Re-run EV-148, EV-109 and repository XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_drtrainset21_revalidation_ev148.py --repo-root . --output-dir artifacts/ev148-closure
          python tools/validate_trainset_v21_ev109.py
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Close DRTRAINSET21 block atomically
        shell: bash
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}
          CLOSURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json,os
          from pathlib import Path

          rp=Path('audit_registry/finding_revalidation_registry_v0.1.json')
          sp=Path('00_START_HERE/CURRENT_STATE.json')
          ep=Path('audit_registry/drtrainset21_revalidation_evidence_2026-09-06.json')
          report=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTRAINSET21_2026-09-06.md')
          d=json.loads(rp.read_text(encoding='utf-8'))
          s=json.loads(sp.read_text(encoding='utf-8'))
          e=json.loads(ep.read_text(encoding='utf-8'))
          run_id=os.environ['CLOSURE_RUN_ID']; run_url=os.environ['CLOSURE_RUN_URL']

          scope=['DRTRAINSET21-001','DRTRAINSET21-002','DRTRAINSET21-003']
          states={fid:'context_verified' for fid in scope}

          assert e['evidence_id']=='EV-148' and e['result']=='PASS'
          assert e['scope']==scope
          assert e['successful_run_id']=='34029363792'
          assert e['successful_job_id']=='101475946965'
          assert e['head_sha']=='1f5fcc0245bc5f53c29118f90252f644feef276d'
          assert e['artifact_id']=='9988086415'
          assert e['artifact_digest']=='sha256:c4e963de40e4684a9625644f9df2fc8f63ebedc8b2bba38736e83723d1c8dfea'
          assert e['authority']['source_id']=='TRAINSET_V2.1'
          assert e['authority']['pdf_sha256']=='8eb53f2e960d125382e22d9c58dff8685c041001cf39a87ed4d12bb266bbe12e'
          assert e['authority']['pdf_size_bytes']==1708401
          assert e['authority']['deep_read_blob']=='6d5680f438e7e592aaf1d056e39224e7c2a3f2d9'
          assert e['authority']['exact_v21_xsd_blobs']=={
            'IBIS-IP_TrainSetInformationService_V2.1.xsd':'897f373e31b76aa23d8bc206854b042524e4c102',
            'IBIS-IP_TrainSetManagementService_V2.1.xsd':'add9d1cb37e5759ff7a77855b239108d38373206',
            'IBIS-IP_TrainSetDataService_V2.1.xsd':'c2cdb73fcae265a2e4e0349ac6072e3548e36d8b'}
          assert e['authority']['ev109_blob']=='f88208bff7e39bb38a86a310dc121f486984f807'
          assert e['fresh_visual_evidence']['status']=='PASS'
          assert sorted(map(int,e['fresh_visual_evidence']['physical_pages'].keys()))==[6,9,10,44]
          assert e['executable_context']['terminal_state_requires_xml_execution'] is False
          assert e['executable_context']['EV-109_rerun_in_EV-148_job']=='PASS'
          assert e['full_xsd_pool']=={'count':50,'result':'PASS','role':'repository-regression-only'}
          assert e['immutable_guards']['xsd_mutated'] is False
          assert e['immutable_guards']['frozen_inventory_mutated'] is False
          assert {k:v['recommended_terminal_state'] for k,v in e['finding_results'].items()}==states

          inv=d['inventory']; entries=inv['entries']
          assert inv['state']=='frozen' and inv['entry_count']==192 and len(entries)==192
          assert d['next_revalidation_block']=='DRTRAINSET21'
          pre_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          pre_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (pre_terminal,pre_pending)==(117,75),(pre_terminal,pre_pending)
          by={x['finding_id']:x for x in entries}
          for fid in scope:
              assert by[fid]['revalidation_state']=='pending'
              assert by[fid]['terminal_state_source'] is None
              by[fid]['revalidation_state']='context_verified'
              by[fid]['terminal_state_source']=str(report)

          post_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          post_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (post_terminal,post_pending)==(120,72),(post_terminal,post_pending)

          first_pending=next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')
          assert first_pending=='DRTRAINSET22-001', first_pending
          assert all(by[f]['revalidation_state']=='pending' for f in ['DRTRAINSET22-001','DRTRAINSET22-002'])
          next_block='DRTRAINSET22'
          next_subblock='TRAINSET_V2.2_DRTRAINSET22'
          d['next_revalidation_block']=next_block

          blocks=d['revalidation_blocks']
          assert 'TRAINSET_V2.1_DRTRAINSET21' not in blocks
          assert blocks['TIME_V1.0_DRTIME10']['state']=='completed'
          prior_time=copy.deepcopy(blocks['TIME_V1.0_DRTIME10'])
          prior_sms=copy.deepcopy(blocks['SMS_V2.2_DRSMS22'])
          blocks['TRAINSET_V2.1_DRTRAINSET21']={
            'date':'2026-09-06',
            'state':'completed',
            'parent_block':'DRTRAINSET21',
            'scope_kind':'frozen_deep_read_findings_subblock',
            'source_id':'TRAINSET_V2.1',
            'publication':'VDV 301-2-14 TrainSet Services V2.1, 05/2018',
            'authority_lane':'byte-pinned official TrainSet V2.1 PDF with exact V2.1 service-XSD operation inventories and EV-109 used as counter-context; the three terminal findings are documentation-only',
            'pdf_sha256':'8eb53f2e960d125382e22d9c58dff8685c041001cf39a87ed4d12bb266bbe12e',
            'pdf_size_bytes':1708401,
            'original_pin_evidence_run_id':'33226637254',
            'deep_read_blob':'6d5680f438e7e592aaf1d056e39224e7c2a3f2d9',
            'xsd_blobs':e['authority']['exact_v21_xsd_blobs'],
            'ev109_blob':'f88208bff7e39bb38a86a310dc121f486984f807',
            'evidence_id':'EV-148',
            'evidence_run_id':'34029363792',
            'evidence_job_id':'101475946965',
            'evidence_head_sha':'1f5fcc0245bc5f53c29118f90252f644feef276d',
            'artifact_id':'9988086415',
            'artifact_digest':'sha256:c4e963de40e4684a9625644f9df2fc8f63ebedc8b2bba38736e83723d1c8dfea',
            'evidence_record':str(ep),
            'closure_run_id':run_id,
            'closure_run_url':run_url,
            'fresh_visual_physical_pages':[6,9,10,44],
            'visual_status':'closed_by_fresh_byte_pinned_render_and_manual_inspection',
            'ev109_rerun':'PASS',
            'xsd_pool_role':'repository-regression-only',
            'findings':states,
            'terminal_state_source':str(report),
            'xsd_mutation':False,
            'frozen_inventory_mutation':False,
            'next_block':next_block,
            'next_subblock':next_subblock
          }
          assert blocks['TIME_V1.0_DRTIME10']==prior_time
          assert blocks['SMS_V2.2_DRSMS22']==prior_sms

          a=s['audit']
          assert a['finding_inventory_count']==192
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(117,75)
          assert a['finding_revalidation_next_block']=='DRTRAINSET21'
          assert a['finding_revalidation_current_block']=='TIME_V1.0_DRTIME10'
          assert a['finding_revalidation_latest_completed_block']=='TIME_V1.0_DRTIME10'
          assert a['latest_revalidation_evidence_id']=='EV-147'
          assert 'drtrainset21_revalidation' not in a
          a['finding_revalidation_completed_findings']=120
          a['finding_revalidation_pending_findings']=72
          a['finding_revalidation_current_block']='TRAINSET_V2.1_DRTRAINSET21'
          a['finding_revalidation_latest_completed_block']='TRAINSET_V2.1_DRTRAINSET21'
          a['finding_revalidation_next_block']=next_block
          a['finding_revalidation_latest_terminal_state_source']=str(report)
          a['latest_revalidation_evidence_id']='EV-148'
          a['drtrainset21_revalidation']={
            'status':'complete',
            'completed_at_run':run_id,
            'evidence_id':'EV-148',
            'evidence_run_id':'34029363792',
            'evidence_job_id':'101475946965',
            'evidence_head_sha':'1f5fcc0245bc5f53c29118f90252f644feef276d',
            'artifact_id':'9988086415',
            'artifact_digest':'sha256:c4e963de40e4684a9625644f9df2fc8f63ebedc8b2bba38736e83723d1c8dfea',
            'terminal_states':states,
            'fresh_visual_physical_pages':[6,9,10,44],
            'visual_status':'closed',
            'ev109_rerun':'PASS',
            'xsd_pool_role':'repository-regression-only',
            'report':str(report),
            'next_block':next_block,
            'next_subblock':next_subblock,
            'xsd_mutation':False,
            'frozen_inventory_mutation':False
          }

          rp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          report.write_text(f'''# Finding Revalidation — DRTRAINSET21 / TrainSet Services V2.1\n\nDate: 2026-09-06  \nScope: `DRTRAINSET21-001`, `DRTRAINSET21-002`, `DRTRAINSET21-003`  \nEvidence: `EV-148`, successful evidence run `34029363792`, job `101475946965`  \nEvidence commit: `1f5fcc0245bc5f53c29118f90252f644feef276d`  \nClosure run: `{run_id}`\n\n## Authority route\n\nOfficial byte-pinned VDV 301-2-14 TrainSet Services V2.1 PDF (`8eb53f2e960d125382e22d9c58dff8685c041001cf39a87ed4d12bb266bbe12e`, 1,708,401 bytes), original pin run `33226637254`. The current Deep Read is blob `6d5680f438e7e592aaf1d056e39224e7c2a3f2d9`. Exact V2.1 service XSD blobs are TSI `897f373e31b76aa23d8bc206854b042524e4c102`, TSM `add9d1cb37e5759ff7a77855b239108d38373206`, and TSD `c2cdb73fcae265a2e4e0349ac6072e3548e36d8b`.\n\nThe XSDs and EV-109 are used as exact-version counter-context only. All three DRTRAINSET21 terminal states are documentation/navigation/name-context findings and do not alter XML validation behaviour. EV-109 and the complete 50-XSD pool were rerun and passed without XSD mutation.\n\n## Visual evidence\n\nEV-148 rendered the exact pinned PDF at 180 DPI. Physical pages 6, 9, 10 and 44 were manually inspected after the successful run and match the stored render hashes in the permanent evidence record.\n\n## DRTRAINSET21-001 — context_verified\n\nGerman page 9 and English page 10 both point the service-interaction examples to section 9.1. Page 6 identifies 9.1 as the driving-direction re-initialisation subsection and separately identifies section 10 as `Examples`. The counter-hypothesis that 9.1 was intentionally referenced because it itself contains an example-style re-initialisation use case was tested. It does contain such a use case; however, overview item 4 already assigns re-initialisation to sections 7 and 9, while item 5 separately introduces examples of service interaction, and section 10 contains multiple dedicated cross-service example use cases. The 9.1 pointer is therefore retained as a stale/wrong cross-reference.\n\n## DRTRAINSET21-002 — context_verified\n\nPage 44 says the TrainSetInformationService composition operations provide the same information as equally named operations of the `TrainSetDataService`. Exact TrainSetDataService V2.1 exposes TripRef/TripInformation operations and no `TrainSetComposition` operation. The alternate-alias hypothesis is therefore rejected. TrainSetManagementService carries composition context in this V2.1 family; it is recorded only as the likely intended reference, not used to rewrite or synthesize schema operations.\n\n## DRTRAINSET21-003 — context_verified\n\nPage 44 visibly prints `GetTrainSetCompositon`. Exact TrainSetInformationService V2.1 and the publication operation inventory use `Composition`; no `Compositon` declaration or alias exists. The typo is documentation-only and no compatibility alias is created.\n\n## Closure\n\nEV-148 PASS; closure rerun PASS; EV-109 PASS; all 50 root XSDs PASS as repository-regression evidence; frozen 192-finding inventory unchanged; no XSD mutation. Revalidation count is now **120/192 terminal, 72 pending**. The first remaining pending finding is `DRTRAINSET22-001`; next block is `DRTRAINSET22` (`TRAINSET_V2.2_DRTRAINSET22`).\n''',encoding='utf-8')
          print('DRTRAINSET21_CLOSE_WRITE_OK terminal=120 pending=72 next=DRTRAINSET22')
          PY

      - name: Cleanup, verify allowlist, commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/ev148-closure local_sources/vdv_pdfs/TRAINSET_V2.1.pdf tools/__pycache__
          rm .github/workflows/temp_probe_trainset_v21_drtrainset21.yml
          rm .github/workflows/temp_validate_drtrainset21_ev148.yml
          rm .github/workflows/drtrainset21-registry-closure.yml

          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test -z "$(git diff --name-only | grep -E '\.xsd$' || true)"

          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          s=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          by={x['finding_id']:x for x in d['inventory']['entries']}
          scope=['DRTRAINSET21-001','DRTRAINSET21-002','DRTRAINSET21-003']
          assert all(by[f]['revalidation_state']=='context_verified' for f in scope)
          assert d['revalidation_blocks']['TRAINSET_V2.1_DRTRAINSET21']['state']=='completed'
          assert d['next_revalidation_block']=='DRTRAINSET22'
          first=next(x['finding_id'] for x in d['inventory']['entries'] if x['revalidation_state']=='pending')
          assert first=='DRTRAINSET22-001'
          a=s['audit']
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(120,72)
          assert a['finding_revalidation_next_block']=='DRTRAINSET22'
          assert a['finding_revalidation_latest_completed_block']=='TRAINSET_V2.1_DRTRAINSET21'
          assert a['latest_revalidation_evidence_id']=='EV-148'

          allowed={
            '.github/workflows/temp_probe_trainset_v21_drtrainset21.yml',
            '.github/workflows/temp_validate_drtrainset21_ev148.yml',
            '.github/workflows/drtrainset21-registry-closure.yml',
            'audit_registry/finding_revalidation_registry_v0.1.json',
            '00_START_HERE/CURRENT_STATE.json',
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTRAINSET21_2026-09-06.md'
          }
          changed=set(subprocess.check_output(['git','status','--porcelain'],text=True).splitlines())
          paths={line[3:] for line in changed if len(line)>=4}
          assert paths==allowed,(paths,allowed)
          print('DRTRAINSET21_POST_CLOSURE_CONSISTENCY_PASS')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: close DRTRAINSET21 revalidation block [skip ci]'
          git push origin HEAD:dev/schema-integration
