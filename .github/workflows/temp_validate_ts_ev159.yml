name: TEMP validate TS EV-159

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_validate_ts_ev159.yml

permissions:
  contents: read
  actions: read

jobs:
  validate-ts-ev159:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical audit branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Assert exact post-TKT pre-TS state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "0a4bfcb5d895f25381afd56c32fe5c7d349e4de0"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "f3c248261066c3760ac093e73c6bfaca484c67c1"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/TIME_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "23723fbb6bb99ffa3aa1eb8c13feae6aa95a0170"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TIME_V1.0.md)" = "82a88fbd6dae5d22f472bf144770d915fcc902ea"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(git hash-object tools/runtime_time_profile.py)" = "acd28ca0bd6ac1917b3d2db29745555b7e17d8dd"
          test "$(git hash-object tools/validate_time_runtime_rv003.py)" = "ff6e3fcd35d4c2f6bff760b3e86f5adb0e72156c"

      - name: Verify pinned TS source-acquisition run online
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34814542791 > /tmp/ts-source-run.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34814542791/jobs > /tmp/ts-source-jobs.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34814542791/artifacts > /tmp/ts-source-artifacts.json
          python - <<'PY'
          import json
          run=json.load(open('/tmp/ts-source-run.json'))
          jobs=json.load(open('/tmp/ts-source-jobs.json'))['jobs']
          arts=json.load(open('/tmp/ts-source-artifacts.json'))['artifacts']
          assert run['conclusion']=='success'
          assert run['head_sha']=='bd158b2a6121a3f7e4612acca5607875ab7ab852'
          job=[x for x in jobs if x['id']==103882386972]
          assert len(job)==1 and job[0]['conclusion']=='success'
          art=[x for x in arts if x['id']==10336172299]
          assert len(art)==1
          assert art[0]['name']=='ts-ev159-source'
          assert art[0]['digest']=='sha256:c24cfc7d8b80652a5caaeafa4d131f31c32fcbe85e45cfb4a6bb5edb2f789c94'
          assert art[0]['expired'] is False
          print('OK pinned TS source run/job/artifact/digest')
          PY

      - name: Fetch exact official VDV release contexts
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'upstream-v10 f5b53785f703e898632603eec3bfa3555a79fdba 729bbe3270e52fed3e0641466048a745d5a09b32' \
            'upstream-v20 f2569a91f0a7c737a0ca7c0280b28ad223d7ee08 11daf0ebb3b26745c036ee19a547ad16d39f922c'
          do
            set -- $spec
            dir="$1"; commit="$2"; tree="$3"
            git init "/tmp/$dir"
            git -C "/tmp/$dir" remote add origin https://github.com/VDVde/VDV301.git
            git -C "/tmp/$dir" fetch --depth=1 origin "$commit"
            git -C "/tmp/$dir" checkout --detach FETCH_HEAD
            test "$(git -C "/tmp/$dir" rev-parse HEAD)" = "$commit"
            test "$(git -C "/tmp/$dir" rev-parse HEAD^{tree})" = "$tree"
          done

      - name: Re-acquire official TimeService V1.0 PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ts-ev159
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 VDV301-audit-EV159' \
            'https://www.vdv.de/301-2-10sds-v-1-01.pdfx' \
            -o /tmp/ts-ev159/TIME_V1.0.pdf
          test "$(sha256sum /tmp/ts-ev159/TIME_V1.0.pdf | awk '{print $1}')" = "d040f503be8e82f5500220ba5cc9b0b41a2fa10db80d9f3980eed191378594d3"
          test "$(stat --printf='%s' /tmp/ts-ev159/TIME_V1.0.pdf)" = "515920"
          test "$(pdfinfo /tmp/ts-ev159/TIME_V1.0.pdf | awk '/^Pages:/ {print $2}')" = "10"

      - name: Snapshot complete XSD pool before EV-159
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ev159
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > artifacts/ev159/xsd-before.sha256
          test "$(wc -l < artifacts/ev159/xsd-before.sha256)" -eq 50

      - name: Run EV-159 TimeService finding revalidation
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_ts_revalidation_ev159.py \
            --repo-root . \
            --pdf /tmp/ts-ev159/TIME_V1.0.pdf \
            --upstream-v10-dir /tmp/upstream-v10 \
            --upstream-v20-dir /tmp/upstream-v20 \
            --output-dir artifacts/ev159

      - name: Run complete 50-root-XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . | tee artifacts/ev159/xsd-pool.log

      - name: Verify XSD and audit-state immutability
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > artifacts/ev159/xsd-after.sha256
          cmp artifacts/ev159/xsd-before.sha256 artifacts/ev159/xsd-after.sha256
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "0a4bfcb5d895f25381afd56c32fe5c7d349e4de0"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "f3c248261066c3760ac093e73c6bfaca484c67c1"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"

      - name: Upload EV-159 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ts-ev159-evidence
          path: artifacts/ev159
          if-no-files-found: error
