name: temp-final3-v22-visible-body-render

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - '.github/workflows/temp-final3-v22-visible-body-render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Download, pin and render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results/final3-v22-visible-body
          curl -L --fail --retry 3 -o /tmp/v22.pdf 'https://www.vdv.de/301-2-1-sdes-v2-2-commonstructure-enums.pdfx'
          echo '85168c2012e81a9a2186c98859f04f959d783b5e33b631104a1b90b29fceb203  /tmp/v22.pdf' | sha256sum -c -
          python - <<'PY'
          import fitz, hashlib, json
          from pathlib import Path
          out=Path('audit-results/final3-v22-visible-body')
          doc=fitz.open('/tmp/v22.pdf')
          manifest={}
          for printed in (15,34):
              pix=doc[printed-1].get_pixmap(matrix=fitz.Matrix(2,2), alpha=False)
              dest=out/f'v22_printed_{printed:02d}.png'
              pix.save(dest)
              manifest[f'p{printed}']={'printed_page':printed,'pdf_page_index':printed-1,'png_sha256':hashlib.sha256(dest.read_bytes()).hexdigest()}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload exact-byte visible-body pages
        uses: actions/upload-artifact@v4
        with:
          name: final3-v22-visible-body
          path: audit-results/final3-v22-visible-body/
          if-no-files-found: error
          retention-days: 30
