name: temp-merge-semantic-classification-jis-v10-005

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_merge_semantic_classification_jis_v10_005.yml

permissions:
  contents: write

jobs:
  merge-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact prestate and current JIS-005 executable boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b17ef32604a1128c76d148e48108c84d339f6b44"
          test "$(git rev-parse HEAD^^)" = "c1764890118ac3eb3a9e974e3b86f62d5393d6ec"
          test "$(git hash-object audit_registry/semantic_classification_blocks/JIS_V10_005_v0.1.json)" = "1a3af8d55354fecc1bee14669de55e5598d899a3"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "5c0e7a4884011766c304470cf020d2feca4e40d8"
          test "$(git hash-object audit_registry/jis_revalidation_evidence_2026-09-08.json)" = "d08ac5748240373fa83b6f92272a69ad8011d8fc"
          test "$(git hash-object IBIS-IP_JourneyInformationService_V1.0.xsd)" = "8c303db5a9c0548d66b90174d9c329d33092ad24"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"

          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/JIS_V10_005_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          evidence=json.loads(Path('audit_registry/jis_revalidation_evidence_2026-09-08.json').read_text())

          assert registry['progress']['classified_count']==137
          assert registry['progress']['remaining_count']==55
          assert registry['progress']['latest_block']=='JIS_V10_003_004'
          assert 'JIS-005' not in {e['finding_id'] for e in registry['entries']}
          assert [e['finding_id'] for e in block['entries']]==['JIS-005']
          j5=block['entries'][0]
          assert j5['defect_assessment']=='confirmed_pdf_defect'
          assert j5['sdk_behavior']=='error_with_advisory'
          assert j5['runtime_match']['state']=='candidate'

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['JIS-005']['revalidation_state']=='executable_confirmed'
          ev=evidence['finding_results']['JIS-005']
          assert ev['positive_xsd_element_name'] is True
          assert ev['negative_pdf_row_name'] is False

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          doc=etree.parse('IBIS-IP_JourneyInformationService_V1.0.xsd')
          resp=doc.xpath("//xs:complexType[@name='JourneyInformationService.RetrieveSpecificGNSSPointInformationResponseStructure']",namespaces=NS)
          assert len(resp)==1
          good=resp[0].xpath("./xs:choice/xs:element[@name='SpecificGNSSPointInformation']",namespaces=NS)
          bad=resp[0].xpath("./xs:choice/xs:element[@name='SpecificGNSSPointInformationData']",namespaces=NS)
          assert len(good)==1
          assert good[0].get('type')=='JourneyInformationService.SpecificGNSSPointInformationData'
          assert not bad

          schema=etree.XMLSchema(doc)
          def xml(child):
              return f"""<JourneyInformationService.RetrieveSpecificGNSSPointInformationResponse>
            <{child}>
              <TimeStamp><Value>2026-09-18T06:00:00Z</Value></TimeStamp>
              <GNSSPoint>
                <Longitude><Degree><Value>6.95</Value></Degree><Direction><Value>E</Value></Direction></Longitude>
                <Latitude><Degree><Value>50.93</Value></Degree><Direction><Value>N</Value></Direction></Latitude>
              </GNSSPoint>
            </{child}>
          </JourneyInformationService.RetrieveSpecificGNSSPointInformationResponse>"""
          assert schema.validate(etree.fromstring(xml('SpecificGNSSPointInformation').encode()))
          assert not schema.validate(etree.fromstring(xml('SpecificGNSSPointInformationData').encode()))
          print('PASSED: current selected XSD accepts the correct JIS-005 element and rejects the PDF row-name form')
          PY

      - name: Snapshot XSD pool before semantic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256

      - name: Merge JIS-005 block and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/JIS_V10_005_v0.1.json
          python tools/validate_finding_semantic_classification.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert registry['progress']['classified_count']==138
          assert registry['progress']['remaining_count']==54
          assert registry['progress']['latest_block']=='JIS_V10_005'
          assert registry['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/JIS_V10_005_v0.1.json'
          e={x['finding_id']:x for x in registry['entries']}['JIS-005']
          assert e['sdk_behavior']=='error_with_advisory'
          assert e['runtime_match']['state']=='candidate'
          assert e['primary_issue_kind']=='wrong_structure_reference'
          print('PASSED: merged registry is exactly 138/192 and JIS-005 semantics are preserved')
          PY

      - name: Validate all 50 root XSDs and prove no schema mutation
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Persist only JIS-005 block and master registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp_merge_semantic_classification_jis_v10_005.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          mapfile -t changed < <(git diff --name-only c1764890118ac3eb3a9e974e3b86f62d5393d6ec | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'audit_registry/finding_semantic_classification_v0.1.json'
          test "${changed[1]}" = 'audit_registry/semantic_classification_blocks/JIS_V10_005_v0.1.json'
          git commit -m 'audit: merge JIS-005 semantic classification'
          git push origin HEAD:dev/schema-integration
