name: temp-gate-semantic-classification-tsm-v21-001

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_tsm_v21_001.yml

permissions:
  contents: read

jobs:
  gate-tsm-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact TSM classification prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1dd621f5558efbcdf925ea3e461e94d63f23862b"
          test "$(git hash-object audit_registry/semantic_classification_blocks/TSM_V21_001_v0.1.json)" = "ff1dd05b70ab618ec001efb02c05c7f99b931e93"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "e2daaf4756c5770b6f78fa1df459da38188746c1"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSM_2026-09-14.md)" = "57e09f0434f5bc6348965add43051bfdcb0d2c13"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.1.md)" = "6d5680f438e7e592aaf1d056e39224e7c2a3f2d9"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.2.md)" = "61850045c26fb2a848c4670f1418fdb809ab475c"

      - name: Verify frozen state and V2.1/V2.2 root history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/TSM_V21_001_v0.1.json').read_text())

          assert registry['progress']['classified_count']==167
          assert registry['progress']['remaining_count']==25
          assert registry['progress']['latest_block']=='TSI_V21_001'
          assert [e['finding_id'] for e in block['entries']]==['TSM-001']

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['TSM-001']['revalidation_state']=='executable_confirmed'
          assert frozen['TSM-001']['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSM_2026-09-14.md'

          e=block['entries'][0]
          assert e['defect_assessment']=='confirmed_xsd_defect'
          assert e['primary_surface']=='xsd'
          assert e['primary_issue_kind']=='identifier_typo'
          assert e['sdk_behavior']=='error_with_advisory'
          assert e['runtime_match']['state']=='candidate'
          assert 'xsd_rejects_pdf_documented_form' not in e['validation_effect']

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          def roots(path):
              tree=etree.parse(path)
              etree.XMLSchema(tree)
              globals_={n.get('name'):n.get('type') for n in tree.xpath('/xs:schema/xs:element',namespaces=NS)}
              group={n.get('name'):n.get('type') for n in tree.xpath("/xs:schema/xs:group[@name='TrainSetManagementServiceOperations']//xs:element",namespaces=NS)}
              return globals_,group

          old='TrainSetManagementService.GetTrainSetComposition'
          corrected='TrainSetManagementService.GetTrainSetCompositionResponse'
          response_type='TrainSetInformationService.GetTrainSetCompositionResponseStructure'

          g21,grp21=roots('IBIS-IP_TrainSetManagementService_V2.1.xsd')
          assert g21.get(old)==response_type
          assert grp21.get(old)==response_type
          assert corrected not in g21
          assert corrected not in grp21

          g22,grp22=roots('IBIS-IP_TrainSetManagementService_V2.2.xsd')
          assert g22.get(corrected)==response_type
          assert old not in g22
          assert grp22.get(old)==response_type
          assert corrected not in grp22

          terminal=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSM_2026-09-14.md').read_text()
          assert 'EV-162' in terminal
          assert '34823353897' in terminal
          assert '34823587675' in terminal

          dr21=Path('docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.1.md').read_text()
          dr22=Path('docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.2.md').read_text()
          assert 'V2.1 old-name root GetTrainSetComposition            VALID' in dr21
          assert 'later GetTrainSetCompositionResponse root            INVALID / no matching global declaration' in dr21
          assert 'GetTrainSetCompositionResponse replaces the V2.1 name without' in dr22
          print('PASSED: TSM-001 authority and correction history verified')
          PY

      - name: Simulate merge and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py \
            --block audit_registry/semantic_classification_blocks/TSM_V21_001_v0.1.json \
            --output /tmp/tsm-merged-registry.json
          python tools/validate_finding_semantic_classification.py \
            --registry /tmp/tsm-merged-registry.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/tsm-merged-registry.json',encoding='utf-8'))
          assert r['progress']['classified_count']==168
          assert r['progress']['remaining_count']==24
          assert r['progress']['latest_block']=='TSM_V21_001'
          by={e['finding_id']:e for e in r['entries']}
          assert by['TSM-001']['defect_assessment']=='confirmed_xsd_defect'
          assert by['TSM-001']['primary_issue_kind']=='identifier_typo'
          print('PASSED: simulated registry is exactly 168/192')
          PY

      - name: Validate all 50 root XSDs and prove read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: TSM semantic gate complete; repository remains unmodified"
