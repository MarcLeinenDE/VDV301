name: TEMP pin PCS PDFs for EV-155

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_pin_pcs_ev155.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Install PDF evidence tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify immutable audit prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/finding_revalidation_registry_v0.1.json)" = "865a21115cec1beb556af000c71717ae774459cb"
          test "$(git rev-parse HEAD:00_START_HERE/CURRENT_STATE.json)" = "ee9120db8b01e26e888ad6b512c0a49d8751d700"
          test "$(git rev-parse HEAD:audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git rev-parse HEAD:IBIS-IP_PassengerCountingService_V1.0.xsd)" = "4161872be76740abfdd1cddf96f8a736333fc8be"
          test "$(git rev-parse HEAD:IBIS-IP_PassengerCountingService_V2.1.xsd)" = "59ef2ddb09b92db0d492974e38bad5b6be03865e"
          test "$(git rev-parse 7fad145f528205ef5c40e58a3a23374379b08189:docs/pdf_xsd_semantic_audit/findings.md)" = "9e34d4eb9f798b83390b27c166bf1368adbd9ad8"
          test "$(git rev-parse 7fad145f528205ef5c40e58a3a23374379b08189:docs/pdf_xsd_semantic_audit/PASSENGER_COUNTING_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "d95f19a3e8ba207c0964a16f24260358536acf7d"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(wc -l < /tmp/xsd-before.sha256)" -eq 50

      - name: Fetch official PCS PDFs and build fresh evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/ev155-pcs-pin
          mkdir -p artifacts/ev155-pcs-pin/pdfs artifacts/ev155-pcs-pin/text artifacts/ev155-pcs-pin/renders
          python - <<'PY'
          import hashlib, json, subprocess, time, urllib.request
          from pathlib import Path

          out = Path('artifacts/ev155-pcs-pin')
          sources = {
              'PCS_V1.0': 'https://www.vdv.de/301-2-5-sdes-v1.0-passenger-counting-service.pdfx',
              'PCS_V2.1': 'https://www.vdv.de/301-2-5-sds-v2.1-passenger-counting-service.pdfx',
          }
          metadata = {'sources': {}}
          terms = [
              'RetrieveSpecificDoorData', 'OperationNotSupported',
              'DataEstimated', 'DataNotAvailable', 'PassengerCountingService'
          ]

          for sid, url in sources.items():
              data = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': 'VDV301-Audit-EV155/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                          'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
                      })
                      with urllib.request.urlopen(req, timeout=90) as response:
                          data = response.read()
                      break
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(2 * (attempt + 1))
              assert data is not None and data.startswith(b'%PDF-')
              pdf = out / 'pdfs' / f'{sid}.pdf'
              pdf.write_bytes(data)
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(['pdfinfo', str(pdf)], text=True, errors='replace')
              pages = None
              for line in info.splitlines():
                  if line.startswith('Pages:'):
                      pages = int(line.split(':',1)[1].strip())
              assert pages and pages > 0
              full_txt = out / 'text' / f'{sid}.txt'
              subprocess.run(['pdftotext','-layout',str(pdf),str(full_txt)], check=True)
              page_hits = {}
              hit_pages = set()
              page_text_dir = out / 'text' / f'{sid}_pages'
              page_text_dir.mkdir(parents=True, exist_ok=True)
              for p in range(1, pages + 1):
                  pt = page_text_dir / f'page-{p}.txt'
                  subprocess.run(['pdftotext','-layout','-f',str(p),'-l',str(p),str(pdf),str(pt)], check=True,
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  text = pt.read_text(encoding='utf-8', errors='replace')
                  found = [t for t in terms if t.lower() in text.lower()]
                  if found:
                      page_hits[str(p)] = found
                      hit_pages.add(p)
              selected = sorted(hit_pages) if hit_pages else list(range(1, min(pages,3)+1))
              decisive = {int(p) for p, found in page_hits.items() if any(t in found for t in ['RetrieveSpecificDoorData','OperationNotSupported'])}
              selected = sorted(set(selected[:20]) | decisive)
              render_dir = out / 'renders' / sid
              render_dir.mkdir(parents=True, exist_ok=True)
              for p in selected:
                  prefix = render_dir / f'page-{p}'
                  subprocess.run(['pdftoppm','-f',str(p),'-singlefile','-r','180','-png',str(pdf),str(prefix)], check=True,
                                 stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              metadata['sources'][sid] = {
                  'url': url,
                  'sha256': sha,
                  'size_bytes': len(data),
                  'pages': pages,
                  'page_hits': page_hits,
                  'rendered_physical_pages': selected,
                  'full_text_sha256': hashlib.sha256(full_txt.read_bytes()).hexdigest(),
              }
              print(sid, sha, len(data), pages, page_hits, selected)

          (out / 'pin_result.json').write_text(json.dumps(metadata, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Verify repository remained immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code -- '*.xsd' audit_registry/finding_inventory_frozen_2026-09-03.json audit_registry/finding_revalidation_registry_v0.1.json 00_START_HERE/CURRENT_STATE.json

      - name: Upload EV-155 PCS pin evidence
        uses: actions/upload-artifact@v4
        with:
          name: pcs-ev155-pin
          path: artifacts/ev155-pcs-pin
          if-no-files-found: error
