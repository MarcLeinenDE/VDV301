name: temp-merge-semantic-classification-jis-v10-001-002

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_merge_semantic_classification_jis_v10_001_002.yml

permissions:
  contents: write

jobs:
  merge-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact prestate, EV-152 and shared-model boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "131bdc83c18d96d6fa8b04a81d345c493f21cfe8"
          test "$(git rev-parse HEAD^^)" = "74b00c4637dd39e10266da4e9868893e1d6b0562"
          test "$(git hash-object audit_registry/semantic_classification_blocks/JIS_V10_001_002_v0.1.json)" = "f507cfff48d0672ddebcd071d3c397d8630c31ec"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "f096dcd957805a3f56dc5878109e3c1b1c30273e"
          test "$(git hash-object audit_registry/jis_revalidation_evidence_2026-09-08.json)" = "d08ac5748240373fa83b6f92272a69ad8011d8fc"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_JIS_2026-09-08.md)" = "a83b9fcff0030e084e8f1c6ec16841e7706c5739"
          test "$(git hash-object IBIS-IP_JourneyInformationService_V1.0.xsd)" = "8c303db5a9c0548d66b90174d9c329d33092ad24"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"

          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry = json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          block = json.loads(Path('audit_registry/semantic_classification_blocks/JIS_V10_001_002_v0.1.json').read_text())
          baseline = json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          evidence = json.loads(Path('audit_registry/jis_revalidation_evidence_2026-09-08.json').read_text())

          assert registry['progress']['classified_count'] == 133
          assert registry['progress']['remaining_count'] == 59
          assert registry['progress']['latest_block'] == 'HDS_V21_V22_V22A_HDS001'
          existing = {e['finding_id']: e for e in registry['entries']}
          assert 'JIS-001' not in existing and 'JIS-002' not in existing

          assert block['block_id'] == 'JIS_V10_001_002'
          assert [e['finding_id'] for e in block['entries']] == ['JIS-001','JIS-002']
          for e in block['entries']:
              assert e['normative_authority'] == 'selected_xsd'
              assert e['primary_issue_kind'] == 'intentional_design_misread'
              assert e['defect_assessment'] == 'non_defect'
              assert e['validation_effect'] == ['no_runtime_effect']
              assert e['sdk_behavior'] == 'no_runtime_diagnostic'
              assert e['runtime_match']['state'] == 'not_applicable'

          frozen = {e['finding_id']: e for e in baseline['inventory']['entries']}
          assert frozen['JIS-001']['revalidation_state'] == 'contextual_not_defect'
          assert frozen['JIS-002']['revalidation_state'] == 'contextual_not_defect'
          assert frozen['JIS-001']['terminal_state_source'] == 'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_JIS_2026-09-08.md'
          assert frozen['JIS-002']['terminal_state_source'] == 'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_JIS_2026-09-08.md'

          assert evidence['evidence_id'] == 'EV-152'
          assert evidence['result'] == 'PASS'
          assert evidence['successful_run_id'] == '34113437268'
          assert evidence['successful_job_id'] == '101714662141'
          assert evidence['authority']['xsd_route'] == 'JIS V1.0 -> Common V1.0 -> Enumerations V1.0'
          assert evidence['authority']['service_blob'] == '8c303db5a9c0548d66b90174d9c329d33092ad24'
          assert evidence['authority']['common_blob'] == '194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c'
          assert evidence['authority']['enumerations_blob'] == 'a9bea5bc73003ed91ded8519db06c32c4067831d'
          assert evidence['finding_results']['JIS-001']['recommended_terminal_state'] == 'contextual_not_defect'
          assert evidence['finding_results']['JIS-002']['recommended_terminal_state'] == 'contextual_not_defect'

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          service=etree.parse('IBIS-IP_JourneyInformationService_V1.0.xsd')
          common=etree.parse('IBIS-IP_common_V1.0.xsd')
          group=service.xpath("//xs:group[@name='JourneyInformationServiceGroup']",namespaces=NS)
          assert len(group)==1
          names=[x.get('name') for x in group[0].xpath('.//xs:element',namespaces=NS)]
          assert not any('Subscribe' in (x or '') or 'Unsubscribe' in (x or '') for x in names)
          for ctype in ['SubscribeRequestStructure','SubscribeResponseStructure','UnsubscribeRequestStructure','UnsubscribeResponseStructure']:
              assert len(common.xpath(f"//xs:complexType[@name='{ctype}']",namespaces=NS))==1, ctype
          set_requests=[x for x in names if (x or '').startswith('JourneyInformationService.Set')]
          assert len(set_requests)==7, set_requests
          assert all((x or '').endswith('Request') for x in set_requests)
          assert not any((x or '').startswith('JourneyInformationService.Set') and (x or '').endswith('Response') for x in names)
          assert len(common.xpath("//xs:complexType[@name='DataAcceptedResponseStructure']",namespaces=NS))==1
          print('PASSED: exact 133/192 prestate and JIS-001/002 shared Common modelling verified')
          PY

      - name: Snapshot XSD pool before semantic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256

      - name: Merge JIS-001/002 block and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/JIS_V10_001_002_v0.1.json
          python tools/validate_finding_semantic_classification.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert registry['progress']['classified_count']==135
          assert registry['progress']['remaining_count']==57
          assert registry['progress']['latest_block']=='JIS_V10_001_002'
          assert registry['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/JIS_V10_001_002_v0.1.json'
          by_id={e['finding_id']:e for e in registry['entries']}
          for fid in ['JIS-001','JIS-002']:
              e=by_id[fid]
              assert e['defect_assessment']=='non_defect'
              assert e['sdk_behavior']=='no_runtime_diagnostic'
              assert e['runtime_match']['state']=='not_applicable'
          print('PASSED: merged registry is exactly 135/192 and JIS-001/002 semantics are preserved')
          PY

      - name: Validate all 50 root XSDs and prove no schema mutation
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          echo 'PASSED: all 50 root XSDs compile and are byte-identical before/after semantic merge'

      - name: Persist only JIS-001/002 block and master registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp_merge_semantic_classification_jis_v10_001_002.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          mapfile -t changed < <(git diff --name-only 74b00c4637dd39e10266da4e9868893e1d6b0562 | sort)
          printf 'Durable cumulative diff:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'audit_registry/finding_semantic_classification_v0.1.json'
          test "${changed[1]}" = 'audit_registry/semantic_classification_blocks/JIS_V10_001_002_v0.1.json'
          git status --short
          git commit -m 'audit: merge JIS-001 and JIS-002 semantic classification'
          git push origin HEAD:dev/schema-integration
