name: temp-finalize-hds-v22-close
on:
  push:
    branches: [dev/schema-integration]
    paths: ['.github/workflows/temp-finalize-hds-v22-close.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build HDS V2.2 closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          sp=Path('00_START_HERE/CURRENT_STATE.json')
          s=json.loads(sp.read_text(encoding='utf-8')); a=s['audit']
          a['deep_read_in_progress']=0
          a['deep_read_current_document_id']=None
          a['deep_read_previous_document_id']='HDS_V2.2'
          a['next_natural_deep_read_document_id']='HDS_V2.2a'
          a['latest_deep_read_revalidation']='HDS-001_V2.2_context_verified_ok_with_note_RV-002_run_33266770833'
          a['latest_deep_read_findings_delta']='audit_registry/deep_read_findings_delta_hds_v22_2026-08-29.json'
          a['hds_v2_2_findings']={
            'HDS-001':'context_verified_ok_with_note_runtime_profile_supported_RV-002_run_33266770833'
          }
          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          dp=Path('audit_registry/deep_read_registry_delta_hds_v22_2026-08-29.json')
          d=json.loads(dp.read_text(encoding='utf-8')); h=d['document_updates']['HDS_V2.2']
          h['state']='targeted_visual_review_complete_historical_reconciliation_complete'
          h['historical_v22_profile_reconciled_after_fresh_read_freeze']=True
          h['existing_findings_revalidated']={
            'HDS-001':'context_verified_ok_with_note_runtime_profile_supported_RV-002_run_33266770833'
          }
          h['new_unique_findings']=[]
          h['runtime_evidence']={
            'evidence_id':'RV-002',
            'revalidation_run':'33266770833',
            'job':'99138094017',
            'status':'PASS',
            'scope':'deterministic DNS-SD profile classifier; no live DNS/mDNS or endpoint-reachability claim',
            'v2_2_checks':[
              'canonical _http._tcp profile passes',
              'content endpoint comes from TXT url rather than SRV host/port reconstruction',
              'service-specific HDS specialization is recorded',
              'missing url is detected and yields no resolved content endpoint',
              'wrong service name is detected',
              '_ibisip_http._tcp transition is accepted only with note and is not reclassified as the native V2.2 canonical label'
            ]
          }
          h['historical_reconciliation']='complete_for_V2.2_only'
          h['next_document_id']='HDS_V2.2a'
          dp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          fd={
            'delta_version':'0.1','date':'2026-08-29','document_id':'HDS_V2.2',
            'evidence_gate':'docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md',
            'new_unique_findings':[],
            'revalidated_findings':{
              'HDS-001':{
                'state':'context_verified_ok_with_note_runtime_profile_supported_RV-002_run_33266770833',
                'summary':'The byte-pinned official V2.2 publication, visible pages 7-11 and official VDV-301-2.2 release inventory confirm that HDS remains intentionally non-XSD. V2.2 changes access discovery to TXT content+url while retaining canonical _http._tcp; RV-002 confirms the corresponding deterministic resolver behavior.',
                'classification':'ok_with_note',
                'validation_behavior':'discovery_http_profile_not_service_xsd'
              }
            },
            'version_profile':{
              'canonical_protocol':'_http._tcp',
              'txt_keys':['content','url'],
              'endpoint_source':'TXT url',
              'srv_port_role':'published_but_not_content_address',
              'srv_host_role':'publishing_device_identity',
              'later_v2_2a_transition_note':'_ibisip_http._tcp may be accepted with explicit compatibility note only; not native V2.2 source wording'
            },
            'authority_note':{
              'official_pdf':'official_public_VDV_writing',
              'official_tag':'VDV-301-2.2',
              'dedicated_service_xsd':False,
              'runtime_evidence':'RV-002 run 33266770833',
              'live_network_claim':False
            },
            'deduplication':'No new HDS V2.2 finding ID opened; the independently derived V2.2 profile reconciles to HDS-001 plus version-specific routing behavior.'
          }
          fdp=Path('audit_registry/deep_read_findings_delta_hds_v22_2026-08-29.json')
          fdp.write_text(json.dumps(fd,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          rp=Path('audit_registry/finding_revalidation_registry_v0.1.json')
          r=json.loads(rp.read_text(encoding='utf-8'))
          r['explicit_revalidations_during_deep_read_pass_2']['HDS_V2.2']={
            'HDS-001':'context_verified_ok_with_note_runtime_profile_supported_RV-002_run_33266770833'
          }
          rp.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          report_p=Path('docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.2.md')
          report=report_p.read_text(encoding='utf-8')
          appendix='''\n## Historical V2.2 reconciliation after fresh-read freeze\n\nThe independent V2.2 source state was frozen in commit `da2c000e82640e321d0f5379a120be75dc7a3eb2` before formal V2.2 historical reconciliation.\n\nThe historical HDS profile record matches the independently derived V2.2 facts: canonical `_http._tcp`, TXT `content + url`, endpoint taken directly from TXT `url`, SRV port not used for content addressing, and SRV host identifying the publisher. This is a version-specific routing change, not a defect.\n\n### HDS-001 — V2.2 revalidation\n\nState: `context_verified_ok_with_note_runtime_profile_supported_RV-002_run_33266770833`.\n\nEvidence chain:\n\n- official byte-pinned V2.2 publication;\n- exact official `VDV-301-2.2` release inventory with no dedicated HDS service schema;\n- visible pinned-byte pages 7-11;\n- independent active-falsification checks for SRV host/port semantics and hidden-XSD inference;\n- deterministic RV-002 rerun `33266770833`.\n\nRV-002 confirms canonical V2.2 `_http._tcp`, TXT-url endpoint resolution, missing-url failure and HDS service-name checking. Its `_ibisip_http._tcp` transition acceptance is retained only as an explicit compatibility note derived from later V2.2a documentation; it does not rewrite the native V2.2 profile.\n\nNo live DNS/mDNS, HTTP reachability or browser/content-interoperability conclusion is claimed. No new V2.2 finding ID is opened.\n'''
          if '## Historical V2.2 reconciliation after fresh-read freeze' not in report:
            report_p.write_text(report.rstrip()+appendix+'\n',encoding='utf-8')

          hp=Path('docs/pdf_xsd_semantic_audit/HTML_DISPLAY_SERVICE_FINDINGS_REGISTER_ADDENDUM.md')
          txt=hp.read_text(encoding='utf-8')
          txt=txt.replace(
            'V2.1 has now also been independently re-read and HDS-001 revalidated under the current Evidence Gate; V2.2/V2.2a Deep Read revalidation remains pending.',
            'V2.1 and V2.2 have now also been independently re-read and HDS-001 revalidated under the current Evidence Gate; V2.2a Deep Read revalidation remains pending.'
          )
          txt=txt.replace(
            'State: closed OK with note historically; **V2.1 scope revalidated under the current Evidence Gate**. V2.2/V2.2a scopes remain pending their own Deep Reads.',
            'State: closed OK with note historically; **V2.1 and V2.2 scopes revalidated under the current Evidence Gate**. V2.2a scope remains pending its own Deep Read.'
          )
          extra='''\n## V2.2 Evidence-Gate revalidation\n\n```text\nsource pin: bf62b7a8b6cfdf654181b48da2d85a805118687c7463a46fadfd32679c9b7577 / 802399 bytes / run 33266549282\nvisible review: pages 7-11 / render-read run 33266588436\nfresh-read freeze: da2c000e82640e321d0f5379a120be75dc7a3eb2\nRV-002 rerun after freeze: 33266770833 PASS\n```\n\nResult for V2.2:\n\n```text\nHDS-001 -> context_verified_ok_with_note_runtime_profile_supported_RV-002\ncanonical protocol: _http._tcp\nTXT: content + url\ncontent endpoint: TXT url\nSRV port: no content-address meaning\nSRV host: publishing device\nNo dedicated HDS service XSD is expected.\nLater V2.2a _ibisip_http._tcp transition is compatibility context, not native V2.2 source wording.\n```\n'''
          if '## V2.2 Evidence-Gate revalidation' not in txt:
            txt=txt.rstrip()+extra+'\n'
          hp.write_text(txt,encoding='utf-8')

          vp=Path('docs/pdf_xsd_semantic_audit/validation_backlog.md')
          v=vp.read_text(encoding='utf-8')
          add='''\n## HTMLDisplayService V2.2 Deep Read evidence status\n\nThe official HDS V2.2 PDF is byte-pinned and independently re-derived from the exact source before V2.2 historical reconciliation. HDS remains a non-XSD DNS-SD/HTTP profile.\n\n```text\nPDF sha256: bf62b7a8b6cfdf654181b48da2d85a805118687c7463a46fadfd32679c9b7577\nPDF size: 802399\npin run: 33266549282\nrender/read run: 33266588436\npages visibly reviewed: 7-11\nRV-002 post-freeze rerun: 33266770833 PASS\n```\n\nV2.2 canonical profile is `_http._tcp` with TXT `content + url`; the content endpoint is the TXT `url`, while SRV port has no content-address meaning and host identifies the publisher. `HDS-001` is revalidated for V2.2 as `ok_with_note`. `_ibisip_http._tcp` remains a later V2.2a compatibility context, not a rewritten native V2.2 rule. Live network and HTTP/browser interoperability remain outside deterministic RV-002 evidence.\n\nNext Deep Read document: `HDS_V2.2a`.\n'''
          if '## HTMLDisplayService V2.2 Deep Read evidence status' not in v:
            vp.write_text(v.rstrip()+add+'\n',encoding='utf-8')

          handoff='''# Audit handoff delta — HTMLDisplayService V2.2 Deep Read\n\nDate: 2026-08-29\n\n## Permanent result\n\n- HDS V2.2 source independently pinned/read before formal V2.2 reconciliation.\n- PDF pin: `bf62b7a8b6cfdf654181b48da2d85a805118687c7463a46fadfd32679c9b7577`, 802399 bytes, run `33266549282`.\n- Render/read: run `33266588436`, pages 7-11 visibly reviewed.\n- Authority: non-XSD discovery/HTTP profile; no dedicated HDS XSD in official `VDV-301-2.2` tag.\n- Canonical V2.2: `_http._tcp`, TXT `content + url`, endpoint from TXT `url`; SRV port not used for content address, host identifies publisher.\n- HDS-001 revalidated V2.2 as OK with note.\n- RV-002 post-freeze run `33266770833` PASS.\n- No new V2.2 finding IDs and no XSD changes.\n- `_ibisip_http._tcp` is not back-written into native V2.2 authority; only later V2.2a compatibility context may permit it with note.\n\n## Next\n\n`HDS_V2.2a`: own byte pin, document-first read and visible review, then reconcile the protocol-label transition.\n'''
          Path('docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_HDS_V22_DEEP_READ_2026-08-29.md').write_text(handoff,encoding='utf-8')

          for p in [sp,dp,fdp,rp]: json.loads(p.read_text(encoding='utf-8'))
          assert s['audit']['next_natural_deep_read_document_id']=='HDS_V2.2a'
          PY
      - name: Commit exact HDS V2.2 closure and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          git add 00_START_HERE/CURRENT_STATE.json \
            audit_registry/deep_read_registry_delta_hds_v22_2026-08-29.json \
            audit_registry/deep_read_findings_delta_hds_v22_2026-08-29.json \
            audit_registry/finding_revalidation_registry_v0.1.json \
            docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.2.md \
            docs/pdf_xsd_semantic_audit/HTML_DISPLAY_SERVICE_FINDINGS_REGISTER_ADDENDUM.md \
            docs/pdf_xsd_semantic_audit/validation_backlog.md \
            docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_HDS_V22_DEEP_READ_2026-08-29.md
          git rm .github/workflows/temp-finalize-hds-v22-close.yml
          if git diff --cached --name-only | grep -E '\.xsd$'; then exit 1; fi
          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git commit -m 'Deep-read HTMLDisplayService V2.2 and revalidate HDS-001'
          git push origin HEAD:dev/schema-integration
