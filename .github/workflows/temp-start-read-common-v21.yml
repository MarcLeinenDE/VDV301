name: Temporary pin and render Common V2.1

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-start-read-common-v21.yml

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Pin extract render and verify authority
        run: python tools/temp_start_read_common_v21.py

      - name: Fail closed before evidence upload
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git status --porcelain | awk '{print $2}' | grep -E '\.xsd$'; then
            echo 'ERROR: XSD modification detected'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
              'audit_registry/pdf_source_pins_v0.1.json',
              'audit_registry/deep_read_registry_delta_common_v21_2026-08-31.json',
              '00_START_HERE/CURRENT_STATE.json',
              'audit-results/common-v21-pinned-read/manifest.json',
          ]:
              json.loads(Path(p).read_text(encoding='utf-8'))
              print('OK JSON', p)
          PY

      - name: Upload exact pinned read artifact
        uses: actions/upload-artifact@v4
        with:
          name: common-v21-pinned-read
          path: audit-results/common-v21-pinned-read/
          if-no-files-found: error

      - name: Commit source pin and start state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Marc Leinen'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git rm -f .github/workflows/temp-start-read-common-v21.yml
          git add -A
          if git diff --cached --name-only | grep -E '\.xsd$'; then
            echo 'ERROR: staged XSD modification detected'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Pin and start Common V2.1 deep read'
          git push origin HEAD:dev/schema-integration
