name: temp-merge-semantic-classification-drsms22-v22-001-002

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drsms22_v22_001_002.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drsms22-v22-001-002:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2
      - name: Verify exact prestate and evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          STAGED_BASE=1ab36330abcf542616ca2e4b10bdedf96dab27a7
          CLEAN_BASE=50ac4c1ff3e3c6e06f507a06b5b1f8682fb4d105
          test "$(git rev-parse HEAD^)" = "$STAGED_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drsms22_v22_001_002.yml"
          test "$(git hash-object audit_registry/semantic_classification_blocks/DRSMS22_V22_001_002_v0.1.json)" = "c5c1f3d7c52cfa4e4c8a45e01f32fda1d03e094e"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "675804710501400a90f8a7ffc376a2b00d33bcf0"
          test "$(git hash-object audit_registry/drsms22_revalidation_evidence_2026-09-06.json)" = "df753dd77cee29c832d1f8b44320c49297df6e6f"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRSMS22_2026-09-06.md)" = "c43b4312faeae51b736928696b6db64a23699e04"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/SMS_V2.2.md)" = "4eb220e43a728a0f719cdcf81fac78df058ecd08"
          test "$(git hash-object tools/validate_sms_v22_ev116.py)" = "bac849f6c33e6084e899794564f99f0c6cbd338a"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          target={'DRSMS22-001','DRSMS22-002'}
          reg=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert reg['progress']['classified_count']==116
          assert reg['progress']['remaining_count']==76
          assert reg['progress']['latest_block']=='DRS_V21_003_004'
          assert not ({e['finding_id'] for e in reg['entries']} & target)
          prov=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          states={e['finding_id']:e['revalidation_state'] for e in prov['inventory']['entries'] if e['finding_id'] in target}
          assert states=={'DRSMS22-001':'context_verified','DRSMS22-002':'context_verified'}, states
          ev=json.loads(Path('audit_registry/drsms22_revalidation_evidence_2026-09-06.json').read_text())
          assert ev['evidence_id']=='EV-146' and ev['result']=='PASS'
          assert ev['authority']['source_id']=='SMS_V2.2'
          assert ev['authority']['official_release_tag']=='VDV-301-2.2'
          assert ev['authority']['sms_xsd_blob']=='d8d3011965fcf7c5c15ecd6f0d7e917a3f9e6d3c'
          assert ev['authority']['common_v2_2_blob']=='468fee6d177e7185dbcd5d3f90cfb114e29e01ae'
          assert ev['authority']['enumerations_v2_2_blob']=='2a23b512379b18e8f122ac1272cef8229fb86283'
          assert ev['authority']['latest_xsd_wins'] is False
          assert ev['finding_results']['DRSMS22-001']['executable_effect'] is False
          assert ev['finding_results']['DRSMS22-002']['executable_effect'] is False
          block=json.loads(Path('audit_registry/semantic_classification_blocks/DRSMS22_V22_001_002_v0.1.json').read_text())
          assert block['block_id']=='DRSMS22_V22_001_002'
          assert [e['finding_id'] for e in block['entries']]==['DRSMS22-001','DRSMS22-002']
          for e in block['entries']:
              assert e['normative_authority']=='selected_xsd'
              assert e['version_scope'][0]['authority']=='official_release'
              assert e['sdk_behavior']=='no_runtime_diagnostic'
              assert e['runtime_match']['state']=='not_applicable'
          print('PASSED: exact DRSMS22-001/002 prestate and authority boundary')
          PY
          git diff --exit-code
      - name: Re-run exact SMS V2.2 authority and ServiceState guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_sms_v22_ev116.py | tee /tmp/ev116.log
          grep -F "PASSED: EV-116 official SMS V2.2 compile, naming boundary and generic-subscription structure evidence confirmed" /tmp/ev116.log
          python - <<'PY'
          from lxml import etree
          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          common=etree.parse('IBIS-IP_common_V2.2.xsd')
          nodes=common.xpath("//xs:complexType[@name='ServiceIdentificationWithStateStructure']", namespaces=NS)
          assert len(nodes)==1
          members=[]
          for el in nodes[0].xpath('.//xs:element', namespaces=NS):
              members.append(el.get('name') or el.get('ref') or '')
          assert any(x.endswith('ServiceIdentification') for x in members), members
          assert any(x.endswith('ServiceState') for x in members), members
          assert not any(x.endswith('DeviceState') for x in members), members
          print('PASSED: exact Common V2.2 ServiceIdentificationWithStateStructure uses ServiceIdentification + ServiceState and no DeviceState')
          PY
      - name: Merge two-finding block and validate registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRSMS22_V22_001_002_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRSMS22_V22_001_002; classified=118 remaining=74" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 118 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert r['progress']['classified_count']==118
          assert r['progress']['remaining_count']==74
          assert r['progress']['latest_block']=='DRSMS22_V22_001_002'
          assert r['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRSMS22_V22_001_002_v0.1.json'
          assert r['progress']['reviewed_blocks'][-1]=='DRSMS22_V22_001_002'
          ids={e['finding_id'] for e in r['entries']}
          assert {'DRSMS22-001','DRSMS22-002'} <= ids
          assert 'DRSMS22-003' not in ids and 'DRSMS22-004' not in ids
          print('PASSED: DRSMS22 part 1 poststate 118/192; DRSMS22-003/004 untouched')
          PY
      - name: Persist exact two-finding boundary
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=50ac4c1ff3e3c6e06f507a06b5b1f8682fb4d105
          git rm .github/workflows/temp_merge_semantic_classification_drsms22_v22_001_002.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'.github/workflows/temp_merge_semantic_classification_drsms22_v22_001_002.yml','audit_registry/finding_semantic_classification_v0.1.json'}
          assert staged==expected,(staged,expected)
          changed=set(subprocess.check_output(['git','diff','--name-only','50ac4c1ff3e3c6e06f507a06b5b1f8682fb4d105'],text=True).splitlines())
          expected_changed={'audit_registry/finding_semantic_classification_v0.1.json','audit_registry/semantic_classification_blocks/DRSMS22_V22_001_002_v0.1.json'}
          assert changed==expected_changed,(changed,expected_changed)
          print('PASSED: persistent boundary is master registry + DRSMS22-001/002 block only')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRSMS22-001 and DRSMS22-002 semantic classification"
          git push origin HEAD:dev/schema-integration
