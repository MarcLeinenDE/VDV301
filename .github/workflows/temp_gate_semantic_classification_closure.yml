name: temp-gate-semantic-classification-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_closure.yml

permissions:
  contents: read

jobs:
  gate-semantic-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact semantic-closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4496d465d23203acc09e91816a0bb9d8f089951d"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "746286de01103add0a3ae0fc19b17655a89b94a9"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "8ae19860bb8ede6cddc511f439a4715f1d097a71"
          test "$(git hash-object tools/validate_sdk_manifest_v0_1.py)" = "18f900b0b33fffd344402901e932c93944171339"

      - name: Simulate complete semantic registry and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          src=Path('audit_registry/finding_semantic_classification_v0.1.json')
          r=json.loads(src.read_text())
          assert r['state']=='in_progress'
          assert len(r['entries'])==192
          assert r['progress']['classified_count']==192
          assert r['progress']['remaining_count']==0
          assert all(e['review_state'] in {'manually_reviewed','sdk_ready'} for e in r['entries'])
          assert not any(e['runtime_match']['state']=='implemented' for e in r['entries'])

          r['state']='complete'
          Path('/tmp/finding_semantic_classification_complete.json').write_text(
              json.dumps(r,indent=2,ensure_ascii=False)+'\n',encoding='utf-8'
          )
          print('PASSED: simulated semantic registry transition in_progress -> complete')
          PY
          python tools/validate_finding_semantic_classification.py \
            --registry /tmp/finding_semantic_classification_complete.json

      - name: Verify readiness separation and planned SDK handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter

          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          s=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())

          assert s['audit']['finding_knowledge_ready'] is True
          assert s['audit']['finding_baseline_frozen'] is True
          assert s['audit']['remediation_authorized'] is False
          assert s['sdk']['finding_knowledge_ready'] is False
          assert s['project_phase']=='finding_baseline_frozen'

          runtime=Counter(e['runtime_match']['state'] for e in r['entries'])
          assert runtime==Counter({'not_applicable':110,'candidate':51,'reviewed':30,'not_designed':1})
          assert runtime.get('implemented',0)==0

          behavior=Counter(e['sdk_behavior'] for e in r['entries'])
          assert sum(behavior.values())==192
          assert behavior['error_with_advisory']==51
          assert behavior['unsupported_profile']==10

          planned_state=json.loads(json.dumps(s))
          planned_state['project_phase']='semantic_classification_complete_runtime_mapping_pending'
          planned_state['sdk']['status']='semantic_classification_complete_runtime_mapping_pending'
          planned_state['sdk']['finding_knowledge_ready']=True
          planned_state['sdk']['legacy_revalidation_requirement_satisfied']=True
          planned_state['sdk']['semantic_classification_state']='complete'
          planned_state['sdk']['semantic_classification_finding_count']=192
          planned_state['sdk']['runtime_mapping_state']='pending_review'
          planned_state['sdk']['runtime_mapping_implemented_count']=0
          assert planned_state['sdk']['runtime_mapping_implemented_count']==0

          planned_manifest=json.loads(json.dumps(m))
          planned_manifest['known_issues_knowledge']={
              'classification_state':'complete',
              'finding_count':192,
              'normative_xsd_override_allowed':False,
              'runtime_mapping_state':'pending_review',
              'runtime_mapping_implemented_count':0
          }
          assert planned_manifest['known_issues_knowledge']['normative_xsd_override_allowed'] is False
          print('PASSED: readiness/semantic/runtime layers remain separated')
          PY
          python tools/validate_sdk_manifest_v0_1.py

      - name: Validate all 50 root XSDs and prove read-only closure gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: semantic-classification closure gate complete; repository remains unmodified"
