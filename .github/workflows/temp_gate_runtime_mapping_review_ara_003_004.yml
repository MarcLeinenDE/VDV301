name: temp-gate-runtime-mapping-review-ara-003-004

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_ara_003_004.yml

permissions:
  contents: read

jobs:
  gate-ara-runtime-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact ARA runtime-review prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "582444f7bec02253f6b33c1329470c0979690254"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "7f466278c2f6dd8e7fea047a4af0a97595af2c95"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "dafa6f4657a913a6dfb4bde5dd1b3c7337d8eea0"
          test "$(git hash-object tools/generate_known_issues_runtime_mapping_v0_1.py)" = "4eea73f115beeb9333710640fbb28355d1e428fe"
          test "$(git hash-object tools/validate_known_issues_runtime_mapping_v0_1.py)" = "c73d32be4622197f9f3ee923b0d693c788bb7798"
          test "$(git hash-object sdk_manifest/runtime_mapping_review_blocks/ARA_003_004_v0.1.json)" = "1f61d053e1db2c2c6e44ff56d241b97bc35d99af"

      - name: Validate semantic and runtime-mapping registries
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py

      - name: Verify ARA review decisions and authority guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          semantic=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          mapping=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          block=json.loads(Path('sdk_manifest/runtime_mapping_review_blocks/ARA_003_004_v0.1.json').read_text())

          by={e['finding_id']:e for e in semantic['entries']}
          assert by['ARA-003']['runtime_match']['state']=='reviewed'
          assert by['ARA-004']['runtime_match']['state']=='reviewed'
          assert mapping['counts']=={
              'reviewed_mapping_count':32,
              'implemented_count':0,
              'semantic_candidate_count':49,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':110,
          }
          mapped={m['finding_id']:m for m in mapping['mappings']}
          assert mapped['ARA-003']['activation_class']=='informational'
          assert mapped['ARA-003']['required_precondition']=='informational_context_matched'
          assert mapped['ARA-003']['result_effect']=='emit_info'
          assert mapped['ARA-003']['implementation_state']=='reviewed_not_implemented'
          assert mapped['ARA-004']['activation_class']=='resolver_or_profile_warning'
          assert mapped['ARA-004']['required_precondition']=='resolver_context_matched'
          assert mapped['ARA-004']['result_effect']=='emit_warning'
          assert mapped['ARA-004']['implementation_state']=='reviewed_not_implemented'
          assert all(m['authority_guard']=='selected_xsd_result_remains_normative' for m in mapping['mappings'])
          assert not any(m['implementation_state']=='implemented' for m in mapping['mappings'])

          rb={e['finding_id']:e for e in block['entries']}
          assert rb['ARA-003']['authority_scope']=='candidate_integration_only'
          assert any('must not claim official V2.4 conformance' in g for g in rb['ARA-003']['guards'])
          assert any('exact literal match only' in g for g in rb['ARA-004']['guards'])
          assert any('must not register SendFFSKTelegram as an operation alias' in g for g in rb['ARA-004']['guards'])
          print('PASSED: ARA-003/004 runtime mapping review guards verified')
          PY

      - name: Validate SDK baseline and all 50 root XSDs
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_sdk_manifest_v0_1.py
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: ARA runtime-mapping review gate complete; repository remains unmodified"
