name: temp-merge-semantic-classification-drdms22

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drdms22.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drdms22:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify immutable prestate
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=06be154bc4281f2a420fcd0d5acf8b6892da61b5
          test "$(git rev-parse HEAD^)" = "$CLEAN_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drdms22.yml"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "4b4fdce078ed82777c01ec6b47118923bd8fb07f"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object tools/validate_dms_v22_deep_read_ev107.py)" = "6acd2dc75131455e220ae18ce5131eeb5ad44789"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md)" = "e8ebcd6ee2506caa3ea5e3ff0a825ec275f3f170"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_V22_2026-09-05.md)" = "26e20cdb15cb5001ab5930baab5956f568753fa1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/DMS_V2.2.md)" = "009243f56e8a81e9fdac82ff96d0fb714c7ba45b"
          test "$(git hash-object IBIS-IP_DeviceManagementService_V2.2.xsd)" = "c589e9f9d9b9a0f60309a275ec36b76b8c5d1f1d"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test ! -e audit_registry/semantic_classification_blocks/DRDMS22_v0.1.json
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count']==102
          assert r['progress']['remaining_count']==90
          assert r['progress']['latest_block']=='DRCOM24'
          assert r['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRCOM24_v0.1.json'
          ids={e['finding_id'] for e in r['entries']}
          target=['DRDMS22-001','DRDMS22-002','DRDMS22-003','DRDMS22-004']
          assert not (ids & set(target))
          p=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text(encoding='utf-8'))
          states={e['finding_id']:e['revalidation_state'] for e in p['inventory']['entries'] if e['finding_id'] in target}
          assert states=={
            'DRDMS22-001':'context_verified',
            'DRDMS22-002':'context_verified',
            'DRDMS22-003':'executable_confirmed',
            'DRDMS22-004':'context_verified'
          }, states
          print('PASSED: exact DRDMS22 prestate 102/192 and frozen terminal states confirmed')
          PY
          git diff --exit-code

      - name: Materialize exact DRDMS22 block
        shell: bash
        env:
          DRDMS22_BLOCK_ZLIB_B64: ""
        run: |
          set -euo pipefail
          mkdir -p audit_registry/semantic_classification_blocks
          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode(os.environ['DRDMS22_BLOCK_ZLIB_B64'], validate=True))
          Path('audit_registry/semantic_classification_blocks/DRDMS22_v0.1.json').write_bytes(data)
          PY
          test "$(sha256sum audit_registry/semantic_classification_blocks/DRDMS22_v0.1.json | awk '{print $1}')" = "157c3b9fe2ca37f53a6f7392e2c646a2d63fd46175f956d557bca6f417fde061"
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('audit_registry/semantic_classification_blocks/DRDMS22_v0.1.json').read_text(encoding='utf-8'))
          assert b['block_id']=='DRDMS22'
          assert [e['finding_id'] for e in b['entries']]==['DRDMS22-001','DRDMS22-002','DRDMS22-003','DRDMS22-004']
          e={x['finding_id']:x for x in b['entries']}
          assert e['DRDMS22-001']['sdk_behavior']=='no_runtime_diagnostic'
          assert e['DRDMS22-002']['sdk_behavior']=='no_runtime_diagnostic'
          assert e['DRDMS22-003']['primary_issue_kind']=='documentation_spelling'
          assert e['DRDMS22-003']['defect_assessment']=='cross_artifact_mismatch'
          assert e['DRDMS22-003']['sdk_behavior']=='error_with_advisory'
          assert any(s['type']=='technical_inference' and 'standard English spelling' in s['note'] for s in e['DRDMS22-003']['semantic_basis'])
          assert any(s['type']=='xsd_internal_consistency' for s in e['DRDMS22-003']['semantic_basis'])
          assert e['DRDMS22-004']['defect_assessment']=='confirmed_pdf_defect'
          assert any(s['type']=='parallel_operation_pattern' for s in e['DRDMS22-004']['semantic_basis'])
          print('PASSED: exact revised DRDMS22 block with orthography/naming safeguards')
          PY

      - name: Merge and validate DRDMS22 classification
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_dms_v22_deep_read_ev107.py | tee /tmp/ev107.log
          grep -F "PASS" /tmp/ev107.log
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRDMS22_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRDMS22; classified=106 remaining=86" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 106 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count']==106
          assert r['progress']['remaining_count']==86
          assert r['progress']['latest_block']=='DRDMS22'
          assert r['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRDMS22_v0.1.json'
          assert r['progress']['reviewed_blocks'][-1]=='DRDMS22'
          print('PASSED: DRDMS22 poststate exactly 106/192')
          PY

      - name: Verify final tree boundary and persist
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=06be154bc4281f2a420fcd0d5acf8b6892da61b5
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md)" = "e8ebcd6ee2506caa3ea5e3ff0a825ec275f3f170"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object IBIS-IP_DeviceManagementService_V2.2.xsd)" = "c589e9f9d9b9a0f60309a275ec36b76b8c5d1f1d"
          git rm .github/workflows/temp_merge_semantic_classification_drdms22.yml
          git add audit_registry/finding_semantic_classification_v0.1.json audit_registry/semantic_classification_blocks/DRDMS22_v0.1.json
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          expected={
            '.github/workflows/temp_merge_semantic_classification_drdms22.yml',
            'audit_registry/finding_semantic_classification_v0.1.json',
            'audit_registry/semantic_classification_blocks/DRDMS22_v0.1.json'
          }
          assert staged==expected, (staged, expected)
          final_changed=set(subprocess.check_output(['git','diff','--name-only','06be154bc4281f2a420fcd0d5acf8b6892da61b5'], text=True).splitlines())
          assert final_changed=={
            'audit_registry/finding_semantic_classification_v0.1.json',
            'audit_registry/semantic_classification_blocks/DRDMS22_v0.1.json'
          }, final_changed
          print('PASSED: persistent DRDMS22 boundary is registry + block only')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRDMS22 semantic classification"
          git push origin HEAD:dev/schema-integration
