name: temp-merge-semantic-classification-drtime10-v10-003

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drtime10_v10_003.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drtime10-v10-003:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2
      - name: Verify exact prestate and editorial boundary
        shell: bash
        run: |
          set -euo pipefail
          STAGED_BASE=b762a9d9c3c3015a7b1163d7261873365aa81ace
          CLEAN_BASE=51bb7112aab67ad27e1666beb4aff12ad5c10239
          test "$(git rev-parse HEAD^)" = "$STAGED_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drtime10_v10_003.yml"
          test "$(git hash-object audit_registry/semantic_classification_blocks/DRTIME10_V10_003_v0.1.json)" = "5e5a48d21bd30d7fbdf34dbd032fb22bd3f82eb1"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "714da9115e1b5812f23597e0402c70ddd13cb352"
          test "$(git hash-object audit_registry/drtime10_revalidation_evidence_2026-09-06.json)" = "649c5b035e6fcc4f201555b467a1500ef06e09e7"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTIME10_2026-09-06.md)" = "c780c853404c117b1cc36437ec87a6aee10a44d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TIME_V1.0.md)" = "82a88fbd6dae5d22f472bf144770d915fcc902ea"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert reg['progress']['classified_count']==122
          assert reg['progress']['remaining_count']==70
          assert reg['progress']['latest_block']=='DRTIME10_V10_001_002'
          assert reg['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRTIME10_V10_001_002_v0.1.json'
          assert 'DRTIME10-003' not in {e['finding_id'] for e in reg['entries']}
          prov=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          state={e['finding_id']:e['revalidation_state'] for e in prov['inventory']['entries'] if e['finding_id']=='DRTIME10-003'}
          assert state=={'DRTIME10-003':'context_verified'}, state
          ev=json.loads(Path('audit_registry/drtime10_revalidation_evidence_2026-09-06.json').read_text())
          assert ev['evidence_id']=='EV-147' and ev['result']=='PASS'
          assert ev['authority']['semantic_authority_lane']=='PDF/API/prose'
          assert ev['authority']['time_service_xsd_authority'] is False
          assert ev['finding_results']['DRTIME10-003']['executable_effect'] is False
          assert ev['finding_results']['DRTIME10-003']['intended_replacement_text'] is None
          block=json.loads(Path('audit_registry/semantic_classification_blocks/DRTIME10_V10_003_v0.1.json').read_text())
          assert block['block_id']=='DRTIME10_V10_003'
          assert [e['finding_id'] for e in block['entries']]==['DRTIME10-003']
          e=block['entries'][0]
          assert e['version_scope'][0]['authority']=='documentation_only'
          assert e['version_scope'][0]['xsd_profile'] is None
          assert e['normative_authority']=='contextual_only'
          assert e['primary_issue_kind']=='editorial_residue'
          assert e['sdk_behavior']=='no_runtime_diagnostic'
          assert e['runtime_match']['state']=='not_applicable'
          print('PASSED: exact DRTIME10-003 prestate and editorial non-XSD boundary')
          PY
          git diff --exit-code
      - name: Merge one-finding block and validate registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRTIME10_V10_003_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRTIME10_V10_003; classified=123 remaining=69" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 123 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert r['progress']['classified_count']==123
          assert r['progress']['remaining_count']==69
          assert r['progress']['latest_block']=='DRTIME10_V10_003'
          assert r['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRTIME10_V10_003_v0.1.json'
          assert 'DRTIME10-003' in {e['finding_id'] for e in r['entries']}
          print('PASSED: DRTIME10 complete at 123/192')
          PY
      - name: Persist exact one-finding boundary
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=51bb7112aab67ad27e1666beb4aff12ad5c10239
          git rm .github/workflows/temp_merge_semantic_classification_drtime10_v10_003.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'.github/workflows/temp_merge_semantic_classification_drtime10_v10_003.yml','audit_registry/finding_semantic_classification_v0.1.json'}
          assert staged==expected,(staged,expected)
          changed=set(subprocess.check_output(['git','diff','--name-only','51bb7112aab67ad27e1666beb4aff12ad5c10239'],text=True).splitlines())
          expected_changed={'audit_registry/finding_semantic_classification_v0.1.json','audit_registry/semantic_classification_blocks/DRTIME10_V10_003_v0.1.json'}
          assert changed==expected_changed,(changed,expected_changed)
          print('PASSED: persistent boundary is master registry + DRTIME10-003 block only')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRTIME10-003 semantic classification"
          git push origin HEAD:dev/schema-integration
