name: temp-tvs-v22-ev113

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: read

jobs:
  ev113:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check lxml
      - name: Run EV-113
        run: python tools/validate_tvs_v22_ev113.py
