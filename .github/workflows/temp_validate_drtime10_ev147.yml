name: Temp validate DRTIME10 EV-147

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_validate_drtime10_ev147.yml
      - tools/validate_drtime10_revalidation_ev147.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Snapshot root XSD hashes
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256

      - name: Fetch exact byte-pinned TIME V1.0 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          sid='TIME_V1.0'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==sid)
          pin=next(x for x in pins['sources'] if x['source_id']==sid)
          assert source['official_url']=='https://www.vdv.de/301-2-10sds-v-1-01.pdfx'
          assert source['local_filename']=='TIME_V1.0.pdf'
          assert pin['expected_sha256']=='d040f503be8e82f5500220ba5cc9b0b41a2fa10db80d9f3980eed191378594d3'
          assert int(pin['expected_size_bytes'])==515920
          assert str(pin['evidence_run_id'])=='33196758957'
          for attempt in range(4):
              try:
                  req=urllib.request.Request(source['official_url'],headers={
                      'User-Agent':'VDV301-Audit-EV147/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                      'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(2*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          if sha != pin['expected_sha256'] or len(data) != int(pin['expected_size_bytes']):
              raise AssertionError(
                  f'OFFICIAL_SOURCE_BYTES_CHANGED current_sha={sha} current_size={len(data)} '
                  f'pinned_sha={pin["expected_sha256"]} pinned_size={pin["expected_size_bytes"]} '
                  f'original_pin_run={pin["evidence_run_id"]}')
          assert data.startswith(b'%PDF-')
          target=Path('local_sources/vdv_pdfs')/source['local_filename']
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {sid} sha256={sha} size={len(data)}')
          PY

      - name: Run EV-147 on PDF/API/prose authority lane
        run: python tools/validate_drtime10_revalidation_ev147.py --repo-root . --output-dir artifacts/ev147

      - name: Run complete XSD pool as repository regression guard only
        run: python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Verify immutable boundaries and authority separation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:docs/pdf_xsd_semantic_audit/deep_read/TIME_V1.0.md)" = "82a88fbd6dae5d22f472bf144770d915fcc902ea"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          test -z "$(git diff --name-only | grep -E '\.xsd$' || true)"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/ev147/ev147_results.json').read_text())
          scope=['DRTIME10-001','DRTIME10-002','DRTIME10-003']
          assert r['evidence_id']=='EV-147' and r['result']=='PASS'
          assert r['scope']==scope
          assert r['recommended_terminal_states']=={fid:'context_verified' for fid in scope}
          assert r['semantic_authority_lane']=='PDF/API/prose'
          assert r['time_service_xsd_authority'] is False
          assert r['xsd_pool_role']=='repository-regression-only'
          assert r['authority']['pdf_sha256']=='d040f503be8e82f5500220ba5cc9b0b41a2fa10db80d9f3980eed191378594d3'
          assert r['authority']['pdf_size_bytes']==515920
          assert r['authority']['deep_read_blob']=='82a88fbd6dae5d22f472bf144770d915fcc902ea'
          assert r['rederived_invariants']['cyclic_time_broadcast_expected'] is False
          assert r['visual_gap_closure_targets']==[3,6]
          assert r['xsd_mutated'] is False and r['frozen_inventory_mutated'] is False
          print('EV-147 immutable-boundary and authority-separation verification PASS')
          PY

      - name: Upload EV-147 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drtime10-ev147
          path: artifacts/ev147
          if-no-files-found: error
          retention-days: 90
