name: temp-validate-vrs-ev166
# validator-revision: 22ef7a87e5ae6395b7a15a96750a9eb116472bbb

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_validate_vrs_ev166.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  vrs-ev166:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check lxml==6.1.2

      - name: Snapshot immutable XSD pool
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/vrs-xsd-before.sha256
          git diff --exit-code

      - name: Verify official V2.0, historical V1.0, and candidate V2.4 authority
        shell: bash
        run: |
          set -euo pipefail
          git remote remove audit-upstream 2>/dev/null || true
          git remote add audit-upstream https://github.com/VDVde/VDV301.git
          git fetch --no-tags audit-upstream refs/tags/VDV-301-2.0
          test "$(git rev-parse FETCH_HEAD^{commit})" = "f2569a91f0a7c737a0ca7c0280b28ad223d7ee08"
          test "$(git rev-parse FETCH_HEAD:IBIS-IP_VideoRecordingService_V2.0.xsd)" = "6ef0dae64ce6f4d3aa4f652d6d166896e71aaac7"
          test "$(git rev-parse FETCH_HEAD:IBIS-IP_common_V2.0.xsd)" = "8608e3dcd665c197c34da7f6ec6af5a3758da164"
          test "$(git rev-parse FETCH_HEAD:IBIS-IP_Enumerations_V2.0.xsd)" = "27e3c183b00381d959622d13c10543123af8eef6"
          git fetch --no-tags audit-upstream refs/tags/VDV-301-1.0
          test "$(git rev-parse FETCH_HEAD^{commit})" = "f5b53785f703e898632603eec3bfa3555a79fdba"
          ! git ls-tree -r --name-only FETCH_HEAD | grep -Eq '(^|/)IBIS-IP_VideoRecordingService_V1\.0\.xsd$'
          ! git show FETCH_HEAD:IBIS_IP_V1.0.xsd | grep -q 'VideoRecordingService'
          git fetch --no-tags audit-upstream refs/pull/27/head
          test "$(git rev-parse FETCH_HEAD^{commit})" = "0aa728aab47a7f13b6f36da415581d51592c4ca7"
          test "$(git rev-parse FETCH_HEAD:IBIS-IP_VideoRecordingService_V2.4.xsd)" = "07ff2c41731e63fd85b203e4b8e0186136caaaaf"
          test "$(git hash-object IBIS-IP_VideoRecordingService_V2.4.xsd)" = "07ff2c41731e63fd85b203e4b8e0186136caaaaf"

      - name: Verify PR 27 remains candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/VDVde/VDV301/pulls/27 --jq .state)" = "open"
          test "$(gh api repos/VDVde/VDV301/pulls/27 --jq .merged)" = "false"
          test "$(gh api repos/VDVde/VDV301/pulls/27 --jq .draft)" = "false"
          test "$(gh api repos/VDVde/VDV301/pulls/27 --jq .head.sha)" = "0aa728aab47a7f13b6f36da415581d51592c4ca7"

      - name: Reacquire exact official VRS PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence_sources evidence_out
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "https://www.vdv.de/301-2-12-sds.pdfx" -o evidence_sources/VRS_V1.0.pdf
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "https://www.vdv.de/301-2-12-sdes-v2-0-video-recording-service.pdfx" -o evidence_sources/VRS_V2.0.pdf
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "https://www.vdv.de/301-2-12-sdg-v2.4-videorecordingservice.pdfx" -o evidence_sources/VRS_V2.4.pdf
          test "$(stat -c '%s' evidence_sources/VRS_V1.0.pdf)" = "1227302"
          test "$(sha256sum evidence_sources/VRS_V1.0.pdf | awk '{print $1}')" = "29d0bcb270fdab2119c4653296d4bca01e0f8b127eb9aaf393f66b2b34dcd390"
          test "$(stat -c '%s' evidence_sources/VRS_V2.0.pdf)" = "941841"
          test "$(sha256sum evidence_sources/VRS_V2.0.pdf | awk '{print $1}')" = "fbe9e68e72de4e5450f562aa6a6117283a94f87a28bded0e05458670527b6c5f"
          test "$(stat -c '%s' evidence_sources/VRS_V2.4.pdf)" = "1036423"
          test "$(sha256sum evidence_sources/VRS_V2.4.pdf | awk '{print $1}')" = "d1a3cf36b4a9719ff8d233a84ade34ed7ff9c3dccb58f8a8688727d82a568a7b"

      - name: Verify pinned visual evidence and EV-103 metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33204547867" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9699101854" --jq .digest)" = "sha256:09c32d7cc15f03deeb27a747268da8120e40e79da5cc5e343d2d682c6c6d1670"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33206290291" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9699785995" --jq .digest)" = "sha256:c37754790fe9e62c64a245593b258465d167ee6b76353010399af49e9462cbae"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33207026201" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9700060119" --jq .digest)" = "sha256:a81fa9b51ae3cc63fc00548e55308551754b6d17bb81c49d7272dcc24a277593"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33111119723" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9662552176" --jq .digest)" = "sha256:b97d2e4506ffd63b8ff7985765131826d409e32769fb3a08193084134ca00ec0"

      - name: Rerun EV-103 compositor evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_video_v20_compositors.py | tee evidence_out/ev103-rerun.log
          grep -Fq "PASSED: EV-103 video compositor behaviour confirmed" evidence_out/ev103-rerun.log

      - name: Run EV-166 final VRS gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_vrs_revalidation_ev166.py \
            --vrs-v10-pdf evidence_sources/VRS_V1.0.pdf \
            --vrs-v20-pdf evidence_sources/VRS_V2.0.pdf \
            --vrs-v24-pdf evidence_sources/VRS_V2.4.pdf \
            --output evidence_out/vrs_ev166_evidence.json \
            | tee evidence_out/ev166.log
          grep -Fq "PASSED: EV-166 VRS final-block aggregate gate" evidence_out/ev166.log

      - name: Run complete 50-root-XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py | tee evidence_out/xsd-pool.log
          grep -Fq "PASSED" evidence_out/xsd-pool.log
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50

      - name: Enforce immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort -k2 > /tmp/vrs-xsd-after.sha256
          cmp /tmp/vrs-xsd-before.sha256 /tmp/vrs-xsd-after.sha256
          git diff --exit-code -- \
            audit_registry/finding_inventory_frozen_2026-09-03.json \
            audit_registry/finding_revalidation_registry_v0.1.json \
            00_START_HERE/CURRENT_STATE.json \
            audit_registry/pdf_source_registry_v0.1.json \
            audit_registry/pdf_source_pins_v0.1.json \
            '*.xsd'
          {
            echo "canonical_head=${GITHUB_SHA}"
            echo "root_xsd_count=50"
            echo "xsd_mutation=false"
            echo "frozen_inventory_mutation=false"
            echo "registry_mutation=false"
            echo "current_state_mutation=false"
          } > evidence_out/immutability.txt

      - name: Upload EV-166 evidence
        uses: actions/upload-artifact@v4
        with:
          name: vrs-ev166-evidence
          path: evidence_out/
          if-no-files-found: error
          retention-days: 90
