name: temp-merge-semantic-classification-dms

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_dms.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-dms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify immutable prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "14da3c2f84a490fdd65973e9a7d2a000e4721fb7"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_dms.yml"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "03fa7b13120469b8971d2948f47ef8cf47464f9f"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_2026-09-03.md)" = "252d44de861614bfc3654441c94b0e9704045dbb"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/DEVICE_MANAGEMENT_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "c77e703eef0b34ff1a262e531cf641c8c639e0a5"
          test "$(git hash-object audit_registry/dms_visual_revalidation_evidence_2026-09-03.json)" = "d7748ed81015f2224155138f89cf259fd6973690"
          test "$(git hash-object audit_registry/deep_read_findings_delta_dms_v22_2026-08-28.json)" = "e350612884c8c22ca7fc0e4839a03ac924abc076"
          test "$(git hash-object audit_registry/deep_read_findings_delta_dms_v24_2026-08-28.json)" = "3e07eec98384744b113cb25c37916c67ac23cc6f"
          test "$(git hash-object tools/validate_dms_instance_boundaries_ev127.py)" = "4afb5a605ef359f96eefab72f6e21a24383441c9"
          test ! -e audit_registry/semantic_classification_blocks/DMS_v0.1.json
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("audit_registry/finding_semantic_classification_v0.1.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          assert r["progress"]["classified_count"] == 54
          assert r["progress"]["remaining_count"] == 138
          assert r["progress"]["reviewed_blocks"] == ["ARA", "ARCH", "BG", "CE", "CIS", "DISC"]
          assert r["progress"]["latest_block"] == "DISC"
          assert r["progress"]["latest_block_file"] == "audit_registry/semantic_classification_blocks/DISC_v0.1.json"
          ids = {e["finding_id"] for e in r["entries"]}
          assert not any(f"DMS-{n:03d}" in ids for n in range(1, 8))
          print("PASSED: DMS semantic prestate is exactly 54/192")
          PY
          git diff --exit-code

      - name: Materialize DMS block
        shell: bash
        env:
          DMS_BLOCK_ZLIB_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          raw = zlib.decompress(base64.b64decode(os.environ["DMS_BLOCK_ZLIB_B64"]))
          assert hashlib.sha256(raw).hexdigest() == "e71fa5d0eabe2fb761543bd91bfa09d45aa95bd8f34841edbd192933e45516a0"
          block = json.loads(raw.decode("utf-8"))
          assert block["block_id"] == "DMS"
          assert block["source_baseline_payload_sha256"] == "d5bf14df302d57a0fc3d71792e1cb00583fafd3e9c7efd19721fd0de353dd576"
          assert [e["finding_id"] for e in block["entries"]] == [f"DMS-{n:03d}" for n in range(1, 8)]
          out = Path("audit_registry/semantic_classification_blocks/DMS_v0.1.json")
          out.write_bytes(raw)
          print("PASSED: materialized DMS block sha256=e71fa5d0eabe2fb761543bd91bfa09d45aa95bd8f34841edbd192933e45516a0")
          PY

      - name: Merge and validate DMS classification
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DMS_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DMS; classified=61 remaining=131" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 61 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_dms_instance_boundaries_ev127.py
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Verify poststate and mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_2026-09-03.md)" = "252d44de861614bfc3654441c94b0e9704045dbb"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/DEVICE_MANAGEMENT_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "c77e703eef0b34ff1a262e531cf641c8c639e0a5"
          test "$(git hash-object audit_registry/dms_visual_revalidation_evidence_2026-09-03.json)" = "d7748ed81015f2224155138f89cf259fd6973690"
          test "$(git hash-object audit_registry/deep_read_findings_delta_dms_v22_2026-08-28.json)" = "e350612884c8c22ca7fc0e4839a03ac924abc076"
          test "$(git hash-object audit_registry/deep_read_findings_delta_dms_v24_2026-08-28.json)" = "3e07eec98384744b113cb25c37916c67ac23cc6f"
          test "$(git hash-object tools/validate_dms_instance_boundaries_ev127.py)" = "4afb5a605ef359f96eefab72f6e21a24383441c9"
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("audit_registry/finding_semantic_classification_v0.1.json").read_text(encoding="utf-8"))
          assert r["progress"]["classified_count"] == 61
          assert r["progress"]["remaining_count"] == 131
          assert r["progress"]["reviewed_blocks"] == ["ARA", "ARCH", "BG", "CE", "CIS", "DISC", "DMS"]
          assert r["progress"]["latest_block"] == "DMS"
          assert r["progress"]["latest_block_file"] == "audit_registry/semantic_classification_blocks/DMS_v0.1.json"
          dms = [e for e in r["entries"] if e["finding_id"].startswith("DMS-")]
          assert [e["finding_id"] for e in dms] == [f"DMS-{n:03d}" for n in range(1, 8)]
          print("PASSED: DMS semantic poststate is exactly 61/192")
          PY
          git add audit_registry/semantic_classification_blocks/DMS_v0.1.json audit_registry/finding_semantic_classification_v0.1.json
          python - <<'PY'
          import subprocess
          names = subprocess.check_output(["git","diff","--cached","--name-only"], text=True).splitlines()
          assert names == [
              "audit_registry/finding_semantic_classification_v0.1.json",
              "audit_registry/semantic_classification_blocks/DMS_v0.1.json",
          ], names
          print("PASSED: staged mutation boundary contains only DMS block and semantic registry")
          PY

      - name: Commit validated DMS classification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DMS semantic classification"
          git push origin HEAD:dev/schema-integration
