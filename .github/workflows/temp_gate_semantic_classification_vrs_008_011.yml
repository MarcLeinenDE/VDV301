name: temp-gate-semantic-classification-vrs-008-011

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_vrs_008_011.yml

permissions:
  contents: read

jobs:
  gate-vrs-008-011:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact final-block prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "07c0393d3cde90ca041e350538720b018975079c"
          test "$(git hash-object audit_registry/semantic_classification_blocks/VRS_V10_V24_008_011_v0.1.json)" = "e402c48ca89046986f56858109b35c18e8379e5a"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "ccd3a089e3ef94f5e6a713fb9c2926a3ff626657"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VRS_2026-09-14.md)" = "21fe2f2d615e5d48b82213c8519ded5978d68750"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/VIDEO_RECORDING_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "d9392d85a855717ac8041f9d34b127160244f946"

      - name: Verify frozen states and final VRS semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/VRS_V10_V24_008_011_v0.1.json').read_text())

          assert registry['progress']['classified_count']==188
          assert registry['progress']['remaining_count']==4
          assert registry['progress']['latest_block']=='VRS_V10_V24_004_007'
          assert [e['finding_id'] for e in block['entries']]==['VRS-008','VRS-009','VRS-010','VRS-011']

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          for fid in ('VRS-008','VRS-009','VRS-010','VRS-011'):
              assert frozen[fid]['revalidation_state']=='context_verified'
              assert frozen[fid]['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VRS_2026-09-14.md'

          by={e['finding_id']:e for e in block['entries']}
          assert by['VRS-008']['primary_issue_kind']=='wrong_operation_reference'
          assert by['VRS-009']['primary_issue_kind']=='version_routing_issue'
          assert by['VRS-010']['primary_issue_kind']=='wrong_structure_reference'
          assert by['VRS-011']['primary_issue_kind']=='semantic_contradiction'
          for fid in by:
              assert by[fid]['defect_assessment']=='confirmed_pdf_defect'
              assert by[fid]['runtime_match']['state']=='not_applicable'

          addendum=Path('docs/pdf_xsd_semantic_audit/VIDEO_RECORDING_SERVICE_FINDINGS_REGISTER_ADDENDUM.md').read_text()
          for token in (
              'VRS-008 - StopRecording prose says StopRecordingERM',
              'VRS-009 - neighboring video-service',
              'VRS-010 - Pause request table caption describes wrong role/name',
              'VRS-011 - V2.4 VideoRecordingStateStructure table describes itself as Pause request data'
          ):
              assert token in addendum
          print('PASSED: final VRS semantic evidence verified')
          PY

      - name: Simulate final merge and validate registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py \
            --block audit_registry/semantic_classification_blocks/VRS_V10_V24_008_011_v0.1.json \
            --output /tmp/final-semantic-registry.json
          python tools/validate_finding_semantic_classification.py \
            --registry /tmp/final-semantic-registry.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/final-semantic-registry.json',encoding='utf-8'))
          assert r['progress']['classified_count']==192
          assert r['progress']['remaining_count']==0
          assert r['progress']['latest_block']=='VRS_V10_V24_008_011'
          assert len(r['entries'])==192
          print('PASSED: simulated semantic registry is exactly 192/192')
          PY

      - name: Validate all 50 root XSDs and prove read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: final VRS semantic gate complete; repository remains unmodified"
