name: temp-freeze-finding-baseline-ev168

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_freeze_finding_baseline_ev168.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  freeze-baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check lxml==6.1.2

      - name: Verify exact freeze inputs and snapshot immutable XSDs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/freeze_finding_provenance_baseline.py)" = "4c0a9960fa4630a09d57dc74ed1478cec67c659e"
          test "$(git hash-object tools/validate_finding_baseline_ev168.py)" = "dddc6d0ef605b7725a85b8b54bd7b1d8995325a8"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "d5a645bb9c1498cbca55796d16d2ee71c80ebb37"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "ccc7efa9d1a12578295dcab7b19a18e3ef3e8e94"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "bc60527ddc158d967470a63d38ffd035e5ec1400"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/ev168-freeze-xsd-before.sha256
          git diff --exit-code

      - name: Verify successful EV-168 evidence online
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34844500027 --jq .conclusion)" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/jobs/103977033739 --jq .conclusion)" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10347158213 --jq .digest)" = "sha256:cf92dcd1e0ca3ca24efc7d8327e3a9ce10d6fc1fc1e2342c0a56ac6ecf36a608"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34844500027 --jq .head_sha)" = "f0eab8251939ef69c921e721fa5d8db1c049055e"

      - name: Rerun EV-168 and complete 50-root-XSD pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence_out
          python tools/validate_finding_baseline_ev168.py \
            --output evidence_out/ev168_finding_baseline.json \
            | tee evidence_out/ev168.log
          grep -Fq "FINDING_ENTRIES_SHA256=411519c4aaaeb370dfa336d729988d37007a78dfaf5bc6d5fcfb1dfa3f49f792" evidence_out/ev168.log
          grep -Fq "AUTHORITY_SNAPSHOT_SHA256=1f4d5b9468668c7b1839585b710fc63ad6a5ef6196f14afbe58c36377c809e95" evidence_out/ev168.log
          grep -Fq "XSD_MANIFEST_SHA256=081cff20627157441c6fb6da11f4026906080e7dd44479e45c8bbcc1ef3dcb26" evidence_out/ev168.log
          grep -Fq "PASSED: EV-168 finding/provenance baseline pre-freeze gate" evidence_out/ev168.log
          python tools/validate_xsd_pool.py | tee evidence_out/xsd_pool.log
          grep -Fq "PASSED" evidence_out/xsd_pool.log

      - name: Prepare finding provenance baseline freeze
        shell: bash
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}
          CLOSURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/freeze_finding_provenance_baseline.py | tee evidence_out/freeze.log
          grep -Fq "PASSED: finding/provenance baseline freeze prepared" evidence_out/freeze.log

      - name: Enforce exact four-path mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence_out
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            '00_START_HERE/CURRENT_STATE.json'
            'audit_registry/finding_provenance_baseline_2026-09-14.json'
            'audit_registry/finding_revalidation_registry_v0.1.json'
            'docs/pdf_xsd_semantic_audit/FINDING_PROVENANCE_BASELINE_FREEZE_2026-09-14.md'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          git diff --check
          if git status --porcelain | grep -E '\.xsd$'; then
            echo 'XSD mutation detected' >&2
            exit 1
          fi

      - name: Verify exact frozen poststate and immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort -k2 > /tmp/ev168-freeze-xsd-after.sha256
          cmp /tmp/ev168-freeze-xsd-before.sha256 /tmp/ev168-freeze-xsd-after.sha256
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "bc60527ddc158d967470a63d38ffd035e5ec1400"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          state=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          base=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          embedded=base.pop('baseline_payload_sha256')
          canonical=json.dumps(base,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(canonical).hexdigest()==embedded
          assert base['inventory']['count']==192
          assert base['inventory']['terminal']==192
          assert base['inventory']['pending']==0
          assert base['inventory']['unresolved']==0
          assert base['inventory']['finding_entries_sha256']=='411519c4aaaeb370dfa336d729988d37007a78dfaf5bc6d5fcfb1dfa3f49f792'
          assert base['authority']['snapshot_sha256']=='1f4d5b9468668c7b1839585b710fc63ad6a5ef6196f14afbe58c36377c809e95'
          assert base['xsd_pool']['manifest_sha256']=='081cff20627157441c6fb6da11f4026906080e7dd44479e45c8bbcc1ef3dcb26'
          assert reg['state']=='finding_provenance_baseline_frozen'
          assert reg['sdk_readiness']['finding_knowledge_ready'] is True
          assert reg['sdk_readiness']['finding_baseline_frozen'] is True
          assert reg['remediation_readiness']['ready'] is False
          assert state['project_phase']=='finding_baseline_frozen'
          assert state['audit']['finding_baseline_frozen'] is True
          assert state['audit']['audit_knowledge_phase_complete'] is True
          assert state['audit']['remediation_authorized'] is False
          print('FROZEN_POSTSTATE_OK')
          PY

      - name: Commit and push finding provenance baseline freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            00_START_HERE/CURRENT_STATE.json \
            audit_registry/finding_provenance_baseline_2026-09-14.json \
            audit_registry/finding_revalidation_registry_v0.1.json \
            docs/pdf_xsd_semantic_audit/FINDING_PROVENANCE_BASELINE_FREEZE_2026-09-14.md
          git diff --cached --check
          git commit -m 'audit: freeze finding provenance baseline'
          git push origin HEAD:dev/schema-integration
