name: TEMP validate TSM EV-162

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_validate_tsm_ev162.yml

permissions:
  contents: read
  actions: read

jobs:
  validate-tsm-ev162:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical audit branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils unzip
          python -m pip install --disable-pip-version-check lxml

      - name: Assert exact post-TSI pre-TSM state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "84f4b647c2910c27550bdd8f62d7c072d56714ba"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "efa00ed4ffc2fad76f50b000377ef1f8def0d486"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md)" = "969cce8b14b50ded2ca5eb745674b894428ecf1a"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/TRAIN_SET_SERVICES_FINDINGS_REGISTER_ADDENDUM.md)" = "8b1ac3db4c3603d04cca9001c82d7f4de6b5459e"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.1.md)" = "6d5680f438e7e592aaf1d056e39224e7c2a3f2d9"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.2.md)" = "61850045c26fb2a848c4670f1418fdb809ab475c"
          test "$(git hash-object tools/validate_tsm_revalidation_ev162.py)" = "141ac346548cee5f00dee34b356df5262e098178"
          test "$(git hash-object tools/validate_trainset_v21_ev109.py)" = "f88208bff7e39bb38a86a310dc121f486984f807"
          test "$(git hash-object tools/validate_trainset_ev104.py)" = "0d7bc30b56dd3e61771e0ac0ddd7c9f06a6b0d31"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object IBIS-IP_TrainSetManagementService_V2.1.xsd)" = "add9d1cb37e5759ff7a77855b239108d38373206"
          test "$(git hash-object IBIS-IP_TrainSetManagementService_V2.2.xsd)" = "da9465d6683e3f7d54a546ab4a13739fb3c3e902"
          test "$(git hash-object IBIS-IP_TrainSetInformationService_V2.2.xsd)" = "7ab1f8f892bfcea2a8b8a055f07de92c143356f9"

      - name: Verify reused exact TrainSet source artifact online
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900 > /tmp/source-run.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900/jobs > /tmp/source-jobs.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900/artifacts > /tmp/source-artifacts.json
          python - <<'PY'
          import json
          run=json.load(open('/tmp/source-run.json'))
          jobs=json.load(open('/tmp/source-jobs.json'))['jobs']
          arts=json.load(open('/tmp/source-artifacts.json'))['artifacts']
          assert run['conclusion']=='success'
          assert run['head_sha']=='20785d8ee41e812a5902d49b6d4b800ef238e311'
          j=[x for x in jobs if x['id']==103888867262]
          assert len(j)==1 and j[0]['conclusion']=='success'
          a=[x for x in arts if x['id']==10336466475]
          assert len(a)==1 and a[0]['name']=='tsd-ev160-source'
          assert a[0]['digest']=='sha256:30089b9d4f2c86dd57f8bb184844a428ee08e91b0d327517c84f6689ea231bfb'
          assert a[0]['expired'] is False
          print('OK exact TrainSet source artifact reusable for TSM')
          PY
          rm -rf /tmp/tsm-source
          mkdir -p /tmp/tsm-source
          gh run download 34816735900 --repo MarcLeinenDE/VDV301 --name tsd-ev160-source --dir /tmp/tsm-source
          test -f /tmp/tsm-source/manifest.json
          test -f /tmp/tsm-source/pdfs/TRAINSET_V2.1.pdf
          test -f /tmp/tsm-source/pdfs/TRAINSET_V2.2.pdf

      - name: Fetch exact official VDV release contexts
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'upstream-v21 585e0bea34b64887db4276f1c94d5f3e78f06c66 a8472530e840f7b365f6ba1075bfc09758ebda21' \
            'upstream-v22 f283697124750d12189b960b302b399769bad530 2dbde53864ef07319016b419ff6951f6e90e79dc'
          do
            set -- $spec
            dir="$1"; commit="$2"; tree="$3"
            git init "/tmp/$dir"
            git -C "/tmp/$dir" remote add origin https://github.com/VDVde/VDV301.git
            git -C "/tmp/$dir" fetch --depth=1 origin "$commit"
            git -C "/tmp/$dir" checkout --detach FETCH_HEAD
            test "$(git -C "/tmp/$dir" rev-parse HEAD)" = "$commit"
            test "$(git -C "/tmp/$dir" rev-parse HEAD^{tree})" = "$tree"
          done
          test "$(git -C /tmp/upstream-v21 hash-object IBIS-IP_TrainSetManagementService_V2.1.xsd)" = "add9d1cb37e5759ff7a77855b239108d38373206"
          test "$(git -C /tmp/upstream-v22 hash-object IBIS-IP_TrainSetManagementService_V2.2.xsd)" = "da9465d6683e3f7d54a546ab4a13739fb3c3e902"
          test "$(git -C /tmp/upstream-v22 hash-object IBIS-IP_TrainSetInformationService_V2.2.xsd)" = "7ab1f8f892bfcea2a8b8a055f07de92c143356f9"

      - name: Re-acquire exact official TrainSet PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tsm-ev162
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 VDV301-audit-EV162' \
            'https://www.vdv.de/vdv-301-2-14-v2-1-sds-trainsetservices.pdfx' \
            -o /tmp/tsm-ev162/TRAINSET_V2.1.pdf
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 VDV301-audit-EV162' \
            'https://www.vdv.de/301-2-14-sdes-v2-2-trainsetservices.pdfx' \
            -o /tmp/tsm-ev162/TRAINSET_V2.2.pdf
          test "$(sha256sum /tmp/tsm-ev162/TRAINSET_V2.1.pdf | awk '{print $1}')" = "8eb53f2e960d125382e22d9c58dff8685c041001cf39a87ed4d12bb266bbe12e"
          test "$(stat --printf='%s' /tmp/tsm-ev162/TRAINSET_V2.1.pdf)" = "1708401"
          test "$(pdfinfo /tmp/tsm-ev162/TRAINSET_V2.1.pdf | awk '/^Pages:/ {print $2}')" = "51"
          test "$(sha256sum /tmp/tsm-ev162/TRAINSET_V2.2.pdf | awk '{print $1}')" = "c1946694a1809933a9a4a23adff1c551effdb0a2fbc6a7f7f68faec0b0c7bd6e"
          test "$(stat --printf='%s' /tmp/tsm-ev162/TRAINSET_V2.2.pdf)" = "1744296"
          test "$(pdfinfo /tmp/tsm-ev162/TRAINSET_V2.2.pdf | awk '/^Pages:/ {print $2}')" = "54"

      - name: Snapshot complete XSD pool before EV-162
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ev162
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > artifacts/ev162/xsd-before.sha256
          test "$(wc -l < artifacts/ev162/xsd-before.sha256)" -eq 50

      - name: Rerun EV-109 V2.1 executable control
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_trainset_v21_ev109.py | tee artifacts/ev162/ev109.log
          grep -q 'PASSED: TSM-001 V2.1 response-root naming discrepancy executable-confirmed' artifacts/ev162/ev109.log

      - name: Rerun EV-104 V2.2 executable control
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_trainset_ev104.py | tee artifacts/ev162/ev104.log
          grep -q 'PASSED: TSM-002 executable operation-group/global-root mismatch confirmed' artifacts/ev162/ev104.log

      - name: Run EV-162 TSM closure gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_tsm_revalidation_ev162.py \
            --repo-root . \
            --source-evidence-dir /tmp/tsm-source \
            --v21-pdf /tmp/tsm-ev162/TRAINSET_V2.1.pdf \
            --v22-pdf /tmp/tsm-ev162/TRAINSET_V2.2.pdf \
            --output-dir artifacts/ev162 | tee artifacts/ev162/ev162.log

      - name: Run complete 50-root-XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . | tee artifacts/ev162/xsd-pool.log

      - name: Verify XSD and audit-state immutability
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > artifacts/ev162/xsd-after.sha256
          cmp artifacts/ev162/xsd-before.sha256 artifacts/ev162/xsd-after.sha256
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "84f4b647c2910c27550bdd8f62d7c072d56714ba"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "efa00ed4ffc2fad76f50b000377ef1f8def0d486"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"

      - name: Upload EV-162 evidence
        uses: actions/upload-artifact@v4
        with:
          name: tsm-ev162-evidence
          path: artifacts/ev162
          if-no-files-found: error
          retention-days: 90
