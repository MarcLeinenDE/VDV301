name: TEMP validate VDV301-2 GC V2.3 EV-133

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_validate_vdv3012_gc23_ev133.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned GC V2.3 PDF from split source/pin registries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request

          source_id = 'VDV301-2_GC_V2.3'
          source_registry = json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text(encoding='utf-8'))
          pin_registry = json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text(encoding='utf-8'))
          source = next(x for x in source_registry['sources'] if x['source_id'] == source_id)
          pin = next(x for x in pin_registry['sources'] if x['source_id'] == source_id)
          expected_hash = pin['expected_sha256']
          expected_size = int(pin['expected_size_bytes'])
          request = urllib.request.Request(
              source['official_url'],
              headers={
                  'User-Agent': 'VDV301-Audit-EV133/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
              },
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          actual_hash = hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-'), 'download is not PDF'
          assert actual_hash == expected_hash, (actual_hash, expected_hash)
          assert len(data) == expected_size, (len(data), expected_size)
          target = Path('local_sources/vdv_pdfs') / source['local_filename']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual_hash} size={len(data)}')
          PY

      - name: Render visible evidence pages 70 and 71
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ev133/pages artifacts/ev133/text
          for p in 70 71; do
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 180 \
              local_sources/vdv_pdfs/VDV301-2_GC_V2.3.pdf \
              "artifacts/ev133/pages/page-$p"
            pdftotext -f "$p" -l "$p" -layout \
              local_sources/vdv_pdfs/VDV301-2_GC_V2.3.pdf \
              "artifacts/ev133/text/page-$p.txt"
          done

      - name: Run EV-133
        shell: bash
        env:
          EV133_OUTPUT_DIR: artifacts/ev133
        run: |
          set -euo pipefail
          python tools/validate_vdv3012_gc23_ev133.py

      - name: Build evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum local_sources/vdv_pdfs/VDV301-2_GC_V2.3.pdf > artifacts/ev133/pdf.sha256
          find artifacts/ev133 -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifacts/ev133/manifest.sha256
          cat artifacts/ev133/ev133_result.json
          cat artifacts/ev133/manifest.sha256

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Verify no tracked mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          git diff --exit-code -- '*.xsd'
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo 'Unexpected tracked changes:'
            git status --short
            git diff --exit-code
            exit 1
          fi

      - name: Upload EV-133 evidence
        uses: actions/upload-artifact@v4
        with:
          name: vdv3012-gc23-ev133
          path: artifacts/ev133
          if-no-files-found: error
          retention-days: 90
