name: TEMP close COMMON V2.4 revalidation subblock

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_close_common_v24_revalidation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-common-v24:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned COMMON V2.4 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          source_id='COMMON_V2.4'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==source_id)
          pin=next(x for x in pins['sources'] if x['source_id']==source_id)
          req=urllib.request.Request(source['official_url'],headers={'User-Agent':'VDV301-Audit-EV140-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
          with urllib.request.urlopen(req,timeout=90) as response: data=response.read()
          actual=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual==pin['expected_sha256'],(actual,pin['expected_sha256'])
          assert len(data)==int(pin['expected_size_bytes']),(len(data),pin['expected_size_bytes'])
          target=Path('local_sources/vdv_pdfs')/source['local_filename']; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual} size={len(data)}')
          PY

      - name: Re-run EV-140 exact evidence gate
        shell: bash
        env:
          EV140_OUTPUT_DIR: artifacts/ev140-closure
        run: |
          set -euo pipefail
          python tools/validate_common_v24_revalidation_ev140.py

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Pre-closure immutable and mutation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/common_v24_revalidation_evidence_2026-09-04.json)" = "6eb4cc7a600b6f526c9f4c203afd02ca0de2436b"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.4_FRESH_2026-09-03.md)" = "1a2f58c60152e14a61257d21a8c2cd4533f2696e"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.4.md)" = "5800c06781b17775f6763a918568d3e5712210c5"
          test "$(git hash-object audit_registry/deep_read_findings_delta_common_v24_2026-09-03.json)" = "9744612c607e63659d574c13500cfc611f239f39"
          test "$(git hash-object IBIS-IP_common_V2.4.xsd)" = "1946fd37e29ced605654f49ea3d98cd2fbbdc8e4"
          test "$(git hash-object IBIS-IP_Enumerations_V2.4.xsd)" = "2afed8cf23afa91db92b0f043cc5b4ad428b0f25"
          test "$(git hash-object tools/validate_common_v24_ev122.py)" = "acbca8a808e623030c2ff48bc2e3f3e336cb5f11"
          test "$(git hash-object tools/validate_common_v24_revalidation_ev140.py)" = "75633e50c7de5a469acab226084603dbc0906ae2"
          test "$(git hash-object tools/close_common_v24_revalidation_block.py)" = "dca7f6b1cdc68c8d4fa4b0edb74342d1668b9267"
          git diff --exit-code -- '*.xsd'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Write COMMON V2.4 closure state
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_common_v24_revalidation_block.py

      - name: Remove temporary workflow plumbing and generated caches
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_validate_common_v24_ev140.yml
          rm -f .github/workflows/temp_close_common_v24_revalidation.yml
          rm -rf artifacts/ev140-closure
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Verify closure delta allowlist and immutable authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/common_v24_revalidation_evidence_2026-09-04.json)" = "6eb4cc7a600b6f526c9f4c203afd02ca0de2436b"
          test "$(git hash-object IBIS-IP_common_V2.4.xsd)" = "1946fd37e29ced605654f49ea3d98cd2fbbdc8e4"
          test "$(git hash-object IBIS-IP_Enumerations_V2.4.xsd)" = "2afed8cf23afa91db92b0f043cc5b4ad428b0f25"
          git diff --exit-code -- '*.xsd'
          python - <<'PY'
          import subprocess
          allowed={'audit_registry/finding_revalidation_registry_v0.1.json','00_START_HERE/CURRENT_STATE.json','docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_COMMON_V24_2026-09-04.md','.github/workflows/temp_validate_common_v24_ev140.yml','.github/workflows/temp_close_common_v24_revalidation.yml'}
          lines=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          changed={line[3:] for line in lines if len(line)>=4}
          assert not changed-allowed,f'unexpected closure delta: {sorted(changed-allowed)}'
          required={'audit_registry/finding_revalidation_registry_v0.1.json','00_START_HERE/CURRENT_STATE.json','docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_COMMON_V24_2026-09-04.md'}
          assert required<=changed,f'missing required closure delta: {sorted(required-changed)}'
          print('ALLOWLIST_OK',sorted(changed))
          PY

      - name: Verify post-closure state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text()); state=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          entries=reg['inventory']['entries']; by_id={x['finding_id']:x for x in entries}
          terminal=sum(x.get('revalidation_state')!='pending' for x in entries); pending=sum(x.get('revalidation_state')=='pending' for x in entries)
          assert (terminal,pending)==(96,96),(terminal,pending)
          assert by_id['DRCOM24-001']['revalidation_state']=='executable_confirmed'
          for fid in ('DRDMS22-001','DRDMS22-002','DRDMS22-003','DRDMS22-004'):
              assert by_id[fid]['revalidation_state']=='pending',fid
          block=reg['revalidation_blocks']['COMMON_V2.4']; assert block['state']=='completed'
          assert block['next_block']=='DMS' and block['next_subblock']=='DMS_V2.2'
          assert block['official_release_authority'] is False and block['latest_xsd_wins'] is False
          assert reg['next_revalidation_block']=='DMS'
          audit=state['audit']; assert audit['finding_revalidation_completed_findings']==96 and audit['finding_revalidation_pending_findings']==96
          assert audit['finding_revalidation_latest_completed_block']=='COMMON_V2.4'
          assert audit['finding_revalidation_next_block']=='DMS'
          assert audit['common_v24_revalidation']['next_subblock']=='DMS_V2.2'
          assert json.loads(Path('audit_registry/finding_inventory_frozen_2026-09-03.json').read_text())['entry_count']==192
          print('POST_STATE_OK terminal=96 pending=96 next=DMS_V2.2')
          PY

      - name: Commit closure atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Marc Leinen"
          git config user.email "34336531+MarcLeinenDE@users.noreply.github.com"
          git add -A
          git commit -m "audit: revalidate COMMON V2.4 finding subblock [skip ci]"
          git push origin HEAD:dev/schema-integration
