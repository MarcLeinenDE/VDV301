name: temp-start-read-common-v10
on:
  push:
    branches: [dev/schema-integration]
    paths:
      - '.github/workflows/temp-start-read-common-v10.yml'
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf
      - name: Pin extract and render Common V1.0
        run: python tools/temp_start_read_common_v10.py
      - name: Fail closed before evidence upload
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git status --porcelain | awk '{print $2}' | grep -E '\.xsd$'; then
            echo 'ERROR: XSD modification detected'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: common-v10-pinned-read
          path: audit-results/common-v10-pinned-read/
          if-no-files-found: error
      - name: Commit source pin and start state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git add audit_registry/pdf_source_pins_v0.1.json audit_registry/deep_read_registry_delta_common_v10_2026-08-29.json 00_START_HERE/CURRENT_STATE.json
          git add -u tools/temp_start_read_common_v10.py
          git status --short
          git commit -m 'Pin and start Common V1.0 deep read'
          git push origin HEAD:dev/schema-integration
