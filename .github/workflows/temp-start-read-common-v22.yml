name: TEMP Start COMMON V2.2 deep read

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - tools/temp_start_read_common_v22.py
      - .github/workflows/temp-start-read-common-v22.yml

permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Pin render and prepare start state
        run: python tools/temp_start_read_common_v22.py
      - name: Fail closed before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git status --porcelain | awk '{print $2}' | grep -E '\.xsd$'; then
            echo 'ERROR: XSD modification detected'
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text(encoding='utf-8'))
          a=s['audit']
          assert a['deep_read_textual_fresh_read_completed'] == 34
          assert a['deep_read_needs_visual_review'] == 34
          assert a['deep_read_in_progress'] == 1
          assert a['deep_read_current_document_id'] == 'COMMON_V2.2'
          assert a['deep_read_previous_document_id'] == 'COMMON_V2.1'
          assert a['next_natural_deep_read_document_id'] == 'COMMON_V2.2'
          assert a['common_v2_2_authority']['Common_V2.2_blob'] == '468fee6d177e7185dbcd5d3f90cfb114e29e01ae'
          assert a['common_v2_2_authority']['Enumerations_V2.2_blob'] == '2a23b512379b18e8f122ac1272cef8229fb86283'
          assert a['common_v2_2_authority']['release_tag'] is None
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text(encoding='utf-8'))
          matches=[x for x in pins['sources'] if x.get('source_id') == 'COMMON_V2.2']
          assert len(matches) == 1 and matches[0]['deep_read_source_ready'] is True
          d=json.loads(Path('audit_registry/deep_read_registry_delta_common_v22_2026-09-02.json').read_text(encoding='utf-8'))
          u=d['document_updates']['COMMON_V2.2']
          assert u['render_read_evidence']['fresh_read_freeze'] == 'not_started'
          m=json.loads(Path('audit-results/common-v22-pinned-read/manifest.json').read_text(encoding='utf-8'))
          assert m['common_blob'] == '468fee6d177e7185dbcd5d3f90cfb114e29e01ae'
          assert m['enumerations_blob'] == '2a23b512379b18e8f122ac1272cef8229fb86283'
          assert len(m['page_png_sha256']) == m['page_count']
          print('COMMON_V22_FAIL_CLOSED_OK')
          PY
      - name: Upload pinned read evidence
        uses: actions/upload-artifact@v4
        with:
          name: common-v22-pinned-read
          path: audit-results/common-v22-pinned-read/
          if-no-files-found: error
          retention-days: 30
      - name: Commit atomic start state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Marc Leinen'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git rm -f .github/workflows/temp-start-read-common-v22.yml tools/temp_start_read_common_v22.py
          git add \
            00_START_HERE/CURRENT_STATE.json \
            audit_registry/pdf_source_pins_v0.1.json \
            audit_registry/deep_read_registry_delta_common_v22_2026-09-02.json
          git diff --cached --check
          if git diff --cached --name-only | grep -E '\.xsd$'; then
            echo 'ERROR: staged XSD modification detected'
            exit 1
          fi
          UNEXPECTED="$(git diff --cached --name-only | grep -Ev '^(00_START_HERE/CURRENT_STATE\.json|audit_registry/pdf_source_pins_v0\.1\.json|audit_registry/deep_read_registry_delta_common_v22_2026-09-02\.json|\.github/workflows/temp-start-read-common-v22\.yml|tools/temp_start_read_common_v22\.py)$' || true)"
          if [ -n "$UNEXPECTED" ]; then
            echo 'ERROR: unexpected staged paths:'
            echo "$UNEXPECTED"
            exit 1
          fi
          git commit -m 'audit: pin and start COMMON V2.2 deep read'
          git push origin HEAD:dev/schema-integration
