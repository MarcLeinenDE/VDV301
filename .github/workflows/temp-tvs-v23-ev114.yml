name: temp-tvs-v23-ev114

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: read

jobs:
  ev114:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check lxml
      - name: Run EV-114
        run: python tools/validate_tvs_v23_ev114.py
