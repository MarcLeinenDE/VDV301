name: temp-gate-runtime-mapping-review-jis-v10

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_jis_v10.yml

permissions:
  contents: read

jobs:
  gate-jis-v10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact review prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "53bda2978e62a4c136887cad01718103e7827657"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "22e491c1b0e9af608dac796c6134b9f8855380f5"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "88ea0184de7f4e02d8cfbe885c4d5a9bc01bb79e"
          test "$(git hash-object sdk_manifest/runtime_mapping_review_blocks/JIS_V10_JIS_003_005_v0.1.json)" = "9635a0035788f3a0d1592d39b2d8fbcc3906d322"
          test "$(git hash-object IBIS-IP_JourneyInformationService_V1.0.xsd)" = "8c303db5a9c0548d66b90174d9c329d33092ad24"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"

      - name: Validate semantic registry and deterministic runtime mapping
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py

      - name: Verify focused JIS V1.0 executable boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          sem=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          mapping=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          block=json.loads(Path('sdk_manifest/runtime_mapping_review_blocks/JIS_V10_JIS_003_005_v0.1.json').read_text())
          by={e['finding_id']:e for e in sem['entries']}
          mapped={m['finding_id']:m for m in mapping['mappings']}

          assert mapping['counts']=={
              'reviewed_mapping_count':58,
              'implemented_count':0,
              'semantic_candidate_count':20,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          for fid in ('JIS-003','JIS-005'):
              assert by[fid]['runtime_match']['state']=='reviewed'
              assert mapped[fid]['activation_class']=='xsd_invalid_advisory'
              assert mapped[fid]['required_precondition']=='xsd_result_invalid'
              assert mapped[fid]['result_effect']=='decorate_existing_invalid'
              assert mapped[fid]['implementation_state']=='reviewed_not_implemented'
              assert mapped[fid]['authority_guard']=='selected_xsd_result_remains_normative'

          XS='http://www.w3.org/2001/XMLSchema'
          NS={'xs':XS}
          service=etree.parse('IBIS-IP_JourneyInformationService_V1.0.xsd')
          root=service.getroot()
          includes=[x.get('schemaLocation') for x in root.findall('xs:include',NS)]
          assert includes==['IBIS-IP_common_V1.0.xsd','IBIS-IP_Enumerations_V1.0.xsd']

          all_line=root.find("xs:complexType[@name='JourneyInformationService.AllLineInformationData']",NS)
          assert all_line is not None
          line=all_line.find("./xs:sequence/xs:element[@name='LineInformation']",NS)
          assert line is not None
          assert line.get('type')=='LineInformationStructure'
          assert line.get('minOccurs') is None
          assert line.get('maxOccurs') is None

          gnss=root.find("xs:complexType[@name='JourneyInformationService.RetrieveSpecificGNSSPointInformationResponseStructure']",NS)
          assert gnss is not None
          good=gnss.find("./xs:choice/xs:element[@name='SpecificGNSSPointInformation']",NS)
          bad=gnss.find("./xs:choice/xs:element[@name='SpecificGNSSPointInformationData']",NS)
          assert good is not None and good.get('type')=='JourneyInformationService.SpecificGNSSPointInformationData'
          assert bad is None

          schema=etree.XMLSchema(service)

          def line_xml(count):
              entries=''.join(
                  f'<LineInformation><LineRef><Value>L{i}</Value></LineRef></LineInformation>'
                  for i in range(1,count+1)
              )
              return f'''<JourneyInformationService.ListAllLineInformationResponse>
                <AllLineInformationData>
                  <TimeStamp><Value>2026-09-07T10:00:00Z</Value></TimeStamp>
                  {entries}
                </AllLineInformationData>
              </JourneyInformationService.ListAllLineInformationResponse>'''

          def gnss_xml(child):
              return f'''<JourneyInformationService.RetrieveSpecificGNSSPointInformationResponse>
                <{child}>
                  <TimeStamp><Value>2026-09-07T10:00:00Z</Value></TimeStamp>
                  <GNSSPoint>
                    <Longitude><Degree><Value>6.95</Value></Degree><Direction><Value>E</Value></Direction></Longitude>
                    <Latitude><Degree><Value>50.93</Value></Degree><Direction><Value>N</Value></Direction></Latitude>
                  </GNSSPoint>
                </{child}>
              </JourneyInformationService.RetrieveSpecificGNSSPointInformationResponse>'''

          assert schema.validate(etree.fromstring(line_xml(1).encode()))
          assert not schema.validate(etree.fromstring(line_xml(2).encode()))
          assert schema.validate(etree.fromstring(gnss_xml('SpecificGNSSPointInformation').encode()))
          assert not schema.validate(etree.fromstring(gnss_xml('SpecificGNSSPointInformationData').encode()))

          rb={e['finding_id']:e for e in block['entries']}
          assert any('must not relax cardinality to the PDF-documented 1:*' in g for g in rb['JIS-003']['guards'])
          assert any('must not register the Data-suffixed PDF row label as an element alias or rewrite it' in g for g in rb['JIS-005']['guards'])
          print('PASSED: JIS V1.0 JIS-003/JIS-005 runtime boundaries verified')
          PY

      - name: Prove preserved EV-152 reference and XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          grep -q "EV-152" docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_JIS_2026-09-08.md
          grep -q "34113437268" docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_JIS_2026-09-08.md
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: JIS V1.0 runtime-mapping gate complete"
