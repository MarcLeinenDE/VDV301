name: temp-gate-runtime-mapping-review-jis-v10-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_jis_v10.yml

permissions:
  contents: read

jobs:
  gate-jis-v10-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "64b8a064211ac7ff7b9c9f480df5268b5b539593"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "5853acb6f3449be9ea794207bfc289cbd317e5bd"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "df1a69dcf3c6e8fb5dd23032d6aa3c6c09c801a5"
          test "$(git hash-object sdk_manifest/README.md)" = "acdfc04e2a029f4204b4c2c1b0b5819374012804"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "22e491c1b0e9af608dac796c6134b9f8855380f5"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "88ea0184de7f4e02d8cfbe885c4d5a9bc01bb79e"

      - name: Validate synchronized runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':20,'not_applicable':113,'not_designed':1,'reviewed':58}
          assert r['counts']=={
              'reviewed_mapping_count':58,
              'implemented_count':0,
              'semantic_candidate_count':20,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='JIS_V10_JIS_003_005'
          print('PASSED: JIS V1.0 closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: JIS V1.0 runtime-mapping closure gate complete"
