name: TEMP delete TKT cleanup safety branch

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_delete_tkt_cleanup_safety.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary safety branch
        shell: bash
        run: |
          set -euo pipefail
          git init cleanup
          cd cleanup
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/MarcLeinenDE/VDV301.git"
          git push origin --delete audit/tmp-tkt-cleanup-safety
