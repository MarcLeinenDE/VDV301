name: temp-hds-v22a-start
on:
  push:
    branches: [dev/schema-integration]
    paths: ['.github/workflows/temp-hds-v22a-start.yml']
permissions:
  contents: write
jobs:
  start:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin official HDS V2.2a PDF and record independent start
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, urllib.request
          from datetime import datetime, timezone
          url='https://www.vdv.de/301-2-17-sdes-v2-2a-htmldisplayservice.pdfx'
          req=urllib.request.Request(url,headers={'User-Agent':'VDV301-audit-source-pin/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r: data=r.read()
          if not data.startswith(b'%PDF-'): raise SystemExit('Downloaded source is not a PDF')
          sha=hashlib.sha256(data).hexdigest(); size=len(data)
          ts=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          print('HDS_V22A_PIN',sha,size,ts)

          pp=Path('audit_registry/pdf_source_pins_v0.1.json')
          pins=json.loads(pp.read_text(encoding='utf-8'))
          assert not any(x['source_id']=='HDS_V2.2a' for x in pins['sources'])
          pins['sources'].append({'source_id':'HDS_V2.2a','expected_sha256':sha,'expected_size_bytes':size,'pinned_at_utc':ts,'deep_read_source_ready':True,'evidence_run_id':'SELF_RUN_ID_PENDING_LOG_CAPTURE'})
          pp.write_text(json.dumps(pins,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          delta={'delta_version':'0.1','date':'2026-08-29','base_registry':'audit_registry/deep_read_registry_v0.1.json','document_updates':{'HDS_V2.2a':{
            'state':'source_pinned_authority_established_pending_fresh_read',
            'official_url':url,
            'publication':'VDV-Schrift 301-2-17, HTMLDisplayService V2.2a, 02/2021',
            'source_pin':{'sha256':sha,'size_bytes':size,'pinned_at_utc':ts,'evidence_run':'SELF_RUN_ID_PENDING_LOG_CAPTURE'},
            'authority_status':{
              'official_pdf':'official_public_VDV_writing',
              'dedicated_release_tag_VDV-301-2.2a_exists':False,
              'service_model':'non_xsd_dns_sd_http_profile',
              'dedicated_HtmlDisplayService_xsd_in_integration_branch':False,
              'xsd_boundary':'No dedicated HDS service XSD is selected or inferred; V2.2a authority is the official service publication plus separately sourced general-conventions rules where explicitly referenced.'
            },
            'historical_context_note':'The historical HDS block is known from earlier reconciliation, but V2.2a facts must be independently re-derived from this pinned V2.2a source before V2.2a reconciliation.',
            'historical_v22a_profile_not_used_as_source_during_fresh_read':True,
            'evidence_gate':'docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md'
          }}}
          Path('audit_registry/deep_read_registry_delta_hds_v22a_2026-08-29.json').write_text(json.dumps(delta,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          sp=Path('00_START_HERE/CURRENT_STATE.json'); s=json.loads(sp.read_text(encoding='utf-8')); a=s['audit']
          a['deep_read_in_progress']=1; a['deep_read_current_document_id']='HDS_V2.2a'; a['deep_read_previous_document_id']='HDS_V2.2'; a['next_natural_deep_read_document_id']='HDS_V2.2a'
          a['pdf_sources_byte_pinned']=23
          if 'HDS_V2.2a' not in a['pinned_active_sources']: a['pinned_active_sources'].append('HDS_V2.2a')
          a['latest_deep_read_registry_delta']='audit_registry/deep_read_registry_delta_hds_v22a_2026-08-29.json'
          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          for p in [pp,Path('audit_registry/deep_read_registry_delta_hds_v22a_2026-08-29.json'),sp]: json.loads(p.read_text(encoding='utf-8'))
          PY
      - name: Commit start and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add audit_registry/pdf_source_pins_v0.1.json audit_registry/deep_read_registry_delta_hds_v22a_2026-08-29.json 00_START_HERE/CURRENT_STATE.json
          git rm .github/workflows/temp-hds-v22a-start.yml
          if git diff --cached --name-only | grep -E '\.xsd$'; then exit 1; fi
          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git commit -m 'Pin and start HTMLDisplayService V2.2a deep read'
          git push origin HEAD:dev/schema-integration
