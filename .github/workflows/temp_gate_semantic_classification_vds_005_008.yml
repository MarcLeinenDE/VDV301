name: temp-gate-semantic-classification-vds-005-008

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_vds_005_008.yml

permissions:
  contents: read

jobs:
  gate-vds-005-008:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact VDS 005-008 prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "79037c7fc02f5fe22e7f3fd0c98accc226bfcc8a"
          test "$(git hash-object audit_registry/semantic_classification_blocks/VDS_V10_V20_005_008_v0.1.json)" = "8afd1a4d50b3d3ea3a686e3ec3a06a4bb77592e7"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "293f8661ecc8914feeecbf683fee72a2aac34160"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDS_2026-09-14.md)" = "de4abc243b3a295a7a7345e98cb2c31dd33cfbf7"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_CHOICE_NOTATION_2026-08-29.md)" = "fe024798ba1b9803ec70ee3b97def63ee03d298f"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/VIDEO_DISPLAY_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "d5d2903ed04448ba3793b4eb1b7aa2c192ca5b3a"

      - name: Verify documentation findings and corrected VDS-006 semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/VDS_V10_V20_005_008_v0.1.json').read_text())

          assert registry['progress']['classified_count']==172
          assert registry['progress']['remaining_count']==20
          assert registry['progress']['latest_block']=='VDS_V10_V20_001_004'
          assert [e['finding_id'] for e in block['entries']]==['VDS-005','VDS-006','VDS-007','VDS-008']

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          for fid in ('VDS-005','VDS-006','VDS-007','VDS-008'):
              assert frozen[fid]['revalidation_state']=='context_verified'
              assert frozen[fid]['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDS_2026-09-14.md'

          by={e['finding_id']:e for e in block['entries']}
          assert by['VDS-005']['primary_issue_kind']=='editorial_residue'
          assert by['VDS-005']['defect_assessment']=='confirmed_pdf_defect'
          assert by['VDS-005']['runtime_match']['state']=='not_applicable'

          assert by['VDS-006']['primary_issue_kind']=='other'
          assert by['VDS-006']['defect_assessment']=='likely_pdf_defect'
          assert by['VDS-006']['confidence']=='high'
          assert 'choice_notation_application_anomaly' in by['VDS-006']['secondary_issue_kinds']
          assert 'supersedes_invalid_cardinality_interpretation' in by['VDS-006']['secondary_issue_kinds']
          assert by['VDS-006']['runtime_match']['state']=='not_applicable'

          assert by['VDS-007']['primary_issue_kind']=='version_routing_issue'
          assert by['VDS-007']['defect_assessment']=='confirmed_pdf_defect'
          assert by['VDS-007']['sdk_behavior']=='warning'

          assert by['VDS-008']['primary_issue_kind']=='semantic_contradiction'
          assert by['VDS-008']['defect_assessment']=='confirmed_pdf_defect'
          assert by['VDS-008']['runtime_match']['state']=='not_applicable'

          deep10=Path('docs/pdf_xsd_semantic_audit/deep_read/VDS_V1.0.md').read_text()
          deep20=Path('docs/pdf_xsd_semantic_audit/deep_read/VDS_V2.0.md').read_text()
          correction=Path('docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_CHOICE_NOTATION_2026-08-29.md').read_text()
          addendum=Path('docs/pdf_xsd_semantic_audit/VIDEO_DISPLAY_SERVICE_FINDINGS_REGISTER_ADDENDUM.md').read_text()
          vls=Path('docs/pdf_xsd_semantic_audit/deep_read/VLS_V1.0.md').read_text()

          assert 'Fehler! Verweisquelle konnte nicht gefunden werden.' in deep10
          assert 'VDS-005 is V1.0-only' in deep20

          assert 'A prefixed minus sign denotes XML choice.' in correction
          assert 'VDS-006 - refined, not a cardinality error' in correction
          assert 'incomplete or degenerate application' in correction
          assert 'The old premise is rejected: `-1:1` is a valid VDV XML-choice notation form.' in addendum
          assert 'VDS-006 is documentation-only' in addendum

          assert 'VideoDisplayService v1.1 1.0, 05/2017' in vls
          assert 'The official VDV catalog identifies the 05/2017 VDV 301-2-13 publication as VideoDisplayService V1.0.' in addendum
          assert 'No VDS V1.1 schema/profile alias is created.' in addendum

          assert 'RTP  Real Time Protocol' in addendum
          assert 'SOA  Server Oriented Architecture' in addendum
          assert 'External standard terminology uses RTP as the real-time transport protocol and SOA as Service Oriented Architecture.' in addendum
          print('PASSED: VDS-005..008 documentation semantics and VDS-006 correction verified')
          PY

      - name: Simulate merge and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py \
            --block audit_registry/semantic_classification_blocks/VDS_V10_V20_005_008_v0.1.json \
            --output /tmp/vds-005-008-merged.json
          python tools/validate_finding_semantic_classification.py \
            --registry /tmp/vds-005-008-merged.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('/tmp/vds-005-008-merged.json',encoding='utf-8'))
          assert r['progress']['classified_count']==176
          assert r['progress']['remaining_count']==16
          assert r['progress']['latest_block']=='VDS_V10_V20_005_008'

          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          done={e['finding_id'] for e in r['entries']}
          remaining=[e['finding_id'] for e in baseline['inventory']['entries'] if e['finding_id'] not in done]
          assert len(remaining)==16
          assert remaining[0]=='VLS-001'
          print('PASSED: simulated registry is exactly 176/192; next open finding VLS-001')
          PY

      - name: Validate all 50 root XSDs and prove read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: VDS 005-008 semantic gate complete; repository remains unmodified"
