name: Temp validate DRTRAINSET22 EV-149

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_validate_drtrainset22_ev149.yml
      - tools/validate_drtrainset22_revalidation_ev149.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF and XSD tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Snapshot root XSD hashes
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256

      - name: Fetch exact byte-pinned TRAINSET V2.2 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          sid='TRAINSET_V2.2'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==sid)
          pin=next(x for x in pins['sources'] if x['source_id']==sid)
          assert source['official_url']=='https://www.vdv.de/301-2-14-sdes-v2-2-trainsetservices.pdfx'
          assert source['local_filename']=='TRAINSET_V2.2.pdf'
          assert pin['expected_sha256']=='c1946694a1809933a9a4a23adff1c551effdb0a2fbc6a7f7f68faec0b0c7bd6e'
          assert int(pin['expected_size_bytes'])==1744296
          assert str(pin['evidence_run_id'])=='33239594518'
          for attempt in range(4):
              try:
                  req=urllib.request.Request(source['official_url'],headers={
                      'User-Agent':'VDV301-Audit-EV149/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                      'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(2*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          if sha != pin['expected_sha256'] or len(data) != int(pin['expected_size_bytes']):
              raise AssertionError(
                  f'OFFICIAL_SOURCE_BYTES_CHANGED current_sha={sha} current_size={len(data)} '
                  f'pinned_sha={pin["expected_sha256"]} pinned_size={pin["expected_size_bytes"]} '
                  f'original_pin_run={pin["evidence_run_id"]}')
          assert data.startswith(b'%PDF-')
          target=Path('local_sources/vdv_pdfs')/source['local_filename']
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {sid} sha256={sha} size={len(data)}')
          PY

      - name: Run EV-149 on exact V2.2 PDF navigation authority
        run: python tools/validate_drtrainset22_revalidation_ev149.py --repo-root . --output-dir artifacts/ev149

      - name: Run complete XSD pool as repository regression guard only
        run: python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Verify immutable boundaries and evidence separation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.2.md)" = "61850045c26fb2a848c4670f1418fdb809ab475c"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          test -z "$(git diff --name-only | grep -E '\.xsd$' || true)"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/ev149/ev149_results.json').read_text())
          scope=['DRTRAINSET22-001','DRTRAINSET22-002']
          assert r['evidence_id']=='EV-149' and r['result']=='PASS'
          assert r['scope']==scope
          assert r['recommended_terminal_states']=={fid:'context_verified' for fid in scope}
          assert r['authority']['pdf_sha256']=='c1946694a1809933a9a4a23adff1c551effdb0a2fbc6a7f7f68faec0b0c7bd6e'
          assert r['authority']['pdf_size_bytes']==1744296
          assert r['authority']['xsd_semantic_authority_required'] is False
          assert r['executable_evidence']['required_for_terminal_state'] is False
          assert r['manual_visual_review_status']=='pending_human_inspection_of_EV149_artifact_before_registry_closure'
          assert r['xsd_pool_role']=='repository-regression-only'
          assert r['xsd_mutated'] is False and r['frozen_inventory_mutated'] is False
          print('EV-149 immutable-boundary and evidence-separation verification PASS')
          PY

      - name: Upload EV-149 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drtrainset22-ev149
          path: artifacts/ev149
          if-no-files-found: error
          retention-days: 90
