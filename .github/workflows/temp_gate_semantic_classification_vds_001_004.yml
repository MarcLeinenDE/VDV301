name: temp-gate-semantic-classification-vds-001-004

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_vds_001_004.yml

permissions:
  contents: read

jobs:
  gate-vds-001-004:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact VDS 001-004 prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4d6567247751d622e349fc22fda142fc4c1caa0f"
          test "$(git hash-object audit_registry/semantic_classification_blocks/VDS_V10_V20_001_004_v0.1.json)" = "ef4e0c5beb3d84292e462b44aa1dafd94c26231e"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "9f2c0630f2b908f9db5604d442e3199e08be0fdb"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDS_2026-09-14.md)" = "de4abc243b3a295a7a7345e98cb2c31dd33cfbf7"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_CHOICE_NOTATION_2026-08-29.md)" = "fe024798ba1b9803ec70ee3b97def63ee03d298f"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/VIDEO_DISPLAY_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "d5d2903ed04448ba3793b4eb1b7aa2c192ca5b3a"
          test "$(git hash-object IBIS-IP_VideoDisplayService_V2.0.xsd)" = "fcfdadd3b62a584370cae326004050b4dc832e23"

      - name: Verify VDS authority and compositor boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -e IBIS-IP_VideoDisplayService_V1.0.xsd
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/VDS_V10_V20_001_004_v0.1.json').read_text())

          assert registry['progress']['classified_count']==168
          assert registry['progress']['remaining_count']==24
          assert registry['progress']['latest_block']=='TSM_V21_001'
          assert [e['finding_id'] for e in block['entries']]==['VDS-001','VDS-002','VDS-003','VDS-004']

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['VDS-001']['revalidation_state']=='context_verified'
          for fid in ('VDS-002','VDS-003','VDS-004'):
              assert frozen[fid]['revalidation_state']=='executable_confirmed'
          for fid in ('VDS-001','VDS-002','VDS-003','VDS-004'):
              assert frozen[fid]['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDS_2026-09-14.md'

          by={e['finding_id']:e for e in block['entries']}
          assert by['VDS-001']['normative_authority']=='no_strict_xsd_profile'
          assert by['VDS-001']['defect_assessment']=='authority_gap'
          assert by['VDS-001']['sdk_behavior']=='unsupported_profile'
          for fid in ('VDS-002','VDS-003','VDS-004'):
              assert by[fid]['normative_authority']=='selected_xsd'
              assert by[fid]['primary_issue_kind']=='structure_mismatch'
              assert by[fid]['defect_assessment']=='cross_artifact_mismatch'
              assert by[fid]['sdk_behavior']=='error_with_advisory'
              assert by[fid]['runtime_match']['state']=='candidate'

          deep10=Path('docs/pdf_xsd_semantic_audit/deep_read/VDS_V1.0.md').read_text()
          assert 'no VideoDisplayService V1.0 service XSD' in deep10
          assert 'VDS V2.0 XSD must NOT be substituted for V1.0' in deep10
          mono=Path('IBIS_IP_V1.0.xsd').read_text()
          assert 'VideoDisplayService' not in mono

          correction=Path('docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_CHOICE_NOTATION_2026-08-29.md').read_text()
          assert 'A prefixed minus sign denotes XML choice.' in correction
          assert 'VDS-002: remains executable-confirmed' in correction
          assert 'VDS-004: remains executable-confirmed' in correction

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          tree=etree.parse('IBIS-IP_VideoDisplayService_V2.0.xsd')
          etree.XMLSchema(tree)
          def choice_names(type_name):
              return tree.xpath(f"/xs:schema/xs:complexType[@name='{type_name}']/xs:choice/xs:element/@name",namespaces=NS)

          assert choice_names('VideoDisplayService.ListViewCapabilitiesResponseStructure')==['ViewID','ViewName','ViewType']
          assert choice_names('VideoDisplayService.SetVideoViewRequestStructure')==['ViewID','Timeout']
          assert choice_names('VideoDisplayService.SetVideoViewResponseStructure')==['State','CurrentViewID','OperationErrorMessage']
          assert choice_names('VideoDisplayService.SetNextViewIndexResponseStructure')==['State','OperationErrorMessage']
          assert choice_names('VideoDisplayService.GetDisplayStateResponseStructure')==['State','CurrentViewID','OperationErrorMessage']

          ev=Path('docs/pdf_xsd_semantic_audit/24c_executable_validation_video_compositors.md').read_text()
          assert 'VDS-002 remains executable-confirmed.' in ev
          assert 'VDS-003 remains executable-confirmed' in ev
          assert 'VDS-004 remains executable-confirmed' in ev
          print('PASSED: VDS-001 authority gap and VDS-002..004 compositor boundaries verified')
          PY

      - name: Simulate merge and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py \
            --block audit_registry/semantic_classification_blocks/VDS_V10_V20_001_004_v0.1.json \
            --output /tmp/vds-001-004-merged.json
          python tools/validate_finding_semantic_classification.py \
            --registry /tmp/vds-001-004-merged.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/vds-001-004-merged.json',encoding='utf-8'))
          assert r['progress']['classified_count']==172
          assert r['progress']['remaining_count']==20
          assert r['progress']['latest_block']=='VDS_V10_V20_001_004'
          by={e['finding_id']:e for e in r['entries']}
          assert by['VDS-001']['sdk_behavior']=='unsupported_profile'
          for fid in ('VDS-002','VDS-003','VDS-004'):
              assert by[fid]['primary_issue_kind']=='structure_mismatch'
          print('PASSED: simulated registry is exactly 172/192')
          PY

      - name: Validate all 50 root XSDs and prove read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: VDS 001-004 semantic gate complete; repository remains unmodified"
