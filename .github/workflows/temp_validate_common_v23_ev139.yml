name: TEMP validate COMMON V2.3 EV-139

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_validate_common_v23_ev139.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned COMMON V2.3 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request
          source_id = 'COMMON_V2.3'
          sources = json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text(encoding='utf-8'))
          pins = json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text(encoding='utf-8'))
          source = next(x for x in sources['sources'] if x['source_id'] == source_id)
          pin = next(x for x in pins['sources'] if x['source_id'] == source_id)
          request = urllib.request.Request(source['official_url'], headers={
              'User-Agent': 'VDV301-Audit-EV139/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          actual_hash = hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual_hash == pin['expected_sha256'], (actual_hash, pin['expected_sha256'])
          assert len(data) == int(pin['expected_size_bytes']), (len(data), pin['expected_size_bytes'])
          target = Path('local_sources/vdv_pdfs') / source['local_filename']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual_hash} size={len(data)}')
          PY

      - name: Run EV-139 Common V2.3 revalidation gate
        shell: bash
        env:
          EV139_OUTPUT_DIR: artifacts/ev139
        run: |
          set -euo pipefail
          python tools/validate_common_v23_revalidation_ev139.py

      - name: Render all EV-139 evidence pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ev139/pages artifacts/ev139/text
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 180 \
              local_sources/vdv_pdfs/COMMON_V2.3.pdf "artifacts/ev139/pages/page-$p"
            pdftotext -f "$p" -l "$p" -layout \
              local_sources/vdv_pdfs/COMMON_V2.3.pdf "artifacts/ev139/text/page-$p.txt"
          done < artifacts/ev139/render_pages.txt

      - name: Build evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum local_sources/vdv_pdfs/COMMON_V2.3.pdf > artifacts/ev139/pdf.sha256
          find artifacts/ev139 -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifacts/ev139/manifest.sha256
          cat artifacts/ev139/ev139_result.json
          cat artifacts/ev139/render_pages.txt
          cat artifacts/ev139/manifest.sha256

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Verify no tracked mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.3_FRESH_2026-09-02.md)" = "cf6060cc9639de64edacdfa84a4cb336fc28c0e6"
          test "$(git hash-object audit_registry/deep_read_findings_delta_common_v23_2026-09-02.json)" = "2bf1f8555ecad4c050d78750dd7326dd28c9484a"
          test "$(git hash-object IBIS-IP_common_V2.3.xsd)" = "0d8926c4063c12de9a5e68b6f0addaab35a55dc1"
          test "$(git hash-object IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"
          test "$(git hash-object tools/validate_common_v23_ev121.py)" = "79a55a6eed8eacdc2f853b4380a987beea14b40c"
          test "$(git hash-object tools/validate_common_v23_revalidation_ev139.py)" = "0b920d09df1d873ba8e2fa623fd3ee402b139fcd"
          git diff --exit-code -- '*.xsd'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload EV-139 evidence
        uses: actions/upload-artifact@v4
        with:
          name: common-v23-ev139
          path: artifacts/ev139
          if-no-files-found: error
          retention-days: 90
