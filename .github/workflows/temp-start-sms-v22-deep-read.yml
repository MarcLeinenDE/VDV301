name: temp-start-sms-v22-deep-read
on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-start-sms-v22-deep-read.yml
permissions:
  contents: write
jobs:
  start:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin official SMS V2.2 source and establish authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, urllib.request
          from datetime import datetime, timezone

          source_id='SMS_V2.2'
          url='https://www.vdv.de/301-2-18-sdes-v2-2-systemmonitoringservice.pdfx'
          run_id=os.environ['GITHUB_RUN_ID']
          req=urllib.request.Request(url,headers={'User-Agent':'VDV301-audit-source-pin/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              data=r.read()
          if not data.startswith(b'%PDF-'):
              raise SystemExit('Downloaded SMS V2.2 source is not a PDF')
          sha=hashlib.sha256(data).hexdigest()
          size=len(data)
          ts=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          print('SMS_V22_PIN',sha,size,ts,'RUN',run_id)

          pp=Path('audit_registry/pdf_source_pins_v0.1.json')
          pins=json.loads(pp.read_text(encoding='utf-8'))
          if any(x['source_id']==source_id for x in pins['sources']):
              raise SystemExit('SMS_V2.2 already pinned')
          pins['sources'].append({
              'source_id':source_id,
              'expected_sha256':sha,
              'expected_size_bytes':size,
              'pinned_at_utc':ts,
              'deep_read_source_ready':True,
              'evidence_run_id':run_id
          })
          pp.write_text(json.dumps(pins,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          delta={
            'delta_version':'0.1',
            'date':'2026-08-29',
            'base_registry':'audit_registry/deep_read_registry_v0.1.json',
            'document_updates':{
              'SMS_V2.2':{
                'state':'source_pinned_authority_established_pending_fresh_read',
                'official_url':url,
                'publication':'VDV-Schrift 301-2-18, SystemMonitoringService V2.2, 08/2019',
                'source_pin':{
                  'sha256':sha,
                  'size_bytes':size,
                  'pinned_at_utc':ts,
                  'evidence_run':run_id
                },
                'authority_status':{
                  'official_pdf':'official_public_VDV_writing',
                  'official_release_tag':'VDV-301-2.2',
                  'SystemMonitoringService_blob':'d8d3011965fcf7c5c15ecd6f0d7e917a3f9e6d3c',
                  'Common_V2.2_blob':'468fee6d177e7185dbcd5d3f90cfb114e29e01ae',
                  'Enumerations_V2.2_blob':'2a23b512379b18e8f122ac1272cef8229fb86283',
                  'integration_branch_matches_official_tag':True,
                  'dependency_policy':'exact V2.2 service + Common V2.2 + Enumerations V2.2; no latest-version substitution'
                },
                'historical_sms_findings_quarantined_until_fresh_read_freeze':True,
                'fresh_read_rule':'derive observations from pinned official SMS V2.2 source and exact authority family before historical SMS finding reconciliation',
                'evidence_gate':'docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md'
              }
            }
          }
          dp=Path('audit_registry/deep_read_registry_delta_sms_v22_2026-08-29.json')
          dp.write_text(json.dumps(delta,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          sp=Path('00_START_HERE/CURRENT_STATE.json')
          s=json.loads(sp.read_text(encoding='utf-8')); a=s['audit']
          a['deep_read_in_progress']=1
          a['deep_read_current_document_id']='SMS_V2.2'
          a['deep_read_previous_document_id']='HDS_V2.2a'
          a['next_natural_deep_read_document_id']='SMS_V2.2'
          a['pdf_sources_byte_pinned']=24
          if source_id not in a['pinned_active_sources']:
              a['pinned_active_sources'].append(source_id)
          a['latest_deep_read_registry_delta']='audit_registry/deep_read_registry_delta_sms_v22_2026-08-29.json'
          a['sms_v2_2_source_pin']={
              'sha256':sha,
              'size_bytes':size,
              'evidence_run':run_id,
              'pinned_at_utc':ts,
              'pdf_authority':'official_public_VDV_writing',
              'xsd_authority_status':'official_VDV-301-2.2_exact_version_aligned_family'
          }
          a['sms_v2_2_authority']={
              'SystemMonitoringService_blob':'d8d3011965fcf7c5c15ecd6f0d7e917a3f9e6d3c',
              'Common_V2.2_blob':'468fee6d177e7185dbcd5d3f90cfb114e29e01ae',
              'Enumerations_V2.2_blob':'2a23b512379b18e8f122ac1272cef8229fb86283',
              'integration_branch_matches_official_tag':True
          }
          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          for p in [pp,dp,sp]:
              json.loads(p.read_text(encoding='utf-8'))
          PY
          git diff --check
      - name: Commit SMS V2.2 start and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add audit_registry/pdf_source_pins_v0.1.json \
            audit_registry/deep_read_registry_delta_sms_v22_2026-08-29.json \
            00_START_HERE/CURRENT_STATE.json
          git rm .github/workflows/temp-start-sms-v22-deep-read.yml
          if git diff --cached --name-only | grep -E '\.xsd$'; then exit 1; fi
          git config user.name MarcLeinenDE
          git config user.email 34336531+MarcLeinenDE@users.noreply.github.com
          git commit -m 'Pin and start SystemMonitoringService V2.2 deep read'
          git push origin HEAD:dev/schema-integration
