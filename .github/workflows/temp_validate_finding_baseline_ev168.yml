name: temp-validate-finding-baseline-ev168

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_validate_finding_baseline_ev168.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  baseline-ev168:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check lxml==6.1.2

      - name: Snapshot exact prestate and immutable XSDs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/validate_finding_baseline_ev168.py)" = "4a79cb0b2dff5fa8cd10cb52cc57d7f32bd7e969"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "d5a645bb9c1498cbca55796d16d2ee71c80ebb37"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "ccc7efa9d1a12578295dcab7b19a18e3ef3e8e94"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "bc60527ddc158d967470a63d38ffd035e5ec1400"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/ev168-xsd-before.sha256
          git diff --exit-code

      - name: Verify final EV-167 readiness evidence online
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34843562886 --jq .conclusion)" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/jobs/103973944657 --jq .conclusion)" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10347047619 --jq .digest)" = "sha256:d978765cfbd90b5f0ab345d9f6626b3ead6c051ac3477cf6a542d6db74a36bf2"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34843562886 --jq .head_sha)" = "171ff38a4b9df401429749ad9c8b5133de4d2e9a"

      - name: Run EV-168 baseline pre-freeze gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence_out
          python tools/validate_finding_baseline_ev168.py \
            --output evidence_out/ev168_finding_baseline.json \
            | tee evidence_out/ev168.log
          grep -Fq "PASSED: EV-168 finding/provenance baseline pre-freeze gate" evidence_out/ev168.log

      - name: Run complete 50-root-XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py | tee evidence_out/xsd_pool.log
          grep -Fq "PASSED" evidence_out/xsd_pool.log

      - name: Enforce audit and XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort -k2 > /tmp/ev168-xsd-after.sha256
          cmp /tmp/ev168-xsd-before.sha256 /tmp/ev168-xsd-after.sha256
          git diff --exit-code -- \
            '*.xsd' \
            audit_registry/finding_inventory_frozen_2026-09-03.json \
            audit_registry/finding_revalidation_registry_v0.1.json \
            audit_registry/pdf_source_registry_v0.1.json \
            audit_registry/pdf_source_pins_v0.1.json \
            00_START_HERE/CURRENT_STATE.json

      - name: Upload EV-168 evidence
        uses: actions/upload-artifact@v4
        with:
          name: finding-baseline-ev168-evidence
          path: evidence_out/
          if-no-files-found: error
