name: temp-gate-runtime-mapping-review-common-v20-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_common_v20.yml

permissions:
  contents: read

jobs:
  gate-common-v20-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8c71b0ce38e1ccb63386383d1c432ee0bd079339"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "a12eabb20c54a99242810052aee431ddda930e9f"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "b2c2f38ad70c236edec641de4fbf219550d4625f"
          test "$(git hash-object sdk_manifest/README.md)" = "10512c0506638fc6531ae62921424b16ee3643d9"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "58256447700586ebd8f39ee93702b34ab09d1065"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "a4e63ed9f5f775a5a0f382e2a9849b213035fb01"

      - name: Validate synchronized runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':29,'not_applicable':113,'not_designed':1,'reviewed':49}
          assert r['counts']=={
              'reviewed_mapping_count':49,
              'implemented_count':0,
              'semantic_candidate_count':29,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='COMMON_V20_DRCOM20_001'
          print('PASSED: Common V2.0 closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: Common V2.0 runtime-mapping closure gate complete"
