name: temp-pin-arch-v10

on:
  push:
    branches: [dev/schema-integration]
    paths: ['.github/workflows/temp-pin-arch-v10.yml']

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and render exact architecture source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p arch-v10-pinned/pages
          url='https://www.vdv.de/vdv-301-1-ibis-ip-teil-1-systemarchitektur.pdfx'
          pdf='arch-v10-pinned/VDV301-1_V1.0_DE.pdf'
          curl --fail --location --retry 3 --retry-delay 2 --output "$pdf" "$url"
          test "$(head -c 5 "$pdf")" = '%PDF-'
          sha256sum "$pdf" > arch-v10-pinned/pdf.sha256
          stat -c '%s' "$pdf" > arch-v10-pinned/pdf.size
          pdfinfo "$pdf" > arch-v10-pinned/pdfinfo.txt
          pdftotext -layout "$pdf" arch-v10-pinned/fulltext.txt
          pdftoppm -png -r 120 "$pdf" arch-v10-pinned/pages/page >/dev/null 2>&1
          sha256sum arch-v10-pinned/fulltext.txt > arch-v10-pinned/fulltext.sha256
          sha256sum arch-v10-pinned/pages/*.png > arch-v10-pinned/page_hashes.sha256
          cat arch-v10-pinned/pdf.sha256
          cat arch-v10-pinned/pdf.size
          grep '^Pages:' arch-v10-pinned/pdfinfo.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arch-v10-pinned-read
          path: arch-v10-pinned/
          if-no-files-found: error
