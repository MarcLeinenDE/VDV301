name: temp-finalize-sms-v22
on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-finalize-sms-v22.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build formal SMS V2.2 closure
        run: python tools/temp_finalize_sms_v22.py
      - name: Check generated diff
        run: git diff --check
      - name: Commit exact SMS V2.2 closure and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          git add 00_START_HERE/CURRENT_STATE.json \
            audit_registry/deep_read_registry_delta_sms_v22_2026-08-29.json \
            audit_registry/deep_read_findings_delta_sms_v22_2026-08-29.json \
            audit_registry/finding_revalidation_registry_v0.1.json \
            docs/pdf_xsd_semantic_audit/deep_read/SMS_V2.2.md \
            docs/pdf_xsd_semantic_audit/SYSTEM_MONITORING_SERVICE_FINDINGS_REGISTER_ADDENDUM.md \
            docs/pdf_xsd_semantic_audit/validation_backlog.md \
            docs/pdf_xsd_semantic_audit/EVIDENCE_ID_POLICY.md \
            docs/pdf_xsd_semantic_audit/24o_executable_validation_sms_v22.md \
            docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_SMS_V22_DEEP_READ_2026-08-29.md
          git rm tools/temp_finalize_sms_v22.py
          git rm .github/workflows/temp-finalize-sms-v22.yml
          if git diff --cached --name-only | grep -E '\.xsd$'; then echo 'XSD change forbidden'; exit 1; fi
          git config user.name MarcLeinenDE
          git config user.email 34336531+MarcLeinenDE@users.noreply.github.com
          git commit -m 'Deep-read SystemMonitoringService V2.2 and confirm EV-116'
          git push origin HEAD:dev/schema-integration
