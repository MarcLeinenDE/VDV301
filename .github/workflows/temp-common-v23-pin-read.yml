name: temp-common-v23-pin-read

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-common-v23-pin-read.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-read:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Fetch, verify and render exact COMMON V2.3 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p common-v23-pinned-read/pages
          url='https://www.vdv.de/301-2-1-sdes-v2-3-commonstructure-enums.pdfx'
          pdf='common-v23-pinned-read/COMMON_V2.3.pdf'
          curl --fail --location --retry 3 --retry-delay 2 --output "$pdf" "$url"
          test "$(head -c 5 "$pdf")" = '%PDF-'
          sha="$(sha256sum "$pdf" | awk '{print $1}')"
          size="$(stat -c %s "$pdf")"
          test "$sha" = 'd59620b22e7f6d3e47ad0dabdac5ce4b6e8ec5d2965fb68a95003ded8dd4986b'
          test "$size" = '793521'
          pdfinfo "$pdf" > common-v23-pinned-read/pdfinfo.txt
          pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
          pdftotext -layout "$pdf" common-v23-pinned-read/fulltext.txt
          pdftoppm -png -r 120 "$pdf" common-v23-pinned-read/pages/page >/dev/null 2>&1
          fulltext_sha="$(sha256sum common-v23-pinned-read/fulltext.txt | awk '{print $1}')"
          printf 'source_id=COMMON_V2.3\nurl=%s\nsha256=%s\nsize_bytes=%s\npages=%s\nfulltext_sha256=%s\n' "$url" "$sha" "$size" "$pages" "$fulltext_sha" > common-v23-pinned-read/manifest.txt
          (cd common-v23-pinned-read && sha256sum pages/*.png > page_hashes.sha256)
          cat common-v23-pinned-read/manifest.txt

      - name: Upload exact read artifact
        uses: actions/upload-artifact@v4
        with:
          name: common-v23-pinned-read
          path: common-v23-pinned-read/
          if-no-files-found: error
