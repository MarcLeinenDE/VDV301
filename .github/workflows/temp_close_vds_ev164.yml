name: temp-close-vds-ev164

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_close_vds_ev164.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  close-vds:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev/schema-integration

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check lxml==6.1.2

      - name: Verify exact closure inputs and snapshot immutable XSDs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/close_vds_revalidation_block.py)" = "8c7435a79b4c807df4069e5031cdcd8007d17600"
          test "$(git hash-object tools/validate_vds_revalidation_ev164.py)" = "fe2e11a9389accd4c3b111530d56bda1621e2036"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "13ef10dfe353ad51b2cecd371333bd12e35c8e6b"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "81d24c501c5fd483853075fbdc9edeecdc7d6df7"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/vds-close-xsd-before.sha256
          git diff --exit-code

      - name: Verify successful EV-164 evidence online
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/34838003303" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/34838003303" --jq .head_sha)" = "233e54e59bb027a629c9f16274666b336866951d"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10345007994" --jq .digest)" = "sha256:ef85ea5999c2fee585b493fb3705031d6a231e251efab7bcce6d92e30d6f05dd"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10345007994" --jq .expired)" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33111119723" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9662552176" --jq .digest)" = "sha256:b97d2e4506ffd63b8ff7985765131826d409e32769fb3a08193084134ca00ec0"

      - name: Verify exact upstream V2.0 and historical V1.0 authority
        shell: bash
        run: |
          set -euo pipefail
          git remote remove audit-upstream 2>/dev/null || true
          git remote add audit-upstream https://github.com/VDVde/VDV301.git
          git fetch --no-tags audit-upstream refs/tags/VDV-301-2.0
          test "$(git rev-parse FETCH_HEAD^{commit})" = "f2569a91f0a7c737a0ca7c0280b28ad223d7ee08"
          test "$(git rev-parse FETCH_HEAD:IBIS-IP_VideoDisplayService_V2.0.xsd)" = "fcfdadd3b62a584370cae326004050b4dc832e23"
          test "$(git rev-parse FETCH_HEAD:IBIS-IP_common_V2.0.xsd)" = "8608e3dcd665c197c34da7f6ec6af5a3758da164"
          test "$(git rev-parse FETCH_HEAD:IBIS-IP_Enumerations_V2.0.xsd)" = "27e3c183b00381d959622d13c10543123af8eef6"
          git fetch --no-tags audit-upstream refs/tags/VDV-301-1.0
          test "$(git rev-parse FETCH_HEAD^{commit})" = "f5b53785f703e898632603eec3bfa3555a79fdba"
          ! git ls-tree -r --name-only FETCH_HEAD | grep -Eq '(^|/)IBIS-IP_VideoDisplayService_V1\.0\.xsd$'
          ! git show FETCH_HEAD:IBIS_IP_V1.0.xsd | grep -q 'VideoDisplayService'

      - name: Reacquire exact official VDS PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence_sources evidence_out
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "https://www.vdv.de/301-2-13-sds.pdfx" -o evidence_sources/VDS_V1.0.pdf
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 "https://www.vdv.de/301-2-13-sdes-v2-0-video-display-service.pdfx" -o evidence_sources/VDS_V2.0.pdf
          test "$(stat -c '%s' evidence_sources/VDS_V1.0.pdf)" = "1202943"
          test "$(sha256sum evidence_sources/VDS_V1.0.pdf | awk '{print $1}')" = "9280cc239cf71bb158ab5941b522a2c4c822420e07ed44f4d4111d9689418480"
          test "$(stat -c '%s' evidence_sources/VDS_V2.0.pdf)" = "903444"
          test "$(sha256sum evidence_sources/VDS_V2.0.pdf | awk '{print $1}')" = "c287df20d8225af2afcd37dfdb487eb4922b89ce78c287da91745d12b410c8a2"

      - name: Verify visual evidence and external terminology
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33225843645" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9706815054" --jq .digest)" = "sha256:ff288301329a8fc3ea7e5e1fa568f06b0b6b5c4e76270f9c720a3a60eb29c9cd"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/33226294383" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9706970109" --jq .digest)" = "sha256:a8f9a098f7bbf534d41c1586230a45518ada62c67482494d8ba9b0debb617fb1"
          curl -fsSL --retry 3 "https://www.rfc-editor.org/rfc/rfc3550.txt" -o evidence_out/rfc3550.txt
          grep -Fiq "real-time transport protocol" evidence_out/rfc3550.txt
          curl -fsSL --retry 3 "https://docs.oasis-open.org/soa-rm/v1.0/soa-rm.html" -o evidence_out/oasis-soa-rm.html
          grep -Fiq "Service Oriented Architecture" evidence_out/oasis-soa-rm.html

      - name: Rerun EV-103 and EV-164
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_video_v20_compositors.py | tee evidence_out/ev103-rerun.log
          grep -Fq "PASSED: EV-103 video compositor behaviour confirmed" evidence_out/ev103-rerun.log
          python tools/validate_vds_revalidation_ev164.py \
            --vds-v10-pdf evidence_sources/VDS_V1.0.pdf \
            --vds-v20-pdf evidence_sources/VDS_V2.0.pdf \
            --output evidence_out/vds_ev164_evidence.json \
            | tee evidence_out/ev164-rerun.log
          grep -Fq "PASSED: EV-164 VDS aggregate evidence gate" evidence_out/ev164-rerun.log

      - name: Run complete 50-root-XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py | tee evidence_out/xsd-pool.log
          grep -Fq "PASSED" evidence_out/xsd-pool.log
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50

      - name: Prepare atomic VDS closure
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/close_vds_revalidation_block.py | tee evidence_out/closure-writer.log
          grep -Fq "PASSED: VDS closure files prepared; expected poststate 176/16 -> VLS-001" evidence_out/closure-writer.log

      - name: Enforce exact three-path mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 --untracked-files=all
          git status --porcelain=v1 --untracked-files=all | cut -c4- | sort > /tmp/actual-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          00_START_HERE/CURRENT_STATE.json
          audit_registry/finding_revalidation_registry_v0.1.json
          docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDS_2026-09-14.md
          EOF
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

      - name: Verify exact poststate and immutability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          terminal = {"context_verified","executable_confirmed","contextual_not_defect","withdrawn","unresolved","superseded"}
          expected = {
              "VDS-001":"context_verified",
              "VDS-002":"executable_confirmed",
              "VDS-003":"executable_confirmed",
              "VDS-004":"executable_confirmed",
              "VDS-005":"context_verified",
              "VDS-006":"context_verified",
              "VDS-007":"context_verified",
              "VDS-008":"context_verified",
          }
          reg = json.loads(Path("audit_registry/finding_revalidation_registry_v0.1.json").read_text())
          entries = reg["inventory"]["entries"]
          byid = {x["finding_id"]: x for x in entries}
          assert len(entries) == len(byid) == 192
          assert sum(x["revalidation_state"] in terminal for x in entries) == 176
          assert sum(x["revalidation_state"] == "pending" for x in entries) == 16
          assert next(x["finding_id"] for x in entries if x["revalidation_state"] == "pending") == "VLS-001"
          assert reg["next_revalidation_block"] == "VLS"
          assert reg["revalidation_blocks"]["VDS"]["state"] == "completed"
          assert reg["revalidation_blocks"]["VDS"]["artifact_digest"] == "sha256:ef85ea5999c2fee585b493fb3705031d6a231e251efab7bcce6d92e30d6f05dd"
          for fid, state in expected.items():
              assert byid[fid]["revalidation_state"] == state, (fid, byid[fid])
          current = json.loads(Path("00_START_HERE/CURRENT_STATE.json").read_text())["audit"]
          assert current["finding_revalidation_completed_findings"] == 176
          assert current["finding_revalidation_pending_findings"] == 16
          assert current["finding_revalidation_next_block"] == "VLS"
          assert current["finding_revalidation_latest_completed_block"] == "VDS"
          assert current["latest_revalidation_evidence_id"] == "EV-164"
          assert Path("docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDS_2026-09-14.md").is_file()
          print("POSTSTATE PASS: 176/16 -> VLS-001")
          PY
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          sha256sum ./*.xsd | sort -k2 > /tmp/vds-close-xsd-after.sha256
          cmp /tmp/vds-close-xsd-before.sha256 /tmp/vds-close-xsd-after.sha256

      - name: Commit and push atomic VDS closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00_START_HERE/CURRENT_STATE.json \
                  audit_registry/finding_revalidation_registry_v0.1.json \
                  docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDS_2026-09-14.md
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "audit: close VDS revalidation without schema mutation"
          git push origin HEAD:dev/schema-integration
