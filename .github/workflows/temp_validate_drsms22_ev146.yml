name: Temp validate DRSMS22 EV-146

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_validate_drsms22_ev146.yml
      - tools/validate_drsms22_revalidation_ev146.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Snapshot root XSD hashes
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256

      - name: Fetch exact byte-pinned SMS V2.2 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          sid='SMS_V2.2'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==sid)
          pin=next(x for x in pins['sources'] if x['source_id']==sid)
          for attempt in range(4):
              try:
                  req=urllib.request.Request(source['official_url'],headers={'User-Agent':'VDV301-Audit-EV146/0.1 (+https://github.com/MarcLeinenDE/VDV301)','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(2*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert sha==pin['expected_sha256']=='996f639a81cb91ad20a8e78b6213e7c85d41ff0ec42caba4208d6c4652b140f4'
          assert len(data)==int(pin['expected_size_bytes'])==847416
          target=Path('local_sources/vdv_pdfs')/source['local_filename']
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {sid} file={source["local_filename"]} sha256={sha} size={len(data)}')
          PY

      - name: Run EV-146
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_drsms22_revalidation_ev146.py --repo-root . --output-dir artifacts/ev146

      - name: Validate complete XSD pool
        run: python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Verify immutable boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          test -z "$(git diff --name-only | grep -E '\.xsd$' || true)"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/ev146/ev146_results.json').read_text())
          assert r['evidence_id']=='EV-146' and r['result']=='PASS'
          assert r['scope']==['DRSMS22-001','DRSMS22-002','DRSMS22-003','DRSMS22-004']
          assert r['recommended_terminal_states']=={f' DRSMS22-{i:03d}'.strip():'context_verified' for i in range(1,5)}
          assert r['prior_executable_evidence']['evidence_id']=='EV-116'
          assert r['prior_executable_evidence']['rerun_result']=='PASS'
          assert r['xsd_mutated'] is False and r['frozen_inventory_mutated'] is False
          print('EV-146 immutable-boundary verification PASS')
          PY

      - name: Upload EV-146 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drsms22-ev146
          path: artifacts/ev146
          if-no-files-found: error
          retention-days: 90
