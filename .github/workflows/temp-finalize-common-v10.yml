name: Temporary finalize Common V1.0 Deep Read

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-finalize-common-v10.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run deterministic closure finalizer
        run: python tools/temp_finalize_common_v10.py

      - name: Validate JSON and change boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              '00_START_HERE/CURRENT_STATE.json',
              'audit_registry/deep_read_registry_delta_common_v10_2026-08-29.json',
              'audit_registry/deep_read_findings_delta_common_v10_2026-08-30.json',
              'audit_registry/finding_revalidation_registry_v0.1.json',
          ]:
              json.loads(Path(path).read_text(encoding='utf-8'))
              print('OK JSON', path)
          PY
          if git diff --name-only | grep -E '\.xsd$'; then
            echo 'ERROR: XSD change detected in audit closure'
            exit 1
          fi
          test -f tools/validate_common_v10_ev117.py
          grep -q 'EV-117' docs/pdf_xsd_semantic_audit/EVIDENCE_ID_POLICY.md
          grep -q 'DRCOM10-007' audit_registry/deep_read_findings_delta_common_v10_2026-08-30.json
          grep -q 'COMMON_V2.0' 00_START_HERE/CURRENT_STATE.json
          git diff --check
          git diff --stat

      - name: Remove temporary finalizer files
        run: |
          rm tools/temp_finalize_common_v10.py
          rm .github/workflows/temp-finalize-common-v10.yml

      - name: Commit closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Marc Leinen'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -E '\.xsd$'; then
            echo 'ERROR: staged XSD change detected'
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Deep-read Common V1.0 and confirm EV-117'
          git push origin HEAD:dev/schema-integration
