name: DRTIME10 registry closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/drtime10-registry-closure.yml
      - audit_registry/drtime10_revalidation_evidence_2026-09-06.json

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF and XSD tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Snapshot immutable XSD pool
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/drtime10_revalidation_evidence_2026-09-06.json)" = "649c5b035e6fcc4f201555b467a1500ef06e09e7"
          test "$(git rev-parse HEAD:docs/pdf_xsd_semantic_audit/deep_read/TIME_V1.0.md)" = "82a88fbd6dae5d22f472bf144770d915fcc902ea"

      - name: Fetch exact byte-pinned TIME V1.0 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          sid='TIME_V1.0'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==sid)
          pin=next(x for x in pins['sources'] if x['source_id']==sid)
          assert source['official_url']=='https://www.vdv.de/301-2-10sds-v-1-01.pdfx'
          assert source['local_filename']=='TIME_V1.0.pdf'
          assert pin['expected_sha256']=='d040f503be8e82f5500220ba5cc9b0b41a2fa10db80d9f3980eed191378594d3'
          assert int(pin['expected_size_bytes'])==515920
          assert str(pin['evidence_run_id'])=='33196758957'
          for attempt in range(4):
              try:
                  req=urllib.request.Request(source['official_url'],headers={
                      'User-Agent':'VDV301-Audit-EV147-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                      'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(2*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert sha==pin['expected_sha256']
          assert len(data)==int(pin['expected_size_bytes'])
          target=Path('local_sources/vdv_pdfs')/source['local_filename']
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print('TIME_V10_PDF_PIN_OK',sha,len(data))
          PY

      - name: Re-run EV-147 and repository XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_drtime10_revalidation_ev147.py --repo-root . --output-dir artifacts/ev147-closure
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Close DRTIME10 block atomically
        shell: bash
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}
          CLOSURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json,os
          from pathlib import Path

          rp=Path('audit_registry/finding_revalidation_registry_v0.1.json')
          sp=Path('00_START_HERE/CURRENT_STATE.json')
          ep=Path('audit_registry/drtime10_revalidation_evidence_2026-09-06.json')
          report=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTIME10_2026-09-06.md')
          d=json.loads(rp.read_text(encoding='utf-8'))
          s=json.loads(sp.read_text(encoding='utf-8'))
          e=json.loads(ep.read_text(encoding='utf-8'))
          run_id=os.environ['CLOSURE_RUN_ID']; run_url=os.environ['CLOSURE_RUN_URL']

          scope=['DRTIME10-001','DRTIME10-002','DRTIME10-003']
          states={fid:'context_verified' for fid in scope}

          assert e['evidence_id']=='EV-147' and e['result']=='PASS'
          assert e['scope']==scope
          assert e['successful_run_id']=='34028395412'
          assert e['successful_job_id']=='101473376840'
          assert e['head_sha']=='686ce92ede0f1391e04a4260bc7adf98b6ae3103'
          assert e['artifact_id']=='9987794844'
          assert e['artifact_digest']=='sha256:2fbb9272c55ebbe704ae4736f488af5758bc0cbbbc8902e77d1a46e19b1ffc92'
          assert e['authority']['source_id']=='TIME_V1.0'
          assert e['authority']['pdf_sha256']=='d040f503be8e82f5500220ba5cc9b0b41a2fa10db80d9f3980eed191378594d3'
          assert e['authority']['semantic_authority_lane']=='PDF/API/prose'
          assert e['authority']['time_service_xsd_authority'] is False
          assert e['authority']['xsd_pool_role']=='repository-regression-only'
          assert e['rederived_invariants']['cyclic_time_broadcast_expected'] is False
          assert e['fresh_visual_evidence']['status']=='PASS'
          assert sorted(map(int,e['fresh_visual_evidence']['physical_pages'].keys()))==[4,6,7]
          assert e['full_xsd_pool']=={
            'count':50,'result':'PASS','role':'repository-regression-only','time_service_semantic_authority':False}
          assert e['immutable_guards']['xsd_mutated'] is False
          assert e['immutable_guards']['frozen_inventory_mutated'] is False
          assert {k:v['recommended_terminal_state'] for k,v in e['finding_results'].items()}==states

          inv=d['inventory']; entries=inv['entries']
          assert inv['state']=='frozen' and inv['entry_count']==192 and len(entries)==192
          assert d['next_revalidation_block']=='DRTIME10'
          pre_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          pre_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (pre_terminal,pre_pending)==(114,78),(pre_terminal,pre_pending)
          by={x['finding_id']:x for x in entries}
          for fid in scope:
              assert by[fid]['revalidation_state']=='pending'
              assert by[fid]['terminal_state_source'] is None
              by[fid]['revalidation_state']='context_verified'
              by[fid]['terminal_state_source']=str(report)

          post_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          post_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (post_terminal,post_pending)==(117,75),(post_terminal,post_pending)

          first_pending=next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')
          assert first_pending=='DRTRAINSET21-001', first_pending
          assert all(by[f]['revalidation_state']=='pending' for f in ['DRTRAINSET21-001','DRTRAINSET21-002','DRTRAINSET21-003'])
          assert by['DRTRAINSET22-001']['revalidation_state']=='pending'
          next_block='DRTRAINSET21'
          next_subblock='TRAINSET_V2.1_DRTRAINSET21'
          d['next_revalidation_block']=next_block

          blocks=d['revalidation_blocks']
          assert 'TIME_V1.0_DRTIME10' not in blocks
          assert blocks['SMS_V2.2_DRSMS22']['state']=='completed'
          prior_sms=copy.deepcopy(blocks['SMS_V2.2_DRSMS22'])
          prior_drs=copy.deepcopy(blocks['DOOR_V2.1_DRS'])
          blocks['TIME_V1.0_DRTIME10']={
            'date':'2026-09-06',
            'state':'completed',
            'parent_block':'DRTIME10',
            'scope_kind':'frozen_deep_read_findings_subblock',
            'source_id':'TIME_V1.0',
            'publication':'VDV 301-2-10 TimeService V1.0, 02/2018',
            'authority_lane':'byte-pinned official TimeService PDF plus API/prose protocol profile; TimeService XSD semantic authority is not applicable',
            'pdf_sha256':'d040f503be8e82f5500220ba5cc9b0b41a2fa10db80d9f3980eed191378594d3',
            'pdf_size_bytes':515920,
            'original_pin_evidence_run_id':'33196758957',
            'deep_read_blob':'82a88fbd6dae5d22f472bf144770d915fcc902ea',
            'time_service_xsd_authority':False,
            'xsd_pool_role':'repository-regression-only',
            'evidence_id':'EV-147',
            'evidence_run_id':'34028395412',
            'evidence_job_id':'101473376840',
            'evidence_head_sha':'686ce92ede0f1391e04a4260bc7adf98b6ae3103',
            'artifact_id':'9987794844',
            'artifact_digest':'sha256:2fbb9272c55ebbe704ae4736f488af5758bc0cbbbc8902e77d1a46e19b1ffc92',
            'evidence_record':str(ep),
            'closure_run_id':run_id,
            'closure_run_url':run_url,
            'fresh_visual_physical_pages':[4,6,7],
            'visual_gap_status':'closed_by_fresh_byte_pinned_render_and_manual_inspection',
            'historical_RV_003_status':'deep_read_reference_only_no_current_checker_claimed',
            'cyclic_time_broadcast_expected':False,
            'findings':states,
            'non_promoted_findings':['FR-TIM10-SEM-001','FR-TIM10-SEM-004'],
            'terminal_state_source':str(report),
            'xsd_mutation':False,
            'frozen_inventory_mutation':False,
            'next_block':next_block,
            'next_subblock':next_subblock
          }
          assert blocks['SMS_V2.2_DRSMS22']==prior_sms
          assert blocks['DOOR_V2.1_DRS']==prior_drs

          a=s['audit']
          assert a['finding_inventory_count']==192
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(114,78)
          assert a['finding_revalidation_next_block']=='DRTIME10'
          assert a['finding_revalidation_current_block']=='SMS_V2.2_DRSMS22'
          assert a['finding_revalidation_latest_completed_block']=='SMS_V2.2_DRSMS22'
          assert a['latest_revalidation_evidence_id']=='EV-146'
          assert 'drtime10_revalidation' not in a
          a['finding_revalidation_completed_findings']=117
          a['finding_revalidation_pending_findings']=75
          a['finding_revalidation_current_block']='TIME_V1.0_DRTIME10'
          a['finding_revalidation_latest_completed_block']='TIME_V1.0_DRTIME10'
          a['finding_revalidation_next_block']=next_block
          a['finding_revalidation_latest_terminal_state_source']=str(report)
          a['latest_revalidation_evidence_id']='EV-147'
          a['drtime10_revalidation']={
            'status':'complete',
            'completed_at_run':run_id,
            'evidence_id':'EV-147',
            'evidence_run_id':'34028395412',
            'evidence_job_id':'101473376840',
            'evidence_head_sha':'686ce92ede0f1391e04a4260bc7adf98b6ae3103',
            'artifact_id':'9987794844',
            'artifact_digest':'sha256:2fbb9272c55ebbe704ae4736f488af5758bc0cbbbc8902e77d1a46e19b1ffc92',
            'terminal_states':states,
            'semantic_authority_lane':'PDF/API/prose',
            'time_service_xsd_authority':False,
            'xsd_pool_role':'repository-regression-only',
            'fresh_visual_physical_pages':[4,6,7],
            'visual_gap_status':'closed',
            'cyclic_time_broadcast_expected':False,
            'report':str(report),
            'next_block':next_block,
            'next_subblock':next_subblock,
            'xsd_mutation':False,
            'frozen_inventory_mutation':False
          }

          rp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          report.write_text(f'''# Finding Revalidation — DRTIME10 / TimeService V1.0\n\nDate: 2026-09-06  \nScope: `DRTIME10-001`, `DRTIME10-002`, `DRTIME10-003`  \nEvidence: `EV-147`, successful evidence run `34028395412`, job `101473376840`  \nEvidence commit: `686ce92ede0f1391e04a4260bc7adf98b6ae3103`  \nClosure run: `{run_id}`\n\n## Authority route\n\nOfficial byte-pinned VDV 301-2-10 TimeService V1.0 PDF (`d040f503be8e82f5500220ba5cc9b0b41a2fa10db80d9f3980eed191378594d3`, 515920 bytes) on the **PDF/API/prose** authority lane. TimeService has **no XSD semantic authority** in this audit. The complete 50-XSD pool was rerun only as a repository regression and immutability guard.\n\nThe original pin derives from run `33196758957`. EV-147 verified that the current official VDV URL still returns exactly the pinned bytes. The current Deep Read is blob `82a88fbd6dae5d22f472bf144770d915fcc902ea`.\n\n## Visual-review closure\n\nThe older Deep Read remained `needs_visual_review` because interactive screenshot requests for the foreword and version history returned cache-miss. EV-147 resolved that boundary by rendering the exact pinned PDF at 180 DPI and preserving the PNGs in artifact `9987794844`. Physical PDF pages 4, 6 and 7 were then manually inspected. The old page numbers 3/5/6 were screenshot indices, not one-based physical page numbers.\n\n## DRTIME10-001 — context_verified\n\nPhysical page 4 visibly places the German and English forewords together. German correctly says VDV-Schrift 301-2-10 describes TimeService; English visibly says VDV 301-2-1 describes TimeService. The equivalent-document-identity counter-hypothesis is rejected by the same-page bilingual comparison and the publication identity itself. Documentation/resolver error only.\n\n## DRTIME10-002 — context_verified\n\nPhysical page 6 visibly contains the German statement that cyclic transmission of the current time is not intended. The directly following English TimeService section omits that sentence. This is a bilingual omission, not an English contradiction. The runtime/profile consequence remains conservative: do not infer a generic cyclic UDP time-broadcast service; synchronization remains the SNTP path.\n\n## DRTIME10-003 — context_verified\n\nPhysical page 7 visibly prints `define Type for Service-Discovery: _ibisip_udp._udp (cd. 1)`. The extraction-only counter-hypothesis is rejected by the fresh render. No intended replacement for `cd. 1` is invented.\n\n## Historical RV-003 reference\n\nThe current Deep Read records an older RV-003 check, including `cyclic_time_broadcast_expected() == False`. No current RV-003 checker or implementation with that name exists on the audited branch, so EV-147 does not pretend otherwise. The relevant invariant was re-derived directly from the pinned TimeService source and remains `false`.\n\n## Closure\n\nEV-147 PASS; closure rerun PASS; all 50 root XSDs PASS as regression-only evidence; frozen 192-finding inventory unchanged; no XSD mutation. Revalidation count is now **117/192 terminal, 75 pending**. The first remaining pending finding is `DRTRAINSET21-001`; next block is `DRTRAINSET21` (`TRAINSET_V2.1_DRTRAINSET21`).\n''',encoding='utf-8')
          print('DRTIME10_CLOSE_WRITE_OK terminal=117 pending=75 next=DRTRAINSET21')
          PY

      - name: Cleanup, verify allowlist, commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/ev147-closure local_sources/vdv_pdfs/TIME_V1.0.pdf tools/__pycache__
          rm .github/workflows/temp_validate_drtime10_ev147.yml
          rm .github/workflows/drtime10-registry-closure.yml

          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test -z "$(git diff --name-only | grep -E '\.xsd$' || true)"

          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          s=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          by={x['finding_id']:x for x in d['inventory']['entries']}
          scope=['DRTIME10-001','DRTIME10-002','DRTIME10-003']
          assert all(by[f]['revalidation_state']=='context_verified' for f in scope)
          assert d['revalidation_blocks']['TIME_V1.0_DRTIME10']['state']=='completed'
          assert d['next_revalidation_block']=='DRTRAINSET21'
          first=next(x['finding_id'] for x in d['inventory']['entries'] if x['revalidation_state']=='pending')
          assert first=='DRTRAINSET21-001'
          a=s['audit']
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(117,75)
          assert a['finding_revalidation_next_block']=='DRTRAINSET21'
          assert a['finding_revalidation_latest_completed_block']=='TIME_V1.0_DRTIME10'
          assert a['latest_revalidation_evidence_id']=='EV-147'

          allowed={
            '.github/workflows/temp_validate_drtime10_ev147.yml',
            '.github/workflows/drtime10-registry-closure.yml',
            'audit_registry/finding_revalidation_registry_v0.1.json',
            '00_START_HERE/CURRENT_STATE.json',
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTIME10_2026-09-06.md'
          }
          changed=set(subprocess.check_output(['git','status','--porcelain'],text=True).splitlines())
          paths={line[3:] for line in changed if len(line)>=4}
          assert paths==allowed,(paths,allowed)
          print('DRTIME10_POST_CLOSURE_CONSISTENCY_PASS')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: close DRTIME10 revalidation block [skip ci]'
          git push origin HEAD:dev/schema-integration
