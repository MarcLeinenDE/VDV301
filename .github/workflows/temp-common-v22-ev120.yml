name: temp-common-v22-ev120

on:
  workflow_dispatch:
  push:
    branches:
      - dev/schema-integration
    paths:
      - tools/validate_common_v22_ev120.py
      - .github/workflows/temp-common-v22-ev120.yml

permissions:
  contents: read

jobs:
  ev120:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check lxml

      - name: Run EV-120 Common V2.2 evidence
        run: python tools/validate_common_v22_ev120.py
