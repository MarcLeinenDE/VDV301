name: TEMP pin VDV 301-3 for EV-154

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_pin_network_vdv301_3_ev154.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Install PDF evidence tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify immutable audit prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/finding_revalidation_registry_v0.1.json)" = "c63feaaa2e88f36185e1b3b90a4aa41c5d560ac4"
          test "$(git rev-parse HEAD:00_START_HERE/CURRENT_STATE.json)" = "3706ebd462a4d02b6eefe823c433c0897663cd3a"
          test "$(git rev-parse HEAD:audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git rev-parse 7fad145f528205ef5c40e58a3a23374379b08189:docs/pdf_xsd_semantic_audit/deep_read/VDV301-3_02-2020.md)" = "ddb4f49da1e3afa55920e50f9e74e554748f1378"
          test "$(git rev-parse 7fad145f528205ef5c40e58a3a23374379b08189:docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_VDV301_3_02_2020_DEEP_READ_2026-08-29.md)" = "69bb404f71eb4173c8757b6c7751f2b3922588b9"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(wc -l < /tmp/xsd-before.sha256)" -eq 50

      - name: Fetch exact official VDV 301-3 bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local_sources/vdv_pdfs artifacts/ev154-network-pin/pages artifacts/ev154-network-pin/text
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          source_id = "VDV301-3_02-2020"
          registry = json.loads(Path("audit_registry/pdf_source_registry_v0.1.json").read_text(encoding="utf-8"))
          source = next(x for x in registry["sources"] if x["source_id"] == source_id)
          assert source["official_url"] == "https://www.vdv.de/301-3-sdes-network-infrastructure.pdfx"
          assert source["local_filename"] == "VDV301-3_02-2020.pdf"
          expected_sha = "edfedf36eeb18075b45bf5224f0da6500cdd489438091f18bada42f9668c2a99"
          expected_size = 558005
          data = None
          for attempt in range(4):
              try:
                  req = urllib.request.Request(source["official_url"], headers={
                      "User-Agent": "VDV301-Audit-EV154-Pin/0.1 (+https://github.com/MarcLeinenDE/VDV301)",
                      "Accept": "application/pdf,application/octet-stream;q=0.9,*/*;q=0.1",
                  })
                  with urllib.request.urlopen(req, timeout=90) as response:
                      data = response.read()
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(2 * (attempt + 1))
          assert data is not None and data.startswith(b"%PDF-")
          assert hashlib.sha256(data).hexdigest() == expected_sha
          assert len(data) == expected_size
          target = Path("local_sources/vdv_pdfs") / source["local_filename"]
          target.write_bytes(data)
          result = {
              "source_id": source_id,
              "official_url": source["official_url"],
              "local_filename": source["local_filename"],
              "sha256": expected_sha,
              "size_bytes": expected_size,
              "retrieved_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "pdf_signature_ok": True,
              "registry_mutated": False,
              "historical_pin_sha_match": True,
          }
          Path("artifacts/ev154-network-pin/pin-result.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print("EV154_NETWORK_PIN_OK", expected_sha, expected_size)
          PY

      - name: Extract and render finding evidence pages
        shell: bash
        run: |
          set -euo pipefail
          pdf=local_sources/vdv_pdfs/VDV301-3_02-2020.pdf
          for p in 6 7 8 11 14 20 29; do
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 180 "$pdf" "artifacts/ev154-network-pin/pages/page-$p"
            pdftotext -f "$p" -l "$p" -layout "$pdf" "artifacts/ev154-network-pin/text/page-$p-layout.txt"
            pdftotext -f "$p" -l "$p" -raw "$pdf" "artifacts/ev154-network-pin/text/page-$p-raw.txt"
          done
          pdftotext "$pdf" artifacts/ev154-network-pin/full-text.txt
          pdfinfo "$pdf" > artifacts/ev154-network-pin/pdfinfo.txt
          sha256sum "$pdf" > artifacts/ev154-network-pin/pdf.sha256
          sha256sum artifacts/ev154-network-pin/full-text.txt > artifacts/ev154-network-pin/full-text.sha256
          find artifacts/ev154-network-pin -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifacts/ev154-network-pin/manifest.sha256
          cat artifacts/ev154-network-pin/pin-result.json
          cat artifacts/ev154-network-pin/pdfinfo.txt

      - name: Verify repository remained immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code -- '*.xsd'
          git diff --exit-code

      - name: Upload EV-154 network pin evidence
        uses: actions/upload-artifact@v4
        with:
          name: network-vdv301-3-ev154-pin
          path: artifacts/ev154-network-pin
          if-no-files-found: error
          retention-days: 90
