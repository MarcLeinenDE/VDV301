name: temp-close-finding-readiness-ev167

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_close_finding_readiness_ev167.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  close-readiness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check lxml==6.1.2 pypdf

      - name: Verify exact closure inputs and snapshot immutable XSDs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/close_finding_readiness_ev167.py)" = "88a063d26a2fd2f58593bec6a9c3ee95870a2e56"
          test "$(git hash-object tools/validate_finding_readiness_ev167.py)" = "a4c13eab177a64b0f18140673c07e8ef5fdcbf63"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "8635e6d6a5e3f6f9a358760d35e716a0b065b277"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "c5b5d7f29203a23d42fe9feee54ab2c130850191"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "bc60527ddc158d967470a63d38ffd035e5ec1400"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/ev167-close-xsd-before.sha256
          git diff --exit-code

      - name: Verify successful EV-167 evidence online
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34843562886 --jq .conclusion)" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/jobs/103973944657 --jq .conclusion)" = "success"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10347047619 --jq .digest)" = "sha256:d978765cfbd90b5f0ab345d9f6626b3ead6c051ac3477cf6a542d6db74a36bf2"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/34843562886 --jq .head_sha)" = "171ff38a4b9df401429749ad9c8b5133de4d2e9a"

      - name: Reacquire CIS V1.1 and verify authority boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence_sources evidence_out
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://www.vdv.de/301-2-3-sds-v1-1.pdfx" \
            -o evidence_sources/CIS_V1.1.pdf
          test "$(stat -c '%s' evidence_sources/CIS_V1.1.pdf)" = "809729"
          test "$(sha256sum evidence_sources/CIS_V1.1.pdf | awk '{print $1}')" = "f9d63dd1f2e417691913e57a9c7121c90b4e781cbcd1328be681695975f59739"
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          src=Path('evidence_sources/CIS_V1.1.pdf')
          out=Path('evidence_out/cis_v11_text.txt')
          text='\n'.join((p.extract_text() or '') for p in PdfReader(str(src)).pages)
          out.write_text(text, encoding='utf-8')
          for token in ('SpeakerActive','StopInformationActive'):
              if token not in text:
                  raise SystemExit(f'missing published token {token}')
          PY
          if git ls-remote --tags https://github.com/VDVde/VDV301.git refs/tags/VDV-301-1.1 | grep -q .; then
            echo "Unexpected VDV-301-1.1 release tag exists" >&2
            exit 1
          fi
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            "https://raw.githubusercontent.com/VDVde/VDV301/0a5228a768c7d710c40f5f99fbdce2e544d19883/IBIS-IP_CustomerInformationService_V1.1.xsd" \
            -o evidence_sources/IBIS-IP_CustomerInformationService_V1.1.xsd
          test "$(git hash-object evidence_sources/IBIS-IP_CustomerInformationService_V1.1.xsd)" = "5957e27f128a191c794b0c8081b531a07126784a"
          ! grep -Fq 'SpeakerActive' evidence_sources/IBIS-IP_CustomerInformationService_V1.1.xsd
          ! grep -Fq 'StopInformationActive' evidence_sources/IBIS-IP_CustomerInformationService_V1.1.xsd

      - name: Rerun EV-167 and complete 50-root-XSD pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_readiness_ev167.py \
            --cis-v11-pdf evidence_sources/CIS_V1.1.pdf \
            --cis-v11-text evidence_out/cis_v11_text.txt \
            --working-cis-xsd evidence_sources/IBIS-IP_CustomerInformationService_V1.1.xsd \
            --output evidence_out/ev167_readiness.json \
            | tee evidence_out/ev167.log
          grep -Fq "PASSED: EV-167 final finding-knowledge readiness gate" evidence_out/ev167.log
          python tools/validate_xsd_pool.py | tee evidence_out/xsd_pool.log
          grep -Fq "PASSED" evidence_out/xsd_pool.log

      - name: Prepare atomic final readiness closure
        shell: bash
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}
          CLOSURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_finding_readiness_ev167.py | tee evidence_out/closure.log
          grep -Fq "PASSED: final EV-167 finding readiness closure prepared" evidence_out/closure.log

      - name: Enforce exact three-path mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence_out evidence_sources
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            '00_START_HERE/CURRENT_STATE.json'
            'audit_registry/finding_revalidation_registry_v0.1.json'
            'docs/pdf_xsd_semantic_audit/FINDING_READINESS_RECONCILIATION_2026-09-14.md'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          git diff --check
          if git status --porcelain | grep -E '\.xsd$'; then
            echo 'XSD mutation detected' >&2
            exit 1
          fi

      - name: Verify exact poststate and immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort -k2 > /tmp/ev167-close-xsd-after.sha256
          cmp /tmp/ev167-close-xsd-before.sha256 /tmp/ev167-close-xsd-after.sha256
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "bc60527ddc158d967470a63d38ffd035e5ec1400"
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          state=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          entries=reg['inventory']['entries']
          by={e['finding_id']:e for e in entries}
          terminal={'context_verified','executable_confirmed','contextual_not_defect','withdrawn','unresolved','superseded'}
          assert len(entries)==192 and all(e['revalidation_state'] in terminal for e in entries)
          assert not [e for e in entries if e['revalidation_state'] in {'pending','unresolved'}]
          assert by['CIS-001']['revalidation_state']=='context_verified'
          assert reg['sdk_readiness']['finding_knowledge_ready'] is True
          assert reg['sdk_readiness']['readiness_reconciliation_pending']==[]
          assert reg['next_revalidation_block'] is None
          assert state['project_phase']=='finding_baseline_freeze_ready'
          assert state['audit']['finding_knowledge_ready'] is True
          assert state['audit']['finding_revalidation_completed_findings']==192
          assert state['audit']['finding_revalidation_pending_findings']==0
          print('POSTSTATE_OK')
          PY

      - name: Commit and push final readiness closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            00_START_HERE/CURRENT_STATE.json \
            audit_registry/finding_revalidation_registry_v0.1.json \
            docs/pdf_xsd_semantic_audit/FINDING_READINESS_RECONCILIATION_2026-09-14.md
          git diff --cached --check
          git commit -m 'audit: complete finding knowledge readiness'
          git push origin HEAD:dev/schema-integration
