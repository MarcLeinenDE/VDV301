name: TEMP close PCS EV-155

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_close_pcs_ev155.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-pcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Verify immutable PCS prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/finding_revalidation_registry_v0.1.json)" = "865a21115cec1beb556af000c71717ae774459cb"
          test "$(git rev-parse HEAD:00_START_HERE/CURRENT_STATE.json)" = "ee9120db8b01e26e888ad6b512c0a49d8751d700"
          test "$(git rev-parse HEAD:tools/validate_pcs_revalidation_ev155.py)" = "99483fe79fdffa35b81d6890469499a4546efab6"
          test "$(git rev-parse HEAD:tools/validate_pcs_v21_operation_not_supported.py)" = "ffb932f19b669cd0584943063fc14cb4fd5daba8"
          test "$(git rev-parse HEAD:tools/close_pcs_revalidation_block.py)" = "ffb46f71169706098aa35f90c239d5f9370c60df"
          test "$(git rev-parse HEAD:IBIS-IP_PassengerCountingService_V1.0.xsd)" = "4161872be76740abfdd1cddf96f8a736333fc8be"
          test "$(git rev-parse HEAD:IBIS-IP_PassengerCountingService_V2.1.xsd)" = "59ef2ddb09b92db0d492974e38bad5b6be03865e"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(wc -l < /tmp/xsd-before.sha256)" -eq 50

      - name: Re-pin official PCS PDFs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/pcs-closure-ev155
          mkdir -p artifacts/pcs-closure-ev155/pdfs artifacts/pcs-closure-ev155/renders
          python - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          sources = {
            'PCS_V1.0': ('https://www.vdv.de/301-2-8-sd-2017-03.pdfx', '372be7a5d39c72e4bf405e3058f5af3d809eb611ac3548b70c526788d364c402', 918762),
            'PCS_V2.1': ('https://www.vdv.de/301-2-8-sds-v2-1-passengercounting.pdfx', '572f07adbb6999463433a3e764e47f29c8157a4e63aa88ea7c927393da7ec043', 1084925),
          }
          for sid, (url, expected_sha, expected_size) in sources.items():
              data = None
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'VDV301-Audit-EV155-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                      with urllib.request.urlopen(req, timeout=90) as response:
                          data = response.read()
                      break
                  except Exception:
                      if attempt == 3: raise
                      time.sleep(2 * (attempt + 1))
              assert data is not None and data.startswith(b'%PDF-')
              assert hashlib.sha256(data).hexdigest() == expected_sha
              assert len(data) == expected_size
              Path(f'artifacts/pcs-closure-ev155/pdfs/{sid}.pdf').write_bytes(data)
              print('PIN_OK', sid, expected_sha, expected_size)
          PY
          for p in 12 16 17; do
            pdftoppm -f "$p" -singlefile -r 180 -png artifacts/pcs-closure-ev155/pdfs/PCS_V2.1.pdf "artifacts/pcs-closure-ev155/renders/PCS_V2.1-page-$p" >/dev/null 2>&1
          done

      - name: Materialize exact official upstream PCS tags
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/pcs-upstream-git artifacts/pcs-upstream-v1 artifacts/pcs-upstream-v20
          mkdir -p artifacts/pcs-upstream-git artifacts/pcs-upstream-v1 artifacts/pcs-upstream-v20
          git -C artifacts/pcs-upstream-git init
          git -C artifacts/pcs-upstream-git remote add origin https://github.com/VDVde/VDV301.git
          git -C artifacts/pcs-upstream-git fetch --depth=1 origin refs/tags/VDV-301-1.0:refs/tags/VDV-301-1.0 refs/tags/VDV-301-2.0:refs/tags/VDV-301-2.0 refs/tags/VDV-301-2.1:refs/tags/VDV-301-2.1
          test "$(git -C artifacts/pcs-upstream-git rev-parse VDV-301-1.0)" = "ef38d3babebfbb72e6bcdc42c7026e13bab77f69"
          test "$(git -C artifacts/pcs-upstream-git rev-parse VDV-301-1.0^{})" = "f5b53785f703e898632603eec3bfa3555a79fdba"
          test "$(git -C artifacts/pcs-upstream-git rev-parse VDV-301-2.0^{})" = "f2569a91f0a7c737a0ca7c0280b28ad223d7ee08"
          test "$(git -C artifacts/pcs-upstream-git rev-parse VDV-301-2.1^{})" = "585e0bea34b64887db4276f1c94d5f3e78f06c66"
          test "$(git -C artifacts/pcs-upstream-git rev-parse VDV-301-1.0^{}:IBIS-IP_PassengerCountingService_V1.0.xsd)" = "600a3ee6290c630a4435fb06ca9803dabaceb788"
          test "$(git -C artifacts/pcs-upstream-git rev-parse VDV-301-1.0^{}:IBIS_IP_V1.0.xsd)" = "41289eaed2674a169fdf77a10a2eff293c76d5c4"
          test "$(git -C artifacts/pcs-upstream-git rev-parse VDV-301-2.0^{}:IBIS-IP_PassengerCountingService_V1.0.xsd)" = "4161872be76740abfdd1cddf96f8a736333fc8be"
          test "$(git -C artifacts/pcs-upstream-git rev-parse VDV-301-2.1^{}:IBIS-IP_PassengerCountingService_V2.1.xsd)" = "59ef2ddb09b92db0d492974e38bad5b6be03865e"
          git -C artifacts/pcs-upstream-git archive VDV-301-1.0^{} | tar -x -C artifacts/pcs-upstream-v1
          git -C artifacts/pcs-upstream-git archive VDV-301-2.0^{} | tar -x -C artifacts/pcs-upstream-v20

      - name: Re-run EV-155 and full XSD pool
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/validate_pcs_revalidation_ev155.py tools/validate_pcs_v21_operation_not_supported.py tools/close_pcs_revalidation_block.py
          python tools/validate_pcs_revalidation_ev155.py \
            --repo-root . \
            --pdf-v1 artifacts/pcs-closure-ev155/pdfs/PCS_V1.0.pdf \
            --pdf-v21 artifacts/pcs-closure-ev155/pdfs/PCS_V2.1.pdf \
            --upstream-v1-dir artifacts/pcs-upstream-v1 \
            --upstream-v20-dir artifacts/pcs-upstream-v20 \
            --output-dir artifacts/pcs-closure-ev155/result
          python - <<'PY'
          import json
          p='artifacts/pcs-closure-ev155/result/ev155_result.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['evidence_id']=='EV-155' and d['result']=='PASS'
          assert d['finding_results']['PCS-001']['recommended_terminal_state']=='executable_confirmed'
          assert d['finding_results']['PCS-001']['executable_result']=='PASS'
          assert d['finding_results']['PCS-002']['recommended_terminal_state']=='contextual_not_defect'
          assert d['finding_results']['PCS-002']['same_payload_sample_valid_old_service_only'] is False
          assert d['finding_results']['PCS-002']['same_payload_sample_valid_old_aggregate'] is True
          assert d['finding_results']['PCS-002']['same_payload_sample_valid_later_self_contained_service'] is True
          assert d['expected_poststate_if_closed']=={'terminal':140,'pending':52,'first_pending':'SMS-001','next_block':'SMS'}
          print('EV155_RESULT_OK')
          PY
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after-evidence.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after-evidence.sha256
          git diff --exit-code -- '*.xsd'

      - name: Apply fail-closed PCS closure
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_pcs_revalidation_block.py

      - name: Verify PCS poststate and immutability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          reg=json.load(open('audit_registry/finding_revalidation_registry_v0.1.json',encoding='utf-8'))
          st=json.load(open('00_START_HERE/CURRENT_STATE.json',encoding='utf-8'))['audit']
          entries=reg['inventory']['entries']
          by={x['finding_id']:x for x in entries}
          assert len(entries)==192
          assert by['PCS-001']['revalidation_state']=='executable_confirmed'
          assert by['PCS-002']['revalidation_state']=='contextual_not_defect'
          assert by['PCS-001']['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_PCS_2026-09-10.md'
          assert by['PCS-002']['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_PCS_2026-09-10.md'
          terminal_states={'context_verified','executable_confirmed','contextual_not_defect','withdrawn','unresolved','superseded'}
          assert sum(x['revalidation_state'] in terminal_states for x in entries)==140
          assert sum(x['revalidation_state']=='pending' for x in entries)==52
          assert next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')=='SMS-001'
          assert reg['next_revalidation_block']=='SMS'
          assert reg['revalidation_blocks']['PCS']['state']=='completed'
          assert st['finding_revalidation_completed_findings']==140
          assert st['finding_revalidation_pending_findings']==52
          assert st['finding_revalidation_next_block']=='SMS'
          assert st['finding_revalidation_latest_completed_block']=='PCS'
          assert st['latest_revalidation_evidence_id']=='EV-155'
          print('PCS_POSTSTATE_OK terminal=140 pending=52 next=SMS first=SMS-001')
          PY
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after-closure.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after-closure.sha256

      - name: Remove transient PCS workflows and enforce write allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_pin_pcs_ev155.yml
          rm -f .github/workflows/temp_validate_pcs_ev155.yml
          rm -f .github/workflows/temp_close_pcs_ev155.yml
          rm -rf artifacts/pcs-closure-ev155 artifacts/pcs-upstream-git artifacts/pcs-upstream-v1 artifacts/pcs-upstream-v20
          printf '%s\n' \
            '.github/workflows/temp_close_pcs_ev155.yml' \
            '.github/workflows/temp_pin_pcs_ev155.yml' \
            '.github/workflows/temp_validate_pcs_ev155.yml' \
            '00_START_HERE/CURRENT_STATE.json' \
            'audit_registry/finding_revalidation_registry_v0.1.json' \
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_PCS_2026-09-10.md' \
            | sort > /tmp/expected-paths.txt
          git status --porcelain=v1 | sed -E 's/^.. //' | sort > /tmp/actual-paths.txt
          echo 'EXPECTED'; cat /tmp/expected-paths.txt
          echo 'ACTUAL'; cat /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git diff --exit-code -- '*.xsd' audit_registry/finding_inventory_frozen_2026-09-03.json

      - name: Commit and push atomic PCS closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VDV301 Audit Bot'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git add -A -- \
            .github/workflows/temp_close_pcs_ev155.yml \
            .github/workflows/temp_pin_pcs_ev155.yml \
            .github/workflows/temp_validate_pcs_ev155.yml \
            00_START_HERE/CURRENT_STATE.json \
            audit_registry/finding_revalidation_registry_v0.1.json \
            docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_PCS_2026-09-10.md
          git diff --cached --name-only | sort > /tmp/staged-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/staged-paths.txt
          git diff --cached --check
          git commit -m 'audit: close PCS revalidation block'
          git push origin HEAD:dev/schema-integration
