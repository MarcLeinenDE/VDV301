name: temp-common-v24-pin-read

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-common-v24-pin-read.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-read:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Fetch, pin, render and bundle current V2.4 schema candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p common-v24-pinned-read/pages common-v24-pinned-read/xsd
          url='https://www.vdv.de/301-2-1-sde-v2-4-commonstructure-enums.pdfx'
          pdf='common-v24-pinned-read/COMMON_V2.4.pdf'
          curl --fail --location --retry 3 --retry-delay 2 --output "$pdf" "$url"
          test "$(head -c 5 "$pdf")" = '%PDF-'
          sha="$(sha256sum "$pdf" | awk '{print $1}')"
          size="$(stat -c %s "$pdf")"
          test "$(git hash-object IBIS-IP_common_V2.4.xsd)" = '1946fd37e29ced605654f49ea3d98cd2fbbdc8e4'
          test "$(git hash-object IBIS-IP_Enumerations_V2.4.xsd)" = '2afed8cf23afa91db92b0f043cc5b4ad428b0f25'
          cp IBIS-IP_common_V2.4.xsd common-v24-pinned-read/xsd/
          cp IBIS-IP_Enumerations_V2.4.xsd common-v24-pinned-read/xsd/
          pdfinfo "$pdf" > common-v24-pinned-read/pdfinfo.txt
          pages="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
          pdftotext -layout "$pdf" common-v24-pinned-read/fulltext.txt
          pdftoppm -png -r 120 "$pdf" common-v24-pinned-read/pages/page >/dev/null 2>&1
          fulltext_sha="$(sha256sum common-v24-pinned-read/fulltext.txt | awk '{print $1}')"
          printf 'source_id=COMMON_V2.4\nurl=%s\nsha256=%s\nsize_bytes=%s\npages=%s\nfulltext_sha256=%s\ncommon_branch_blob=1946fd37e29ced605654f49ea3d98cd2fbbdc8e4\nenumerations_branch_blob=2afed8cf23afa91db92b0f043cc5b4ad428b0f25\nbranch_schema_status=public_candidate_provenance_pending_exact_authority_resolution\n' "$url" "$sha" "$size" "$pages" "$fulltext_sha" > common-v24-pinned-read/manifest.txt
          (cd common-v24-pinned-read && sha256sum pages/*.png > page_hashes.sha256)
          cat common-v24-pinned-read/manifest.txt
      - name: Upload exact read artifact
        uses: actions/upload-artifact@v4
        with:
          name: common-v24-pinned-read
          path: common-v24-pinned-read/
          if-no-files-found: error
