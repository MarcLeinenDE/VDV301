name: temp-gate-runtime-mapping-review-sms-v22-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_sms_v22.yml

permissions:
  contents: read

jobs:
  gate-sms-v22-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d0a12051d6a8b8b3c91f21d1c2344d43338c68b6"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "e2ec9dba190f9881453e21e8e1663953bf500360"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "36736ce1dbd4cb5f0b83f77259f1e93a3a414a6c"
          test "$(git hash-object sdk_manifest/README.md)" = "aab4de1d9efac6f2374c27ace5c55e7b3302d049"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "4a98a01ba97cdf2a77260638fbc884f5ac52f16b"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "b20d492d8fa3eb46534083cc041064026f275fdc"

      - name: Validate synchronized runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':17,'not_applicable':113,'not_designed':1,'reviewed':61}
          assert r['counts']=={
              'reviewed_mapping_count':61,
              'implemented_count':0,
              'semantic_candidate_count':17,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='SMS_V22_SMS_002'
          print('PASSED: SMS V2.2 closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: SMS V2.2 runtime-mapping closure gate complete"
