name: temp-gate-runtime-mapping-review-cis-003-005

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_cis_003_005.yml

permissions:
  contents: read

jobs:
  gate-cis-runtime-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact CIS runtime-review prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "11171b2c132956fd265185e62b48bf92f554487f"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "fd73c0993cf379751709f8ef51d6e4337dfd3b49"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "29dce0ca9606d8df93f3aaf2266c8b44d1f87e10"
          test "$(git hash-object sdk_manifest/runtime_mapping_review_blocks/CIS_003_005_v0.1.json)" = "f4308095bdd6ffa13e3c2c36795df6e23d6528d1"
          test "$(git hash-object tools/validate_cis_ev125.py)" = "f220d509183c3643d0f3bb7416a653be2f5a809c"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_CIS_2026-09-03.md)" = "4e871dae28db1d36c99ff0ebcb553e7178681c4f"

      - name: Validate semantic and runtime mapping registries
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py

      - name: Verify CIS exact runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          semantic=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          mapping=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          block=json.loads(Path('sdk_manifest/runtime_mapping_review_blocks/CIS_003_005_v0.1.json').read_text())
          by={e['finding_id']:e for e in semantic['entries']}
          mapped={m['finding_id']:m for m in mapping['mappings']}

          for fid in ('CIS-003','CIS-004','CIS-005'):
              assert by[fid]['runtime_match']['state']=='reviewed'
              assert mapped[fid]['activation_class']=='xsd_invalid_advisory'
              assert mapped[fid]['required_precondition']=='xsd_result_invalid'
              assert mapped[fid]['result_effect']=='decorate_existing_invalid'
              assert mapped[fid]['implementation_state']=='reviewed_not_implemented'

          assert mapping['counts']=={
              'reviewed_mapping_count':35,
              'implemented_count':0,
              'semantic_candidate_count':46,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':110,
          }

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          profiles={
              '2.0':'IBIS-IP_CustomerInformationService_V2.0.xsd',
              '2.2':'IBIS-IP_CustomerInformationService_V2.2.xsd',
              '2.3':'IBIS-IP_CustomerInformationService_V2.3.xsd',
          }
          short_connection='CustomerInformationService.GetCurrentConnectionResponse'
          correct_connection='CustomerInformationService.GetCurrentConnectionInformationResponse'
          short_retrieve='CustomerInformationService.RetrievePartialStopRequest'
          correct_retrieve='CustomerInformationService.RetrievePartialStopSequenceRequest'

          for version,path in profiles.items():
              tree=etree.parse(path)
              etree.XMLSchema(tree)
              globals_=set(tree.xpath('/xs:schema/xs:element/@name',namespaces=NS))
              assert correct_connection in globals_ and short_connection not in globals_
              assert correct_retrieve in globals_ and short_retrieve not in globals_
              group=tree.xpath("/xs:schema/xs:group[@name='VehicleInformationGroup']",namespaces=NS)[0]
              own=group.xpath(".//xs:element[@name='MyOwnVehicleMode']",namespaces=NS)
              if version=='2.0':
                  assert own==[]
              else:
                  assert len(own)==1 and own[0].get('type')=='NetexMode'

          rb={e['finding_id']:e for e in block['entries']}
          assert rb['CIS-005']['authority_scope']=='official_CIS_V2.2_V2.3_only'
          assert any('must not run for CIS V2.0' in g for g in rb['CIS-005']['guards'])
          assert all(any('must require XSD INVALID' in g for g in rb[fid]['guards']) for fid in rb)

          ev=Path('tools/validate_cis_ev125.py').read_text()
          assert 'PDF short current-connection root' in ev
          assert 'PDF short retrieve root' in ev
          assert 'scalar PtModes-like value rejected' in ev
          print('PASSED: CIS-003..005 exact runtime boundaries verified')
          PY

      - name: Validate SDK baseline and all 50 root XSDs
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_sdk_manifest_v0_1.py
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: CIS runtime-mapping review gate complete; repository remains unmodified"
