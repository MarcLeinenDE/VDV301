name: temp-merge-semantic-classification-net-vdv3013-001-002

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_merge_semantic_classification_net_vdv3013_001_002.yml

permissions:
  contents: write

jobs:
  merge-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact prestate and NET-001/002 authority boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "560c60e2417754534bce9b4e9adf7a54af709155"
          test "$(git rev-parse HEAD^^)" = "8444062acd9a3427c69ed863dbc257420496ff1d"
          test "$(git hash-object audit_registry/semantic_classification_blocks/NET_VDV3013_001_002_v0.1.json)" = "17108b5787ce38cd4797a41672785c02b8582b92"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "51a41d8b27cee6487e40b999e88ed3ef1a5cf9e1"
          test "$(git hash-object audit_registry/network_vdv301_3_revalidation_evidence_2026-09-08.json)" = "efed3d0ad85aa40551a5d36c5310d1a477deae51"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_NETWORK_2026-09-08.md)" = "1e780f09bb235b1388aa02e274d4c85640976bd1"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"

          python - <<'PY'
          import json
          from pathlib import Path

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/NET_VDV3013_001_002_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          evidence=json.loads(Path('audit_registry/network_vdv301_3_revalidation_evidence_2026-09-08.json').read_text())

          assert registry['progress']['classified_count']==141
          assert registry['progress']['remaining_count']==51
          assert registry['progress']['latest_block']=='LS_V10_003'
          existing={e['finding_id']:e for e in registry['entries']}
          assert 'NET-001' not in existing and 'NET-002' not in existing

          assert block['block_id']=='NET_VDV3013_001_002'
          assert [e['finding_id'] for e in block['entries']]==['NET-001','NET-002']
          for e in block['entries']:
              assert e['normative_authority']=='contextual_only'
              assert e['defect_assessment']=='confirmed_pdf_defect'
              assert e['sdk_behavior']=='no_runtime_diagnostic'
              assert e['runtime_match']['state']=='not_applicable'
              assert e['version_scope'][0]['authority']=='documentation_only'
              assert e['version_scope'][0]['xsd_profile'] is None

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['NET-001']['revalidation_state']=='context_verified'
          assert frozen['NET-002']['revalidation_state']=='context_verified'
          assert frozen['NET-001']['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_NETWORK_2026-09-08.md'
          assert frozen['NET-002']['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_NETWORK_2026-09-08.md'

          assert evidence['evidence_id']=='EV-154'
          assert evidence['result']=='PASS'
          assert evidence['successful_run_id']=='34232483234'
          assert evidence['successful_job_id']=='102081822927'
          assert evidence['authority']['source_id']=='VDV301-3_02-2020'
          assert evidence['authority']['pdf_sha256']=='edfedf36eeb18075b45bf5224f0da6500cdd489438091f18bada42f9668c2a99'
          assert evidence['authority']['validation_lane']=='physical/network/protocol documentation; intentionally no XSD lane'
          assert evidence['executable_evidence']['applicable'] is False
          assert evidence['finding_results']['NET-001']['observed_wrong']=='VDV 303-3'
          assert evidence['finding_results']['NET-001']['document_identity_confirmed']=='VDV 301-3'
          assert evidence['finding_results']['NET-001']['alternate_document_identity_rejected'] is True
          assert evidence['finding_results']['NET-002']['german_number']=='2.3.4'
          assert evidence['finding_results']['NET-002']['english_number']=='2.3.5'
          assert evidence['finding_results']['NET-002']['english_toc_skip_confirmed'] is True
          assert evidence['full_xsd_pool']['count']==50
          assert evidence['full_xsd_pool']['role']=='regression/no-mutation guard only'
          print('PASSED: exact 141/192 prestate and NET-001/002 documentation-only authority boundary verified')
          PY

      - name: Snapshot XSD pool before semantic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256

      - name: Merge NET-001/002 block and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/NET_VDV3013_001_002_v0.1.json
          python tools/validate_finding_semantic_classification.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert registry['progress']['classified_count']==143
          assert registry['progress']['remaining_count']==49
          assert registry['progress']['latest_block']=='NET_VDV3013_001_002'
          assert registry['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/NET_VDV3013_001_002_v0.1.json'
          by_id={e['finding_id']:e for e in registry['entries']}
          assert by_id['NET-001']['primary_issue_kind']=='identifier_typo'
          assert by_id['NET-002']['primary_issue_kind']=='other'
          assert by_id['NET-001']['sdk_behavior']=='no_runtime_diagnostic'
          assert by_id['NET-002']['sdk_behavior']=='no_runtime_diagnostic'
          print('PASSED: merged registry is exactly 143/192 and NET-001/002 semantics are preserved')
          PY

      - name: Validate all 50 root XSDs and prove no schema mutation
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Persist only NET-001/002 block and master registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp_merge_semantic_classification_net_vdv3013_001_002.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          mapfile -t changed < <(git diff --name-only 8444062acd9a3427c69ed863dbc257420496ff1d | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'audit_registry/finding_semantic_classification_v0.1.json'
          test "${changed[1]}" = 'audit_registry/semantic_classification_blocks/NET_VDV3013_001_002_v0.1.json'
          git commit -m 'audit: merge NET-001 and NET-002 semantic classification'
          git push origin HEAD:dev/schema-integration
