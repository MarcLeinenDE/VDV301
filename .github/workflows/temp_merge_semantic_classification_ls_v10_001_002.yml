name: temp-merge-semantic-classification-ls-v10-001-002

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_merge_semantic_classification_ls_v10_001_002.yml

permissions:
  contents: write

jobs:
  merge-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact prestate, EV-153 and LS-001/002 boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7e1340d9f7f004fdc06f4b1cdf8a899fb6633b71"
          test "$(git rev-parse HEAD^^)" = "fa2724d346e30970292b9f7860d9a748dcd4214e"
          test "$(git hash-object audit_registry/semantic_classification_blocks/LS_V10_001_002_v0.1.json)" = "8240e33887fcf121ffd136c15e8a925eeea6c152"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "971c78e7f105b8f23955f6795d0cc2ad57216d3d"
          test "$(git hash-object audit_registry/location_services_revalidation_evidence_2026-09-08.json)" = "ee01b1bfaa84c08af8f2ff58df0aa60bd5073f22"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_LOCATION_SERVICES_2026-09-08.md)" = "48e110b2c488cdadd58f5d772d97ac1327981dbc"
          test "$(git hash-object IBIS-IP_GNSSLocationService_V1.0.xsd)" = "a74a22079af25cdd028a3e519019d9b3326d9971"
          test "$(git hash-object IBIS-IP_DistanceLocationService_V1.0.xsd)" = "e6fdc418b6ddaba75d3fbe8f048d1c6d70e023b6"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"

          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/LS_V10_001_002_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          evidence=json.loads(Path('audit_registry/location_services_revalidation_evidence_2026-09-08.json').read_text())

          assert registry['progress']['classified_count']==138
          assert registry['progress']['remaining_count']==54
          assert registry['progress']['latest_block']=='JIS_V10_005'
          existing={e['finding_id']:e for e in registry['entries']}
          assert 'LS-001' not in existing and 'LS-002' not in existing

          assert block['block_id']=='LS_V10_001_002'
          assert [e['finding_id'] for e in block['entries']]==['LS-001','LS-002']
          l1,l2=block['entries']
          assert l1['defect_assessment']=='cross_artifact_mismatch'
          assert l1['sdk_behavior']=='error_with_advisory'
          assert l1['runtime_match']['state']=='candidate'
          assert l2['defect_assessment']=='non_defect'
          assert l2['sdk_behavior']=='no_runtime_diagnostic'
          assert l2['runtime_match']['state']=='not_applicable'

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['LS-001']['revalidation_state']=='executable_confirmed'
          assert frozen['LS-002']['revalidation_state']=='contextual_not_defect'
          assert frozen['LS-001']['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_LOCATION_SERVICES_2026-09-08.md'
          assert frozen['LS-002']['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_LOCATION_SERVICES_2026-09-08.md'

          assert evidence['evidence_id']=='EV-153'
          assert evidence['result']=='PASS'
          assert evidence['successful_run_id']=='34229647400'
          assert evidence['successful_job_id']=='102072276013'
          assert evidence['authority']['service_blobs']['GNSS']=='a74a22079af25cdd028a3e519019d9b3326d9971'
          assert evidence['authority']['service_blobs']['DLS']=='e6fdc418b6ddaba75d3fbe8f048d1c6d70e023b6'
          assert evidence['finding_results']['LS-001']['positive_xsd_sample_valid'] is True
          assert evidence['finding_results']['LS-001']['negative_pdf_spelling_rejected'] is True
          assert evidence['finding_results']['LS-002']['positive_exact_name_valid'] is True
          assert evidence['finding_results']['LS-002']['normalized_alias_rejected'] is True

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}

          gnss_doc=etree.parse('IBIS-IP_GNSSLocationService_V1.0.xsd')
          gnss_type=gnss_doc.xpath("//xs:complexType[@name='GNSSLocationService.DataStructure']",namespaces=NS)
          assert len(gnss_type)==1
          good_decl=gnss_type[0].xpath("./xs:sequence/xs:element[@name='HoriziontalDilutionOfPrecision']",namespaces=NS)
          bad_decl=gnss_type[0].xpath("./xs:sequence/xs:element[@name='HorizontalDilutionOfPrecision']",namespaces=NS)
          assert len(good_decl)==1 and good_decl[0].get('type')=='IBIS-IP.double' and good_decl[0].get('minOccurs')=='0'
          assert not bad_decl
          gnss_schema=etree.XMLSchema(gnss_doc)
          def gnss_xml(name):
              return f"""<GNSSLocationService.Data>
                <latitude><Degree><Value>50.93</Value></Degree><Direction><Value>N</Value></Direction></latitude>
                <longitude><Degree><Value>6.95</Value></Degree><Direction><Value>E</Value></Direction></longitude>
                <{name}><Value>1.1</Value></{name}>
                <GNSSType>GPS</GNSSType>
              </GNSSLocationService.Data>"""
          assert gnss_schema.validate(etree.fromstring(gnss_xml('HoriziontalDilutionOfPrecision').encode()))
          assert not gnss_schema.validate(etree.fromstring(gnss_xml('HorizontalDilutionOfPrecision').encode()))

          dls_doc=etree.parse('IBIS-IP_DistanceLocationService_V1.0.xsd')
          dls_type=dls_doc.xpath("//xs:complexType[@name='DistanceLocationService.DataStructure']",namespaces=NS)
          assert len(dls_type)==1
          exact=dls_type[0].xpath("./xs:sequence/xs:element[@name='Odometer-Pulses']",namespaces=NS)
          normalized=dls_type[0].xpath("./xs:sequence/xs:element[@name='OdometerPulses']",namespaces=NS)
          assert len(exact)==1 and exact[0].get('type')=='IBIS-IP.int' and exact[0].get('minOccurs')=='0'
          assert not normalized
          dls_schema=etree.XMLSchema(dls_doc)
          def dls_xml(name):
              return f"""<DistanceLocationService.Data>
                <Distance><Value>12.5</Value></Distance>
                <{name}><Value>42</Value></{name}>
              </DistanceLocationService.Data>"""
          assert dls_schema.validate(etree.fromstring(dls_xml('Odometer-Pulses').encode()))
          assert not dls_schema.validate(etree.fromstring(dls_xml('OdometerPulses').encode()))
          print('PASSED: exact 138/192 prestate and current LS-001/002 executable boundaries verified')
          PY

      - name: Snapshot XSD pool before semantic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256

      - name: Merge LS-001/002 block and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/LS_V10_001_002_v0.1.json
          python tools/validate_finding_semantic_classification.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert registry['progress']['classified_count']==140
          assert registry['progress']['remaining_count']==52
          assert registry['progress']['latest_block']=='LS_V10_001_002'
          assert registry['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/LS_V10_001_002_v0.1.json'
          by_id={e['finding_id']:e for e in registry['entries']}
          assert by_id['LS-001']['defect_assessment']=='cross_artifact_mismatch'
          assert by_id['LS-001']['sdk_behavior']=='error_with_advisory'
          assert by_id['LS-002']['defect_assessment']=='non_defect'
          assert by_id['LS-002']['sdk_behavior']=='no_runtime_diagnostic'
          print('PASSED: merged registry is exactly 140/192 and LS-001/002 semantics are preserved')
          PY

      - name: Validate all 50 root XSDs and prove no schema mutation
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Persist only LS-001/002 block and master registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp_merge_semantic_classification_ls_v10_001_002.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          mapfile -t changed < <(git diff --name-only fa2724d346e30970292b9f7860d9a748dcd4214e | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'audit_registry/finding_semantic_classification_v0.1.json'
          test "${changed[1]}" = 'audit_registry/semantic_classification_blocks/LS_V10_001_002_v0.1.json'
          git commit -m 'audit: merge LS-001 and LS-002 semantic classification'
          git push origin HEAD:dev/schema-integration
