name: temp-vls-v10-render

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Render byte-pinned VLS V1.0 pages
        run: |
          python tools/render_vdv_pdf_pages.py \
            --source-id VLS_V1.0 \
            --pages 38,45 \
            --dpi 180 \
            --out-dir audit-results/vls-v10-renders

      - name: Upload visual review evidence
        uses: actions/upload-artifact@v4
        with:
          name: vls-v10-visual-review-2
          path: audit-results/vls-v10-renders/
          if-no-files-found: error
