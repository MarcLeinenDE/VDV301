name: temp-disc-source-pin

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-disc-source-pin.yml

permissions:
  contents: read

jobs:
  pin-disc-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Fetch and inspect DISC source PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/pdfs evidence/text evidence/renders
          cat > evidence/sources.tsv <<'EOF'
          VDV301-2_V1.0_DE	https://www.vdv.de/301-2sds-v1-0.pdfx
          VDV301-2_BASE_V2.0	https://www.vdv.de/301-2-sds-v-2-0.pdfx
          VDV301-2_BASE_V2.1	https://www.vdv.de/301-2-sds-v2-1-basicservices.pdfx
          VDV301-2_GC_V2.2	https://www.vdv.de/301-2-sdes-v2-2-common-conventions.pdfx
          VDV301-2_GC_V2.3	https://www.vdv.de/301-2-sdes-v2-3-common-conventions.pdfx
          VDV301-2_GC_V2.4	https://www.vdv.de/301-2-sde-v2.4-common-conventions.pdfx
          EOF
          : > evidence/manifest.tsv
          : > evidence/page_hits.txt
          while IFS=$'\t' read -r sid url; do
            pdf="evidence/pdfs/${sid}.pdf"
            txt="evidence/text/${sid}.txt"
            curl --fail --location --silent --show-error "$url" -o "$pdf"
            sha=$(sha256sum "$pdf" | awk '{print $1}')
            size=$(stat -c %s "$pdf")
            pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
            printf '%s\t%s\t%s\t%s\t%s\n' "$sid" "$sha" "$size" "$pages" "$url" | tee -a evidence/manifest.tsv
            pdftotext -layout "$pdf" "$txt"
            for p in $(seq 1 "$pages"); do
              page_txt=$(pdftotext -f "$p" -l "$p" -layout "$pdf" - 2>/dev/null || true)
              if printf '%s' "$page_txt" | grep -Eiq 'RFC[[:space:]]*2927|RFC[[:space:]]*3927|169[.]254|IP[- ]?Adress|IP address|IP-Adresse|IP address allocation|fehlend.{0,30}Eintr|missing.{0,30}entr|Tabelle[[:space:]]*3|Table[[:space:]]*3'; then
                printf '%s\tpage=%s\n' "$sid" "$p" | tee -a evidence/page_hits.txt
                mkdir -p "evidence/renders/${sid}"
                pdftoppm -f "$p" -l "$p" -png -r 150 -singlefile "$pdf" "evidence/renders/${sid}/page-${p}" >/dev/null 2>&1
              fi
            done
          done < evidence/sources.tsv
          echo '--- PAGE HITS ---'
          cat evidence/page_hits.txt
      - name: Upload DISC evidence
        uses: actions/upload-artifact@v4
        with:
          name: disc-source-pin
          path: evidence
          if-no-files-found: error
