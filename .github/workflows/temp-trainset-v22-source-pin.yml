name: temp-trainset-v22-source-pin

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Download and hash official TrainSet V2.2 PDF
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.vdv.de/301-2-14-sdes-v2-2-trainsetservices.pdfx'
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 30 -A 'Mozilla/5.0' "$url" -o TRAINSET_V2.2.pdf
          test "$(head -c 5 TRAINSET_V2.2.pdf)" = '%PDF-'
          sha=$(sha256sum TRAINSET_V2.2.pdf | awk '{print $1}')
          size=$(stat -c '%s' TRAINSET_V2.2.pdf)
          now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          printf 'source_id=TRAINSET_V2.2\nsha256=%s\nsize_bytes=%s\npinned_at_utc=%s\nurl=%s\n' "$sha" "$size" "$now" "$url" | tee pin.txt
      - name: Upload pin evidence
        uses: actions/upload-artifact@v4
        with:
          name: trainset-v22-source-pin
          path: pin.txt
          if-no-files-found: error
