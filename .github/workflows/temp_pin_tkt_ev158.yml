name: TEMP pin TKT EV-158 PDF

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_pin_tkt_ev158.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-tkt-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical audit branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Assert immutable prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "287e3bbcf4130567b288b1d039e8f576b668012b"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "a911f050fa5e7affc3d03ec9f2b21c68c848d364"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object IBIS-IP_TicketInformationService_V1.0.xsd)" = "3fda66d872ab0d1c511247f13e715cf3ad56afe7"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          es=reg['inventory']['entries']
          terminal={'context_verified','field_validated','executable_confirmed','contextual_not_defect','withdrawn','unresolved','superseded'}
          tc=sum(e.get('revalidation_state') in terminal for e in es)
          pc=sum(e.get('revalidation_state')=='pending' for e in es)
          fp=next(e['finding_id'] for e in es if e.get('revalidation_state')=='pending')
          assert (tc,pc)==(146,46),(tc,pc)
          assert fp=='TKT-001',fp
          assert reg.get('next_revalidation_block')=='TKT',reg.get('next_revalidation_block')
          by={e['finding_id']:e for e in es}
          for i in range(1,10):
              fid=f'TKT-{i:03d}'
              assert by[fid]['revalidation_state']=='pending',(fid,by[fid]['revalidation_state'])
              assert by[fid].get('terminal_state_source') is None,(fid,by[fid].get('terminal_state_source'))
          print('prestate OK: 146 terminal / 46 pending / first TKT-001')
          PY

      - name: Re-acquire official TicketingService V1.0 PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/tkt_ev158/pages
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 VDV301-audit-EV158' \
            'https://www.vdv.de/301-2-9sds-v1-0.pdfx' \
            -o evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf
          test "$(head -c 5 evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf)" = '%PDF-'
          pdfinfo evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf > evidence/tkt_ev158/pdfinfo.txt
          pdftotext -layout evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf evidence/tkt_ev158/document.txt
          sha256sum evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf | tee evidence/tkt_ev158/sha256.txt
          stat --printf='%s\n' evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf | tee evidence/tkt_ev158/size.txt
          grep '^Pages:' evidence/tkt_ev158/pdfinfo.txt | tee evidence/tkt_ev158/pages.txt

      - name: Verify disputed PDF text anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('evidence/tkt_ev158/document.txt').read_text(encoding='utf-8',errors='replace')
          flat=''.join(text.split())
          anchors={
            'UnsubscribeValidationResult':'UnsubscribeValidationResult',
            'SubscribeResponseStructure':'SubscribeResponseStructure',
            'TicketInformationService.Validation.GetDataRequest':'TicketInformationService.Validation.GetDataRequest',
            'ValidationResultStructure':'ValidationResultStructure',
            'DefaultLanguage':'DefaultLanguage',
            'CardApplicationInformation':'CardApplicationInformation',
            'TicketingSevice':'TicketingSevice',
          }
          for label,token in anchors.items():
              assert token in flat, f'missing PDF text anchor after whitespace normalization: {label}'
              print(f'OK  PDF text anchor: {label}')
          PY

      - name: Render physical PDF pages 8 through 12
        shell: bash
        run: |
          set -euo pipefail
          pdftoppm -png -r 160 -f 8 -l 12 \
            evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf \
            evidence/tkt_ev158/pages/tkt
          ls -lh evidence/tkt_ev158/pages

      - name: Build machine-readable PDF pin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          p=Path('evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf')
          data=p.read_bytes()
          info=Path('evidence/tkt_ev158/pdfinfo.txt').read_text(errors='replace')
          m=re.search(r'^Pages:\s+(\d+)\s*$',info,re.M)
          assert m
          text=Path('evidence/tkt_ev158/document.txt').read_bytes()
          out={
            'evidence_id':'EV-158-PDF-PIN',
            'source_id':'VDV301-2-9_TICKETING_V1.0',
            'official_url':'https://www.vdv.de/301-2-9sds-v1-0.pdfx',
            'sha256':hashlib.sha256(data).hexdigest(),
            'size_bytes':len(data),
            'pages':int(m.group(1)),
            'pdftotext_sha256':hashlib.sha256(text).hexdigest(),
            'rendered_physical_pages':[8,9,10,11,12],
          }
          Path('evidence/tkt_ev158/tkt_pdf_pin.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload TKT PDF pin evidence
        uses: actions/upload-artifact@v4
        with:
          name: tkt-ev158-pdf-pin
          path: evidence/tkt_ev158
          if-no-files-found: error
