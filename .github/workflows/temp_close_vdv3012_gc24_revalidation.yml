name: TEMP close VDV301-2 GC V2.4 revalidation subblock

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_close_vdv3012_gc24_revalidation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-gc24:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned GC V2.4 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request
          source_id = 'VDV301-2_GC_V2.4'
          sources = json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text(encoding='utf-8'))
          pins = json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text(encoding='utf-8'))
          source = next(x for x in sources['sources'] if x['source_id'] == source_id)
          pin = next(x for x in pins['sources'] if x['source_id'] == source_id)
          request = urllib.request.Request(source['official_url'], headers={
              'User-Agent': 'VDV301-Audit-EV134-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          actual_hash = hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual_hash == pin['expected_sha256'], (actual_hash, pin['expected_sha256'])
          assert len(data) == int(pin['expected_size_bytes']), (len(data), pin['expected_size_bytes'])
          target = Path('local_sources/vdv_pdfs') / source['local_filename']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual_hash} size={len(data)}')
          PY

      - name: Re-run EV-134 exact text/XSD gate
        shell: bash
        env:
          EV134_OUTPUT_DIR: artifacts/ev134-closure
        run: |
          set -euo pipefail
          python tools/run_vdv3012_gc24_ev134.py

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Pre-closure immutable and authority guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/vdv3012_gc24_revalidation_evidence_2026-09-04.json)" = "82e09d930f3a69c197a695d5ea64d64b56fe92e4"
          test "$(git hash-object IBIS-IP_common_V2.4.xsd)" = "1946fd37e29ced605654f49ea3d98cd2fbbdc8e4"
          test "$(git hash-object IBIS-IP_Enumerations_V2.4.xsd)" = "2afed8cf23afa91db92b0f043cc5b4ad428b0f25"
          git diff --exit-code -- '*.xsd'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Write GC V2.4 closure state
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_vdv3012_gc24_revalidation_block.py

      - name: Remove temporary workflow plumbing and generated caches
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_validate_vdv3012_gc24_ev134.yml
          rm -f .github/workflows/temp_close_vdv3012_gc24_revalidation.yml
          rm -rf artifacts/ev134-closure
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Verify closure delta allowlist and immutable authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/vdv3012_gc24_revalidation_evidence_2026-09-04.json)" = "82e09d930f3a69c197a695d5ea64d64b56fe92e4"
          test "$(git hash-object IBIS-IP_common_V2.4.xsd)" = "1946fd37e29ced605654f49ea3d98cd2fbbdc8e4"
          test "$(git hash-object IBIS-IP_Enumerations_V2.4.xsd)" = "2afed8cf23afa91db92b0f043cc5b4ad428b0f25"
          git diff --exit-code -- '*.xsd'
          python - <<'PY'
          import subprocess
          allowed = {
              'audit_registry/finding_revalidation_registry_v0.1.json',
              '00_START_HERE/CURRENT_STATE.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3012_GC24_2026-09-04.md',
              '.github/workflows/temp_validate_vdv3012_gc24_ev134.yml',
              '.github/workflows/temp_close_vdv3012_gc24_revalidation.yml',
          }
          lines = subprocess.check_output(['git','status','--porcelain','--untracked-files=all'], text=True).splitlines()
          changed = {line[3:] for line in lines if len(line) >= 4}
          unexpected = changed - allowed
          assert not unexpected, f'unexpected closure delta: {sorted(unexpected)}'
          required = {
              'audit_registry/finding_revalidation_registry_v0.1.json',
              '00_START_HERE/CURRENT_STATE.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3012_GC24_2026-09-04.md',
          }
          assert required <= changed, f'missing required closure delta: {sorted(required-changed)}'
          print('ALLOWLIST_OK', sorted(changed))
          PY

      - name: Verify post-closure state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          state = json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          entries = reg['inventory']['entries']
          by_id = {x['finding_id']: x for x in entries}
          terminal = sum(x.get('revalidation_state') != 'pending' for x in entries)
          pending = sum(x.get('revalidation_state') == 'pending' for x in entries)
          assert (terminal, pending) == (84, 108), (terminal, pending)
          expected = {
              'DR3012GC24-001': 'executable_confirmed',
              'DR3012GC24-002': 'context_verified',
              'DR3012GC24-003': 'context_verified',
              'DR3012GC24-004': 'executable_confirmed',
              'DR3012GC24-005': 'context_verified',
          }
          for finding_id, terminal_state in expected.items():
              assert by_id[finding_id]['revalidation_state'] == terminal_state
          for i in range(1, 8):
              assert by_id[f'DRCOM10-{i:03d}']['revalidation_state'] == 'pending'
          assert reg['next_revalidation_block'] == 'COMMON'
          assert reg['revalidation_blocks']['VDV301-2_GC_V2.4']['next_subblock'] == 'COMMON_V1.0'
          audit = state['audit']
          assert audit['finding_revalidation_completed_findings'] == 84
          assert audit['finding_revalidation_pending_findings'] == 108
          assert audit['finding_revalidation_latest_completed_block'] == 'VDV301-2_GC_V2.4'
          assert audit['finding_revalidation_next_block'] == 'COMMON'
          assert audit['vdv3012_gc24_revalidation']['next_subblock'] == 'COMMON_V1.0'
          assert json.loads(Path('audit_registry/finding_inventory_frozen_2026-09-03.json').read_text())['entry_count'] == 192
          print('POST_STATE_OK terminal=84 pending=108 next=COMMON/COMMON_V1.0')
          PY

      - name: Commit closure atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Marc Leinen"
          git config user.email "34336531+MarcLeinenDE@users.noreply.github.com"
          git add -A
          git commit -m "audit: revalidate VDV301-2 GC V2.4 finding subblock [skip ci]"
          git push origin HEAD:dev/schema-integration
