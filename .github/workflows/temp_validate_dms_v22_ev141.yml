name: TEMP validate DMS V2.2 EV-141

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_validate_dms_v22_ev141.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned DMS V2.2 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          source_id='DMS_V2.2'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==source_id)
          pin=next(x for x in pins['sources'] if x['source_id']==source_id)
          req=urllib.request.Request(source['official_url'],headers={'User-Agent':'VDV301-Audit-EV141/0.1 (+https://github.com/MarcLeinenDE/VDV301)','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
          with urllib.request.urlopen(req,timeout=90) as response: data=response.read()
          actual=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual==pin['expected_sha256'],(actual,pin['expected_sha256'])
          assert len(data)==int(pin['expected_size_bytes']),(len(data),pin['expected_size_bytes'])
          target=Path('local_sources/vdv_pdfs')/source['local_filename']; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual} size={len(data)}')
          PY

      - name: Run EV-141 DMS V2.2 revalidation gate
        shell: bash
        env:
          EV141_OUTPUT_DIR: artifacts/ev141
        run: |
          set -euo pipefail
          python tools/validate_dms_v22_revalidation_ev141.py

      - name: Render all EV-141 evidence pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ev141/pages artifacts/ev141/text
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 180 \
              local_sources/vdv_pdfs/DMS_V2.2.pdf "artifacts/ev141/pages/page-$p"
            pdftotext -f "$p" -l "$p" -layout \
              local_sources/vdv_pdfs/DMS_V2.2.pdf "artifacts/ev141/text/page-$p.txt"
          done < artifacts/ev141/render_pages.txt

      - name: Build evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum local_sources/vdv_pdfs/DMS_V2.2.pdf > artifacts/ev141/pdf.sha256
          find artifacts/ev141 -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifacts/ev141/manifest.sha256
          cat artifacts/ev141/ev141_result.json
          cat artifacts/ev141/page_map.json
          cat artifacts/ev141/manifest.sha256

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Verify no tracked mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/DMS_V2.2.md)" = "009243f56e8a81e9fdac82ff96d0fb714c7ba45b"
          test "$(git hash-object audit_registry/deep_read_findings_delta_dms_v22_2026-08-28.json)" = "e350612884c8c22ca7fc0e4839a03ac924abc076"
          test "$(git hash-object audit_registry/deep_read_registry_delta_dms_v22_2026-08-28.json)" = "d44cc214ebd85172579065b8091d2e91d9dbb4a4"
          test "$(git hash-object IBIS-IP_DeviceManagementService_V2.2.xsd)" = "c589e9f9d9b9a0f60309a275ec36b76b8c5d1f1d"
          test "$(git hash-object IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"
          test "$(git hash-object IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"
          test "$(git hash-object tools/validate_dms_v22_deep_read_ev107.py)" = "6acd2dc75131455e220ae18ce5131eeb5ad44789"
          test "$(git hash-object tools/validate_dms_v22_revalidation_ev141.py)" = "9c3bfe506709f2ee11003ce2ddaa4ccbeaf8cb2f"
          git diff --exit-code -- '*.xsd'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload EV-141 evidence
        uses: actions/upload-artifact@v4
        with:
          name: dms-v22-ev141
          path: artifacts/ev141
          if-no-files-found: error
          retention-days: 90
