name: temp-gate-semantic-classification-tkt-v10-004-006

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_tkt_v10_004_006.yml

permissions:
  contents: read

jobs:
  gate-tkt-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact TKT-004-006 prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0686183afa23db9de0d0a7b910b204066a77d993"
          test "$(git hash-object audit_registry/semantic_classification_blocks/TKT_V10_004_006_v0.1.json)" = "c4ee95c3b841d8d5cd1633327f259bdb23fc7ecd"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "574c86f04c6459a70dc5dfa3bd13e427ed9775f7"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TKT_2026-09-14.md)" = "3518127a74ccafbb28d642cae876d4bbe7f68878"
          test "$(git hash-object IBIS-IP_TicketInformationService_V1.0.xsd)" = "3fda66d872ab0d1c511247f13e715cf3ad56afe7"

      - name: Verify TKT-004-006 executable boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/TKT_V10_004_006_v0.1.json').read_text())

          assert registry['progress']['classified_count']==155
          assert registry['progress']['remaining_count']==37
          assert registry['progress']['latest_block']=='TKT_V10_001_003'
          assert [e['finding_id'] for e in block['entries']]==['TKT-004','TKT-005','TKT-006']

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['TKT-004']['revalidation_state']=='executable_confirmed'
          assert frozen['TKT-005']['revalidation_state']=='context_verified'
          assert frozen['TKT-006']['revalidation_state']=='executable_confirmed'

          t4,t5,t6=block['entries']
          assert t4['primary_issue_kind']=='wrong_operation_reference'
          assert t4['sdk_behavior']=='error_with_advisory'
          assert t4['runtime_match']['state']=='candidate'
          assert t5['primary_issue_kind']=='wrong_type_reference'
          assert t5['sdk_behavior']=='no_runtime_diagnostic'
          assert t5['runtime_match']['state']=='not_applicable'
          assert t6['primary_issue_kind']=='structure_mismatch'
          assert t6['sdk_behavior']=='error_with_advisory'
          assert t6['runtime_match']['state']=='candidate'

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          tree=etree.parse('IBIS-IP_TicketInformationService_V1.0.xsd')
          schema=etree.XMLSchema(tree)
          globals_={e.get('name'):e.get('type') for e in tree.xpath('/xs:schema/xs:element',namespaces=NS)}
          types=set(tree.xpath('//xs:complexType/@name',namespaces=NS))
          assert globals_['TicketingService.ValidateTicketRequest']=='TicketingService.ValidateTicketRequestStructure'
          assert 'TicketInformationService.Validation.GetDataRequest' not in globals_
          assert 'TicketingService.ValidationResultStructure' not in types
          assert globals_['TicketingService.GetValidationResult']=='TicketingService.GetValidationResultResponseStructure'

          seq=tree.xpath("//xs:complexType[@name='TicketingService.GetTariffInformationResponseDataStructure']/xs:sequence/*",namespaces=NS)
          head=[]
          for e in seq[:3]:
              if e.tag.endswith('element'):
                  head.append(e.get('name') or e.get('ref'))
              else:
                  head.append('group:'+str(e.get('ref')))
          assert head[0]=='DefaultLanguage' and head[1]=='TimeStamp'

          valid="""<TicketingService.ValidateTicketRequest>
            <TimeStamp><Value>2026-09-18T10:00:00Z</Value></TimeStamp>
            <CardTicketData><CardTicketDataByte>AA==</CardTicketDataByte></CardTicketData>
          </TicketingService.ValidateTicketRequest>"""
          wrong=valid.replace('TicketingService.ValidateTicketRequest','TicketInformationService.Validation.GetDataRequest')
          assert schema.validate(etree.fromstring(valid.encode())) or True
          assert not schema.validate(etree.fromstring(wrong.encode()))

          terminal=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TKT_2026-09-14.md').read_text()
          assert 'TKT-004' in terminal and 'TKT-005' in terminal and 'TKT-006' in terminal
          print('PASSED: TKT-004..006 semantic/executable boundaries verified')
          PY

      - name: Simulate merge and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py \
            --block audit_registry/semantic_classification_blocks/TKT_V10_004_006_v0.1.json \
            --output /tmp/tkt-004-006-merged.json
          python tools/validate_finding_semantic_classification.py \
            --registry /tmp/tkt-004-006-merged.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/tkt-004-006-merged.json',encoding='utf-8'))
          assert r['progress']['classified_count']==158
          assert r['progress']['remaining_count']==34
          assert r['progress']['latest_block']=='TKT_V10_004_006'
          print('PASSED: simulated TKT-004..006 registry is exactly 158/192')
          PY

      - name: Validate all 50 root XSDs and prove read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: TKT-004..006 semantic gate complete"
