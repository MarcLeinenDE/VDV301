name: temp validate TVS EV-163

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_validate_tvs_ev163.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-tvs-ev163:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Assert workflow-only trigger commit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="466340965faa7cff9c6a78565396b4ea09e27bce"
          git cat-file -e "${BASE_SHA}^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/temp_validate_tvs_ev163.yml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check lxml

      - name: Snapshot immutable XSD pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/tvs_ev163
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > evidence/tvs_ev163/xsd_before.sha256
          sha256sum audit_registry/finding_inventory_frozen_2026-09-03.json > evidence/tvs_ev163/frozen_inventory_before.sha256

      - name: Run EV-112 official V2.1 lane
        run: python tools/validate_tvs_v21_ev112.py | tee evidence/tvs_ev163/ev112_direct.log

      - name: Run EV-113 official V2.2 lane
        run: python tools/validate_tvs_v22_ev113.py | tee evidence/tvs_ev163/ev113_direct.log

      - name: Run EV-114 official V2.3 lane
        run: python tools/validate_tvs_v23_ev114.py | tee evidence/tvs_ev163/ev114_direct.log

      - name: Run EV-115 V2.4 candidate/integration lane
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_tvs_v24_ev115.py | tee evidence/tvs_ev163/ev115_direct.log
          grep -F "AUTHORITY: candidate/integration V2.4 family; NOT official-release V2.4 conformance" evidence/tvs_ev163/ev115_direct.log

      - name: Precheck EV-163 immutable pins
        run: |
          python - <<'PY'
          import hashlib, importlib.util, pathlib
          spec=importlib.util.spec_from_file_location('ev163','tools/validate_tvs_revalidation_ev163.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          for rel, exp in m.EXPECTED_BLOBS.items():
              p=pathlib.Path(rel); d=p.read_bytes(); act=hashlib.sha1(f"blob {len(d)}\0".encode()+d).hexdigest()
              assert act==exp, (rel, exp, act)
          print('PASSED pins')
          PY

      - name: Precheck EV-163 state and registry counts
        run: |
          python - <<'PY'
          import importlib.util, json
          spec=importlib.util.spec_from_file_location('ev163','tools/validate_tvs_revalidation_ev163.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          state=json.load(open('00_START_HERE/CURRENT_STATE.json',encoding='utf-8')); audit=state['audit']
          reg=json.load(open('audit_registry/finding_revalidation_registry_v0.1.json',encoding='utf-8')); entries=reg['inventory']['entries']
          assert state['canonical_branch']=='dev/schema-integration'
          assert audit['finding_inventory_count']==192
          assert audit['finding_revalidation_completed_findings']==165
          assert audit['finding_revalidation_pending_findings']==27
          assert audit['finding_revalidation_next_block']=='TVS'
          assert audit['finding_revalidation_latest_completed_block']=='TSM'
          assert audit['latest_executable_evidence_id']=='EV-162'
          assert reg.get('next_revalidation_block')=='TVS'
          assert len(entries)==192 and len({x['finding_id'] for x in entries})==192
          assert m.counts(entries)==(165,27), m.counts(entries)
          assert m.first_pending(entries)=='TVS-001', m.first_pending(entries)
          pending=[x['finding_id'] for x in entries if x.get('revalidation_state')=='pending']
          assert pending[:3]==['TVS-001','TVS-002','TVS-003'], pending[:3]
          print('PASSED state-registry')
          PY

      - name: Precheck EV-163 projected poststate
        run: |
          python - <<'PY'
          import importlib.util, json
          spec=importlib.util.spec_from_file_location('ev163','tools/validate_tvs_revalidation_ev163.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          reg=json.load(open('audit_registry/finding_revalidation_registry_v0.1.json',encoding='utf-8')); entries=reg['inventory']['entries']
          by={x['finding_id']:x for x in entries}
          for fid in m.TARGET_STATES:
              assert by[fid].get('revalidation_state')=='pending'
              assert by[fid].get('terminal_state_source') is None
          projected=[dict(x) for x in entries]; pby={x['finding_id']:x for x in projected}
          for fid,s in m.TARGET_STATES.items(): pby[fid]['revalidation_state']=s
          assert m.counts(projected)==(168,24), m.counts(projected)
          assert m.first_pending(projected)=='VDS-001', m.first_pending(projected)
          print('PASSED projected-poststate')
          PY

      - name: Precheck EV-163 authority tokens
        run: |
          python - <<'PY'
          a=open('docs/pdf_xsd_semantic_audit/TICKET_VALIDATION_SERVICE_FINDINGS_REGISTER_ADDENDUM.md',encoding='utf-8').read()
          for t in [
            'TVS-001 - GetCurrentShortHaulStopsResponse omitted from TicketValidationServiceOperations',
            'upstream_master_structurally_confirmed_and_candidate_integration_executable_confirmed_EV-115',
            'No V2.4 release tag exists; executable evidence is candidate/integration authority.',
            'TVS-002 - VehicleData.RouteDeviation PDF type vs XSD type',
            'TVS-003 - stale CurrentStopPoint names after CurrentTariffStop rename',
            'EV-115: candidate/integration evidence only; not official-release conformance']:
              assert t in a, t
          s=open('tools/validate_tvs_v24_ev115.py',encoding='utf-8').read()
          for t in ['candidate/integration','not official-release','VDV-301-2.4','GetCurrentShortHaulStopsResponse','TicketValidationServiceOperations']:
              assert t in s, t
          print('PASSED authority-tokens')
          PY

      - name: Precheck EV-163 nested lane markers
        run: |
          python - <<'PY'
          import subprocess, sys
          for ev,p in [('EV-112','tools/validate_tvs_v21_ev112.py'),('EV-113','tools/validate_tvs_v22_ev113.py'),('EV-114','tools/validate_tvs_v23_ev114.py'),('EV-115','tools/validate_tvs_v24_ev115.py')]:
              r=subprocess.run([sys.executable,p],text=True,capture_output=True)
              assert r.returncode==0, (ev,r.stderr)
              assert 'PASSED:' in r.stdout, (ev,r.stdout[-500:])
          print('PASSED nested-lane-markers')
          PY

      - name: Run aggregate EV-163 gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_tvs_revalidation_ev163.py --repo-root . --output-dir evidence/tvs_ev163 | tee evidence/tvs_ev163/ev163.log
          grep -F "PASSED: EV-163 TVS aggregate revalidation gate; projected poststate 168/24, next VDS-001" evidence/tvs_ev163/ev163.log

      - name: Validate complete 50-XSD pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . | tee evidence/tvs_ev163/xsd_pool.log
          grep -Fx "PASSED" evidence/tvs_ev163/xsd_pool.log

      - name: Prove immutable audit/schema inputs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > evidence/tvs_ev163/xsd_after.sha256
          cmp evidence/tvs_ev163/xsd_before.sha256 evidence/tvs_ev163/xsd_after.sha256
          sha256sum audit_registry/finding_inventory_frozen_2026-09-03.json > evidence/tvs_ev163/frozen_inventory_after.sha256
          cmp evidence/tvs_ev163/frozen_inventory_before.sha256 evidence/tvs_ev163/frozen_inventory_after.sha256
          git diff --exit-code -- ./*.xsd audit_registry/finding_inventory_frozen_2026-09-03.json

      - name: Record CI provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('evidence/tvs_ev163/ci_provenance.json')
          p.write_text(json.dumps({'evidence_id':'EV-163','repository':os.environ['GITHUB_REPOSITORY'],'head_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'workflow':os.environ['GITHUB_WORKFLOW'],'ref':os.environ['GITHUB_REF'],'authority_boundary':'EV-115 is candidate/integration V2.4 evidence, not official-release V2.4 XSD conformance','projected_poststate':{'terminal':168,'pending':24,'first_pending':'VDS-001','next_block':'VDS'}},indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Upload EV-163 evidence
        uses: actions/upload-artifact@v4
        with:
          name: tvs-ev163-evidence
          path: evidence/tvs_ev163/
          if-no-files-found: error
          retention-days: 30
