name: temp-gate-runtime-mapping-review-common-v10-remainder-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_common_v10_remainder.yml

permissions:
  contents: read

jobs:
  gate-common-v10-remainder-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3029781fddb8b7584da3b53be45e3c1bdf916a43"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "7ce3872382870aa0516e9950771de994457d16a0"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "bf42ed44b5b534015f2b925ce245a7ad0b50d7a1"
          test "$(git hash-object sdk_manifest/README.md)" = "45c7c0249736846482dbb7dd1bf7005e50f34bd0"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "d4b4cab59ad6622cdd7afecdeb0a24b9e63cff4b"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "b3210b9504b8db96eef0f6c65dd0a815a0a44c3e"

      - name: Validate synchronized runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':30,'not_applicable':113,'not_designed':1,'reviewed':48}
          assert r['counts']=={
              'reviewed_mapping_count':48,
              'implemented_count':0,
              'semantic_candidate_count':30,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='COMMON_V10_DRCOM10_001_006'
          print('PASSED: Common V1.0 remainder closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: Common V1.0 remainder closure gate complete"
