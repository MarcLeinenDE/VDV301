name: TEMP patch TKT EV-158 visual page 11

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_patch_tkt_ev158_visual_page11.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Patch page 11 to rendered visual evidence only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/validate_tkt_revalidation_ev158.py)" = "cb8405bb3c44e59c5e01c210610afcf21464e9f1"
          test "$(git hash-object .github/workflows/temp_validate_tkt_ev158.yml)" = "61cb750852d890ff94af6e96ca1d891d06df295b"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "287e3bbcf4130567b288b1d039e8f576b668012b"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "a911f050fa5e7affc3d03ec9f2b21c68c848d364"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256

          python - <<'PY'
          from pathlib import Path
          p=Path('tools/validate_tkt_revalidation_ev158.py')
          text=p.read_text(encoding='utf-8')
          old='''    p10 = flat_text(page_text(pdf, 10))\n    p11 = flat_text(page_text(pdf, 11))\n    p12 = flat_text(page_text(pdf, 12))'''
          new='''    p10 = flat_text(page_text(pdf, 10))\n    p12 = flat_text(page_text(pdf, 12))'''
          assert text.count(old) == 1, text.count(old)
          text=text.replace(old,new)
          old2='''    require("CardApplicationIn-" in p11 and "formation" in p11,\n            "PDF page 11 extraction preserves the split visible CardApplicationInformation label for visual review")'''
          new2='''    print("OK  PDF page 11 CardApplicationInformation is visual-only evidence; no pdftotext token gate")'''
          assert text.count(old2) == 1, text.count(old2)
          p.write_text(text.replace(old2,new2),encoding='utf-8')
          PY

          new_blob="$(git hash-object tools/validate_tkt_revalidation_ev158.py)"
          python - "$new_blob" <<'PY'
          from pathlib import Path
          import sys
          p=Path('.github/workflows/temp_validate_tkt_ev158.yml')
          text=p.read_text(encoding='utf-8')
          old='cb8405bb3c44e59c5e01c210610afcf21464e9f1'
          new=sys.argv[1]
          assert text.count(old) == 1, text.count(old)
          text=text.replace(old,new)
          marker='''          pdftoppm -png -r 160 -f 7 -l 12 \\\n            evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf \\\n            evidence/tkt_ev158/pages/tkt\n'''
          replacement=marker + '''          test -s evidence/tkt_ev158/pages/tkt-11.png\n'''
          assert text.count(marker) == 1, text.count(marker)
          p.write_text(text.replace(marker,replacement),encoding='utf-8')
          print('new validator blob:',new)
          PY

          rm .github/workflows/temp_patch_tkt_ev158_visual_page11.yml
          python -m py_compile tools/validate_tkt_revalidation_ev158.py
          rm -rf tools/__pycache__
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "287e3bbcf4130567b288b1d039e8f576b668012b"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "a911f050fa5e7affc3d03ec9f2b21c68c848d364"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          changed="$(git status --porcelain | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' '.github/workflows/temp_patch_tkt_ev158_visual_page11.yml' '.github/workflows/temp_validate_tkt_ev158.yml' 'tools/validate_tkt_revalidation_ev158.py' | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Create narrowly scoped correction commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_tkt_revalidation_ev158.py .github/workflows/temp_validate_tkt_ev158.yml
          git rm .github/workflows/temp_patch_tkt_ev158_visual_page11.yml
          git diff --cached --check
          git commit -m 'audit: bind TKT page-11 finding to rendered evidence'
          echo "CORRECTION_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:dev/schema-integration
