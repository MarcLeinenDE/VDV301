name: TEMP close DMS V2.2 revalidation subblock

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_close_dms_v22_revalidation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-dms-v22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned DMS V2.2 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          source_id='DMS_V2.2'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==source_id)
          pin=next(x for x in pins['sources'] if x['source_id']==source_id)
          req=urllib.request.Request(source['official_url'],headers={'User-Agent':'VDV301-Audit-EV141-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
          with urllib.request.urlopen(req,timeout=90) as response: data=response.read()
          actual=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual==pin['expected_sha256'],(actual,pin['expected_sha256'])
          assert len(data)==int(pin['expected_size_bytes']),(len(data),pin['expected_size_bytes'])
          target=Path('local_sources/vdv_pdfs')/source['local_filename']; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual} size={len(data)}')
          PY

      - name: Re-run corrected EV-141 exact evidence gate
        shell: bash
        env:
          EV141_OUTPUT_DIR: artifacts/ev141-closure
        run: |
          set -euo pipefail
          python tools/validate_dms_v22_revalidation_ev141_final.py

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Pre-closure immutable and mutation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/dms_v22_revalidation_evidence_2026-09-05.json)" = "4d755389e4db598d0d1dfb13eed4af3f9a064010"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/DMS_V2.2.md)" = "009243f56e8a81e9fdac82ff96d0fb714c7ba45b"
          test "$(git hash-object audit_registry/deep_read_findings_delta_dms_v22_2026-08-28.json)" = "e350612884c8c22ca7fc0e4839a03ac924abc076"
          test "$(git hash-object audit_registry/deep_read_registry_delta_dms_v22_2026-08-28.json)" = "d44cc214ebd85172579065b8091d2e91d9dbb4a4"
          test "$(git hash-object IBIS-IP_DeviceManagementService_V2.2.xsd)" = "c589e9f9d9b9a0f60309a275ec36b76b8c5d1f1d"
          test "$(git hash-object IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"
          test "$(git hash-object IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"
          test "$(git hash-object tools/validate_dms_v22_deep_read_ev107.py)" = "6acd2dc75131455e220ae18ce5131eeb5ad44789"
          test "$(git hash-object tools/validate_dms_v22_revalidation_ev141.py)" = "9c3bfe506709f2ee11003ce2ddaa4ccbeaf8cb2f"
          test "$(git hash-object tools/validate_dms_v22_revalidation_ev141_final.py)" = "cd89c37f6bcc3f3279ac19fa557c89eb824cf964"
          test "$(git hash-object tools/close_dms_v22_revalidation_block.py)" = "3c9c6945972a2178ed31908f65986c9942ec18bd"
          git diff --exit-code -- '*.xsd'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify pre-closure DMS route and legacy block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          entries=reg['inventory']['entries']; by_id={x['finding_id']:x for x in entries}
          assert sum(x.get('revalidation_state')!='pending' for x in entries)==96
          assert sum(x.get('revalidation_state')=='pending' for x in entries)==96
          assert reg['next_revalidation_block']=='DMS'
          assert reg['revalidation_blocks']['COMMON_V2.4']['next_subblock']=='DMS_V2.2'
          legacy=reg['revalidation_blocks']['DMS']
          assert legacy['state']=='completed'
          assert legacy['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_2026-09-03.md'
          assert 'DMS_V2.2' not in reg['revalidation_blocks']
          for fid in ('DRDMS22-001','DRDMS22-002','DRDMS22-003','DRDMS22-004','DRDMS24-001'):
              assert by_id[fid]['revalidation_state']=='pending',fid
          print('PRE_STATE_OK terminal=96 pending=96 next=DMS_V2.2 legacy_DMS_unchanged')
          PY

      - name: Write DMS V2.2 closure state
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_dms_v22_revalidation_block.py

      - name: Remove temporary workflow plumbing and generated caches
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_validate_dms_v22_ev141.yml
          rm -f .github/workflows/temp_close_dms_v22_revalidation.yml
          rm -rf artifacts/ev141-closure
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Verify closure delta allowlist and immutable authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/dms_v22_revalidation_evidence_2026-09-05.json)" = "4d755389e4db598d0d1dfb13eed4af3f9a064010"
          test "$(git hash-object IBIS-IP_DeviceManagementService_V2.2.xsd)" = "c589e9f9d9b9a0f60309a275ec36b76b8c5d1f1d"
          test "$(git hash-object IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"
          test "$(git hash-object IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"
          git diff --exit-code -- '*.xsd'
          python - <<'PY'
          import subprocess
          allowed={'audit_registry/finding_revalidation_registry_v0.1.json','00_START_HERE/CURRENT_STATE.json','docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_V22_2026-09-05.md','.github/workflows/temp_validate_dms_v22_ev141.yml','.github/workflows/temp_close_dms_v22_revalidation.yml'}
          lines=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          changed={line[3:] for line in lines if len(line)>=4}
          assert not changed-allowed,f'unexpected closure delta: {sorted(changed-allowed)}'
          required={'audit_registry/finding_revalidation_registry_v0.1.json','00_START_HERE/CURRENT_STATE.json','docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_V22_2026-09-05.md'}
          assert required<=changed,f'missing required closure delta: {sorted(required-changed)}'
          print('ALLOWLIST_OK',sorted(changed))
          PY

      - name: Verify post-closure state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text()); state=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          entries=reg['inventory']['entries']; by_id={x['finding_id']:x for x in entries}
          terminal=sum(x.get('revalidation_state')!='pending' for x in entries); pending=sum(x.get('revalidation_state')=='pending' for x in entries)
          assert (terminal,pending)==(100,92),(terminal,pending)
          expected={'DRDMS22-001':'context_verified','DRDMS22-002':'context_verified','DRDMS22-003':'executable_confirmed','DRDMS22-004':'context_verified'}
          for fid,st in expected.items(): assert by_id[fid]['revalidation_state']==st,(fid,by_id[fid])
          assert by_id['DRDMS24-001']['revalidation_state']=='pending'
          block=reg['revalidation_blocks']['DMS_V2.2']; assert block['state']=='completed'
          assert block['next_block']=='DMS' and block['next_subblock']=='DMS_V2.4'
          assert block['existing_legacy_DMS_block_mutated'] is False
          legacy=reg['revalidation_blocks']['DMS']; assert legacy['state']=='completed' and legacy['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_2026-09-03.md'
          assert reg['next_revalidation_block']=='DMS'
          audit=state['audit']; assert audit['finding_revalidation_completed_findings']==100 and audit['finding_revalidation_pending_findings']==92
          assert audit['finding_revalidation_latest_completed_block']=='DMS_V2.2'
          assert audit['finding_revalidation_next_block']=='DMS'
          assert audit['dms_v22_deep_revalidation']['next_subblock']=='DMS_V2.4'
          assert audit['dms_revalidation']['status']=='complete'
          assert json.loads(Path('audit_registry/finding_inventory_frozen_2026-09-03.json').read_text())['entry_count']==192
          print('POST_STATE_OK terminal=100 pending=92 next=DMS_V2.4')
          PY

      - name: Commit closure atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Marc Leinen"
          git config user.email "34336531+MarcLeinenDE@users.noreply.github.com"
          git add -A
          git commit -m "audit: revalidate DMS V2.2 deep finding subblock [skip ci]"
          git push origin HEAD:dev/schema-integration
