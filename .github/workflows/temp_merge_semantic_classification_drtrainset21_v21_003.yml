name: temp-merge-semantic-classification-drtrainset21-v21-003

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drtrainset21_v21_003.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drtrainset21-v21-003:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2
      - name: Verify exact prestate and typo boundary
        shell: bash
        run: |
          set -euo pipefail
          STAGED_BASE=bf2f777dc31032780f13fdb1f5e7e775f1145389
          CLEAN_BASE=9caf112cf76b05b863f3e0e07134015a701068f0
          test "$(git rev-parse HEAD^)" = "$STAGED_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drtrainset21_v21_003.yml"
          test "$(git hash-object audit_registry/semantic_classification_blocks/DRTRAINSET21_V21_003_v0.1.json)" = "ddc7708920b5674b9afab0cc63ef24e7918d184e"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "0675a167276fc8b2e8d17b8bc38f7307a60ea463"
          test "$(git hash-object audit_registry/drtrainset21_revalidation_evidence_2026-09-06.json)" = "5378874f7948527a76d18a313b1c8879dd2ec981"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTRAINSET21_2026-09-06.md)" = "2c208c72b065f58538729128338af99783b9f310"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.1.md)" = "6d5680f438e7e592aaf1d056e39224e7c2a3f2d9"
          test "$(git hash-object tools/validate_trainset_v21_ev109.py)" = "f88208bff7e39bb38a86a310dc121f486984f807"
          test "$(git hash-object IBIS-IP_TrainSetInformationService_V2.1.xsd)" = "897f373e31b76aa23d8bc206854b042524e4c102"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert reg['progress']['classified_count']==125
          assert reg['progress']['remaining_count']==67
          assert reg['progress']['latest_block']=='DRTRAINSET21_V21_001_002'
          assert reg['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRTRAINSET21_V21_001_002_v0.1.json'
          assert 'DRTRAINSET21-003' not in {e['finding_id'] for e in reg['entries']}
          prov=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          state={e['finding_id']:e['revalidation_state'] for e in prov['inventory']['entries'] if e['finding_id']=='DRTRAINSET21-003'}
          assert state=={'DRTRAINSET21-003':'context_verified'},state
          ev=json.loads(Path('audit_registry/drtrainset21_revalidation_evidence_2026-09-06.json').read_text())
          assert ev['evidence_id']=='EV-148' and ev['result']=='PASS'
          assert ev['finding_results']['DRTRAINSET21-003']['executable_effect'] is False
          assert 'GetTrainSetCompositon' in ev['finding_results']['DRTRAINSET21-003']['summary']
          block=json.loads(Path('audit_registry/semantic_classification_blocks/DRTRAINSET21_V21_003_v0.1.json').read_text())
          assert block['block_id']=='DRTRAINSET21_V21_003'
          assert [e['finding_id'] for e in block['entries']]==['DRTRAINSET21-003']
          e=block['entries'][0]
          assert e['normative_authority']=='selected_xsd'
          assert e['primary_issue_kind']=='identifier_typo'
          assert e['defect_assessment']=='confirmed_pdf_defect'
          assert e['sdk_behavior']=='no_runtime_diagnostic'
          assert e['runtime_match']['state']=='not_applicable'
          print('PASSED: exact DRTRAINSET21-003 prestate and no-alias typo boundary')
          PY
          git diff --exit-code
      - name: Re-run EV-109 as exact spelling counter-context
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_trainset_v21_ev109.py | tee /tmp/ev109.log
          grep -F "PASSED: EV-109 TrainSet V2.1 deep-read evidence completed" /tmp/ev109.log
      - name: Merge one-finding block and validate registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRTRAINSET21_V21_003_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRTRAINSET21_V21_003; classified=126 remaining=66" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 126 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert r['progress']['classified_count']==126
          assert r['progress']['remaining_count']==66
          assert r['progress']['latest_block']=='DRTRAINSET21_V21_003'
          assert r['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRTRAINSET21_V21_003_v0.1.json'
          assert 'DRTRAINSET21-003' in {e['finding_id'] for e in r['entries']}
          print('PASSED: DRTRAINSET21 complete at 126/192')
          PY
      - name: Persist exact one-finding boundary
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp_merge_semantic_classification_drtrainset21_v21_003.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'.github/workflows/temp_merge_semantic_classification_drtrainset21_v21_003.yml','audit_registry/finding_semantic_classification_v0.1.json'}
          assert staged==expected,(staged,expected)
          changed=set(subprocess.check_output(['git','diff','--name-only','9caf112cf76b05b863f3e0e07134015a701068f0'],text=True).splitlines())
          expected_changed={'audit_registry/finding_semantic_classification_v0.1.json','audit_registry/semantic_classification_blocks/DRTRAINSET21_V21_003_v0.1.json'}
          assert changed==expected_changed,(changed,expected_changed)
          print('PASSED: persistent boundary is master registry + DRTRAINSET21-003 block only')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRTRAINSET21-003 semantic classification"
          git push origin HEAD:dev/schema-integration
