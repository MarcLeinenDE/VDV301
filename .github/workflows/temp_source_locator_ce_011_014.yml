name: TEMP source locator CE011 CE014

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_source_locator_ce_011_014.yml
      - audit_registry/finding_source_locators_v0.1.json
      - audit_registry/finding_source_locators_v0.1.schema.json
      - audit_registry/finding_semantic_classification_v0.1.json
      - audit_registry/pdf_source_registry_v0.1.json
      - audit_registry/pdf_source_pins_v0.1.json
      - audit_registry/source_locator_review_blocks/CE_011_014_v0.1.json
      - docs/pdf_xsd_semantic_audit/SOURCE_LOCATOR_REVIEW_CE_011_014_2026-09-25.md
      - sdk_manifest/manifest_v0.1.json
      - sdk_manifest/known_issues_runtime_mapping_v0.1.json
      - 00_START_HERE/CURRENT_STATE.json
      - tools/validate_finding_source_locators_v0_1.py
      - tools/validate_sdk_manifest_v0_1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check lxml jsonschema

      - name: Validate canonical locator manifest
        run: python tools/validate_finding_source_locators_v0_1.py

      - name: Verify all stored XSD component locators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          ROOT=Path(".")
          NS={"xs":"http://www.w3.org/2001/XMLSchema"}
          m=json.loads((ROOT/"audit_registry/finding_source_locators_v0.1.json").read_text())

          assert len(m["entries"])==10
          assert m["counts"]=={
              "semantic_finding_count":192,
              "locator_entry_count":10,
              "coverage_complete_count":10,
              "coverage_partial_count":0,
              "remaining_finding_count":182,
          }
          lanes=sum(len(e["coverage"]) for e in m["entries"])
          assert lanes==44,lanes

          for e in m["entries"]:
              for c in e["coverage"]:
                  for x in c["xsd_locators"]:
                      tree=etree.parse(str(ROOT/x["file"]))
                      nodes=tree.xpath(x["xpath_hint"],namespaces=NS)
                      assert nodes,(e["finding_id"],c["version"],x["file"],x["xpath_hint"])
                      if x.get("value"):
                          assert any(n.get("value")==x["value"] for n in nodes),(e["finding_id"],c["version"],x["value"])
          print("ALL_SOURCE_LOCATOR_XPATHS_OK",lanes)
          PY

      - name: Verify CE-011..014 PDF matrix and semantic scopes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ROOT=Path(".")
          m=json.loads((ROOT/"audit_registry/finding_source_locators_v0.1.json").read_text())
          sem=json.loads((ROOT/"audit_registry/finding_semantic_classification_v0.1.json").read_text())
          by={e["finding_id"]:e for e in m["entries"]}
          sem_by={e["finding_id"]:e for e in sem["entries"]}

          targets={"CE-011","CE-012","CE-013","CE-014"}
          assert targets.issubset(by)
          for fid in targets:
              assert by[fid]["coverage_state"]=="complete"
              assert by[fid]["scope_claims"]==sem_by[fid]["version_scope"]

          expected_versions={
              "CE-011":{"2.2","2.3","2.4"},
              "CE-012":{"1.0","2.0","2.1","2.2","2.3","2.4"},
              "CE-013":{"1.0","2.0","2.1","2.2","2.3","2.4"},
              "CE-014":{"1.0","2.0","2.1","2.2","2.3","2.4"},
          }
          expected_pages={
              ("CE-011","2.2"):{18},("CE-011","2.3"):{18},("CE-011","2.4"):{20},
              ("CE-012","1.0"):{11},("CE-012","2.0"):{18},("CE-012","2.1"):{20},("CE-012","2.2"):{21},("CE-012","2.3"):{21},("CE-012","2.4"):{23},
              ("CE-013","1.0"):{7},("CE-013","2.0"):{14},("CE-013","2.1"):{15},("CE-013","2.2"):{16},("CE-013","2.3"):{16},("CE-013","2.4"):{18},
              ("CE-014","1.0"):{10},("CE-014","2.0"):{17},("CE-014","2.1"):{18},("CE-014","2.2"):{19},("CE-014","2.3"):{19},("CE-014","2.4"):{21},
          }
          expected_table={"CE-011":"Table 8","CE-012":"Table 18","CE-013":"Table 1","CE-014":"Table 12"}

          for fid,versions in expected_versions.items():
              got={c["version"] for c in by[fid]["coverage"]}
              assert got==versions,(fid,got)
              for c in by[fid]["coverage"]:
                  key=(fid,c["version"])
                  pages={p for loc in c["pdf_locators"] for p in loc["printed_pages"]}
                  tables={loc["table"] for loc in c["pdf_locators"]}
                  assert pages==expected_pages[key],(key,pages)
                  assert tables=={expected_table[fid]},(key,tables)
                  assert all(loc["source_id"]==f"COMMON_V{c['version']}" for loc in c["pdf_locators"])
                  assert c["authority"]==("candidate_integration" if c["version"]=="2.4" else "official_release")

          # CE-011 must not back-extend to aligned V2.1.
          assert {c["version"] for c in by["CE-011"]["coverage"]}=={"2.2","2.3","2.4"}
          assert [s["version"] for s in sem_by["CE-011"]["version_scope"]]==["Common V2.2-V2.3","Common V2.4"]

          # V1.0 CE-014 must retain the exact anonymous inline schema model.
          v10=next(c for c in by["CE-014"]["coverage"] if c["version"]=="1.0")
          x=v10["xsd_locators"][0]
          assert x["component"]=="DeviceInformationStructure/DataVersionList"
          assert "DeviceInformationStructure" in x["xpath_hint"]
          assert "DataVersionListStructure" not in x["xpath_hint"]

          # CE-013 has two independently located XSD boundaries in every version.
          for c in by["CE-013"]["coverage"]:
              assert len(c["xsd_locators"])==2
              members={x["member"] for x in c["xsd_locators"]}
              assert members=={"xs:choice minOccurs=0","SpecificPoint"},(c["version"],members)

          print("CE011_014_LOCATOR_MATRIX_OK")
          PY

      - name: Re-run affected Common executable evidence
        shell: bash
        run: |
          python tools/validate_common_v10_ev117.py
          python tools/validate_common_v20_ev118.py
          python tools/validate_common_v21_ev119.py
          python tools/validate_common_v22_ev120.py
          python tools/validate_common_v23_ev121.py
          python tools/validate_common_v24_ev122.py

      - name: Validate semantic registry
        run: python tools/validate_finding_semantic_classification.py
      - name: Validate deterministic Known-Issues mapping
        run: python tools/validate_known_issues_runtime_mapping_v0_1.py
      - name: Validate SDK manifest integration
        run: python tools/validate_sdk_manifest_v0_1.py
      - name: Root XSD regression
        run: python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
      - name: Verify XSD tree clean
        run: git diff --exit-code -- '*.xsd'
