name: temp-merge-semantic-classification-drcom10

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drcom10.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drcom10:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify immutable prestate
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=24115c8df3f0f236c4592e2860a11ae8b85bcd20
          test "$(git rev-parse HEAD^)" = "$CLEAN_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drcom10.yml"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "4249132040aac1be222f3feae13a10a8fdeb830d"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_COMMON_V10_2026-09-04.md)" = "5451b70122205f80abf2f419cd4fceb999d382aa"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/COMMON_V1.0.md)" = "9cea2ebdc8dfafe3f5d9a74bc3da17b9d2fe62cc"
          test ! -e audit_registry/semantic_classification_blocks/DRCOM10_v0.1.json
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PYSTATE'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count'] == 90
          assert r['progress']['remaining_count'] == 102
          assert r['progress']['reviewed_blocks'] == ['ARA','ARCH','BG','CE','CIS','DISC','DMS','DR3011','DR3012','DRARA24']
          assert r['progress']['latest_block'] == 'DRARA24'
          assert r['progress']['latest_block_file'] == 'audit_registry/semantic_classification_blocks/DRARA24_v0.1.json'
          ids={e['finding_id'] for e in r['entries']}
          assert not any(f'DRCOM10-{n:03d}' in ids for n in range(1,8))
          print('PASSED: DRCOM10 semantic prestate is exactly 90/192')
          PYSTATE
          git diff --exit-code

      - name: Materialize exact DRCOM10 block
        shell: bash
        env:
          DRCOM10_BLOCK_ZLIB_B64: ""
        run: |
          set -euo pipefail
          mkdir -p audit_registry/semantic_classification_blocks
          python - <<'PYBLOCK'
          import base64, os, zlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode(os.environ['DRCOM10_BLOCK_ZLIB_B64'], validate=True))
          Path('audit_registry/semantic_classification_blocks/DRCOM10_v0.1.json').write_bytes(data)
          PYBLOCK
          test "$(sha256sum audit_registry/semantic_classification_blocks/DRCOM10_v0.1.json | awk '{print $1}')" = "833cd7991c9364f9d2bed395953fbf2d98868f3bb094c7e57e4b65a788db676a"
          python - <<'PYCHECK'
          import json
          from pathlib import Path
          b=json.loads(Path('audit_registry/semantic_classification_blocks/DRCOM10_v0.1.json').read_text(encoding='utf-8'))
          assert b['block_id'] == 'DRCOM10'
          assert [e['finding_id'] for e in b['entries']] == [f'DRCOM10-{n:03d}' for n in range(1,8)]
          by={e['finding_id']:e for e in b['entries']}
          assert by['DRCOM10-007']['normative_authority'] == 'contextual_only'
          assert by['DRCOM10-007']['sdk_behavior'] == 'no_runtime_diagnostic'
          for n in range(1,7):
              assert by[f'DRCOM10-{n:03d}']['normative_authority'] == 'selected_xsd'
          print('PASSED: exact seven-entry DRCOM10 block with executable/documentation boundary')
          PYCHECK

      - name: Merge and validate DRCOM10 classification
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRCOM10_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRCOM10; classified=97 remaining=95" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 97 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Verify final tree boundary and persist
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=24115c8df3f0f236c4592e2860a11ae8b85bcd20
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          python - <<'PYPOST'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count'] == 97
          assert r['progress']['remaining_count'] == 95
          assert r['progress']['reviewed_blocks'] == ['ARA','ARCH','BG','CE','CIS','DISC','DMS','DR3011','DR3012','DRARA24','DRCOM10']
          assert r['progress']['latest_block'] == 'DRCOM10'
          assert r['progress']['latest_block_file'] == 'audit_registry/semantic_classification_blocks/DRCOM10_v0.1.json'
          entries=[e for e in r['entries'] if e['finding_id'].startswith('DRCOM10-')]
          assert [e['finding_id'] for e in entries] == [f'DRCOM10-{n:03d}' for n in range(1,8)]
          print('PASSED: DRCOM10 semantic poststate is exactly 97/192')
          PYPOST
          git diff --check
          rm -f .github/workflows/temp_merge_semantic_classification_drcom10.yml
          git add -A
          python - <<'PYDIFF'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only','24115c8df3f0f236c4592e2860a11ae8b85bcd20'], text=True).splitlines()
          assert names == [
              'audit_registry/finding_semantic_classification_v0.1.json',
              'audit_registry/semantic_classification_blocks/DRCOM10_v0.1.json',
          ], names
          print('PASSED: final tree differs from DRARA24 clean prestate only by DRCOM10 block and semantic registry')
          PYDIFF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRCOM10 semantic classification"
          git push origin HEAD:dev/schema-integration
