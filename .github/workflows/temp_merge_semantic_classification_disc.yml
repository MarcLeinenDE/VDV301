name: temp-merge-semantic-classification-disc

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_disc.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-disc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify immutable prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "be39c52ba6508746145eba80cfe96fbf814e9b15"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_disc.yml"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "d1ccef925452d447d9ebdb856305c0d752a8b282"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DISC_2026-09-03.md)" = "f17ce8f6a3a5ad19d515552d2349baa2a62a8802"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/NETWORK_DISCOVERY_FINDINGS_REGISTER_ADDENDUM.md)" = "eb5f03d98a9a8d2dd9a0e970a2a8a8217646d765"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          git diff --exit-code

      - name: Materialize DISC block
        shell: bash
        env:
          DISC_BLOCK_ZLIB_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          raw = zlib.decompress(base64.b64decode(os.environ['DISC_BLOCK_ZLIB_B64']))
          p = Path('audit_registry/semantic_classification_blocks/DISC_v0.1.json')
          p.write_bytes(raw)
          PY
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('audit_registry/semantic_classification_blocks/DISC_v0.1.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['block_id'] == 'DISC'
          assert d['source_baseline_payload_sha256'] == 'd5bf14df302d57a0fc3d71792e1cb00583fafd3e9c7efd19721fd0de353dd576'
          assert [e['finding_id'] for e in d['entries']] == ['DISC-001','DISC-002','DISC-003']
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'c634da04f40008a63a436a6b8d87f2c1131ebe4778b696c71666f7f9c3083c81'
          print('DISC_BLOCK_OK')
          PY

      - name: Merge and validate DISC
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DISC_v0.1.json | tee /tmp/merge.log
          grep -Fq 'PASSED: merged block DISC; classified=54 remaining=138' /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/classification.log
          grep -Fq 'PASSED: semantic classification registry valid; 54 reviewed entries anchored to frozen baseline' /tmp/classification.log
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert len(d['entries']) == 54
          assert d['progress']['classified_count'] == 54
          assert d['progress']['remaining_count'] == 138
          assert d['progress']['reviewed_blocks'] == ['ARA','ARCH','BG','CE','CIS','DISC']
          assert d['progress']['latest_block'] == 'DISC'
          assert d['progress']['latest_block_file'] == 'audit_registry/semantic_classification_blocks/DISC_v0.1.json'
          ids = {e['finding_id'] for e in d['entries']}
          assert all(f'DISC-{i:03d}' in ids for i in range(1,4))
          print('DISC_REGISTRY_POSTSTATE_OK')
          PY

      - name: XSD regression and mutation guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py | tee /tmp/xsd.log
          grep -Fq PASSED /tmp/xsd.log
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'audit_registry/finding_semantic_classification_v0.1.json'
          test "${changed[1]}" = 'audit_registry/semantic_classification_blocks/DISC_v0.1.json'
          git diff --check
          ! git status --porcelain | grep -E '\.xsd$'

      - name: Commit DISC semantic classification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit_registry/finding_semantic_classification_v0.1.json audit_registry/semantic_classification_blocks/DISC_v0.1.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'audit: merge DISC semantic classification'
          git push origin HEAD:dev/schema-integration
