          t = t.replace('State: `context_verified` for V2.1 and independently for V2.2, with exact-XSD-side support from EV-112/EV-113.', 'State: `context_verified` for V2.1, V2.2 and V2.3, with exact-XSD-side support from EV-112/EV-113/EV-114 as applicable.', 1)
          t = t.replace('State: `context_verified` for V2.1 and independently for V2.2.', 'State: `context_verified` for V2.1, V2.2 and V2.3.', 1)
          t = t.replace('version_scope: V2.1-V2.2 PDFs', 'version_scope: V2.1-V2.3 PDFs')
          t = t.replace('This routing note is historical knowledge only until the V2.3 Deep Read independently re-establishes the exact V2.3 authority route before using it as current Evidence-Gate proof.', 'The V2.3 Deep Read has now independently re-established this routing note: official tag VDV-301-2.3 contains the V2.2-named service file and no V2.3-named service file; the V2.3 PDF says no XSD update is necessary; EV-114 guards the official-route/candidate provenance boundary.', 1)
          closing = 'The broader historical TicketValidation inventory is not frozen by the V2.1/V2.2 closures. Later version blocks must independently apply the current Evidence Gate.'
          assert closing in t
          v23 = '''## V2.3 Evidence-Gate closure boundary\n\n```text\nTVS-002       revalidated for V2.3 with EV-114 on the exact official V2.3 -> V2.2 schema route\nTVS-003       revalidated/refined for V2.3 with EV-114; correction-claim context retained\nDRTVS21-001  independently recurs; V2.3 scope uses identical official V2.2 blobs, EV-114 exact-type support and EV-113 case-sensitive behavior\nDRTVS21-002  independently recurs; V2.3 scope context-verified with EV-114 XSD support\nDRTVS21-003  independently recurs; V2.3 scope context-verified\nDRTVS21-004  not scope-extended\n\nTVS-001      not revalidated here; V2.4 scope\nnew V2.3-only IDs: none after deduplication\n```\n\nV2.3-specific context refinement for TVS-003:\n\n```text\nThe V2.3 foreword/version history explicitly says chapter 3.1.2 was corrected to correspond to XSD V2.2 and that no XSD update is necessary.\nNevertheless the visible response/table labels and list of tables still carry GetCurrentStopPointResponse / CurrentStopPointData, while the executable official route uses CurrentTariffStop names.\n```\n\nRouting conclusion:\n\n```text\nofficial V2.3 authority = official VDV-301-2.3 tag routing to IBIS-IP_TicketValidationService_V2.2.xsd + Common/Enums V2.2\nbranch IBIS-IP_TicketValidationService_V2.3.xsd = candidate/integration material; not historical official release authority\nsemantic equality does not collapse provenance classes\n```\n\nThe broader historical TicketValidation inventory is not frozen by the V2.1/V2.2/V2.3 closures. V2.4 must independently apply the current Evidence Gate.'''
          t = t.replace(closing, v23, 1)
          p.write_text(t, encoding='utf-8')

          # 7) Validation backlog updates.
          p = ROOT / 'docs/pdf_xsd_semantic_audit/validation_backlog.md'
          t = p.read_text(encoding='utf-8')
          t = t.replace('Status: deterministic repository validation includes EV-113 for TicketValidationService V2.2.', 'Status: deterministic repository validation includes EV-114 for TicketValidationService V2.3 authority/routing and inherited executable boundary.', 1)
          line = 'EV-113           run 33257767942  PASS  official TVS V2.2 RouteDeviation enum separation + CurrentTariffStop rename/type evidence\n'
          assert line in t
          t = t.replace(line, line + 'EV-114           run 33264437557  PASS  TVS V2.3 official-route/candidate authority guard + inherited V2.2 executable boundary\n', 1)
          t = t.replace('EV-110 through EV-113 are targeted additive tests', 'EV-110 through EV-114 are targeted additive tests', 1)
