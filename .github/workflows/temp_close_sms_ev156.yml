name: TEMP close SMS EV-156

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_close_sms_ev156.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  close-sms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install closure tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Verify immutable SMS closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/finding_revalidation_registry_v0.1.json)" = "96fa80faade79c5866f6c9d21e550abb56ea282f"
          test "$(git rev-parse HEAD:00_START_HERE/CURRENT_STATE.json)" = "b2e89510ffebd76448f9ff8a99b98bbc8c0d20fd"
          test "$(git rev-parse HEAD:audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(git rev-parse HEAD:docs/pdf_xsd_semantic_audit/deep_read/SMS_V2.2.md)" = "4eb220e43a728a0f719cdcf81fac78df058ecd08"
          test "$(git rev-parse HEAD:tools/validate_sms_v22_ev116.py)" = "bac849f6c33e6084e899794564f99f0c6cbd338a"
          test "$(git rev-parse HEAD:tools/validate_sms_revalidation_ev156.py)" = "335aff0aaed1badc60bf5a59aac101897f211161"
          test "$(git rev-parse HEAD:tools/close_sms_revalidation_block.py)" = "8df345556d04789171930c6fb1a2a69c3d6a55d3"
          test "$(git rev-parse HEAD:.github/workflows/temp_validate_sms_ev156.yml)" = "d95b9088a36489534d2c16d291c2d587184d15d7"
          test "$(git rev-parse HEAD:IBIS-IP_SystemMonitoringService_V2.2.xsd)" = "d8d3011965fcf7c5c15ecd6f0d7e917a3f9e6d3c"
          test "$(git rev-parse HEAD:IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"
          test "$(git rev-parse HEAD:IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(wc -l < /tmp/xsd-before.sha256)" -eq 50

      - name: Verify pinned EV-156 run and artifact via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${api}/actions/runs/34460160697" > /tmp/ev156-run.json
          test "$(jq -r .status /tmp/ev156-run.json)" = "completed"
          test "$(jq -r .conclusion /tmp/ev156-run.json)" = "success"
          test "$(jq -r .head_branch /tmp/ev156-run.json)" = "dev/schema-integration"
          test "$(jq -r .head_sha /tmp/ev156-run.json)" = "15c0ff646347300167ec592710a84e635b55fd91"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${api}/actions/runs/34460160697/artifacts" > /tmp/ev156-artifacts.json
          test "$(jq -r '.artifacts[] | select(.id==10145182333) | .name' /tmp/ev156-artifacts.json)" = "sms-ev156-evidence"
          test "$(jq -r '.artifacts[] | select(.id==10145182333) | .expired' /tmp/ev156-artifacts.json)" = "false"
          test "$(jq -r '.artifacts[] | select(.id==10145182333) | .digest' /tmp/ev156-artifacts.json)" = "sha256:67c01039e53841c4fb549af2414c6c957ab8de8a85df7a8ff594f85b2a9ffb19"
          echo "PINNED_EV156_OK run=34460160697 artifact=10145182333"

      - name: Re-pin official SMS PDF and upstream tag
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/sms-closure-ev156 artifacts/sms-upstream-git
          mkdir -p artifacts/sms-closure-ev156/renders artifacts/sms-closure-ev156/result
          python - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          url='https://www.vdv.de/301-2-18-sdes-v2-2-systemmonitoringservice.pdfx'
          expected_sha='996f639a81cb91ad20a8e78b6213e7c85d41ff0ec42caba4208d6c4652b140f4'
          expected_size=847416
          data=None
          for attempt in range(4):
              try:
                  req=urllib.request.Request(url, headers={
                      'User-Agent':'VDV301-Audit-EV156-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                      'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
                  })
                  with urllib.request.urlopen(req, timeout=90) as response:
                      data=response.read()
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(2*(attempt+1))
          assert data is not None and data.startswith(b'%PDF-')
          assert hashlib.sha256(data).hexdigest() == expected_sha
          assert len(data) == expected_size
          Path('artifacts/sms-closure-ev156/SMS_V2.2.pdf').write_bytes(data)
          print('PIN_OK', expected_sha, expected_size)
          PY
          for p in 4 9 10 11 12 13; do
            pdftoppm -f "$p" -singlefile -r 180 -png artifacts/sms-closure-ev156/SMS_V2.2.pdf "artifacts/sms-closure-ev156/renders/SMS_V2.2-page-$p" >/dev/null 2>&1
          done
          git init -q artifacts/sms-upstream-git
          git -C artifacts/sms-upstream-git remote add origin https://github.com/VDVde/VDV301.git
          git -C artifacts/sms-upstream-git fetch --depth=1 origin refs/tags/VDV-301-2.2:refs/tags/VDV-301-2.2
          test "$(git -C artifacts/sms-upstream-git rev-parse VDV-301-2.2^{})" = "f283697124750d12189b960b302b399769bad530"
          test "$(git -C artifacts/sms-upstream-git rev-parse VDV-301-2.2^{}:IBIS-IP_SystemMonitoringService_V2.2.xsd)" = "d8d3011965fcf7c5c15ecd6f0d7e917a3f9e6d3c"
          test "$(git -C artifacts/sms-upstream-git rev-parse VDV-301-2.2^{}:IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"
          test "$(git -C artifacts/sms-upstream-git rev-parse VDV-301-2.2^{}:IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"

      - name: Re-run EV-156, EV-116 and full XSD pool
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/validate_sms_revalidation_ev156.py tools/validate_sms_v22_ev116.py tools/close_sms_revalidation_block.py
          python tools/validate_sms_revalidation_ev156.py \
            --repo-root . \
            --pdf artifacts/sms-closure-ev156/SMS_V2.2.pdf \
            --output-dir artifacts/sms-closure-ev156/result
          python - <<'PY'
          import json
          d=json.load(open('artifacts/sms-closure-ev156/result/ev156_result.json',encoding='utf-8'))
          assert d['evidence_id']=='EV-156' and d['result']=='PASS'
          assert d['finding_results']['SMS-001']['recommended_terminal_state']=='contextual_not_defect'
          assert d['finding_results']['SMS-002']['recommended_terminal_state']=='executable_confirmed'
          assert d['finding_results']['SMS-003']['recommended_terminal_state']=='context_verified'
          assert d['finding_results']['SMS-004']['recommended_terminal_state']=='context_verified'
          assert d['expected_poststate_if_closed']=={'terminal':144,'pending':48,'first_pending':'SUB-001','next_block':'SUB'}
          print('EV156_CLOSURE_RESULT_OK')
          PY
          python tools/validate_sms_v22_ev116.py
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after-evidence.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after-evidence.sha256
          git diff --exit-code -- '*.xsd' audit_registry/finding_inventory_frozen_2026-09-03.json

      - name: Apply fail-closed SMS closure
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_sms_revalidation_block.py

      - name: Verify SMS poststate and immutability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          reg=json.load(open('audit_registry/finding_revalidation_registry_v0.1.json',encoding='utf-8'))
          st=json.load(open('00_START_HERE/CURRENT_STATE.json',encoding='utf-8'))['audit']
          entries=reg['inventory']['entries']
          by={x['finding_id']:x for x in entries}
          expected={
              'SMS-001':'contextual_not_defect',
              'SMS-002':'executable_confirmed',
              'SMS-003':'context_verified',
              'SMS-004':'context_verified',
          }
          assert len(entries)==192
          for fid,state in expected.items():
              assert by[fid]['revalidation_state']==state
              assert by[fid]['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_SMS_2026-09-10.md'
          terminal_states={'context_verified','executable_confirmed','contextual_not_defect','withdrawn','unresolved','superseded'}
          assert sum(x['revalidation_state'] in terminal_states for x in entries)==144
          assert sum(x['revalidation_state']=='pending' for x in entries)==48
          assert next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')=='SUB-001'
          assert reg['next_revalidation_block']=='SUB'
          assert reg['revalidation_blocks']['SMS']['state']=='completed'
          assert reg['revalidation_blocks']['SMS']['pinned_successful_evidence_run']=='34460160697'
          assert reg['revalidation_blocks']['SMS']['artifact_id']=='10145182333'
          assert st['finding_revalidation_completed_findings']==144
          assert st['finding_revalidation_pending_findings']==48
          assert st['finding_revalidation_next_block']=='SUB'
          assert st['finding_revalidation_latest_completed_block']=='SMS'
          assert st['latest_revalidation_evidence_id']=='EV-156'
          print('SMS_POSTSTATE_OK terminal=144 pending=48 next=SUB first=SUB-001')
          PY
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after-closure.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after-closure.sha256

      - name: Remove transient SMS workflows and enforce write allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_validate_sms_ev156.yml
          rm -f .github/workflows/temp_close_sms_ev156.yml
          rm -rf artifacts/sms-closure-ev156 artifacts/sms-upstream-git tools/__pycache__
          printf '%s\n' \
            '.github/workflows/temp_close_sms_ev156.yml' \
            '.github/workflows/temp_validate_sms_ev156.yml' \
            '00_START_HERE/CURRENT_STATE.json' \
            'audit_registry/finding_revalidation_registry_v0.1.json' \
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_SMS_2026-09-10.md' \
            | sort > /tmp/expected-paths.txt
          git status --porcelain=v1 | sed -E 's/^.. //' | sort > /tmp/actual-paths.txt
          echo 'EXPECTED'; cat /tmp/expected-paths.txt
          echo 'ACTUAL'; cat /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git diff --check
          git diff --exit-code -- '*.xsd' audit_registry/finding_inventory_frozen_2026-09-03.json

      - name: Commit and push atomic SMS closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VDV301 Audit Bot'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git add -A -- \
            .github/workflows/temp_close_sms_ev156.yml \
            .github/workflows/temp_validate_sms_ev156.yml \
            00_START_HERE/CURRENT_STATE.json \
            audit_registry/finding_revalidation_registry_v0.1.json \
            docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_SMS_2026-09-10.md
          git diff --cached --check
          if git diff --cached --name-only | grep -E '\.xsd$'; then
            echo 'XSD mutation detected in SMS closure' >&2
            exit 1
          fi
          git commit -m 'audit: close SMS revalidation block'
          git push origin HEAD:dev/schema-integration
