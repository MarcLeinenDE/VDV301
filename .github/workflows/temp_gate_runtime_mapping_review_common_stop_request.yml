name: temp-gate-runtime-mapping-review-common-stop-request-closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_runtime_mapping_review_common_stop_request.yml

permissions:
  contents: read

jobs:
  gate-common-stop-request-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact closure prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "bbf2777344e05810da18e058ec275e08e2d8839b"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "018d93136e16d7015a971a81b2624cc1229df4c6"
          test "$(git hash-object sdk_manifest/manifest_v0.1.json)" = "b8f4182aef141909a487891b13c1e4f6231945ab"
          test "$(git hash-object sdk_manifest/README.md)" = "700046d31ac4fde5ef455b5e0f4435894ef10715"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "6dbf19d0d29934783027354fe8a18aa6ea0e7e5a"
          test "$(git hash-object sdk_manifest/known_issues_runtime_mapping_v0.1.json)" = "5ae1b7f19d99475b22411a422484a966d69a7d01"

      - name: Validate synchronized runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_finding_semantic_classification.py
          python tools/validate_known_issues_runtime_mapping_v0_1.py
          python tools/validate_sdk_manifest_v0_1.py
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('sdk_manifest/manifest_v0.1.json').read_text())
          r=json.loads(Path('sdk_manifest/known_issues_runtime_mapping_v0.1.json').read_text())
          k=m['known_issues_knowledge']
          assert k['runtime_match_distribution']=={'candidate':27,'not_applicable':113,'not_designed':1,'reviewed':51}
          assert r['counts']=={
              'reviewed_mapping_count':51,
              'implemented_count':0,
              'semantic_candidate_count':27,
              'semantic_not_designed_count':1,
              'semantic_not_applicable_count':113,
          }
          assert k['runtime_mapping_latest_review_block']=='COMMON_STOP_INFORMATION_REQUEST_V21_V23'
          print('PASSED: StopInformationRequest closure counters and latest block are consistent')
          PY

      - name: Prove XSD immutability
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: StopInformationRequest runtime-mapping closure gate complete"
