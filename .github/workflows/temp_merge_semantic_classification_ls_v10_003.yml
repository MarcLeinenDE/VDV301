name: temp-merge-semantic-classification-ls-v10-003

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_merge_semantic_classification_ls_v10_003.yml

permissions:
  contents: write

jobs:
  merge-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact prestate and current LS-003 routing boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4cd9be737206904b191d6e59cd986ec063947535"
          test "$(git rev-parse HEAD^^)" = "1ec3d3150b6b80e237fbcfe80126d28cfcb208e1"
          test "$(git hash-object audit_registry/semantic_classification_blocks/LS_V10_003_v0.1.json)" = "aca434ba7ca447102a3d2848234838a7da867e59"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "0d5257f5488bde79ae533370aced023172c0fddf"
          test "$(git hash-object audit_registry/location_services_revalidation_evidence_2026-09-08.json)" = "ee01b1bfaa84c08af8f2ff58df0aa60bd5073f22"
          test "$(git hash-object IBIS-IP_BeaconLocationService_V1.0.xsd)" = "791e2889f2baa4779ab66ae9e77038ff1b4be915"
          test "$(git hash-object IBIS-IP_DistanceLocationService_V1.0.xsd)" = "e6fdc418b6ddaba75d3fbe8f048d1c6d70e023b6"
          test "$(git hash-object IBIS-IP_GNSSLocationService_V1.0.xsd)" = "a74a22079af25cdd028a3e519019d9b3326d9971"
          test "$(git hash-object IBIS-IP_NetworkLocationService_V1.0.xsd)" = "bd1f83df2dfa83f36666a3ab3df4457242b387e9"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"

          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/LS_V10_003_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          evidence=json.loads(Path('audit_registry/location_services_revalidation_evidence_2026-09-08.json').read_text())

          assert registry['progress']['classified_count']==140
          assert registry['progress']['remaining_count']==52
          assert registry['progress']['latest_block']=='LS_V10_001_002'
          assert 'LS-003' not in {e['finding_id'] for e in registry['entries']}

          assert block['block_id']=='LS_V10_003'
          assert [e['finding_id'] for e in block['entries']]==['LS-003']
          e=block['entries'][0]
          assert e['primary_issue_kind']=='intentional_design_misread'
          assert e['defect_assessment']=='non_defect'
          assert e['sdk_behavior']=='no_runtime_diagnostic'
          assert e['runtime_match']['state']=='not_applicable'

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['LS-003']['revalidation_state']=='contextual_not_defect'
          assert evidence['evidence_id']=='EV-153'
          assert evidence['result']=='PASS'
          assert evidence['finding_results']['LS-003']['routing_confirmed'] is True
          assert evidence['finding_results']['LS-003']['roots']=={
              'BLS':['BeaconLocationService.GetDataResponse'],
              'DLS':['DistanceLocationService.Data'],
              'GNSS':['GNSSLocationService.Data'],
              'NLS':['NetworkLocationService.Data'],
          }

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          files={
              'BLS':'IBIS-IP_BeaconLocationService_V1.0.xsd',
              'DLS':'IBIS-IP_DistanceLocationService_V1.0.xsd',
              'GNSS':'IBIS-IP_GNSSLocationService_V1.0.xsd',
              'NLS':'IBIS-IP_NetworkLocationService_V1.0.xsd',
          }
          expected={
              'BLS':['BeaconLocationService.GetDataResponse'],
              'DLS':['DistanceLocationService.Data'],
              'GNSS':['GNSSLocationService.Data'],
              'NLS':['NetworkLocationService.Data'],
          }
          docs={k:etree.parse(v) for k,v in files.items()}
          schemas={k:etree.XMLSchema(doc) for k,doc in docs.items()}
          for k,doc in docs.items():
              roots=[x.get('name') for x in doc.xpath('/xs:schema/xs:element',namespaces=NS)]
              assert roots==expected[k], (k, roots)

          samples={
              'BLS':"""<BeaconLocationService.GetDataResponse>
                <Data>
                  <TimeStamp><Value>2026-09-18T06:00:00Z</Value></TimeStamp>
                  <BeaconCode><Value>B1</Value></BeaconCode>
                  <BeaconDistance><Value>10.0</Value></BeaconDistance>
                </Data>
              </BeaconLocationService.GetDataResponse>""",
              'DLS':"""<DistanceLocationService.Data>
                <Distance><Value>12.5</Value></Distance>
              </DistanceLocationService.Data>""",
              'GNSS':"""<GNSSLocationService.Data>
                <latitude><Degree><Value>50.93</Value></Degree><Direction><Value>N</Value></Direction></latitude>
                <longitude><Degree><Value>6.95</Value></Degree><Direction><Value>E</Value></Direction></longitude>
                <GNSSType>GPS</GNSSType>
              </GNSSLocationService.Data>""",
              'NLS':"""<NetworkLocationService.Data>
                <CurrentTripRef><Value>T1</Value></CurrentTripRef>
                <NextPointRef><Value>P1</Value></NextPointRef>
                <DistanceToNextPoint><Value>10.0</Value></DistanceToNextPoint>
                <NextStopPointRef><Value>S1</Value></NextStopPointRef>
                <DistanceToNextStopPoint><Value>20.0</Value></DistanceToNextStopPoint>
              </NetworkLocationService.Data>""",
          }
          for k,xml in samples.items():
              assert schemas[k].validate(etree.fromstring(xml.encode())), (k, schemas[k].error_log.last_error)

          for sample_key,schema_key in [('BLS','DLS'),('DLS','BLS'),('GNSS','NLS'),('NLS','GNSS')]:
              assert not schemas[schema_key].validate(etree.fromstring(samples[sample_key].encode())), (sample_key,schema_key)

          print('PASSED: exact 140/192 prestate and current LS-003 service-specific routing boundary verified')
          PY

      - name: Snapshot XSD pool before semantic merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256

      - name: Merge LS-003 block and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/LS_V10_003_v0.1.json
          python tools/validate_finding_semantic_classification.py
          python - <<'PY'
          import json
          from pathlib import Path
          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert registry['progress']['classified_count']==141
          assert registry['progress']['remaining_count']==51
          assert registry['progress']['latest_block']=='LS_V10_003'
          assert registry['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/LS_V10_003_v0.1.json'
          e={x['finding_id']:x for x in registry['entries']}['LS-003']
          assert e['defect_assessment']=='non_defect'
          assert e['sdk_behavior']=='no_runtime_diagnostic'
          assert e['primary_issue_kind']=='intentional_design_misread'
          print('PASSED: merged registry is exactly 141/192 and LS-003 semantics are preserved')
          PY

      - name: Validate all 50 root XSDs and prove no schema mutation
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Persist only LS-003 block and master registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp_merge_semantic_classification_ls_v10_003.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          mapfile -t changed < <(git diff --name-only 1ec3d3150b6b80e237fbcfe80126d28cfcb208e1 | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'audit_registry/finding_semantic_classification_v0.1.json'
          test "${changed[1]}" = 'audit_registry/semantic_classification_blocks/LS_V10_003_v0.1.json'
          git commit -m 'audit: merge LS-003 semantic classification'
          git push origin HEAD:dev/schema-integration
