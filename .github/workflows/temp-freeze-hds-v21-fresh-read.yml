name: temp-freeze-hds-v21-fresh-read
on:
  push:
    branches: [dev/schema-integration]
    paths: ['.github/workflows/temp-freeze-hds-v21-fresh-read.yml']
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze independent HDS V2.1 fresh read
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          state_p = root/'00_START_HERE/CURRENT_STATE.json'
          delta_p = root/'audit_registry/deep_read_registry_delta_hds_v21_2026-08-29.json'
          report_p = root/'docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.1.md'

          state = json.loads(state_p.read_text(encoding='utf-8'))
          a = state['audit']
          a['deep_read_needs_visual_review'] = 26
          a['deep_read_textual_fresh_read_completed'] = 26
          a['deep_read_in_progress'] = 1
          a['deep_read_current_document_id'] = 'HDS_V2.1'
          a['deep_read_previous_document_id'] = 'TVS_V2.4'
          a['next_natural_deep_read_document_id'] = 'HDS_V2.1'
          a['pdf_sources_byte_pinned'] = 21
          pins = a.setdefault('pinned_active_sources', [])
          if 'HDS_V2.1' not in pins:
              pins.append('HDS_V2.1')
          a['latest_deep_read_registry_delta'] = 'audit_registry/deep_read_registry_delta_hds_v21_2026-08-29.json'
          a['hds_v2_1_deep_read_report'] = 'docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.1.md'
          a['hds_v2_1_source_pin'] = {
              'sha256':'c8aa91626bf60c8e74200200d63d44d497aeb3ab240c47039333b2c922a0e495',
              'size_bytes':734901,
              'evidence_run':'33265498869',
              'pinned_at_utc':'2026-08-29T17:23:26Z',
              'pdf_authority':'official_public_VDV_writing',
              'service_authority_status':'non_xsd_dns_sd_http_profile'
          }
          a['hds_v2_1_visual_evidence'] = {
              'pinned_byte_render_run':'33265541783',
              'render_job':'99134831905',
              'artifact_id':'9718526667',
              'pages_reviewed':[7,8,9,10],
              'status':'targeted_visible_review_complete_independent_fresh_read'
          }
          a['hds_v2_1_authority'] = {
              'dedicated_service_xsd':False,
              'official_release_tag_checked':'VDV-301-2.1',
              'service_model':'non_xsd_dns_sd_http_profile',
              'dns_sd_service_name':'HtmlDisplayService',
              'dns_sd_transport':'_http._tcp',
              'dns_sd_txt_keys':['content','path'],
              'url_model':'http://host:port/path',
              'xsd_boundary':'No HDS XML contract is inferred or selected.'
          }
          state_p.write_text(json.dumps(state, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')

          delta = json.loads(delta_p.read_text(encoding='utf-8'))
          h = delta['document_updates']['HDS_V2.1']
          h['state'] = 'fresh_read_visible_review_complete_pending_historical_reconciliation'
          h['fresh_read_started'] = '2026-08-29'
          h['textual_fresh_read_complete'] = True
          h['historical_findings_opened_during_fresh_read'] = False
          h['visual_evidence'] = {
              'interactive_screenshot_result':'cache_miss_fallback_used',
              'pinned_byte_render_run':'33265541783',
              'render_job':'99134831905',
              'artifact_id':'9718526667',
              'artifact_zip_sha256':'7c614eb57da7c2f43ae62ee930c4bbbc326dd99effcfe13cded0a85363ec907a',
              'pages_reviewed':[7,8,9,10],
              'page_png_sha256':{
                  '7':'2a27330b04c1c75c9d2a8959d3c5a1973251752bcab758480cddb851cc757263',
                  '8':'6e362a61d66d6a7018327e4aaadc71ed5174ab2d8268adf66764f6423da6adae',
                  '9':'fd03a121c9efb2e884a736bd1bc624f9482ece46d004b4b3185a2b683b2af8f2',
                  '10':'250c5aa85bf3a0cd37bfc3e50d470fda6b8a7bd7a274cf417493aa15164a0a08'
              },
              'status':'visible_review_complete_for_independent_fresh_read'
          }
          h['fresh_observations'] = [
              'The document explicitly says HtmlDisplayService defines no own protocol and is comparable to TimeService in that respect.',
              'Discovery is DNS-SD based with service name HtmlDisplayService over _http._tcp.',
              'TXT keys are content and path; path may include query or fragment.',
              'The browser URL is formed as http://host:port/path using SRV host/port plus TXT path.',
              'The content value is project-specific and not standardized by the document.',
              'The document intentionally does not prescribe stable requirements for the served HTTP content/browser behavior.',
              'Device integration uses DeviceManagementService with DeviceClass MultiFunctionalDisplay and DeviceID differentiation.',
              'No dedicated HtmlDisplayService XSD exists in the checked official VDV-301-2.1 tag or integration branch.'
          ]
          h['fresh_findings'] = []
          h['historical_reconciliation'] = 'pending_after_fresh_read_freeze'
          delta_p.write_text(json.dumps(delta, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')

          report = '''# HTMLDisplayService V2.1 — Deep Read Pass 2\n\nStatus: independent fresh read and targeted visible review complete; historical reconciliation intentionally pending.\n\n## Source authority\n\n- Official publication: VDV-Schrift 301-2-17, HtmlDisplayService V2.1, 07/2018.\n- Official URL: https://www.vdv.de/301-2-17-sds-v2-1-htmldisplayservice.pdfx\n- Pinned SHA-256: `c8aa91626bf60c8e74200200d63d44d497aeb3ab240c47039333b2c922a0e495`\n- Pinned size: `734901` bytes.\n- Source pin run: `33265498869`.\n- Interactive screenshot path returned cache miss; exact pinned-byte fallback render used.\n- Render run: `33265541783`, job `99134831905`, artifact `9718526667`.\n- Visibly reviewed pages: 7, 8, 9, 10.\n\n## Authority boundary\n\nThe checked official `VDV-301-2.1` tag and `dev/schema-integration` contain no dedicated HtmlDisplayService XSD. The publication itself states that HtmlDisplayService defines no own protocol. Therefore this document is treated as a **non-XSD DNS-SD/HTTP profile**. Supporting DeviceManagementService/Common structures do not create an HDS XML contract.\n\n## Independent fresh-read observations\n\n1. HtmlDisplayService is presented as comparable to TimeService in the sense that it does not define its own service protocol.\n2. Service discovery uses DNS-SD with service name `HtmlDisplayService` and transport `_http._tcp`.\n3. The SRV record supplies target host and port. TXT records use `content` and `path`.\n4. The browser target is formed as `http://host:port/path`; the `path` value may contain query and/or fragment components.\n5. `content` identifies the displayed content but is project-specific and explicitly not standardized by the publication. Multiple offered URLs are represented as separate DNS-SD entries.\n6. The publication intentionally avoids prescribing stable requirements for the actual HTTP content/browser implementation, because those requirements would age quickly. Browser/content compatibility is left to the involved suppliers.\n7. Device integration is performed through DeviceManagementService using `DeviceClass = MultiFunctionalDisplay`; devices are distinguished by `DeviceID`. No separate DeviceManagementService is introduced for HDS.\n\n## Falsification / boundary checks\n\n- Searched the official `VDV-301-2.1` release inventory for a dedicated HDS schema: none found.\n- Searched the integration root pool for a dedicated HDS schema: none found.\n- The visible German and English pages both support the non-XSD protocol-profile interpretation.\n- No XML/XSD finding is created from this document.\n- No requirement is inferred for MIME type or HTML feature support beyond what the publication explicitly states.\n\n## Fresh finding result\n\nNo new finding ID is promoted from the independent fresh read. This is not a claim that historical HDS findings are valid or invalid; they have deliberately not been opened yet.\n\n## Next gate\n\nOnly after this freeze may the historical HDS audit files and finding register be opened. Each historical item must then be revalidated against this pinned source and the protocol authority boundary under `FINDING_EVIDENCE_GATE.md`.\n'''
          report_p.write_text(report, encoding='utf-8')

          for p in (state_p, delta_p):
              json.loads(p.read_text(encoding='utf-8'))
          PY
      - name: Commit freeze and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add 00_START_HERE/CURRENT_STATE.json audit_registry/deep_read_registry_delta_hds_v21_2026-08-29.json docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.1.md
          git rm .github/workflows/temp-freeze-hds-v21-fresh-read.yml
          if git diff --cached --name-only | grep -E '\.xsd$'; then exit 1; fi
          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git commit -m 'Freeze independent HTMLDisplayService V2.1 fresh read'
          git push origin HEAD:dev/schema-integration
