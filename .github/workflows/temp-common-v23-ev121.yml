name: temp-common-v23-ev121

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-common-v23-ev121.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ev121:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check lxml
      - name: Run EV-121 Common V2.3 evidence
        run: python tools/validate_common_v23_ev121.py
