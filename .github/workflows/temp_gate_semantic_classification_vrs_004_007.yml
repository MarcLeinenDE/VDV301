name: temp-gate-semantic-classification-vrs-004-007

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_vrs_004_007.yml

permissions:
  contents: read

jobs:
  gate-vrs-004-007:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9c7df6da881f0fd773290f12ffb8b7679e88172b"
          test "$(git hash-object audit_registry/semantic_classification_blocks/VRS_V10_V24_004_007_v0.1.json)" = "d0191035f885b3e0139335985b96718edb83bb59"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "d316a6f5f71270cd90d33e24b4aeef78ad74b358"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VRS_2026-09-14.md)" = "21fe2f2d615e5d48b82213c8519ded5978d68750"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_CHOICE_NOTATION_2026-08-29.md)" = "fe024798ba1b9803ec70ee3b97def63ee03d298f"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/VIDEO_RECORDING_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "d9392d85a855717ac8041f9d34b127160244f946"

      - name: Verify VRS 004-007 semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree
          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/VRS_V10_V24_004_007_v0.1.json').read_text())
          assert registry['progress']['classified_count']==184
          assert registry['progress']['remaining_count']==8
          assert registry['progress']['latest_block']=='VRS_V10_V24_001_003'
          assert [e['finding_id'] for e in block['entries']]==['VRS-004','VRS-005','VRS-006','VRS-007']

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          for fid in ('VRS-004','VRS-005','VRS-006'):
              assert frozen[fid]['revalidation_state']=='context_verified'
          assert frozen['VRS-007']['revalidation_state']=='withdrawn'
          for fid in ('VRS-004','VRS-005','VRS-006','VRS-007'):
              assert frozen[fid]['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VRS_2026-09-14.md'

          by={e['finding_id']:e for e in block['entries']}
          assert by['VRS-004']['primary_issue_kind']=='wrong_operation_reference'
          assert by['VRS-004']['defect_assessment']=='confirmed_pdf_defect'
          assert by['VRS-005']['primary_issue_kind']=='identifier_typo'
          assert by['VRS-005']['defect_assessment']=='likely_xsd_defect'
          assert by['VRS-005']['runtime_match']['state']=='not_applicable'
          assert by['VRS-006']['primary_issue_kind']=='editorial_residue'
          assert by['VRS-006']['defect_assessment']=='confirmed_pdf_defect'
          assert by['VRS-007']['primary_issue_kind']=='intentional_design_misread'
          assert by['VRS-007']['defect_assessment']=='non_defect'
          assert by['VRS-007']['confidence']=='confirmed'
          assert by['VRS-007']['runtime_match']['state']=='not_applicable'

          d10=Path('docs/pdf_xsd_semantic_audit/deep_read/VRS_V1.0.md').read_text()
          d20=Path('docs/pdf_xsd_semantic_audit/deep_read/VRS_V2.0.md').read_text()
          d24=Path('docs/pdf_xsd_semantic_audit/deep_read/VRS_V2.4.md').read_text()
          corr=Path('docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_CHOICE_NOTATION_2026-08-29.md').read_text()
          add=Path('docs/pdf_xsd_semantic_audit/VIDEO_RECORDING_SERVICE_FINDINGS_REGISTER_ADDENDUM.md').read_text()

          assert 'SubscribeDisplayState' in d10 and 'UnsubscribeDisplayState' in d10
          assert 'VRS-004 - SubscribeDisplayState headings persist' in d20
          assert 'VRS-004 - Subscribe headings corrected' in d24

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          for path in ('IBIS-IP_VideoRecordingService_V2.0.xsd','IBIS-IP_VideoRecordingService_V2.4.xsd'):
              tree=etree.parse(path)
              etree.XMLSchema(tree)
              types=set(tree.xpath('/xs:schema/xs:complexType/@name',namespaces=NS))
              assert 'VideoRecordingService.PauseRecordingRRMRequestStruture' in types
              assert 'VideoRecordingService.PauseRecordingRRMRequestStructure' not in types

          assert 'Fehler! Verweisquelle konnte nicht gefunden werden..' in d10
          assert 'VRS-006 - broken V1.0 cross references corrected in V2.0' in d20
          assert 'VRS-006 - broken generated subscription references remain corrected' in d24

          assert 'VRS-007 was opened only because `-1:1` was misread as an invalid negative minimum. That premise is wrong.' in corr
          assert 'state: withdrawn_after_deep_read_correction' in corr
          assert 'VRS-007 WITHDRAWN' in add
          assert 'Historical report statements saying VRS-007 "persists" or "moves" in V2.4 are superseded' in add
          print('PASSED: VRS-004..007 semantics including withdrawn VRS-007 verified')
          PY

      - name: Simulate merge
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/VRS_V10_V24_004_007_v0.1.json --output /tmp/vrs-004-007.json
          python tools/validate_finding_semantic_classification.py --registry /tmp/vrs-004-007.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/vrs-004-007.json',encoding='utf-8'))
          assert r['progress']['classified_count']==188
          assert r['progress']['remaining_count']==4
          assert r['progress']['latest_block']=='VRS_V10_V24_004_007'
          print('PASSED: simulated registry is exactly 188/192')
          PY

      - name: Validate all 50 root XSDs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/before
          python tools/validate_xsd_pool.py --repo-root .
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/after
          cmp /tmp/before /tmp/after
          git diff --exit-code
          echo "PASSED: VRS 004-007 semantic gate complete; repository remains unmodified"
