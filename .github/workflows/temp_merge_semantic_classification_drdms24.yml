name: temp-merge-semantic-classification-drdms24

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drdms24.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drdms24:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify immutable prestate
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=39b621429546bd0227c7c1d8a70bb309ea6b2d1b
          test "$(git rev-parse HEAD^)" = "$CLEAN_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drdms24.yml"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "6a4c7d5cdda2e30b1ffd75d5b8bcacdd7af48f1a"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object tools/validate_dms_v24_deep_read_ev108.py)" = "6a88fbc6546d73d9f68936889087a8120b118358"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md)" = "e8ebcd6ee2506caa3ea5e3ff0a825ec275f3f170"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_V24_2026-09-05.md)" = "431b305d8606baa4b6a190705d78c9ec3c528280"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/DMS_V2.4.md)" = "dba69e23579186f1c6c26451f93d9f04ba5728b3"
          test "$(git hash-object IBIS-IP_DeviceManagementService_V2.4.xsd)" = "d222dfd98b2be3777576388da7ace8f333d24c3f"
          test "$(git hash-object IBIS-IP_common_V2.4.xsd)" = "1946fd37e29ced605654f49ea3d98cd2fbbdc8e4"
          test "$(git hash-object IBIS-IP_Enumerations_V2.4.xsd)" = "2afed8cf23afa91db92b0f043cc5b4ad428b0f25"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test ! -e audit_registry/semantic_classification_blocks/DRDMS24_v0.1.json
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count']==106
          assert r['progress']['remaining_count']==86
          assert r['progress']['latest_block']=='DRDMS22'
          assert r['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRDMS22_v0.1.json'
          assert 'DRDMS24-001' not in {e['finding_id'] for e in r['entries']}
          p=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text(encoding='utf-8'))
          hits=[e for e in p['inventory']['entries'] if e['finding_id']=='DRDMS24-001']
          assert hits==[{
            'finding_id':'DRDMS24-001',
            'revalidation_state':'context_verified',
            'terminal_state_source':'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_V24_2026-09-05.md'
          }], hits
          print('PASSED: exact DRDMS24 prestate 106/192 and frozen context_verified state')
          PY
          git diff --exit-code

      - name: Materialize exact DRDMS24 block
        shell: bash
        env:
          DRDMS24_BLOCK_ZLIB_B64: ""
        run: |
          set -euo pipefail
          mkdir -p audit_registry/semantic_classification_blocks
          python - <<'PY'
          import base64, os, zlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode(os.environ['DRDMS24_BLOCK_ZLIB_B64'], validate=True))
          Path('audit_registry/semantic_classification_blocks/DRDMS24_v0.1.json').write_bytes(data)
          PY
          test "$(sha256sum audit_registry/semantic_classification_blocks/DRDMS24_v0.1.json | awk '{print $1}')" = "72301b2c45f0d0915bd01c400910b24104ff6e9d738070769db175e4eac404cb"
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('audit_registry/semantic_classification_blocks/DRDMS24_v0.1.json').read_text(encoding='utf-8'))
          assert b['block_id']=='DRDMS24'
          assert [e['finding_id'] for e in b['entries']]==['DRDMS24-001']
          e=b['entries'][0]
          assert e['normative_authority']=='contextual_only'
          assert e['primary_surface']=='pdf'
          assert e['primary_issue_kind']=='semantic_contradiction'
          assert e['defect_assessment']=='confirmed_pdf_defect'
          assert e['sdk_behavior']=='no_runtime_diagnostic'
          assert e['runtime_match']['state']=='not_applicable'
          assert any(v['authority']=='candidate_integration' for v in e['version_scope'])
          assert any(s['type']=='candidate_integration_provenance' and 'not promoted to official-release authority' in s['note'] for s in e['semantic_basis'])
          print('PASSED: exact DRDMS24 documentation-only block and candidate boundary')
          PY

      - name: Merge and validate DRDMS24 classification
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_dms_v24_deep_read_ev108.py | tee /tmp/ev108.log
          grep -F "PASS" /tmp/ev108.log
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRDMS24_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRDMS24; classified=107 remaining=85" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 107 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count']==107
          assert r['progress']['remaining_count']==85
          assert r['progress']['latest_block']=='DRDMS24'
          assert r['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRDMS24_v0.1.json'
          assert r['progress']['reviewed_blocks'][-1]=='DRDMS24'
          print('PASSED: DRDMS24 poststate exactly 107/192')
          PY

      - name: Verify final tree boundary and persist
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=39b621429546bd0227c7c1d8a70bb309ea6b2d1b
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md)" = "e8ebcd6ee2506caa3ea5e3ff0a825ec275f3f170"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object IBIS-IP_DeviceManagementService_V2.4.xsd)" = "d222dfd98b2be3777576388da7ace8f333d24c3f"
          git rm .github/workflows/temp_merge_semantic_classification_drdms24.yml
          git add audit_registry/finding_semantic_classification_v0.1.json audit_registry/semantic_classification_blocks/DRDMS24_v0.1.json
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          expected={
            '.github/workflows/temp_merge_semantic_classification_drdms24.yml',
            'audit_registry/finding_semantic_classification_v0.1.json',
            'audit_registry/semantic_classification_blocks/DRDMS24_v0.1.json'
          }
          assert staged==expected, (staged, expected)
          final_changed=set(subprocess.check_output(['git','diff','--name-only','39b621429546bd0227c7c1d8a70bb309ea6b2d1b'], text=True).splitlines())
          assert final_changed=={
            'audit_registry/finding_semantic_classification_v0.1.json',
            'audit_registry/semantic_classification_blocks/DRDMS24_v0.1.json'
          }, final_changed
          print('PASSED: persistent DRDMS24 boundary is registry + block only')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRDMS24 semantic classification"
          git push origin HEAD:dev/schema-integration
