name: TEMP close DMS revalidation block

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_close_dms_revalidation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-dms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: EV-127 final context and visual gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_dms_revalidation_ev127_final.py

      - name: EV-127 positive-negative XML boundaries
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_dms_instance_boundaries_ev127.py

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Pre-closure repository mutation guard
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo 'Unexpected tracked changes before closure:'
            git status --short
            git diff --exit-code
            exit 1
          fi
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          git diff --exit-code -- '*.xsd'
          echo 'PRE_CLOSURE_GUARD_OK'

      - name: Write DMS closure state
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_dms_revalidation_block.py

      - name: Remove temporary DMS audit plumbing
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temp_render_dms_revalidation.yml \
            .github/workflows/temp_validate_dms_revalidation.yml \
            .github/workflows/temp_validate_dms_revalidation_retry.yml \
            .github/workflows/temp_validate_dms_revalidation_final.yml \
            .github/workflows/temp_inspect_dms_instance_shapes.yml \
            .github/workflows/temp_validate_dms_boundaries.yml \
            .github/workflows/temp_close_dms_revalidation.yml \
            tools/run_dms_revalidation_ev127.py

      - name: Verify closure delta allowlist and immutable authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          git diff --exit-code -- '*.xsd'

          python - <<'PY'
          import subprocess
          allowed = {
              '00_START_HERE/CURRENT_STATE.json',
              'audit_registry/finding_revalidation_registry_v0.1.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_2026-09-03.md',
              '.github/workflows/temp_render_dms_revalidation.yml',
              '.github/workflows/temp_validate_dms_revalidation.yml',
              '.github/workflows/temp_validate_dms_revalidation_retry.yml',
              '.github/workflows/temp_validate_dms_revalidation_final.yml',
              '.github/workflows/temp_inspect_dms_instance_shapes.yml',
              '.github/workflows/temp_validate_dms_boundaries.yml',
              '.github/workflows/temp_close_dms_revalidation.yml',
              'tools/run_dms_revalidation_ev127.py',
          }
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          observed = set()
          for raw in out.splitlines():
              path = raw[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              observed.add(path)
          unexpected = sorted(observed - allowed)
          required = {
              '00_START_HERE/CURRENT_STATE.json',
              'audit_registry/finding_revalidation_registry_v0.1.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_2026-09-03.md',
          }
          missing = sorted(required - observed)
          if unexpected or missing:
              raise SystemExit(f'closure allowlist failure unexpected={unexpected} missing={missing} observed={sorted(observed)}')
          print('CLOSURE_ALLOWLIST_OK', sorted(observed))
          PY

      - name: Verify post-closure state before commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          state=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          frozen=json.loads(Path('audit_registry/finding_inventory_frozen_2026-09-03.json').read_text())
          entries=reg['inventory']['entries']
          terminal=sum(1 for x in entries if x['revalidation_state']!='pending')
          pending=sum(1 for x in entries if x['revalidation_state']=='pending')
          assert len(entries)==192 and frozen['entry_count']==192
          assert terminal==57 and pending==135
          assert reg['next_revalidation_block']=='VDV301-1'
          assert 'DRDMS24-002' not in frozen['finding_ids']
          audit=state['audit']
          assert audit['finding_revalidation_completed_findings']==57
          assert audit['finding_revalidation_pending_findings']==135
          assert audit['finding_revalidation_latest_completed_block']=='DMS'
          assert audit['finding_revalidation_next_block']=='VDV301-1'
          print('POST_CLOSURE_STATE_OK terminal=57 pending=135 next=VDV301-1')
          PY

      - name: Commit closure atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Marc Leinen'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git add -A
          git commit -m 'audit: revalidate DMS finding block [skip ci]'
          git push origin HEAD:dev/schema-integration
