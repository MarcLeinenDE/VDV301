name: TEMP validate TSD EV-160

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_validate_tsd_ev160.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-tsd-ev160:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical audit branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils unzip
          python -m pip install --disable-pip-version-check lxml

      - name: Assert exact post-TS pre-TSD state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "1449e2c9fe1af2274c0d27f92927d8be74c8f54d"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "b30aebef7c89c62a351dbb6b6f756d8c9ceb30af"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md)" = "969cce8b14b50ded2ca5eb745674b894428ecf1a"
          test "$(git hash-object tools/validate_tsd_revalidation_ev160.py)" = "3d8cc6415517ecac7052739d3e9f456256704f19"
          test "$(git hash-object tools/validate_trainset_v21_ev109.py)" = "f88208bff7e39bb38a86a310dc121f486984f807"
          test "$(git hash-object tools/validate_trainset_tsd002_ev110.py)" = "34f16aec78b49af1210de6f4fd4e0ef674a21604"
          test "$(git hash-object tools/validate_trainset_ev104.py)" = "0d7bc30b56dd3e61771e0ac0ddd7c9f06a6b0d31"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object IBIS-IP_TrainSetDataService_V2.1.xsd)" = "c2cdb73fcae265a2e4e0349ac6072e3548e36d8b"
          test "$(git hash-object IBIS-IP_TrainSetDataService_V2.2.xsd)" = "7a132894c281d613e16514a6fa1bcbffe713d066"
          test "$(git hash-object IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"
          test "$(git hash-object IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"

      - name: Verify pinned EV-160 source-acquisition run online
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900 > /tmp/tsd-source-run.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900/jobs > /tmp/tsd-source-jobs.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900/artifacts > /tmp/tsd-source-artifacts.json
          python - <<'PY'
          import json
          run=json.load(open('/tmp/tsd-source-run.json'))
          jobs=json.load(open('/tmp/tsd-source-jobs.json'))['jobs']
          arts=json.load(open('/tmp/tsd-source-artifacts.json'))['artifacts']
          assert run['conclusion']=='success'
          assert run['head_sha']=='20785d8ee41e812a5902d49b6d4b800ef238e311'
          job=[x for x in jobs if x['id']==103888867262]
          assert len(job)==1 and job[0]['conclusion']=='success'
          art=[x for x in arts if x['id']==10336466475]
          assert len(art)==1
          assert art[0]['name']=='tsd-ev160-source'
          assert art[0]['digest']=='sha256:30089b9d4f2c86dd57f8bb184844a428ee08e91b0d327517c84f6689ea231bfb'
          assert art[0]['expired'] is False
          print('OK pinned EV-160 source run/job/artifact/digest')
          PY
          rm -rf /tmp/tsd-source
          mkdir -p /tmp/tsd-source
          gh run download 34816735900 --repo MarcLeinenDE/VDV301 --name tsd-ev160-source --dir /tmp/tsd-source
          test -f /tmp/tsd-source/manifest.json
          test -f /tmp/tsd-source/pdfs/TRAINSET_V2.1.pdf
          test -f /tmp/tsd-source/pdfs/TRAINSET_V2.2.pdf

      - name: Fetch exact official VDV release contexts
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'upstream-v21 585e0bea34b64887db4276f1c94d5f3e78f06c66 a8472530e840f7b365f6ba1075bfc09758ebda21' \
            'upstream-v22 f283697124750d12189b960b302b399769bad530 2dbde53864ef07319016b419ff6951f6e90e79dc'
          do
            set -- $spec
            dir="$1"; commit="$2"; tree="$3"
            git init "/tmp/$dir"
            git -C "/tmp/$dir" remote add origin https://github.com/VDVde/VDV301.git
            git -C "/tmp/$dir" fetch --depth=1 origin "$commit"
            git -C "/tmp/$dir" checkout --detach FETCH_HEAD
            test "$(git -C "/tmp/$dir" rev-parse HEAD)" = "$commit"
            test "$(git -C "/tmp/$dir" rev-parse HEAD^{tree})" = "$tree"
          done
          test "$(git -C /tmp/upstream-v21 hash-object IBIS-IP_TrainSetDataService_V2.1.xsd)" = "c2cdb73fcae265a2e4e0349ac6072e3548e36d8b"
          test "$(git -C /tmp/upstream-v21 hash-object IBIS-IP_common_V2.0.xsd)" = "8608e3dcd665c197c34da7f6ec6af5a3758da164"
          test "$(git -C /tmp/upstream-v21 hash-object IBIS-IP_Enumerations_V2.0.xsd)" = "27e3c183b00381d959622d13c10543123af8eef6"
          test "$(git -C /tmp/upstream-v21 hash-object IBIS-IP_CustomerInformationService_V2.0.xsd)" = "fa8f0a51ad5f612660c9532c8557ad1ca473a908"
          test "$(git -C /tmp/upstream-v22 hash-object IBIS-IP_TrainSetDataService_V2.2.xsd)" = "7a132894c281d613e16514a6fa1bcbffe713d066"
          test "$(git -C /tmp/upstream-v22 hash-object IBIS-IP_common_V2.2.xsd)" = "468fee6d177e7185dbcd5d3f90cfb114e29e01ae"
          test "$(git -C /tmp/upstream-v22 hash-object IBIS-IP_Enumerations_V2.2.xsd)" = "2a23b512379b18e8f122ac1272cef8229fb86283"
          python - <<'PY'
          from lxml import etree
          for path in (
              '/tmp/upstream-v21/IBIS-IP_TrainSetDataService_V2.1.xsd',
              '/tmp/upstream-v22/IBIS-IP_TrainSetDataService_V2.2.xsd',
          ):
              etree.XMLSchema(etree.parse(path))
              print('OK compiled exact official release context', path)
          PY

      - name: Re-acquire exact official PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tsd-ev160
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 VDV301-audit-EV160' \
            'https://www.vdv.de/vdv-301-2-14-v2-1-sds-trainsetservices.pdfx' \
            -o /tmp/tsd-ev160/TRAINSET_V2.1.pdf
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 VDV301-audit-EV160' \
            'https://www.vdv.de/301-2-14-sdes-v2-2-trainsetservices.pdfx' \
            -o /tmp/tsd-ev160/TRAINSET_V2.2.pdf
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 VDV301-audit-EV160' \
            'https://www.vdv.de/301-2-sdes-v2-2-common-conventions.pdfx' \
            -o /tmp/tsd-ev160/VDV301-2_GC_V2.2.pdf
          test "$(sha256sum /tmp/tsd-ev160/TRAINSET_V2.1.pdf | awk '{print $1}')" = "8eb53f2e960d125382e22d9c58dff8685c041001cf39a87ed4d12bb266bbe12e"
          test "$(stat --printf='%s' /tmp/tsd-ev160/TRAINSET_V2.1.pdf)" = "1708401"
          test "$(pdfinfo /tmp/tsd-ev160/TRAINSET_V2.1.pdf | awk '/^Pages:/ {print $2}')" = "51"
          test "$(sha256sum /tmp/tsd-ev160/TRAINSET_V2.2.pdf | awk '{print $1}')" = "c1946694a1809933a9a4a23adff1c551effdb0a2fbc6a7f7f68faec0b0c7bd6e"
          test "$(stat --printf='%s' /tmp/tsd-ev160/TRAINSET_V2.2.pdf)" = "1744296"
          test "$(pdfinfo /tmp/tsd-ev160/TRAINSET_V2.2.pdf | awk '/^Pages:/ {print $2}')" = "54"
          test "$(sha256sum /tmp/tsd-ev160/VDV301-2_GC_V2.2.pdf | awk '{print $1}')" = "96cf4a146e0c7bfc12eb21a5701d73ed3c570d7689c9f738450cc783206af051"
          test "$(stat --printf='%s' /tmp/tsd-ev160/VDV301-2_GC_V2.2.pdf)" = "1562305"
          test "$(pdfinfo /tmp/tsd-ev160/VDV301-2_GC_V2.2.pdf | awk '/^Pages:/ {print $2}')" = "79"

      - name: Snapshot complete XSD pool before EV-160
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ev160
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > artifacts/ev160/xsd-before.sha256
          test "$(wc -l < artifacts/ev160/xsd-before.sha256)" -eq 50

      - name: Rerun EV-109 TrainSet V2.1 executable evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_trainset_v21_ev109.py | tee artifacts/ev160/ev109.log

      - name: Rerun EV-110 TSD-002 executable evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_trainset_tsd002_ev110.py | tee artifacts/ev160/ev110.log

      - name: Rerun EV-104 TrainSet V2.2 contextual evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_trainset_ev104.py | tee artifacts/ev160/ev104.log

      - name: Run EV-160 TSD closure gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_tsd_revalidation_ev160.py \
            --repo-root . \
            --source-evidence-dir /tmp/tsd-source \
            --v21-pdf /tmp/tsd-ev160/TRAINSET_V2.1.pdf \
            --v22-pdf /tmp/tsd-ev160/TRAINSET_V2.2.pdf \
            --general-pdf /tmp/tsd-ev160/VDV301-2_GC_V2.2.pdf \
            --output-dir artifacts/ev160 | tee artifacts/ev160/ev160.log

      - name: Run complete 50-root-XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . | tee artifacts/ev160/xsd-pool.log

      - name: Verify XSD and audit-state immutability
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > artifacts/ev160/xsd-after.sha256
          cmp artifacts/ev160/xsd-before.sha256 artifacts/ev160/xsd-after.sha256
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "1449e2c9fe1af2274c0d27f92927d8be74c8f54d"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "b30aebef7c89c62a351dbb6b6f756d8c9ceb30af"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"

      - name: Upload EV-160 evidence
        uses: actions/upload-artifact@v4
        with:
          name: tsd-ev160-evidence
          path: artifacts/ev160
          if-no-files-found: error
          retention-days: 90
