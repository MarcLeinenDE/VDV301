name: temp-finalize-ara-v24
on:
  push:
    branches: [dev/schema-integration]
    paths:
      - '.github/workflows/temp-finalize-ara-v24.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize ARA V2.4 audit records
        run: python tools/temp_finalize_ara_v24.py
      - name: Fail closed on whitespace or XSD changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git status --porcelain | awk '{print $2}' | grep -E '\.xsd$'; then
            echo 'ERROR: XSD modification detected'
            exit 1
          fi
      - name: Commit permanent ARA V2.4 closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Deep-read AnalogRadioService V2.4 and revalidate EV-105 route'
          git push origin HEAD:dev/schema-integration
