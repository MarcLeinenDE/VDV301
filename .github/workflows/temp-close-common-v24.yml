name: temp-close-common-v24

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - '.github/workflows/temp-close-common-v24.yml'

permissions:
  contents: write

jobs:
  close-common-v24:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply closure
        run: |
          set -euo pipefail
          python tools/temp_close_common_v24.py
          python - <<'PY'
          from pathlib import Path
          for name in [
            'docs/pdf_xsd_semantic_audit/COMMON_FINDINGS_REGISTER_ADDENDUM.md',
            'docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.4.md',
            'docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_COMMON_V24_DEEP_READ_2026-09-03.md',
            'docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_COMMON_V24_INTERNATIONALTEXT_AUTHORITY_2026-09-03.md',
            'docs/pdf_xsd_semantic_audit/01g_common_enums_v2_4_datatypes_core_structures.md',
          ]:
            q=Path(name)
            q.write_text(q.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          PY
      - name: Validate closure diff
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          tracked=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          untracked=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          got=tracked|untracked
          expected={
            '.github/workflows/temp-common-v24-pin-read.yml',
            '.github/workflows/temp-common-v24-ev122.yml',
            '.github/workflows/temp-close-common-v24.yml',
            'tools/temp_close_common_v24.py',
            '00_START_HERE/CURRENT_STATE.json',
            'audit_registry/pdf_source_pins_v0.1.json',
            'audit_registry/deep_read_registry_delta_common_v24_2026-09-03.json',
            'audit_registry/deep_read_findings_delta_common_v24_2026-09-03.json',
            'docs/pdf_xsd_semantic_audit/COMMON_FINDINGS_REGISTER_ADDENDUM.md',
            'docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.4.md',
            'docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_COMMON_V24_DEEP_READ_2026-09-03.md',
            'docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_COMMON_V24_INTERNATIONALTEXT_AUTHORITY_2026-09-03.md',
            'docs/pdf_xsd_semantic_audit/01g_common_enums_v2_4_datatypes_core_structures.md',
          }
          print('\n'.join(sorted(got)))
          assert got==expected,(sorted(got),sorted(expected))
          assert not [x for x in got if x.endswith('.xsd')]
          s=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          a=s['audit']
          assert a['deep_read_textual_fresh_read_completed']==37
          assert a['deep_read_needs_visual_review']==37
          assert a['deep_read_pass_2_status']=='frozen_complete'
          assert a['next_natural_deep_read_document_id'] is None
          assert s['project_phase']=='legacy_finding_revalidation'
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          assert sum(1 for x in pins['sources'] if x['source_id']=='COMMON_V2.4')==1
          f=json.loads(Path('audit_registry/deep_read_findings_delta_common_v24_2026-09-03.json').read_text())
          assert f['new_unique_findings']['DRCOM24-001']['state']=='executable_confirmed_EV-122'
          print('COMMON_V24_CLOSURE_DIFF_OK')
          PY
      - name: Commit closure
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/temp-common-v24-pin-read.yml \
            .github/workflows/temp-common-v24-ev122.yml \
            .github/workflows/temp-close-common-v24.yml \
            tools/temp_close_common_v24.py \
            00_START_HERE/CURRENT_STATE.json \
            audit_registry/pdf_source_pins_v0.1.json \
            audit_registry/deep_read_registry_delta_common_v24_2026-09-03.json \
            audit_registry/deep_read_findings_delta_common_v24_2026-09-03.json \
            docs/pdf_xsd_semantic_audit/COMMON_FINDINGS_REGISTER_ADDENDUM.md \
            docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.4.md \
            docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_COMMON_V24_DEEP_READ_2026-09-03.md \
            docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_COMMON_V24_INTERNATIONALTEXT_AUTHORITY_2026-09-03.md \
            docs/pdf_xsd_semantic_audit/01g_common_enums_v2_4_datatypes_core_structures.md
          git diff --cached --check
          git commit -m 'audit: close COMMON V2.4 deep read pass 2'
          git push origin HEAD:dev/schema-integration
