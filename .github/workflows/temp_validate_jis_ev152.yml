name: JIS EV-152 revalidation

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - tools/validate_jis_revalidation_ev152.py
      - .github/workflows/temp_validate_jis_ev152.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Snapshot immutable authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:IBIS-IP_JourneyInformationService_V1.0.xsd)" = "8c303db5a9c0548d66b90174d9c329d33092ad24"
          test "$(git rev-parse HEAD:IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git rev-parse HEAD:IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(wc -l < /tmp/xsd-before.sha256)" -eq 50

      - name: Fetch exact byte-pinned JIS V1.0 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path

          url = "https://www.vdv.de/301-2-6sds-v1-0.pdfx"
          expected_sha = "424181b4932e18b6ac059843fa3978fdcc07a9c6acb553f9fbe8b71ef583da73"
          expected_size = 772125
          data = None
          for attempt in range(4):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "VDV301-Audit-EV152/0.1 (+https://github.com/MarcLeinenDE/VDV301)",
                          "Accept": "application/pdf,application/octet-stream;q=0.9,*/*;q=0.1",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=90) as response:
                      data = response.read()
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(2 * (attempt + 1))
          assert data is not None and data.startswith(b"%PDF-")
          sha = hashlib.sha256(data).hexdigest()
          assert sha == expected_sha, (sha, expected_sha)
          assert len(data) == expected_size, len(data)
          target = Path("local_sources/vdv_pdfs/JIS_V1.0.pdf")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print("PIN_OK", sha, len(data))
          PY

      - name: Run EV-152
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ev152
          python -m py_compile tools/validate_jis_revalidation_ev152.py
          python tools/validate_jis_revalidation_ev152.py --repo-root . --output-dir artifacts/ev152 | tee artifacts/ev152/ev152-validator.log

      - name: Run full XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests | tee artifacts/ev152/xsd-pool.log
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          cp /tmp/xsd-before.sha256 artifacts/ev152/xsd-root-sha256.txt

      - name: Verify evidence separation and immutable guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/finding_revalidation_registry_v0.1.json)" = "226c0a0f129ad9fbe2a0d8dbf269925435add112"
          test "$(git rev-parse HEAD:00_START_HERE/CURRENT_STATE.json)" = "c8662264f00986b017bbf7ef02f849e06ab64245"
          git diff --exit-code -- '*.xsd' audit_registry/finding_inventory_frozen_2026-09-03.json audit_registry/finding_revalidation_registry_v0.1.json 00_START_HERE/CURRENT_STATE.json

      - name: Upload EV-152 evidence
        uses: actions/upload-artifact@v4
        with:
          name: jis-ev152
          path: artifacts/ev152
          if-no-files-found: error
