name: temp-merge-semantic-classification-drtime10-v10-001-002

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drtime10_v10_001_002.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drtime10-v10-001-002:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2
      - name: Verify exact prestate and TimeService authority boundary
        shell: bash
        run: |
          set -euo pipefail
          STAGED_BASE=aafc751d90b9fc5ddc7688c610d9b5221b007ab3
          CLEAN_BASE=e7baebbcf3795bf33aff6842356af529e44d7fee
          test "$(git rev-parse HEAD^)" = "$STAGED_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drtime10_v10_001_002.yml"
          test "$(git hash-object audit_registry/semantic_classification_blocks/DRTIME10_V10_001_002_v0.1.json)" = "db86513a3769fb76347e7555ed24c7f4b1dd413b"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "13669b89cbf832ea3d446078c54d84a73a561393"
          test "$(git hash-object audit_registry/drtime10_revalidation_evidence_2026-09-06.json)" = "649c5b035e6fcc4f201555b467a1500ef06e09e7"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTIME10_2026-09-06.md)" = "c780c853404c117b1cc36437ec87a6aee10a44d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TIME_V1.0.md)" = "82a88fbd6dae5d22f472bf144770d915fcc902ea"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          target={'DRTIME10-001','DRTIME10-002'}
          reg=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert reg['progress']['classified_count']==120
          assert reg['progress']['remaining_count']==72
          assert reg['progress']['latest_block']=='DRSMS22_V22_003_004'
          assert reg['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRSMS22_V22_003_004_v0.1.json'
          assert not ({e['finding_id'] for e in reg['entries']} & target)
          prov=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          states={e['finding_id']:e['revalidation_state'] for e in prov['inventory']['entries'] if e['finding_id'] in target}
          assert states=={'DRTIME10-001':'context_verified','DRTIME10-002':'context_verified'}, states
          ev=json.loads(Path('audit_registry/drtime10_revalidation_evidence_2026-09-06.json').read_text())
          assert ev['evidence_id']=='EV-147' and ev['result']=='PASS'
          assert ev['authority']['source_id']=='TIME_V1.0'
          assert ev['authority']['semantic_authority_lane']=='PDF/API/prose'
          assert ev['authority']['time_service_xsd_authority'] is False
          assert ev['authority']['xsd_pool_role']=='repository-regression-only'
          assert ev['rederived_invariants']['cyclic_time_broadcast_expected'] is False
          block=json.loads(Path('audit_registry/semantic_classification_blocks/DRTIME10_V10_001_002_v0.1.json').read_text())
          assert block['block_id']=='DRTIME10_V10_001_002'
          assert [e['finding_id'] for e in block['entries']]==['DRTIME10-001','DRTIME10-002']
          for e in block['entries']:
              assert e['version_scope'][0]['authority']=='documentation_only'
              assert e['version_scope'][0]['xsd_profile'] is None
              assert e['normative_authority']=='contextual_only'
              assert e['sdk_behavior']=='no_runtime_diagnostic'
          assert block['entries'][0]['runtime_match']['state']=='not_applicable'
          assert block['entries'][1]['runtime_match']['state']=='not_designed'
          print('PASSED: exact DRTIME10-001/002 prestate and non-XSD authority boundary')
          PY
          git diff --exit-code
      - name: Verify current-safe TimeService evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          ev=json.loads(Path('audit_registry/drtime10_revalidation_evidence_2026-09-06.json').read_text())
          f=ev['finding_results']
          assert f['DRTIME10-001']['executable_effect'] is False
          assert f['DRTIME10-002']['executable_effect'] is False
          assert f['DRTIME10-002']['runtime_profile_consequence'].startswith('Do not infer a generic cyclic UDP')
          assert ev['historical_review_reference']['RV-003'].startswith('The current deep-read narrative records the historical RV-003 result')
          print('PASSED: EV-147 supports documentation findings without pretending RV-003 is a current checker')
          PY
      - name: Merge two-finding block and validate registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRTIME10_V10_001_002_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRTIME10_V10_001_002; classified=122 remaining=70" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 122 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert r['progress']['classified_count']==122
          assert r['progress']['remaining_count']==70
          assert r['progress']['latest_block']=='DRTIME10_V10_001_002'
          assert r['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRTIME10_V10_001_002_v0.1.json'
          ids={e['finding_id'] for e in r['entries']}
          assert {'DRTIME10-001','DRTIME10-002'} <= ids
          assert 'DRTIME10-003' not in ids
          print('PASSED: DRTIME10 part 1 poststate 122/192; DRTIME10-003 untouched')
          PY
      - name: Persist exact two-finding boundary
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=e7baebbcf3795bf33aff6842356af529e44d7fee
          git rm .github/workflows/temp_merge_semantic_classification_drtime10_v10_001_002.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'.github/workflows/temp_merge_semantic_classification_drtime10_v10_001_002.yml','audit_registry/finding_semantic_classification_v0.1.json'}
          assert staged==expected,(staged,expected)
          changed=set(subprocess.check_output(['git','diff','--name-only','e7baebbcf3795bf33aff6842356af529e44d7fee'],text=True).splitlines())
          expected_changed={'audit_registry/finding_semantic_classification_v0.1.json','audit_registry/semantic_classification_blocks/DRTIME10_V10_001_002_v0.1.json'}
          assert changed==expected_changed,(changed,expected_changed)
          print('PASSED: persistent boundary is master registry + DRTIME10-001/002 block only')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRTIME10-001 and DRTIME10-002 semantic classification"
          git push origin HEAD:dev/schema-integration
