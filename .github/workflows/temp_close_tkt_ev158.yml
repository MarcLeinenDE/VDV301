name: TEMP close TKT EV-158

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_close_tkt_ev158.yml

permissions:
  contents: write
  actions: read

jobs:
  close-tkt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical audit branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Install evidence tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils jq
          python -m pip install --disable-pip-version-check lxml

      - name: Assert immutable TKT prestate and capture full XSD hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "287e3bbcf4130567b288b1d039e8f576b668012b"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "a911f050fa5e7affc3d03ec9f2b21c68c848d364"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md)" = "969cce8b14b50ded2ca5eb745674b894428ecf1a"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/TICKETING_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "5f526763b2c68beb58b40922b52b6f0c7c9b554b"
          test "$(git hash-object tools/validate_tkt_revalidation_ev158.py)" = "be3016b326e013b587621d59402ee57bb39ff318"
          test "$(git hash-object tools/close_tkt_revalidation_block.py)" = "f6bc30579a5ef9b27018613d36c9420be0174680"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object IBIS-IP_TicketInformationService_V1.0.xsd)" = "3fda66d872ab0d1c511247f13e715cf3ad56afe7"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256

      - name: Verify pinned standalone EV-158 and source-pin evidence online
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/MarcLeinenDE/VDV301'
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')

          curl -fsSL "${auth[@]}" "$api/actions/runs/34813527845" -o /tmp/evrun.json
          jq -e '.id==34813527845 and .conclusion=="success" and .head_sha=="c4550faa535b012f19cf4f5f909e813cfcac7bb1"' /tmp/evrun.json
          curl -fsSL "${auth[@]}" "$api/actions/jobs/103879396942" -o /tmp/evjob.json
          jq -e '.id==103879396942 and .run_id==34813527845 and .conclusion=="success"' /tmp/evjob.json
          curl -fsSL "${auth[@]}" "$api/actions/artifacts/10336185560" -o /tmp/evartifact.json
          jq -e '.id==10336185560 and .name=="tkt-ev158" and .expired==false and .digest=="sha256:ba5ee246787f58d4cf690421fda683fb1dd072106d5c4e7eb6376c218b717870" and .workflow_run.id==34813527845' /tmp/evartifact.json

          curl -fsSL "${auth[@]}" "$api/actions/runs/34771722424" -o /tmp/pinrun.json
          jq -e '.id==34771722424 and .conclusion=="success"' /tmp/pinrun.json
          curl -fsSL "${auth[@]}" "$api/actions/artifacts/10322336797" -o /tmp/pinartifact.json
          jq -e '.id==10322336797 and .name=="tkt-ev158-pdf-pin" and .expired==false and .digest=="sha256:df661f9444ab7e26b563b0c748fee583314b19d789b316c6405e45e1fe99589c" and .workflow_run.id==34771722424' /tmp/pinartifact.json

      - name: Re-acquire and render exact official TicketingService PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/tkt_ev158/pages
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 VDV301-audit-EV158-closure' \
            'https://www.vdv.de/301-2-9sds-v1-0.pdfx' \
            -o evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf
          test "$(sha256sum evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf | awk '{print $1}')" = "96241226c7a25b0384527dd3de5fcd9448c8e75f38bfb4ffd7b607680bfc6b43"
          test "$(stat --printf='%s' evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf)" = "627099"
          test "$(pdfinfo evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf | awk '/^Pages:/ {print $2}')" = "16"
          pdftotext -layout evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf evidence/tkt_ev158/document.txt
          test "$(sha256sum evidence/tkt_ev158/document.txt | awk '{print $1}')" = "8f23aa2b8c7c12b601ca603a4154624c66989acf36642ae64cf119ef0b268ca8"
          pdftoppm -png -r 160 -f 7 -l 12 \
            evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf \
            evidence/tkt_ev158/pages/tkt
          test -s evidence/tkt_ev158/pages/tkt-11.png

      - name: Materialize exact official upstream release contexts
        shell: bash
        run: |
          set -euo pipefail
          old=evidence/tkt_ev158/upstream/vdv301-1.0
          later=evidence/tkt_ev158/upstream/vdv301-2.0
          mkdir -p "$old" "$later"
          base10='https://raw.githubusercontent.com/VDVde/VDV301/f5b53785f703e898632603eec3bfa3555a79fdba'
          base20='https://raw.githubusercontent.com/VDVde/VDV301/f2569a91f0a7c737a0ca7c0280b28ad223d7ee08'
          for f in IBIS-IP_TicketInformationService_V1.0.xsd IBIS-IP_common_V1.0.xsd IBIS-IP_Enumerations_V1.0.xsd IBIS_IP_V1.0.xsd; do
            curl --fail --location --retry 3 "$base10/$f" -o "$old/$f"
          done
          for f in IBIS-IP_TicketInformationService_V1.0.xsd IBIS-IP_common_V1.0.xsd IBIS-IP_Enumerations_V1.0.xsd; do
            curl --fail --location --retry 3 "$base20/$f" -o "$later/$f"
          done
          test "$(git hash-object "$old/IBIS-IP_TicketInformationService_V1.0.xsd")" = "017ca64666e25d757fc0cde1f1be817f06a743fc"
          test "$(git hash-object "$old/IBIS-IP_common_V1.0.xsd")" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object "$old/IBIS-IP_Enumerations_V1.0.xsd")" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(git hash-object "$old/IBIS_IP_V1.0.xsd")" = "41289eaed2674a169fdf77a10a2eff293c76d5c4"
          test "$(git hash-object "$later/IBIS-IP_TicketInformationService_V1.0.xsd")" = "3fda66d872ab0d1c511247f13e715cf3ad56afe7"
          test "$(git hash-object "$later/IBIS-IP_common_V1.0.xsd")" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object "$later/IBIS-IP_Enumerations_V1.0.xsd")" = "a9bea5bc73003ed91ded8519db06c32c4067831d"

      - name: Re-run EV-158 and full 50-XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/validate_tkt_revalidation_ev158.py tools/close_tkt_revalidation_block.py
          python tools/validate_tkt_revalidation_ev158.py \
            --repo-root . \
            --pdf evidence/tkt_ev158/VDV301-2-9_TicketingService_V1.0.pdf \
            --upstream-v10-dir evidence/tkt_ev158/upstream/vdv301-1.0 \
            --upstream-v20-dir evidence/tkt_ev158/upstream/vdv301-2.0 \
            --output-dir evidence/tkt_ev158
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests | tee evidence/tkt_ev158/full_xsd_pool_closure.txt

      - name: Apply TKT closure writer
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/MarcLeinenDE/VDV301/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_tkt_revalidation_block.py

      - name: Verify poststate, immutability, and exact mutation surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          terminal_states={"context_verified","field_validated","executable_confirmed","contextual_not_defect","withdrawn","unresolved","superseded"}
          reg=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          entries=reg['inventory']['entries']
          terminal=sum(e.get('revalidation_state') in terminal_states for e in entries)
          pending=sum(e.get('revalidation_state')=='pending' for e in entries)
          first=next(e['finding_id'] for e in entries if e.get('revalidation_state')=='pending')
          assert (terminal,pending)==(155,37),(terminal,pending)
          assert first=='TS-001',first
          assert reg['next_revalidation_block']=='TS'
          assert reg['revalidation_blocks']['TKT']['state']=='completed'
          assert reg['revalidation_blocks']['TKT']['artifact_digest']=='sha256:ba5ee246787f58d4cf690421fda683fb1dd072106d5c4e7eb6376c218b717870'
          state=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())['audit']
          assert state['finding_revalidation_completed_findings']==155
          assert state['finding_revalidation_pending_findings']==37
          assert state['finding_revalidation_next_block']=='TS'
          assert state['finding_revalidation_latest_completed_block']=='TKT'
          print('TKT poststate OK: 155/37 -> TS-001 / TS')
          PY
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          rm -rf evidence/tkt_ev158 tools/__pycache__
          changed="$(git status --porcelain | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' '00_START_HERE/CURRENT_STATE.json' 'audit_registry/finding_revalidation_registry_v0.1.json' 'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TKT_2026-09-14.md' | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Commit and push atomic TKT closure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev/schema-integration
          test "$(git rev-parse origin/dev/schema-integration)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_START_HERE/CURRENT_STATE.json audit_registry/finding_revalidation_registry_v0.1.json docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TKT_2026-09-14.md
          git diff --cached --check
          git commit -m 'audit: close TKT revalidation block'
          git push origin HEAD:dev/schema-integration
