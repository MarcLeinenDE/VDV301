name: temp-gate-semantic-classification-ts-v10-001-002

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_ts_v10_001_002.yml

permissions:
  contents: read

jobs:
  gate-ts-semantic-block:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact TS prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "db14947a031f7f360e01680e411f142d51447133"
          test "$(git hash-object audit_registry/semantic_classification_blocks/TS_V10_001_002_v0.1.json)" = "d57843a8fbbbd2119f200e2f8a196b052ab07b4a"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "15d6032c30db0e4d1fd540594bd8654a29ed439a"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TS_2026-09-14.md)" = "aa9c2be2bdb752caacfb7f1190dc1ffd1412ebc8"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(git hash-object tools/validate_time_runtime_rv003.py)" = "ff6e3fcd35d4c2f6bff760b3e86f5adb0e72156c"

      - name: Verify TS authority and protocol profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/TS_V10_001_002_v0.1.json').read_text())

          assert registry['progress']['classified_count']==161
          assert registry['progress']['remaining_count']==31
          assert registry['progress']['latest_block']=='TKT_V10_007_009'
          assert [e['finding_id'] for e in block['entries']]==['TS-001','TS-002']

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['TS-001']['revalidation_state']=='contextual_not_defect'
          assert frozen['TS-002']['revalidation_state']=='context_verified'
          for fid in ('TS-001','TS-002'):
              assert frozen[fid]['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TS_2026-09-14.md'

          t1,t2=block['entries']
          assert t1['normative_authority']=='no_strict_xsd_profile'
          assert t1['primary_surface']=='external_standard'
          assert t1['primary_issue_kind']=='intentional_design_misread'
          assert t1['defect_assessment']=='non_defect'
          assert t1['sdk_behavior']=='no_runtime_diagnostic'
          assert t1['runtime_match']['state']=='not_applicable'
          assert t2['normative_authority']=='contextual_only'
          assert t2['primary_issue_kind']=='identifier_typo'
          assert t2['defect_assessment']=='confirmed_pdf_defect'
          assert t2['sdk_behavior']=='no_runtime_diagnostic'
          assert t2['runtime_match']['state']=='not_applicable'

          root_xsds=sorted(p.name for p in Path('.').glob('*.xsd'))
          assert len(root_xsds)==50
          assert not [n for n in root_xsds if 'timeservice' in n.lower()]

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          enums=etree.parse('IBIS-IP_Enumerations_V1.0.xsd')
          values=enums.xpath("./xs:simpleType[@name='ServiceNameEnumeration']/xs:restriction/xs:enumeration/@value",namespaces=NS)
          assert 'TimeService' in values

          terminal=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TS_2026-09-14.md').read_text()
          assert 'EV-159' in terminal and '34815684895' in terminal and '34816125569' in terminal
          assert 'VDV 301-2-10' in terminal and 'VDV 301-2-1' in terminal
          print('PASSED: TS authority and semantic boundaries verified')
          PY

          python tools/validate_time_runtime_rv003.py | tee /tmp/rv003.log
          grep -F 'PASSED: RV-003 deterministic TimeService / RFC 4330 SNTP classifier behavior confirmed' /tmp/rv003.log
          grep -F 'TimeService routes to protocol_discovery_profile' /tmp/rv003.log
          grep -F 'TimeService does not synthesize XML operations' /tmp/rv003.log
          grep -F 'TimeService does not expect cyclic transmission of current time' /tmp/rv003.log

      - name: Simulate merge and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py \
            --block audit_registry/semantic_classification_blocks/TS_V10_001_002_v0.1.json \
            --output /tmp/ts-merged.json
          python tools/validate_finding_semantic_classification.py \
            --registry /tmp/ts-merged.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/ts-merged.json',encoding='utf-8'))
          assert r['progress']['classified_count']==163
          assert r['progress']['remaining_count']==29
          assert r['progress']['latest_block']=='TS_V10_001_002'
          print('PASSED: simulated TS registry is exactly 163/192')
          PY

      - name: Validate all 50 root XSDs and prove read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: TS semantic gate complete"
