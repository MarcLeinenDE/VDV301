name: temp-hds-v21-rv002-revalidation
on:
  push:
    branches: [dev/schema-integration]
    paths: ['.github/workflows/temp-hds-v21-rv002-revalidation.yml']
permissions:
  contents: write
jobs:
  rv002:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run current RV-002 discovery profile suite
        run: python tools/validate_discovery_runtime_rv002.py
      - name: Remove temporary workflow after PASS
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-hds-v21-rv002-revalidation.yml
          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git commit -m 'Remove temporary HDS V2.1 RV-002 workflow'
          git push origin HEAD:dev/schema-integration
