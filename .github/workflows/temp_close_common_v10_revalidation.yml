name: TEMP close COMMON V1.0 revalidation subblock

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_close_common_v10_revalidation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-common-v10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned COMMON V1.0 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request
          source_id = 'COMMON_V1.0'
          sources = json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text(encoding='utf-8'))
          pins = json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text(encoding='utf-8'))
          source = next(x for x in sources['sources'] if x['source_id'] == source_id)
          pin = next(x for x in pins['sources'] if x['source_id'] == source_id)
          request = urllib.request.Request(source['official_url'], headers={
              'User-Agent': 'VDV301-Audit-EV135-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          actual_hash = hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual_hash == pin['expected_sha256'], (actual_hash, pin['expected_sha256'])
          assert len(data) == int(pin['expected_size_bytes']), (len(data), pin['expected_size_bytes'])
          target = Path('local_sources/vdv_pdfs') / source['local_filename']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual_hash} size={len(data)}')
          PY

      - name: Re-run EV-135 exact evidence gate
        shell: bash
        env:
          EV135_OUTPUT_DIR: artifacts/ev135-closure
        run: |
          set -euo pipefail
          python tools/run_common_v10_revalidation_ev135.py

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Pre-closure immutable and mutation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/common_v10_revalidation_evidence_2026-09-04.json)" = "47f40823a50266fdfd79dd5dcb9f96f6221f988f"
          test "$(git hash-object audit_registry/deep_read_findings_delta_common_v10_2026-08-30.json)" = "da56c957f654c47207908f9a6e0808ecf9928ea1"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          test "$(git hash-object tools/validate_common_v10_ev117.py)" = "5d2b69aabd8de7b69575d6f98e6b6517c4d66fb4"
          test "$(git hash-object tools/validate_common_v10_revalidation_ev135.py)" = "8f265f127330cf384b3bac2749ac0c5124626080"
          test "$(git hash-object tools/run_common_v10_revalidation_ev135.py)" = "c0f2fb021a16e98f41c889ab2372960cdc0431a1"
          test "$(git hash-object tools/close_common_v10_revalidation_block.py)" = "b866db179f3f31241bac679d3db93369ef50c5e3"
          git diff --exit-code -- '*.xsd'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Write COMMON V1.0 closure state
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_common_v10_revalidation_block.py

      - name: Remove temporary workflow plumbing and generated caches
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_validate_common_v10_ev135.yml
          rm -f .github/workflows/temp_close_common_v10_revalidation.yml
          rm -rf artifacts/ev135-closure
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Verify closure delta allowlist and immutable authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/common_v10_revalidation_evidence_2026-09-04.json)" = "47f40823a50266fdfd79dd5dcb9f96f6221f988f"
          test "$(git hash-object IBIS-IP_common_V1.0.xsd)" = "194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          git diff --exit-code -- '*.xsd'
          python - <<'PY'
          import subprocess
          allowed = {
              'audit_registry/finding_revalidation_registry_v0.1.json',
              '00_START_HERE/CURRENT_STATE.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_COMMON_V10_2026-09-04.md',
              '.github/workflows/temp_validate_common_v10_ev135.yml',
              '.github/workflows/temp_close_common_v10_revalidation.yml',
          }
          lines = subprocess.check_output(['git','status','--porcelain','--untracked-files=all'], text=True).splitlines()
          changed = {line[3:] for line in lines if len(line) >= 4}
          unexpected = changed - allowed
          assert not unexpected, f'unexpected closure delta: {sorted(unexpected)}'
          required = {
              'audit_registry/finding_revalidation_registry_v0.1.json',
              '00_START_HERE/CURRENT_STATE.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_COMMON_V10_2026-09-04.md',
          }
          assert required <= changed, f'missing required closure delta: {sorted(required-changed)}'
          print('ALLOWLIST_OK', sorted(changed))
          PY

      - name: Verify post-closure state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          state = json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          entries = reg['inventory']['entries']
          by_id = {x['finding_id']: x for x in entries}
          expected = {
              'DRCOM10-001': 'executable_confirmed',
              'DRCOM10-002': 'executable_confirmed',
              'DRCOM10-003': 'executable_confirmed',
              'DRCOM10-004': 'executable_confirmed',
              'DRCOM10-005': 'executable_confirmed',
              'DRCOM10-006': 'executable_confirmed',
              'DRCOM10-007': 'context_verified',
          }
          terminal = sum(x.get('revalidation_state') != 'pending' for x in entries)
          pending = sum(x.get('revalidation_state') == 'pending' for x in entries)
          assert (terminal, pending) == (91, 101), (terminal, pending)
          for fid, status in expected.items():
              assert by_id[fid]['revalidation_state'] == status, (fid, by_id[fid])
          assert by_id['DRCOM20-001']['revalidation_state'] == 'pending'
          block = reg['revalidation_blocks']['COMMON_V1.0']
          assert block['next_block'] == 'COMMON'
          assert block['next_subblock'] == 'COMMON_V2.0'
          assert reg['next_revalidation_block'] == 'COMMON'
          audit = state['audit']
          assert audit['finding_revalidation_completed_findings'] == 91
          assert audit['finding_revalidation_pending_findings'] == 101
          assert audit['finding_revalidation_latest_completed_block'] == 'COMMON_V1.0'
          assert audit['common_v10_revalidation']['next_subblock'] == 'COMMON_V2.0'
          assert json.loads(Path('audit_registry/finding_inventory_frozen_2026-09-03.json').read_text())['entry_count'] == 192
          print('POST_STATE_OK terminal=91 pending=101 next=COMMON_V2.0')
          PY

      - name: Commit closure atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Marc Leinen"
          git config user.email "34336531+MarcLeinenDE@users.noreply.github.com"
          git add -A
          git commit -m "audit: revalidate COMMON V1.0 finding subblock [skip ci]"
          git push origin HEAD:dev/schema-integration
