name: Network registry closure

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/network-registry-closure.yml
      - audit_registry/network_vdv301_3_revalidation_evidence_2026-09-08.json
      - tools/close_network_revalidation_ev154.py

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation and PDF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Snapshot immutable authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/finding_revalidation_registry_v0.1.json)" = "c63feaaa2e88f36185e1b3b90a4aa41c5d560ac4"
          test "$(git rev-parse HEAD:00_START_HERE/CURRENT_STATE.json)" = "3706ebd462a4d02b6eefe823c433c0897663cd3a"
          test "$(git rev-parse HEAD:audit_registry/network_vdv301_3_revalidation_evidence_2026-09-08.json)" = "efed3d0ad85aa40551a5d36c5310d1a477deae51"
          test "$(git rev-parse HEAD:tools/validate_network_vdv301_3_revalidation_ev154.py)" = "590a970a998dad780a1554220e2e2271b783bfe8"
          test "$(git rev-parse HEAD:tools/close_network_revalidation_ev154.py)" = "11c8fb71d046a920a9b4ed80ebb1ff04954d13a5"
          test "$(git rev-parse HEAD:.github/workflows/temp_pin_network_vdv301_3_ev154.yml)" = "30cdb5c0d29bc43bd9edcea4ee82b4fcdd9b6537"
          test "$(git rev-parse HEAD:.github/workflows/temp_validate_network_ev154.yml)" = "b388fc0617ec5a5b1b60ebb827b5bea77ecef095"
          test "$(git rev-parse 7fad145f528205ef5c40e58a3a23374379b08189:docs/pdf_xsd_semantic_audit/deep_read/VDV301-3_02-2020.md)" = "ddb4f49da1e3afa55920e50f9e74e554748f1378"
          test "$(git rev-parse 7fad145f528205ef5c40e58a3a23374379b08189:docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_VDV301_3_02_2020_DEEP_READ_2026-08-29.md)" = "69bb404f71eb4173c8757b6c7751f2b3922588b9"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(wc -l < /tmp/xsd-before.sha256)" -eq 50

      - name: Fetch exact byte-pinned VDV 301-3 PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local_sources/vdv_pdfs
          python - <<'PY'
          import hashlib, time, urllib.request
          from pathlib import Path
          url = "https://www.vdv.de/301-3-sdes-network-infrastructure.pdfx"
          expected_sha = "edfedf36eeb18075b45bf5224f0da6500cdd489438091f18bada42f9668c2a99"
          expected_size = 558005
          data = None
          for attempt in range(4):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"VDV301-Audit-EV154-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)","Accept":"application/pdf,application/octet-stream;q=0.9,*/*;q=0.1"})
                  with urllib.request.urlopen(req, timeout=90) as response:
                      data = response.read()
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(2 * (attempt + 1))
          assert data is not None and data.startswith(b"%PDF-")
          assert hashlib.sha256(data).hexdigest() == expected_sha
          assert len(data) == expected_size
          Path("local_sources/vdv_pdfs/VDV301-3_02-2020.pdf").write_bytes(data)
          print("NET_CLOSURE_PIN_OK", expected_sha, expected_size)
          PY

      - name: Re-run EV-154 and full XSD pool
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/ev154-closure
          python -m py_compile tools/validate_network_vdv301_3_revalidation_ev154.py tools/close_network_revalidation_ev154.py
          python tools/validate_network_vdv301_3_revalidation_ev154.py --repo-root . --output-dir artifacts/ev154-closure
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code -- '*.xsd'

      - name: Close Network block atomically
        shell: bash
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}
          CLOSURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_network_revalidation_ev154.py

      - name: Verify allowlist, remove one-shot files, commit and push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-final.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-final.sha256
          rm .github/workflows/temp_pin_network_vdv301_3_ev154.yml
          rm .github/workflows/temp_validate_network_ev154.yml
          rm .github/workflows/network-registry-closure.yml
          rm tools/close_network_revalidation_ev154.py
          git add audit_registry/finding_revalidation_registry_v0.1.json 00_START_HERE/CURRENT_STATE.json docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_NETWORK_2026-09-08.md .github/workflows/temp_pin_network_vdv301_3_ev154.yml .github/workflows/temp_validate_network_ev154.yml .github/workflows/network-registry-closure.yml tools/close_network_revalidation_ev154.py
          python - <<'PY'
          import subprocess
          expected = sorted([
              ".github/workflows/network-registry-closure.yml",
              ".github/workflows/temp_pin_network_vdv301_3_ev154.yml",
              ".github/workflows/temp_validate_network_ev154.yml",
              "00_START_HERE/CURRENT_STATE.json",
              "audit_registry/finding_revalidation_registry_v0.1.json",
              "docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_NETWORK_2026-09-08.md",
              "tools/close_network_revalidation_ev154.py",
          ])
          actual = sorted(subprocess.check_output(["git","diff","--cached","--name-only"], text=True).splitlines())
          assert actual == expected, (actual, expected)
          assert not any(x.lower().endswith(".xsd") for x in actual)
          assert "audit_registry/finding_inventory_frozen_2026-09-03.json" not in actual
          assert "audit_registry/network_vdv301_3_revalidation_evidence_2026-09-08.json" not in actual
          print("NET_CLOSURE_ALLOWLIST_OK")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: close Network revalidation block [skip ci]"
          git push origin HEAD:dev/schema-integration
