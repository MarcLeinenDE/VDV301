name: temp-merge-semantic-classification-dr3011

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_dr3011.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-dr3011:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify immutable prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0c2c30eb59ca29e2701a721bb00ad4bf428b2762"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_dr3011.yml"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "ef5eafd764f23ea3488fc8bccd315be2e1bf19bd"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3011_2026-09-03.md)" = "b66b9be9a8afc4890b847eed563a19ed07f7bc41"
          test ! -e audit_registry/semantic_classification_blocks/DR3011_v0.1.json
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("audit_registry/finding_semantic_classification_v0.1.json").read_text(encoding="utf-8"))
          assert r["progress"]["classified_count"] == 61
          assert r["progress"]["remaining_count"] == 131
          assert r["progress"]["reviewed_blocks"] == ["ARA", "ARCH", "BG", "CE", "CIS", "DISC", "DMS"]
          assert r["progress"]["latest_block"] == "DMS"
          assert r["progress"]["latest_block_file"] == "audit_registry/semantic_classification_blocks/DMS_v0.1.json"
          ids = {e["finding_id"] for e in r["entries"]}
          assert not any(f"DR3011-{n:03d}" in ids for n in range(1, 4))
          print("PASSED: DR3011 semantic prestate is exactly 61/192")
          PY
          git diff --exit-code

      - name: Materialize DR3011 block
        shell: bash
        env:
          DR3011_BLOCK_ZLIB_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          raw = zlib.decompress(base64.b64decode(os.environ["DR3011_BLOCK_ZLIB_B64"]))
          assert hashlib.sha256(raw).hexdigest() == "d098022dffaa79ed76e8ccc0c852925e780960ae818a1c6043297957c729d7bf"
          block = json.loads(raw.decode("utf-8"))
          assert block["block_id"] == "DR3011"
          assert block["source_baseline_payload_sha256"] == "d5bf14df302d57a0fc3d71792e1cb00583fafd3e9c7efd19721fd0de353dd576"
          assert [e["finding_id"] for e in block["entries"]] == [f"DR3011-{n:03d}" for n in range(1, 4)]
          out = Path("audit_registry/semantic_classification_blocks/DR3011_v0.1.json")
          out.write_bytes(raw)
          print("PASSED: materialized DR3011 block sha256=d098022dffaa79ed76e8ccc0c852925e780960ae818a1c6043297957c729d7bf")
          PY

      - name: Merge and validate DR3011 classification
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DR3011_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DR3011; classified=64 remaining=128" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 64 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Verify poststate and mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3011_2026-09-03.md)" = "b66b9be9a8afc4890b847eed563a19ed07f7bc41"
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("audit_registry/finding_semantic_classification_v0.1.json").read_text(encoding="utf-8"))
          assert r["progress"]["classified_count"] == 64
          assert r["progress"]["remaining_count"] == 128
          assert r["progress"]["reviewed_blocks"] == ["ARA", "ARCH", "BG", "CE", "CIS", "DISC", "DMS", "DR3011"]
          assert r["progress"]["latest_block"] == "DR3011"
          assert r["progress"]["latest_block_file"] == "audit_registry/semantic_classification_blocks/DR3011_v0.1.json"
          entries = [e for e in r["entries"] if e["finding_id"].startswith("DR3011-")]
          assert [e["finding_id"] for e in entries] == [f"DR3011-{n:03d}" for n in range(1, 4)]
          print("PASSED: DR3011 semantic poststate is exactly 64/192")
          PY
          git add audit_registry/semantic_classification_blocks/DR3011_v0.1.json audit_registry/finding_semantic_classification_v0.1.json
          python - <<'PY'
          import subprocess
          names = subprocess.check_output(["git","diff","--cached","--name-only"], text=True).splitlines()
          assert names == [
              "audit_registry/finding_semantic_classification_v0.1.json",
              "audit_registry/semantic_classification_blocks/DR3011_v0.1.json",
          ], names
          print("PASSED: staged mutation boundary contains only DR3011 block and semantic registry")
          PY

      - name: Commit validated DR3011 classification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DR3011 semantic classification"
          git push origin HEAD:dev/schema-integration
