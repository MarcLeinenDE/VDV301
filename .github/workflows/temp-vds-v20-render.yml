name: temp-vds-v20-render

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Render byte-pinned VDS V2.0 pages
        run: |
          python tools/render_vdv_pdf_pages.py \
            --source-id VDS_V2.0 \
            --pages 4,6,11-16 \
            --dpi 180 \
            --out-dir audit-results/vds-v20-renders

      - name: Upload visual review evidence
        uses: actions/upload-artifact@v4
        with:
          name: vds-v20-visual-review
          path: audit-results/vds-v20-renders/
          if-no-files-found: error
