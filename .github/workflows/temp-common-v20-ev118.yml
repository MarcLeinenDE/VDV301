name: Temporary Common V2.0 EV-118

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-common-v20-ev118.yml

permissions:
  contents: read

jobs:
  ev118:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lxml
        run: python -m pip install --disable-pip-version-check lxml

      - name: Run EV-118
        run: python tools/validate_common_v20_ev118.py
