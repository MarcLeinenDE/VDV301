name: TEMP close VDV301-1 revalidation block

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_close_vdv3011_revalidation.yml]

permissions:
  contents: write

jobs:
  close-vdv3011:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml
      - name: EV-128 evidence gate
        run: python tools/validate_vdv3011_revalidation_ev128.py
      - name: Root XSD pool regression gate
        run: python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
      - name: Pre-closure immutable guard
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short
            git diff --exit-code
            exit 1
          fi
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/vdv3011_visual_revalidation_evidence_2026-09-03.json)" = "4bf69c495d96c0c471749f5ad5279c6ab7c2d8d7"
          test "$(git hash-object IBIS-IP_SystemManagementService_V1.0.xsd)" = "2d32630a0f1981e980e6a466e3f6a69136410f24"
          git diff --exit-code -- '*.xsd'
      - name: Write VDV301-1 closure state
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/close_vdv3011_revalidation_block.py
      - name: Remove temporary plumbing and caches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/__pycache__
          rm -f .github/workflows/temp_validate_vdv3011_ev128.yml .github/workflows/temp_close_vdv3011_revalidation.yml
      - name: Verify closure delta allowlist
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          git diff --exit-code -- '*.xsd'
          python - <<'PY'
          import subprocess
          allowed={
            '00_START_HERE/CURRENT_STATE.json',
            'audit_registry/finding_revalidation_registry_v0.1.json',
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3011_2026-09-03.md',
            '.github/workflows/temp_validate_vdv3011_ev128.yml',
            '.github/workflows/temp_close_vdv3011_revalidation.yml',
          }
          out=subprocess.check_output(['git','status','--porcelain'],text=True)
          observed=set()
          for raw in out.splitlines():
            path=raw[3:]
            if ' -> ' in path:
              path=path.split(' -> ',1)[1]
            observed.add(path)
          required={
            '00_START_HERE/CURRENT_STATE.json',
            'audit_registry/finding_revalidation_registry_v0.1.json',
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VDV3011_2026-09-03.md',
          }
          unexpected=sorted(observed-allowed)
          missing=sorted(required-observed)
          if unexpected or missing:
            raise SystemExit(f'allowlist failure unexpected={unexpected} missing={missing} observed={sorted(observed)}')
          print('CLOSURE_ALLOWLIST_OK',sorted(observed))
          PY
      - name: Verify post-closure state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          state=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          frozen=json.loads(Path('audit_registry/finding_inventory_frozen_2026-09-03.json').read_text())
          entries=reg['inventory']['entries']
          terminal=sum(1 for x in entries if x['revalidation_state']!='pending')
          pending=sum(1 for x in entries if x['revalidation_state']=='pending')
          assert len(entries)==192 and frozen['entry_count']==192
          assert (terminal,pending)==(60,132)
          assert reg['next_revalidation_block']=='VDV301-2'
          audit=state['audit']
          assert audit['finding_revalidation_completed_findings']==60
          assert audit['finding_revalidation_pending_findings']==132
          assert audit['finding_revalidation_latest_completed_block']=='VDV301-1'
          assert audit['finding_revalidation_next_block']=='VDV301-2'
          print('POST_CLOSURE_STATE_OK terminal=60 pending=132 next=VDV301-2')
          PY
      - name: Commit closure atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Marc Leinen'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git add -A
          git commit -m 'audit: revalidate VDV301-1 finding block [skip ci]'
          git push origin HEAD:dev/schema-integration
