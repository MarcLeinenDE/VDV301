name: TEMP close COMMON V2.1 revalidation subblock

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_close_common_v21_revalidation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-common-v21:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned COMMON V2.1 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request
          source_id = 'COMMON_V2.1'
          sources = json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text(encoding='utf-8'))
          pins = json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text(encoding='utf-8'))
          source = next(x for x in sources['sources'] if x['source_id'] == source_id)
          pin = next(x for x in pins['sources'] if x['source_id'] == source_id)
          request = urllib.request.Request(source['official_url'], headers={
              'User-Agent': 'VDV301-Audit-EV137-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          actual_hash = hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual_hash == pin['expected_sha256'], (actual_hash, pin['expected_sha256'])
          assert len(data) == int(pin['expected_size_bytes']), (len(data), pin['expected_size_bytes'])
          target = Path('local_sources/vdv_pdfs') / source['local_filename']
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual_hash} size={len(data)}')
          PY

      - name: Re-run EV-137 exact evidence gate
        shell: bash
        env:
          EV137_OUTPUT_DIR: artifacts/ev137-closure
        run: |
          set -euo pipefail
          python tools/validate_common_v21_revalidation_ev137.py

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Pre-closure immutable and mutation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/common_v21_revalidation_evidence_2026-09-04.json)" = "83aeb33c8a290b4ab045a8b74e4b8e67194040d7"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.1.md)" = "91cf693217d3b0df5309a0f8a242cfd4895a59fa"
          test "$(git hash-object audit_registry/deep_read_findings_delta_common_v21_2026-09-02.json)" = "44e06e66b65d7a7909d0e37ac3e6657f94e6a092"
          test "$(git hash-object IBIS-IP_common_V2.1.xsd)" = "05977c9f86c7c9dd0b48f36a4a4e9be32e94659e"
          test "$(git hash-object IBIS-IP_Enumerations_V2.1.xsd)" = "311464690ad60749ed8d326217787e4b8ed0b718"
          test "$(git hash-object tools/validate_common_v21_ev119.py)" = "fb892931b74d32a69177fbe32356a08fc758534a"
          test "$(git hash-object tools/validate_common_v21_revalidation_ev137.py)" = "e88731f35970b2f0147a8d60ca546d6165a43ccd"
          test "$(git hash-object tools/close_common_v21_revalidation_block.py)" = "59f6cdd5129103a1bfb6718694c2efba1bd3ff7b"
          git diff --exit-code -- '*.xsd'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Write COMMON V2.1 closure state
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_common_v21_revalidation_block.py

      - name: Remove temporary workflow plumbing and generated caches
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_validate_common_v21_ev137.yml
          rm -f .github/workflows/temp_close_common_v21_revalidation.yml
          rm -rf artifacts/ev137-closure
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Verify closure delta allowlist and immutable authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/common_v21_revalidation_evidence_2026-09-04.json)" = "83aeb33c8a290b4ab045a8b74e4b8e67194040d7"
          test "$(git hash-object IBIS-IP_common_V2.1.xsd)" = "05977c9f86c7c9dd0b48f36a4a4e9be32e94659e"
          test "$(git hash-object IBIS-IP_Enumerations_V2.1.xsd)" = "311464690ad60749ed8d326217787e4b8ed0b718"
          git diff --exit-code -- '*.xsd'
          python - <<'PY'
          import subprocess
          allowed = {
              'audit_registry/finding_revalidation_registry_v0.1.json',
              '00_START_HERE/CURRENT_STATE.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_COMMON_V21_2026-09-04.md',
              '.github/workflows/temp_validate_common_v21_ev137.yml',
              '.github/workflows/temp_close_common_v21_revalidation.yml',
          }
          lines = subprocess.check_output(['git','status','--porcelain','--untracked-files=all'], text=True).splitlines()
          changed = {line[3:] for line in lines if len(line) >= 4}
          unexpected = changed - allowed
          assert not unexpected, f'unexpected closure delta: {sorted(unexpected)}'
          required = {
              'audit_registry/finding_revalidation_registry_v0.1.json',
              '00_START_HERE/CURRENT_STATE.json',
              'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_COMMON_V21_2026-09-04.md',
          }
          assert required <= changed, f'missing required closure delta: {sorted(required-changed)}'
          print('ALLOWLIST_OK', sorted(changed))
          PY

      - name: Verify post-closure state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          state = json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          entries = reg['inventory']['entries']
          by_id = {x['finding_id']: x for x in entries}
          terminal = sum(x.get('revalidation_state') != 'pending' for x in entries)
          pending = sum(x.get('revalidation_state') == 'pending' for x in entries)
          assert (terminal, pending) == (93, 99), (terminal, pending)
          assert by_id['DRCOM21-001']['revalidation_state'] == 'executable_confirmed'
          assert by_id['DRCOM22-001']['revalidation_state'] == 'pending'
          block = reg['revalidation_blocks']['COMMON_V2.1']
          assert block['next_block'] == 'COMMON'
          assert block['next_subblock'] == 'COMMON_V2.2'
          assert reg['next_revalidation_block'] == 'COMMON'
          audit = state['audit']
          assert audit['finding_revalidation_completed_findings'] == 93
          assert audit['finding_revalidation_pending_findings'] == 99
          assert audit['finding_revalidation_latest_completed_block'] == 'COMMON_V2.1'
          assert audit['common_v21_revalidation']['next_subblock'] == 'COMMON_V2.2'
          assert json.loads(Path('audit_registry/finding_inventory_frozen_2026-09-03.json').read_text())['entry_count'] == 192
          print('POST_STATE_OK terminal=93 pending=99 next=COMMON_V2.2')
          PY

      - name: Commit closure atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Marc Leinen"
          git config user.email "34336531+MarcLeinenDE@users.noreply.github.com"
          git add -A
          git commit -m "audit: revalidate COMMON V2.1 finding subblock [skip ci]"
          git push origin HEAD:dev/schema-integration
