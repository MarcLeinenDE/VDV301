name: TEMP close TS EV-159

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_close_ts_ev159.yml

permissions:
  contents: write
  actions: read

jobs:
  close-ts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical audit branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Assert exact pre-closure authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "0a4bfcb5d895f25381afd56c32fe5c7d349e4de0"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "f3c248261066c3760ac093e73c6bfaca484c67c1"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md)" = "969cce8b14b50ded2ca5eb745674b894428ecf1a"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/TIME_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "23723fbb6bb99ffa3aa1eb8c13feae6aa95a0170"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TIME_V1.0.md)" = "82a88fbd6dae5d22f472bf144770d915fcc902ea"
          test "$(git hash-object tools/validate_ts_revalidation_ev159.py)" = "3d51e97e2127d0d44e45ade9ed9138dd9ac59a07"
          test "$(git hash-object tools/close_ts_revalidation_block.py)" = "08d1246aaf4bab57ebd0e96c3197c14e734dd952"
          test "$(git hash-object tools/validate_time_runtime_rv003.py)" = "ff6e3fcd35d4c2f6bff760b3e86f5adb0e72156c"
          test "$(git hash-object tools/runtime_time_profile.py)" = "acd28ca0bd6ac1917b3d2db29745555b7e17d8dd"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"

      - name: Verify pinned EV-159 and source evidence online
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34815684895 > /tmp/ev159-run.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34815684895/jobs > /tmp/ev159-jobs.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34815684895/artifacts > /tmp/ev159-artifacts.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34814542791 > /tmp/source-run.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34814542791/jobs > /tmp/source-jobs.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34814542791/artifacts > /tmp/source-artifacts.json
          python - <<'PY'
          import json
          ev=json.load(open('/tmp/ev159-run.json'))
          jobs=json.load(open('/tmp/ev159-jobs.json'))['jobs']
          arts=json.load(open('/tmp/ev159-artifacts.json'))['artifacts']
          assert ev['conclusion']=='success'
          assert ev['head_sha']=='8257c23dfa55e1ba3a425f8860d54913941c79ae'
          j=[x for x in jobs if x['id']==103885751905]
          assert len(j)==1 and j[0]['conclusion']=='success'
          a=[x for x in arts if x['id']==10336194085]
          assert len(a)==1 and a[0]['name']=='ts-ev159-evidence'
          assert a[0]['digest']=='sha256:4d5c36f36c468b92e1a3ca962eb1e76b8670f6460f2ecf667bd1cdc2c2e2d010'
          assert a[0]['expired'] is False
          src=json.load(open('/tmp/source-run.json'))
          sjobs=json.load(open('/tmp/source-jobs.json'))['jobs']
          sarts=json.load(open('/tmp/source-artifacts.json'))['artifacts']
          assert src['conclusion']=='success'
          assert src['head_sha']=='bd158b2a6121a3f7e4612acca5607875ab7ab852'
          sj=[x for x in sjobs if x['id']==103882386972]
          assert len(sj)==1 and sj[0]['conclusion']=='success'
          sa=[x for x in sarts if x['id']==10336172299]
          assert len(sa)==1 and sa[0]['name']=='ts-ev159-source'
          assert sa[0]['digest']=='sha256:c24cfc7d8b80652a5caaeafa4d131f31c32fcbe85e45cfb4a6bb5edb2f789c94'
          assert sa[0]['expired'] is False
          print('OK pinned EV-159 and TS source evidence')
          PY

      - name: Fetch exact official VDV release contexts
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'upstream-v10 f5b53785f703e898632603eec3bfa3555a79fdba 729bbe3270e52fed3e0641466048a745d5a09b32' \
            'upstream-v20 f2569a91f0a7c737a0ca7c0280b28ad223d7ee08 11daf0ebb3b26745c036ee19a547ad16d39f922c'
          do
            set -- $spec
            dir="$1"; commit="$2"; tree="$3"
            git init "/tmp/$dir"
            git -C "/tmp/$dir" remote add origin https://github.com/VDVde/VDV301.git
            git -C "/tmp/$dir" fetch --depth=1 origin "$commit"
            git -C "/tmp/$dir" checkout --detach FETCH_HEAD
            test "$(git -C "/tmp/$dir" rev-parse HEAD)" = "$commit"
            test "$(git -C "/tmp/$dir" rev-parse HEAD^{tree})" = "$tree"
          done

      - name: Re-acquire exact TimeService PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ts-closure
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 VDV301-audit-EV159-closure' \
            'https://www.vdv.de/301-2-10sds-v-1-01.pdfx' \
            -o /tmp/ts-closure/TIME_V1.0.pdf
          test "$(sha256sum /tmp/ts-closure/TIME_V1.0.pdf | awk '{print $1}')" = "d040f503be8e82f5500220ba5cc9b0b41a2fa10db80d9f3980eed191378594d3"
          test "$(stat --printf='%s' /tmp/ts-closure/TIME_V1.0.pdf)" = "515920"
          test "$(pdfinfo /tmp/ts-closure/TIME_V1.0.pdf | awk '/^Pages:/ {print $2}')" = "10"

      - name: Snapshot complete XSD pool before closure
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > /tmp/ts-xsd-before.sha256
          test "$(wc -l < /tmp/ts-xsd-before.sha256)" -eq 50

      - name: Rerun EV-159 and complete XSD pool
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ev159-closure
          python tools/validate_ts_revalidation_ev159.py \
            --repo-root . \
            --pdf /tmp/ts-closure/TIME_V1.0.pdf \
            --upstream-v10-dir /tmp/upstream-v10 \
            --upstream-v20-dir /tmp/upstream-v20 \
            --output-dir /tmp/ev159-closure
          python tools/validate_xsd_pool.py --repo-root . > /tmp/ts-xsd-pool.log
          grep -q '^PASSED$' /tmp/ts-xsd-pool.log

      - name: Apply TS closure writer
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/close_ts_revalidation_block.py

      - name: Verify poststate, immutability and strict allowlist
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > /tmp/ts-xsd-after.sha256
          cmp /tmp/ts-xsd-before.sha256 /tmp/ts-xsd-after.sha256
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(git hash-object IBIS-IP_Enumerations_V1.0.xsd)" = "a9bea5bc73003ed91ded8519db06c32c4067831d"
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          test -z "$(find . -type d -name '__pycache__' -print -quit)"
          python - <<'PY'
          import json, subprocess
          expected={
            'audit_registry/finding_revalidation_registry_v0.1.json',
            '00_START_HERE/CURRENT_STATE.json',
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TS_2026-09-14.md',
          }
          lines=subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          changed={line[3:] for line in lines if line.strip()}
          assert changed==expected, (changed, expected)
          reg=json.load(open('audit_registry/finding_revalidation_registry_v0.1.json'))
          entries=reg['inventory']['entries']
          term={'context_verified','field_validated','executable_confirmed','contextual_not_defect','withdrawn','unresolved','superseded'}
          assert sum(x['revalidation_state'] in term for x in entries)==157
          assert sum(x['revalidation_state']=='pending' for x in entries)==35
          assert next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')=='TSD-001'
          assert reg['next_revalidation_block']=='TSD'
          assert reg['revalidation_blocks']['TS']['artifact_digest']=='sha256:4d5c36f36c468b92e1a3ca962eb1e76b8670f6460f2ecf667bd1cdc2c2e2d010'
          state=json.load(open('00_START_HERE/CURRENT_STATE.json'))['audit']
          assert state['finding_revalidation_completed_findings']==157
          assert state['finding_revalidation_pending_findings']==35
          assert state['finding_revalidation_next_block']=='TSD'
          assert state['finding_revalidation_latest_completed_block']=='TS'
          print('OK exact TS poststate and path allowlist')
          PY

      - name: Commit and push atomic TS closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            audit_registry/finding_revalidation_registry_v0.1.json \
            00_START_HERE/CURRENT_STATE.json \
            docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TS_2026-09-14.md
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            00_START_HERE/CURRENT_STATE.json \
            audit_registry/finding_revalidation_registry_v0.1.json \
            docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TS_2026-09-14.md | sort)"
          test "$staged" = "$expected"
          git diff --cached --check
          git commit -m 'audit: close TS revalidation without schema mutation'
          git push origin HEAD:dev/schema-integration
