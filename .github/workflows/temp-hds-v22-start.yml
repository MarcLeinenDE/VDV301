name: temp-hds-v22-start
on:
  push:
    branches: [dev/schema-integration]
    paths: ['.github/workflows/temp-hds-v22-start.yml']
permissions:
  contents: write
jobs:
  start:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin official HDS V2.2 PDF and record independent start
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, urllib.request
          from datetime import datetime, timezone

          url='https://www.vdv.de/301-2-17-sdes-v2-2-htmldisplayservice.pdfx'
          req=urllib.request.Request(url,headers={'User-Agent':'VDV301-audit-source-pin/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              data=r.read()
          if not data.startswith(b'%PDF-'):
              raise SystemExit('Downloaded source is not a PDF')
          sha=hashlib.sha256(data).hexdigest(); size=len(data)
          ts=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          print('HDS_V22_PIN',sha,size,ts)

          pp=Path('audit_registry/pdf_source_pins_v0.1.json')
          pins=json.loads(pp.read_text(encoding='utf-8'))
          assert not any(x['source_id']=='HDS_V2.2' for x in pins['sources'])
          pins['sources'].append({
              'source_id':'HDS_V2.2','expected_sha256':sha,'expected_size_bytes':size,
              'pinned_at_utc':ts,'deep_read_source_ready':True,
              'evidence_run_id':'SELF_RUN_ID_PENDING_LOG_CAPTURE'
          })
          pp.write_text(json.dumps(pins,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          delta={
            'delta_version':'0.1','date':'2026-08-29','base_registry':'audit_registry/deep_read_registry_v0.1.json',
            'document_updates':{'HDS_V2.2':{
              'state':'source_pinned_authority_established_pending_fresh_read',
              'official_url':url,
              'publication':'VDV-Schrift 301-2-17, HTMLDisplayService V2.2, 08/2019',
              'historical_findings_opened_during_fresh_read':False,
              'source_pin':{'sha256':sha,'size_bytes':size,'pinned_at_utc':ts,'evidence_run':'SELF_RUN_ID_PENDING_LOG_CAPTURE'},
              'authority_status':{
                'official_pdf':'official_public_VDV_writing',
                'official_release_tag_checked':'VDV-301-2.2',
                'official_release_tag_commit':'f283697124750d12189b960b302b399769bad530',
                'dedicated_HtmlDisplayService_xsd_in_official_tag':False,
                'dedicated_HtmlDisplayService_xsd_in_integration_branch':False,
                'service_model':'non_xsd_dns_sd_http_profile',
                'xsd_boundary':'No dedicated HDS service XSD is selected or inferred.'
              },
              'evidence_gate':'docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md',
              'fresh_read_rule':'Independently derive V2.2 behavior from the pinned V2.2 source before reconciling historical V2.2 profile notes.'
            }}
          }
          Path('audit_registry/deep_read_registry_delta_hds_v22_2026-08-29.json').write_text(json.dumps(delta,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          sp=Path('00_START_HERE/CURRENT_STATE.json')
          s=json.loads(sp.read_text(encoding='utf-8')); a=s['audit']
          a['deep_read_in_progress']=1
          a['deep_read_current_document_id']='HDS_V2.2'
          a['deep_read_previous_document_id']='HDS_V2.1'
          a['next_natural_deep_read_document_id']='HDS_V2.2'
          a['pdf_sources_byte_pinned']=22
          if 'HDS_V2.2' not in a['pinned_active_sources']:
              a['pinned_active_sources'].append('HDS_V2.2')
          a['latest_deep_read_registry_delta']='audit_registry/deep_read_registry_delta_hds_v22_2026-08-29.json'
          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          for p in [pp,Path('audit_registry/deep_read_registry_delta_hds_v22_2026-08-29.json'),sp]:
              json.loads(p.read_text(encoding='utf-8'))
          PY
      - name: Commit start and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git add audit_registry/pdf_source_pins_v0.1.json audit_registry/deep_read_registry_delta_hds_v22_2026-08-29.json 00_START_HERE/CURRENT_STATE.json
          git rm .github/workflows/temp-hds-v22-start.yml
          if git diff --cached --name-only | grep -E '\.xsd$'; then exit 1; fi
          git config user.name 'MarcLeinenDE'
          git config user.email '34336531+MarcLeinenDE@users.noreply.github.com'
          git commit -m 'Pin and start HTMLDisplayService V2.2 deep read'
          git push origin HEAD:dev/schema-integration
