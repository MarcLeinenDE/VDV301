name: TEMP close TSM EV-162

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_close_tsm_ev162.yml

permissions:
  contents: write
  actions: read

jobs:
  close-tsm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical audit branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils unzip
          python -m pip install --disable-pip-version-check lxml

      - name: Assert exact pre-closure authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "84f4b647c2910c27550bdd8f62d7c072d56714ba"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "efa00ed4ffc2fad76f50b000377ef1f8def0d486"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md)" = "969cce8b14b50ded2ca5eb745674b894428ecf1a"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/TRAIN_SET_SERVICES_FINDINGS_REGISTER_ADDENDUM.md)" = "8b1ac3db4c3603d04cca9001c82d7f4de6b5459e"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.1.md)" = "6d5680f438e7e592aaf1d056e39224e7c2a3f2d9"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.2.md)" = "61850045c26fb2a848c4670f1418fdb809ab475c"
          test "$(git hash-object tools/validate_tsm_revalidation_ev162.py)" = "141ac346548cee5f00dee34b356df5262e098178"
          test "$(git hash-object tools/close_tsm_revalidation_block.py)" = "3a708e48d4b363b63316f1188bc6ccdc1921f56a"
          test "$(git hash-object tools/validate_trainset_v21_ev109.py)" = "f88208bff7e39bb38a86a310dc121f486984f807"
          test "$(git hash-object tools/validate_trainset_ev104.py)" = "0d7bc30b56dd3e61771e0ac0ddd7c9f06a6b0d31"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object IBIS-IP_TrainSetManagementService_V2.1.xsd)" = "add9d1cb37e5759ff7a77855b239108d38373206"
          test "$(git hash-object IBIS-IP_TrainSetManagementService_V2.2.xsd)" = "da9465d6683e3f7d54a546ab4a13739fb3c3e902"
          test "$(git hash-object IBIS-IP_TrainSetInformationService_V2.2.xsd)" = "7ab1f8f892bfcea2a8b8a055f07de92c143356f9"

      - name: Verify pinned EV-162 and source evidence online
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34823353897 > /tmp/ev162-run.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34823353897/jobs > /tmp/ev162-jobs.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34823353897/artifacts > /tmp/ev162-artifacts.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900 > /tmp/source-run.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900/jobs > /tmp/source-jobs.json
          gh api repos/MarcLeinenDE/VDV301/actions/runs/34816735900/artifacts > /tmp/source-artifacts.json
          python - <<'PY'
          import json
          ev=json.load(open('/tmp/ev162-run.json')); jobs=json.load(open('/tmp/ev162-jobs.json'))['jobs']; arts=json.load(open('/tmp/ev162-artifacts.json'))['artifacts']
          assert ev['conclusion']=='success' and ev['head_sha']=='41a491ad41b1f03a786610f64fc54979a38faf4f'
          j=[x for x in jobs if x['id']==103909732702]; assert len(j)==1 and j[0]['conclusion']=='success'
          a=[x for x in arts if x['id']==10339282538]; assert len(a)==1 and a[0]['name']=='tsm-ev162-evidence'
          assert a[0]['digest']=='sha256:8083d5badea1af9922302b202f06c33f4961d53878dfbc5d84324a4e4d65a4a0' and a[0]['expired'] is False
          src=json.load(open('/tmp/source-run.json')); sj=json.load(open('/tmp/source-jobs.json'))['jobs']; sa=json.load(open('/tmp/source-artifacts.json'))['artifacts']
          assert src['conclusion']=='success' and src['head_sha']=='20785d8ee41e812a5902d49b6d4b800ef238e311'
          assert any(x['id']==103888867262 and x['conclusion']=='success' for x in sj)
          aa=[x for x in sa if x['id']==10336466475]; assert len(aa)==1 and aa[0]['digest']=='sha256:30089b9d4f2c86dd57f8bb184844a428ee08e91b0d327517c84f6689ea231bfb'
          print('OK pinned EV-162 and TrainSet source evidence')
          PY
          rm -rf /tmp/tsm-source && mkdir -p /tmp/tsm-source
          gh run download 34816735900 --repo MarcLeinenDE/VDV301 --name tsd-ev160-source --dir /tmp/tsm-source

      - name: Fetch exact official VDV release contexts
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'upstream-v21 585e0bea34b64887db4276f1c94d5f3e78f06c66 a8472530e840f7b365f6ba1075bfc09758ebda21' \
            'upstream-v22 f283697124750d12189b960b302b399769bad530 2dbde53864ef07319016b419ff6951f6e90e79dc'
          do
            set -- $spec; dir="$1"; commit="$2"; tree="$3"
            git init "/tmp/$dir"; git -C "/tmp/$dir" remote add origin https://github.com/VDVde/VDV301.git
            git -C "/tmp/$dir" fetch --depth=1 origin "$commit"; git -C "/tmp/$dir" checkout --detach FETCH_HEAD
            test "$(git -C "/tmp/$dir" rev-parse HEAD)" = "$commit"; test "$(git -C "/tmp/$dir" rev-parse HEAD^{tree})" = "$tree"
          done
          test "$(git -C /tmp/upstream-v21 hash-object IBIS-IP_TrainSetManagementService_V2.1.xsd)" = "add9d1cb37e5759ff7a77855b239108d38373206"
          test "$(git -C /tmp/upstream-v22 hash-object IBIS-IP_TrainSetManagementService_V2.2.xsd)" = "da9465d6683e3f7d54a546ab4a13739fb3c3e902"

      - name: Re-acquire exact official TrainSet PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tsm-closure
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 VDV301-audit-EV162-closure' 'https://www.vdv.de/vdv-301-2-14-v2-1-sds-trainsetservices.pdfx' -o /tmp/tsm-closure/TRAINSET_V2.1.pdf
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0 VDV301-audit-EV162-closure' 'https://www.vdv.de/301-2-14-sdes-v2-2-trainsetservices.pdfx' -o /tmp/tsm-closure/TRAINSET_V2.2.pdf
          test "$(sha256sum /tmp/tsm-closure/TRAINSET_V2.1.pdf | awk '{print $1}')" = "8eb53f2e960d125382e22d9c58dff8685c041001cf39a87ed4d12bb266bbe12e"
          test "$(sha256sum /tmp/tsm-closure/TRAINSET_V2.2.pdf | awk '{print $1}')" = "c1946694a1809933a9a4a23adff1c551effdb0a2fbc6a7f7f68faec0b0c7bd6e"

      - name: Snapshot complete XSD pool before closure
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > /tmp/tsm-xsd-before.sha256
          test "$(wc -l < /tmp/tsm-xsd-before.sha256)" -eq 50

      - name: Rerun EV-109, EV-104, EV-162 and complete XSD pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_trainset_v21_ev109.py > /tmp/ev109.log
          python tools/validate_trainset_ev104.py > /tmp/ev104.log
          rm -rf /tmp/ev162-closure
          python tools/validate_tsm_revalidation_ev162.py --repo-root . --source-evidence-dir /tmp/tsm-source --v21-pdf /tmp/tsm-closure/TRAINSET_V2.1.pdf --v22-pdf /tmp/tsm-closure/TRAINSET_V2.2.pdf --output-dir /tmp/ev162-closure > /tmp/ev162.log
          grep -q 'PASSED: EV-162 TSM revalidation gate' /tmp/ev162.log
          python tools/validate_xsd_pool.py --repo-root . > /tmp/tsm-xsd-pool.log
          grep -q '^PASSED$' /tmp/tsm-xsd-pool.log

      - name: Apply TSM closure writer
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/close_tsm_revalidation_block.py

      - name: Verify poststate, immutability and strict allowlist
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -printf '%f\0' | sort -z | xargs -0 sha256sum > /tmp/tsm-xsd-after.sha256
          cmp /tmp/tsm-xsd-before.sha256 /tmp/tsm-xsd-after.sha256
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/pdf_source_registry_v0.1.json)" = "d3471e1cef9b099dc8764a3ee8bf234b9a658ce8"
          test "$(git hash-object audit_registry/pdf_source_pins_v0.1.json)" = "88349638b423689799af700e8a1c8ec99bbfb67b"
          python - <<'PY'
          import json, subprocess
          expected={'audit_registry/finding_revalidation_registry_v0.1.json','00_START_HERE/CURRENT_STATE.json','docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSM_2026-09-14.md'}
          changed={line[3:] for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines() if line.strip()}
          assert changed==expected, (changed, expected)
          reg=json.load(open('audit_registry/finding_revalidation_registry_v0.1.json')); entries=reg['inventory']['entries']
          term={'context_verified','executable_confirmed','contextual_not_defect','withdrawn','unresolved','superseded'}
          assert sum(x['revalidation_state'] in term for x in entries)==165
          assert sum(x['revalidation_state']=='pending' for x in entries)==27
          assert next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')=='TVS-001'
          assert reg['next_revalidation_block']=='TVS'
          assert reg['revalidation_blocks']['TSM']['artifact_digest']=='sha256:8083d5badea1af9922302b202f06c33f4961d53878dfbc5d84324a4e4d65a4a0'
          state=json.load(open('00_START_HERE/CURRENT_STATE.json'))['audit']
          assert state['finding_revalidation_completed_findings']==165 and state['finding_revalidation_pending_findings']==27
          assert state['finding_revalidation_next_block']=='TVS' and state['finding_revalidation_latest_completed_block']=='TSM'
          print('OK exact TSM poststate and path allowlist')
          PY
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Commit and push atomic TSM closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- audit_registry/finding_revalidation_registry_v0.1.json 00_START_HERE/CURRENT_STATE.json docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSM_2026-09-14.md
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' 00_START_HERE/CURRENT_STATE.json audit_registry/finding_revalidation_registry_v0.1.json docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TSM_2026-09-14.md | sort)"
          test "$staged" = "$expected"; git diff --cached --check
          git commit -m 'audit: close TSM revalidation without schema mutation'
          git push origin HEAD:dev/schema-integration
