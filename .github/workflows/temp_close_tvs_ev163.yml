name: temp close TVS EV-163

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_close_tvs_ev163.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  close-tvs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Assert workflow-only trigger commit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="2c1da5558416973e7d09b4dde34f52f5b3559873"
          git cat-file -e "${BASE_SHA}^{commit}"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/temp_close_tvs_ev163.yml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check lxml

      - name: Compile closure and aggregate validators
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/close_tvs_revalidation_block.py
          python -m py_compile tools/validate_tvs_revalidation_ev163.py
          test -z "$(git ls-files '*__pycache__*')"
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Assert exact canonical prestate blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() { test "$(git hash-object "$1")" = "$2"; }
          check_blob audit_registry/finding_inventory_frozen_2026-09-03.json 02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf
          check_blob audit_registry/finding_revalidation_registry_v0.1.json d874cbe211d2335bb02fa9ed317244b31803e3dc
          check_blob 00_START_HERE/CURRENT_STATE.json 6406675512fdcca7ef75fcfd788631660932fb1c
          check_blob audit_registry/pdf_source_registry_v0.1.json d3471e1cef9b099dc8764a3ee8bf234b9a658ce8
          check_blob audit_registry/pdf_source_pins_v0.1.json 88349638b423689799af700e8a1c8ec99bbfb67b
          check_blob docs/pdf_xsd_semantic_audit/FINDING_EVIDENCE_GATE.md 969cce8b14b50ded2ca5eb745674b894428ecf1a
          check_blob docs/pdf_xsd_semantic_audit/TICKET_VALIDATION_SERVICE_FINDINGS_REGISTER_ADDENDUM.md adea51d2dc812cedaf6f8957651c7ea6ac0dfaff
          check_blob tools/validate_tvs_revalidation_ev163.py 094d16f26be4a00740a23d7014c968e9641f5485
          check_blob tools/close_tvs_revalidation_block.py 6eab930d61c2ea04bdc562e457a3cfd014cd42ed
          check_blob tools/validate_tvs_v21_ev112.py ac95c53ac1ca1900f51df0b06fe3f0ed623700f5
          check_blob tools/validate_tvs_v22_ev113.py 097bc0fc87f80da1d1161eb49345a2603e3304d3
          check_blob tools/validate_tvs_v23_ev114.py 9411dd8123d0b7019b05b495eb493208c0f0ce81
          check_blob tools/validate_tvs_v24_ev115.py 2f2fc8ad2a6d3180a3dc961b8de55ecae2c5c6d7
          check_blob tools/validate_xsd_pool.py 7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd

      - name: Verify pinned successful EV-163 run and artifact online
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          run_json=$(curl -fsSL "${auth[@]}" "$api/actions/runs/34835469790")
          test "$(jq -r .status <<<"$run_json")" = "completed"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .head_sha <<<"$run_json")" = "b2dc3c28bce9dc21591a3e232e12cace90637616"
          test "$(jq -r .head_branch <<<"$run_json")" = "dev/schema-integration"
          job_json=$(curl -fsSL "${auth[@]}" "$api/actions/jobs/103948172257")
          test "$(jq -r .run_id <<<"$job_json")" = "34835469790"
          test "$(jq -r .conclusion <<<"$job_json")" = "success"
          art_json=$(curl -fsSL "${auth[@]}" "$api/actions/artifacts/10343689439")
          test "$(jq -r .name <<<"$art_json")" = "tvs-ev163-evidence"
          test "$(jq -r .expired <<<"$art_json")" = "false"
          test "$(jq -r .digest <<<"$art_json")" = "sha256:dbba3bbd71adf72f0d44ba540d214291190749f5f8cbe5d0a6341461ad68f140"

      - name: Snapshot immutable schema and inventory state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tvs-closure
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/tvs-closure/xsd-before.sha256
          sha256sum audit_registry/finding_inventory_frozen_2026-09-03.json > /tmp/tvs-closure/frozen-before.sha256
          sha256sum audit_registry/pdf_source_registry_v0.1.json audit_registry/pdf_source_pins_v0.1.json > /tmp/tvs-closure/source-before.sha256

      - name: Re-run EV-112 official V2.1 lane
        run: python tools/validate_tvs_v21_ev112.py

      - name: Re-run EV-113 official V2.2 lane
        run: python tools/validate_tvs_v22_ev113.py

      - name: Re-run EV-114 official V2.3 lane
        run: python tools/validate_tvs_v23_ev114.py

      - name: Re-run EV-115 candidate V2.4 lane with authority guard
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_tvs_v24_ev115.py | tee /tmp/tvs-closure/ev115.log
          grep -F "AUTHORITY: candidate/integration V2.4 family; NOT official-release V2.4 conformance" /tmp/tvs-closure/ev115.log
          grep -F "GUARD: do not report this PASS as official-release V2.4 XSD conformance" /tmp/tvs-closure/ev115.log

      - name: Re-run aggregate EV-163 gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_tvs_revalidation_ev163.py --repo-root . --output-dir /tmp/tvs-closure/ev163 | tee /tmp/tvs-closure/ev163.log
          grep -F "PASSED: EV-163 TVS aggregate revalidation gate; projected poststate 168/24, next VDS-001" /tmp/tvs-closure/ev163.log

      - name: Validate complete 50-XSD pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . | tee /tmp/tvs-closure/xsd-pool.log
          grep -Fx "PASSED" /tmp/tvs-closure/xsd-pool.log

      - name: Prove pre-closure immutable inputs unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/tvs-closure/xsd-after-validation.sha256
          cmp /tmp/tvs-closure/xsd-before.sha256 /tmp/tvs-closure/xsd-after-validation.sha256
          sha256sum audit_registry/finding_inventory_frozen_2026-09-03.json > /tmp/tvs-closure/frozen-after-validation.sha256
          cmp /tmp/tvs-closure/frozen-before.sha256 /tmp/tvs-closure/frozen-after-validation.sha256
          sha256sum audit_registry/pdf_source_registry_v0.1.json audit_registry/pdf_source_pins_v0.1.json > /tmp/tvs-closure/source-after-validation.sha256
          cmp /tmp/tvs-closure/source-before.sha256 /tmp/tvs-closure/source-after-validation.sha256

      - name: Execute fail-closed TVS closure writer
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/close_tvs_revalidation_block.py

      - name: Enforce exact three-path mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git status --porcelain=v1 --untracked-files=all | cut -c4- | sort > /tmp/tvs-closure/changed.txt
          cat > /tmp/tvs-closure/expected.txt <<'EOF'
          00_START_HERE/CURRENT_STATE.json
          audit_registry/finding_revalidation_registry_v0.1.json
          docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TVS_2026-09-14.md
          EOF
          sort -o /tmp/tvs-closure/expected.txt /tmp/tvs-closure/expected.txt
          diff -u /tmp/tvs-closure/expected.txt /tmp/tvs-closure/changed.txt
          test -f docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TVS_2026-09-14.md

      - name: Verify exact post-TVS state and authority boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          reg=json.load(open('audit_registry/finding_revalidation_registry_v0.1.json',encoding='utf-8'))
          state=json.load(open('00_START_HERE/CURRENT_STATE.json',encoding='utf-8'))
          entries=reg['inventory']['entries']; by={x['finding_id']:x for x in entries}
          terminal={'context_verified','executable_confirmed','contextual_not_defect','withdrawn','unresolved','superseded'}
          assert sum(x['revalidation_state'] in terminal for x in entries)==168
          assert sum(x['revalidation_state']=='pending' for x in entries)==24
          assert next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')=='VDS-001'
          assert reg['next_revalidation_block']=='VDS'
          for fid in ('TVS-001','TVS-002','TVS-003'):
              assert by[fid]['revalidation_state']=='executable_confirmed'
              assert by[fid]['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TVS_2026-09-14.md'
          block=reg['revalidation_blocks']['TVS']
          assert block['state']=='completed' and block['evidence_id']=='EV-163'
          assert block['artifact_digest']=='sha256:dbba3bbd71adf72f0d44ba540d214291190749f5f8cbe5d0a6341461ad68f140'
          assert block['authority_boundary']['v2_4_release_tag']=='absent'
          assert 'NOT official-release V2.4 XSD conformance' in block['authority_boundary']['EV-115']
          audit=state['audit']
          assert audit['finding_revalidation_completed_findings']==168
          assert audit['finding_revalidation_pending_findings']==24
          assert audit['finding_revalidation_next_block']=='VDS'
          assert audit['finding_revalidation_latest_completed_block']=='TVS'
          assert audit['latest_revalidation_evidence_id']=='EV-163'
          assert audit['latest_executable_evidence_id']=='EV-163'
          assert audit['tvs_revalidation']['next_finding']=='VDS-001'
          print('PASSED post-TVS 168/24 -> VDS-001')
          PY

      - name: Prove schemas and frozen/source registries remained immutable
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.xsd | sort > /tmp/tvs-closure/xsd-final.sha256
          cmp /tmp/tvs-closure/xsd-before.sha256 /tmp/tvs-closure/xsd-final.sha256
          sha256sum audit_registry/finding_inventory_frozen_2026-09-03.json > /tmp/tvs-closure/frozen-final.sha256
          cmp /tmp/tvs-closure/frozen-before.sha256 /tmp/tvs-closure/frozen-final.sha256
          sha256sum audit_registry/pdf_source_registry_v0.1.json audit_registry/pdf_source_pins_v0.1.json > /tmp/tvs-closure/source-final.sha256
          cmp /tmp/tvs-closure/source-before.sha256 /tmp/tvs-closure/source-final.sha256

      - name: Commit atomic TVS closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00_START_HERE/CURRENT_STATE.json audit_registry/finding_revalidation_registry_v0.1.json docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_TVS_2026-09-14.md
          git diff --cached --name-only | sort > /tmp/tvs-closure/staged.txt
          diff -u /tmp/tvs-closure/expected.txt /tmp/tvs-closure/staged.txt
          git commit -m "audit: close TVS revalidation without schema mutation"
          git push origin HEAD:dev/schema-integration
