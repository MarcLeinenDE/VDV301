name: schema-audit-validation

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/schema-audit-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xsd-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check lxml

      - name: Run schema audit checks
        shell: bash
        run: |
          set +e
          mkdir -p audit-results

          python tools/validate_xsd_pool.py \
            --repo-root . \
            --dms-v24-tests \
            > audit-results/root_pool_and_dms_v24.log 2>&1
          root_status=$?

          python tools/validate_legacy_v1_roots.py \
            --repo-root . \
            > audit-results/legacy_v1_root_adapters.log 2>&1
          legacy_status=$?

          python tools/validate_pcs_v21_operation_not_supported.py \
            > audit-results/pcs_001_operation_not_supported.log 2>&1
          pcs_status=$?

          {
            echo 'check,authority,target,exit_code'
            echo "root_compile_plus_dms_v24,mixed_inventory_with_candidate_tests,repository_root,$root_status"
            echo "legacy_v1_root_adapters,official_root_mapping_plus_official_service_xsds,schema_profiles/VDV-301-1.0-root-map.csv,$legacy_status"
            echo "pcs_001_operation_not_supported,official_PCS_V2.1_exact_route_plus_enum_control,PCS_V2.1_Common_V1.0_Enums_V1.0,$pcs_status"
          } > audit-results/validation_status.csv

          echo "root_compile_plus_dms_v24 exit=$root_status"
          cat audit-results/root_pool_and_dms_v24.log
          echo "legacy_v1_root_adapters exit=$legacy_status"
          cat audit-results/legacy_v1_root_adapters.log
          echo "pcs_001_operation_not_supported exit=$pcs_status"
          cat audit-results/pcs_001_operation_not_supported.log

          echo "$root_status" > audit-results/root_status.txt
          echo "$legacy_status" > audit-results/legacy_status.txt
          echo "$pcs_status" > audit-results/pcs_status.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-audit-validation-results
          path: audit-results/
          if-no-files-found: error

      - name: Report validation result
        shell: bash
        run: |
          root_status=$(cat audit-results/root_status.txt)
          legacy_status=$(cat audit-results/legacy_status.txt)
          pcs_status=$(cat audit-results/pcs_status.txt)
          echo "root_status=$root_status"
          echo "legacy_status=$legacy_status"
          echo "pcs_status=$pcs_status"
          if [ "$root_status" -ne 0 ] || [ "$legacy_status" -ne 0 ] || [ "$pcs_status" -ne 0 ]; then
            echo "Validation evidence contains failures; inspect uploaded logs."
          else
            echo "All validation checks passed."
          fi

# one-shot EV-101 evidence run
