name: schema-audit-validation

on:
  push:
    branches:
      - dev/schema-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xsd-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check lxml

      - name: Run exact-pool and root compile checks
        shell: bash
        run: |
          set +e
          mkdir -p audit-results

          python tools/validate_xsd_pool.py \
            --repo-root schema_pools/official/VDV-301-1.0 \
            > audit-results/official_vdv_301_1_0.log 2>&1
          v1_status=$?

          python tools/validate_xsd_pool.py \
            --repo-root . \
            --dms-v24-tests \
            > audit-results/root_pool_and_dms_v24.log 2>&1
          root_status=$?

          {
            echo 'check,authority,target,exit_code'
            echo "official_vdv_301_1_0,official_release,schema_pools/official/VDV-301-1.0,$v1_status"
            echo "root_compile_plus_dms_v24,mixed_inventory_with_candidate_tests,repository_root,$root_status"
          } > audit-results/validation_status.csv

          echo "official_vdv_301_1_0 exit=$v1_status"
          cat audit-results/official_vdv_301_1_0.log
          echo "root_compile_plus_dms_v24 exit=$root_status"
          cat audit-results/root_pool_and_dms_v24.log

          echo "$v1_status" > audit-results/v1_status.txt
          echo "$root_status" > audit-results/root_status.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-audit-validation-results
          path: audit-results/
          if-no-files-found: error

      - name: Enforce validation result
        shell: bash
        run: |
          v1_status=$(cat audit-results/v1_status.txt)
          root_status=$(cat audit-results/root_status.txt)
          if [ "$v1_status" -ne 0 ] || [ "$root_status" -ne 0 ]; then
            echo "One or more validation checks failed. See uploaded evidence/logs."
            exit 1
          fi
