name: schema-audit-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xsd-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check lxml

      - name: Run audit checks
        shell: bash
        run: |
          set +e
          mkdir -p audit-results

          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests > audit-results/root_pool_and_dms_v24.log 2>&1
          root_status=$?
          python tools/validate_legacy_v1_roots.py --repo-root . > audit-results/legacy_v1_root_adapters.log 2>&1
          legacy_status=$?
          python tools/validate_pcs_v21_operation_not_supported.py > audit-results/pcs_001_operation_not_supported.log 2>&1
          pcs_status=$?
          python tools/validate_ce018_service_identification_with_state_list.py > audit-results/ce_018_cardinality.log 2>&1
          ce018_status=$?
          python tools/validate_video_v20_compositors.py > audit-results/ev_103_video_compositors.log 2>&1
          video_status=$?
          python tools/validate_trainset_ev104.py > audit-results/ev_104_trainset.log 2>&1
          trainset_status=$?
          python tools/validate_analog_radio_ev105.py > audit-results/ev_105_analog_radio.log 2>&1
          analog_status=$?
          python tools/validate_common_v23_schema_variant.py > audit-results/ev_106_common_v23_variant.log 2>&1
          common_v23_variant_status=$?
          python tools/validate_dms_v22_deep_read_ev107.py > audit-results/ev_107_dms_v22_deep_read.log 2>&1
          dms_v22_status=$?
          python tools/validate_http_runtime_ev25b.py > audit-results/rv_001_http_runtime.log 2>&1
          http_status=$?
          python tools/validate_discovery_runtime_rv002.py > audit-results/rv_002_discovery_runtime.log 2>&1
          discovery_status=$?
          python tools/validate_time_runtime_rv003.py > audit-results/rv_003_time_sntp.log 2>&1
          time_status=$?
          python tools/validate_video_runtime_rv004.py > audit-results/rv_004_video_rtsp_rtp.log 2>&1
          video_runtime_status=$?
          python tools/validate_sdk_manifest_v0_1.py > audit-results/sdk_manifest_v0_1.log 2>&1
          sdk_manifest_status=$?
          python tools/generate_schema_profile_inventory_v0_1.py --repo-root . --output audit-results/schema_profile_inventory_v0.1.json --check-only > audit-results/sdk_profile_generator_v0_1.log 2>&1
          sdk_profile_status=$?

          {
            echo 'check,authority,target,exit_code'
            echo "root_compile_plus_dms_v24,mixed_inventory_with_candidate_tests,repository_root,$root_status"
            echo "legacy_v1_root_adapters,official_root_mapping_plus_official_service_xsds,schema_profiles/VDV-301-1.0-root-map.csv,$legacy_status"
            echo "pcs_001_operation_not_supported,official_PCS_V2.1_exact_route_plus_enum_control,PCS_V2.1_Common_V1.0_Enums_V1.0,$pcs_status"
            echo "ce_018_cardinality,Common_V1.0_to_V2.4_exact_declared_dependencies,ServiceIdentificationWithStateListStructure,$ce018_status"
            echo "ev_103_video_compositors,official_video_V2.0_plus_candidate_VRS_V2.4_control,VLS_VRS_VDS,$video_status"
            echo "ev_104_trainset,official_TrainSet_V2.2_exact_contexts,TSM_002_TSD_003,$trainset_status"
            echo "ev_105_analog_radio,candidate_AnalogRadio_V2.4,ARA_003,$analog_status"
            echo "ev_106_common_v23_variant,official_Common_V2.3_plus_explicit_PR30_candidate_overlay,CE-020,$common_v23_variant_status"
            echo "ev_107_dms_v22_deep_read,official_DMS_V2.2_exact_stored_XSD,DMS_V2.2_deep_read_findings,$dms_v22_status"
            echo "rv_001_http_runtime,VDV_HTTP_profile_plus_RFC9110_RFC7303,deterministic_classifier,$http_status"
            echo "rv_002_discovery_runtime,VDV_discovery_profiles_plus_RFC6763,deterministic_classifier,$discovery_status"
            echo "rv_003_time_sntp,VDV_TimeService_V1.0_plus_RFC4330,deterministic_classifier,$time_status"
            echo "rv_004_video_rtsp_rtp,VDV_VideoLive_boundary_plus_RTSP1_RTSP2_RFC3550,deterministic_classifier,$video_runtime_status"
            echo "sdk_manifest_v0_1,audit_derived_manifest_and_stored_xsd_graph,sdk_manifest,$sdk_manifest_status"
            echo "sdk_profile_inventory_v0_1,fail_closed_authority_plus_xsd_include_graph,sdk_manifest,$sdk_profile_status"
          } > audit-results/validation_status.csv

          for log in audit-results/*.log; do
            echo "===== $log ====="
            cat "$log"
          done

          echo "$root_status" > audit-results/root_status.txt
          echo "$legacy_status" > audit-results/legacy_status.txt
          echo "$pcs_status" > audit-results/pcs_status.txt
          echo "$ce018_status" > audit-results/ce018_status.txt
          echo "$video_status" > audit-results/video_status.txt
          echo "$trainset_status" > audit-results/trainset_status.txt
          echo "$analog_status" > audit-results/analog_status.txt
          echo "$common_v23_variant_status" > audit-results/common_v23_variant_status.txt
          echo "$dms_v22_status" > audit-results/dms_v22_status.txt
          echo "$http_status" > audit-results/http_status.txt
          echo "$discovery_status" > audit-results/discovery_status.txt
          echo "$time_status" > audit-results/time_status.txt
          echo "$video_runtime_status" > audit-results/video_runtime_status.txt
          echo "$sdk_manifest_status" > audit-results/sdk_manifest_status.txt
          echo "$sdk_profile_status" > audit-results/sdk_profile_status.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-audit-validation-results
          path: audit-results/
          if-no-files-found: error

      - name: Report validation result
        shell: bash
        run: |
          root_status=$(cat audit-results/root_status.txt)
          legacy_status=$(cat audit-results/legacy_status.txt)
          pcs_status=$(cat audit-results/pcs_status.txt)
          ce018_status=$(cat audit-results/ce018_status.txt)
          video_status=$(cat audit-results/video_status.txt)
          trainset_status=$(cat audit-results/trainset_status.txt)
          analog_status=$(cat audit-results/analog_status.txt)
          common_v23_variant_status=$(cat audit-results/common_v23_variant_status.txt)
          dms_v22_status=$(cat audit-results/dms_v22_status.txt)
          http_status=$(cat audit-results/http_status.txt)
          discovery_status=$(cat audit-results/discovery_status.txt)
          time_status=$(cat audit-results/time_status.txt)
          video_runtime_status=$(cat audit-results/video_runtime_status.txt)
          sdk_manifest_status=$(cat audit-results/sdk_manifest_status.txt)
          sdk_profile_status=$(cat audit-results/sdk_profile_status.txt)
          echo "root_status=$root_status legacy_status=$legacy_status pcs_status=$pcs_status ce018_status=$ce018_status video_status=$video_status trainset_status=$trainset_status analog_status=$analog_status common_v23_variant_status=$common_v23_variant_status dms_v22_status=$dms_v22_status http_status=$http_status discovery_status=$discovery_status time_status=$time_status video_runtime_status=$video_runtime_status sdk_manifest_status=$sdk_manifest_status sdk_profile_status=$sdk_profile_status"
          if [ "$root_status" -ne 0 ] || [ "$legacy_status" -ne 0 ] || [ "$pcs_status" -ne 0 ] || [ "$ce018_status" -ne 0 ] || [ "$video_status" -ne 0 ] || [ "$trainset_status" -ne 0 ] || [ "$analog_status" -ne 0 ] || [ "$common_v23_variant_status" -ne 0 ] || [ "$dms_v22_status" -ne 0 ] || [ "$http_status" -ne 0 ] || [ "$discovery_status" -ne 0 ] || [ "$time_status" -ne 0 ] || [ "$video_runtime_status" -ne 0 ] || [ "$sdk_manifest_status" -ne 0 ] || [ "$sdk_profile_status" -ne 0 ]; then
            echo "Validation evidence contains failures; inspect uploaded logs."
            exit 1
          else
            echo "All validation checks passed."
          fi
