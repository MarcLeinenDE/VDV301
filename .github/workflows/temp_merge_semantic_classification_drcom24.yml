name: temp-merge-semantic-classification-drcom24

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drcom24.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drcom24:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify immutable prestate
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=b9f47e4b74d595a62decdf54469774f581fc09cc
          test "$(git rev-parse HEAD^)" = "$CLEAN_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drcom24.yml"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "9cf00322da139480e7789c203325fda3c4435ab3"
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object tools/validate_xsd_pool.py)" = "7a682dbddaeeeb3f9cc269d2e48e5ab000aca4bd"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_COMMON_V24_2026-09-04.md)" = "9a0414a3e92021db25c1d3e4912777a0ee89a556"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/COMMON_V2.4.md)" = "5800c06781b17775f6763a918568d3e5712210c5"
          test ! -e audit_registry/semantic_classification_blocks/DRCOM24_v0.1.json
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PYSTATE'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count'] == 101
          assert r['progress']['remaining_count'] == 91
          assert r['progress']['reviewed_blocks'] == ['ARA','ARCH','BG','CE','CIS','DISC','DMS','DR3011','DR3012','DRARA24','DRCOM10','DRCOM20','DRCOM21','DRCOM22','DRCOM23']
          assert r['progress']['latest_block'] == 'DRCOM23'
          assert r['progress']['latest_block_file'] == 'audit_registry/semantic_classification_blocks/DRCOM23_v0.1.json'
          assert 'DRCOM24-001' not in {e['finding_id'] for e in r['entries']}
          print('PASSED: DRCOM24 semantic prestate is exactly 101/192')
          PYSTATE
          git diff --exit-code

      - name: Materialize exact DRCOM24 block
        shell: bash
        env:
          DRCOM24_BLOCK_ZLIB_B64: ""
        run: |
          set -euo pipefail
          mkdir -p audit_registry/semantic_classification_blocks
          python - <<'PYBLOCK'
          import base64, os, zlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode(os.environ['DRCOM24_BLOCK_ZLIB_B64'], validate=True))
          Path('audit_registry/semantic_classification_blocks/DRCOM24_v0.1.json').write_bytes(data)
          PYBLOCK
          test "$(sha256sum audit_registry/semantic_classification_blocks/DRCOM24_v0.1.json | awk '{print $1}')" = "c2ea28471ec54ba699ae0e92a887b2c033bb71226a68a0a786b09c734e063a37"
          python - <<'PYCHECK'
          import json
          from pathlib import Path
          b=json.loads(Path('audit_registry/semantic_classification_blocks/DRCOM24_v0.1.json').read_text(encoding='utf-8'))
          assert b['block_id'] == 'DRCOM24'
          assert [e['finding_id'] for e in b['entries']] == ['DRCOM24-001']
          e=b['entries'][0]
          assert e['normative_authority'] == 'no_strict_xsd_profile'
          assert e['sdk_behavior'] == 'unsupported_profile'
          assert e['review_state'] == 'manually_reviewed'
          assert any(v['authority'] == 'candidate_integration' for v in e['version_scope'])
          assert any(v['authority'] == 'documentation_only' for v in e['version_scope'])
          print('PASSED: exact DRCOM24 candidate-only authority boundary')
          PYCHECK

      - name: Merge and validate DRCOM24 classification
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRCOM24_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRCOM24; classified=102 remaining=90" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 102 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Verify final tree boundary and persist
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BASE=b9f47e4b74d595a62decdf54469774f581fc09cc
          test "$(git hash-object audit_registry/finding_semantic_classification_schema_v0.1.json)" = "7cb69f527fe9d69e5b0fc59f6a23c36e0e426571"
          test "$(git hash-object tools/validate_finding_semantic_classification.py)" = "3304b31b2233e48d8d85e2ef9e248397d9a86b4e"
          test "$(git hash-object tools/merge_semantic_classification_block.py)" = "bddb17d5f264663611585cde33202c355ce9e5ca"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "ab6d5f09081435e1d744b50af0a3a5f572eb5cef"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "6e401f0bd374379e74ce2a065fab88f2016f9f67"
          python - <<'PYPOST'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text(encoding='utf-8'))
          assert r['progress']['classified_count'] == 102
          assert r['progress']['remaining_count'] == 90
          assert r['progress']['reviewed_blocks'] == ['ARA','ARCH','BG','CE','CIS','DISC','DMS','DR3011','DR3012','DRARA24','DRCOM10','DRCOM20','DRCOM21','DRCOM22','DRCOM23','DRCOM24']
          assert r['progress']['latest_block'] == 'DRCOM24'
          assert r['progress']['latest_block_file'] == 'audit_registry/semantic_classification_blocks/DRCOM24_v0.1.json'
          print('PASSED: DRCOM24 semantic poststate is exactly 102/192')
          PYPOST
          git diff --check
          rm -f .github/workflows/temp_merge_semantic_classification_drcom24.yml
          git add -A
          python - <<'PYDIFF'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only','b9f47e4b74d595a62decdf54469774f581fc09cc'], text=True).splitlines()
          assert names == [
              'audit_registry/finding_semantic_classification_v0.1.json',
              'audit_registry/semantic_classification_blocks/DRCOM24_v0.1.json',
          ], names
          print('PASSED: final tree differs from DRCOM23 clean prestate only by DRCOM24 block and semantic registry')
          PYDIFF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRCOM24 semantic classification"
          git push origin HEAD:dev/schema-integration
