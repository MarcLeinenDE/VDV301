name: TEMP patch TKT EV-158 page 11

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_patch_tkt_ev158_page11.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Patch visual-only page-11 extraction gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d26e5efa213f660bab7ae20b246d5f08a6cdf6da"
          test "$(git hash-object tools/validate_tkt_revalidation_ev158.py)" = "213e0471ee6ed458bc386ea7c0a151052e829a21"
          test "$(git hash-object audit_registry/finding_revalidation_registry_v0.1.json)" = "287e3bbcf4130567b288b1d039e8f576b668012b"
          test "$(git hash-object 00_START_HERE/CURRENT_STATE.json)" = "a911f050fa5e7affc3d03ec9f2b21c68c848d364"

          python - <<'PY'
          from pathlib import Path
          p=Path('tools/validate_tkt_revalidation_ev158.py')
          text=p.read_text(encoding='utf-8')
          old='''    require("CardApplicationInformation" in p11,\n            "PDF page 11 visibly carries CardApplicationInformation spelling")'''
          new='''    require("CardApplicationIn-" in p11 and "formation" in p11,\n            "PDF page 11 extraction preserves the split visible CardApplicationInformation label for visual review")'''
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old,new),encoding='utf-8')
          PY

          new_blob="$(git hash-object tools/validate_tkt_revalidation_ev158.py)"
          python - "$new_blob" <<'PY'
          from pathlib import Path
          import sys
          p=Path('.github/workflows/temp_validate_tkt_ev158.yml')
          text=p.read_text(encoding='utf-8')
          old='213e0471ee6ed458bc386ea7c0a151052e829a21'
          new=sys.argv[1]
          assert text.count(old) == 1
          p.write_text(text.replace(old,new),encoding='utf-8')
          print('new validator blob:',new)
          PY

          rm .github/workflows/temp_patch_tkt_ev158_page11.yml
          python -m py_compile tools/validate_tkt_revalidation_ev158.py
          rm -rf tools/__pycache__
          changed="$(git status --porcelain | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' '.github/workflows/temp_patch_tkt_ev158_page11.yml' '.github/workflows/temp_validate_tkt_ev158.yml' 'tools/validate_tkt_revalidation_ev158.py' | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Create narrowly scoped correction commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate_tkt_revalidation_ev158.py .github/workflows/temp_validate_tkt_ev158.yml
          git rm .github/workflows/temp_patch_tkt_ev158_page11.yml
          git diff --cached --check
          git commit -m 'audit: make TKT EV-158 page-11 extraction visual-aware'
          echo "CORRECTION_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:dev/schema-integration
