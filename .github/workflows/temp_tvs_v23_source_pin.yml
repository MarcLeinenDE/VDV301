name: temp-tvs-v23-source-pin

on:
  push:
    branches:
      - dev/schema-integration

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and hash official TVS V2.3 PDF
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          from datetime import datetime, timezone

          url = 'https://www.vdv.de/301-2-16-sdes-v2-3-ticketvalidation.pdfx'
          req = urllib.request.Request(url, headers={'User-Agent': 'VDV301-audit-source-pin/1.0'})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = r.read()
          if not data.startswith(b'%PDF-'):
              raise SystemExit('Downloaded source is not a PDF')
          result = {
              'source_id': 'TVS_V2.3',
              'expected_sha256': hashlib.sha256(data).hexdigest(),
              'expected_size_bytes': len(data),
              'pinned_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'deep_read_source_ready': True,
          }
          print('TVS_V23_PIN=' + json.dumps(result, separators=(',', ':')))
          PY
