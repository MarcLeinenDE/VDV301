name: TEMP close DMS V2.4 revalidation subblock

on:
  push:
    branches: [dev/schema-integration]
    paths:
      - .github/workflows/temp_close_dms_v24_revalidation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-dms-v24:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Fetch exact byte-pinned DMS V2.4 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          source_id='DMS_V2.4'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==source_id)
          pin=next(x for x in pins['sources'] if x['source_id']==source_id)
          req=urllib.request.Request(source['official_url'],headers={'User-Agent':'VDV301-Audit-EV142-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
          with urllib.request.urlopen(req,timeout=90) as response: data=response.read()
          actual=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert actual==pin['expected_sha256'],(actual,pin['expected_sha256'])
          assert len(data)==int(pin['expected_size_bytes']),(len(data),pin['expected_size_bytes'])
          target=Path('local_sources/vdv_pdfs')/source['local_filename']; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          print(f'PIN_OK {source_id} sha256={actual} size={len(data)}')
          PY

      - name: Re-run EV-142 exact evidence gate
        shell: bash
        env:
          EV142_OUTPUT_DIR: artifacts/ev142-closure
        run: |
          set -euo pipefail
          python tools/validate_dms_v24_revalidation_ev142.py

      - name: Root XSD pool regression gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests

      - name: Pre-closure immutable and mutation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/dms_v24_revalidation_evidence_2026-09-05.json)" = "7fc23edbfafd9d3e507679f015ad36ffc02e2fd0"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/DMS_V2.4.md)" = "dba69e23579186f1c6c26451f93d9f04ba5728b3"
          test "$(git hash-object audit_registry/deep_read_findings_delta_dms_v24_2026-08-28.json)" = "3e07eec98384744b113cb25c37916c67ac23cc6f"
          test "$(git hash-object audit_registry/deep_read_registry_delta_dms_v24_2026-08-28.json)" = "edffb50eeb6e12c7eae8f6d5fcac3e6566482adc"
          test "$(git hash-object audit_registry/deep_read_findings_delta_door_v21_2026-08-29.json)" = "5daf0521652097d141947ccba6811b22e66e2468"
          test "$(git hash-object audit_registry/deep_read_registry_delta_door_v21_2026-08-29.json)" = "47a0f7ab3c9004bbfd2e01819194718b356c107f"
          test "$(git hash-object IBIS-IP_DeviceManagementService_V2.4.xsd)" = "d222dfd98b2be3777576388da7ace8f333d24c3f"
          test "$(git hash-object IBIS-IP_common_V2.4.xsd)" = "1946fd37e29ced605654f49ea3d98cd2fbbdc8e4"
          test "$(git hash-object IBIS-IP_Enumerations_V2.4.xsd)" = "2afed8cf23afa91db92b0f043cc5b4ad428b0f25"
          test "$(git hash-object tools/validate_dms_v24_deep_read_ev108.py)" = "6a88fbc6546d73d9f68936889087a8120b118358"
          test "$(git hash-object tools/validate_dms_v24_revalidation_ev142.py)" = "e7a97dd9d705a8a7d578cc5794a4c3841a5509d5"
          test "$(git hash-object tools/close_dms_v24_revalidation_block.py)" = "cf0001d6b13ce8f06b566173269e477d7c198fb3"
          git diff --exit-code -- '*.xsd'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Verify pre-closure DMS V2.4 route and DOOR next block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          state=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          entries=reg['inventory']['entries']; by_id={x['finding_id']:x for x in entries}
          terminal=sum(x.get('revalidation_state')!='pending' for x in entries); pending=sum(x.get('revalidation_state')=='pending' for x in entries)
          assert (terminal,pending)==(100,92),(terminal,pending)
          assert reg['next_revalidation_block']=='DMS'
          assert reg['revalidation_blocks']['DMS']['state']=='completed'
          assert reg['revalidation_blocks']['DMS_V2.2']['state']=='completed'
          assert reg['revalidation_blocks']['DMS_V2.2']['next_subblock']=='DMS_V2.4'
          assert 'DMS_V2.4' not in reg['revalidation_blocks']
          assert by_id['DRDMS24-001']['revalidation_state']=='pending'
          assert by_id['DRDOOR21-001']['revalidation_state']=='pending'
          assert by_id['DRDOOR21-002']['revalidation_state']=='pending'
          audit=state['audit']; assert audit['finding_revalidation_completed_findings']==100 and audit['finding_revalidation_pending_findings']==92
          assert audit['finding_revalidation_next_block']=='DMS' and audit['finding_revalidation_latest_completed_block']=='DMS_V2.2'
          print('PRE_STATE_OK terminal=100 pending=92 next=DMS_V2.4 then DOOR_V2.1')
          PY

      - name: Write DMS V2.4 closure state
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python tools/close_dms_v24_revalidation_block.py

      - name: Remove temporary workflow plumbing and generated caches
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_validate_dms_v24_ev142.yml
          rm -f .github/workflows/temp_close_dms_v24_revalidation.yml
          rm -rf artifacts/ev142-closure
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Verify closure delta allowlist and immutable authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git hash-object audit_registry/dms_v24_revalidation_evidence_2026-09-05.json)" = "7fc23edbfafd9d3e507679f015ad36ffc02e2fd0"
          test "$(git hash-object IBIS-IP_DeviceManagementService_V2.4.xsd)" = "d222dfd98b2be3777576388da7ace8f333d24c3f"
          test "$(git hash-object IBIS-IP_common_V2.4.xsd)" = "1946fd37e29ced605654f49ea3d98cd2fbbdc8e4"
          test "$(git hash-object IBIS-IP_Enumerations_V2.4.xsd)" = "2afed8cf23afa91db92b0f043cc5b4ad428b0f25"
          git diff --exit-code -- '*.xsd'
          python - <<'PY'
          import subprocess
          allowed={'audit_registry/finding_revalidation_registry_v0.1.json','00_START_HERE/CURRENT_STATE.json','docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_V24_2026-09-05.md','.github/workflows/temp_validate_dms_v24_ev142.yml','.github/workflows/temp_close_dms_v24_revalidation.yml'}
          lines=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()
          changed={line[3:] for line in lines if len(line)>=4}
          assert not changed-allowed,f'unexpected closure delta: {sorted(changed-allowed)}'
          required={'audit_registry/finding_revalidation_registry_v0.1.json','00_START_HERE/CURRENT_STATE.json','docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DMS_V24_2026-09-05.md'}
          assert required<=changed,f'missing required closure delta: {sorted(required-changed)}'
          print('ALLOWLIST_OK',sorted(changed))
          PY

      - name: Verify post-closure state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          state=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          entries=reg['inventory']['entries']; by_id={x['finding_id']:x for x in entries}
          terminal=sum(x.get('revalidation_state')!='pending' for x in entries); pending=sum(x.get('revalidation_state')=='pending' for x in entries)
          assert (terminal,pending)==(101,91),(terminal,pending)
          assert by_id['DRDMS24-001']['revalidation_state']=='context_verified'
          assert by_id['DRDOOR21-001']['revalidation_state']=='pending'
          assert by_id['DRDOOR21-002']['revalidation_state']=='pending'
          assert reg['next_revalidation_block']=='DOOR'
          block=reg['revalidation_blocks']['DMS_V2.4']; assert block['state']=='completed' and block['next_block']=='DOOR' and block['next_subblock']=='DOOR_V2.1'
          assert reg['revalidation_blocks']['DMS']['state']=='completed' and reg['revalidation_blocks']['DMS_V2.2']['state']=='completed'
          audit=state['audit']; assert audit['finding_revalidation_completed_findings']==101 and audit['finding_revalidation_pending_findings']==91
          assert audit['finding_revalidation_next_block']=='DOOR' and audit['finding_revalidation_latest_completed_block']=='DMS_V2.4'
          assert audit['dms_v24_deep_revalidation']['next_subblock']=='DOOR_V2.1'
          assert json.loads(Path('audit_registry/finding_inventory_frozen_2026-09-03.json').read_text())['entry_count']==192
          print('POST_STATE_OK terminal=101 pending=91 next=DOOR_V2.1')
          PY

      - name: Commit closure atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Marc Leinen"
          git config user.email "34336531+MarcLeinenDE@users.noreply.github.com"
          git add -A
          git commit -m "audit: revalidate DMS V2.4 deep finding subblock [skip ci]"
          git push origin HEAD:dev/schema-integration
