name: temp-merge-semantic-classification-drtrainset21-v21-001-002

on:
  push:
    branches: [dev/schema-integration]
    paths: [.github/workflows/temp_merge_semantic_classification_drtrainset21_v21_001_002.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-drtrainset21-v21-001-002:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2
      - name: Verify exact prestate and TrainSet V2.1 authority boundary
        shell: bash
        run: |
          set -euo pipefail
          STAGED_BASE=01b389fff639cd0f0b4cd2c80c1726179ff38261
          CLEAN_BASE=2b928df4459c601a6d0f52a2a51aaa01653a8400
          test "$(git rev-parse HEAD^)" = "$STAGED_BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/temp_merge_semantic_classification_drtrainset21_v21_001_002.yml"
          test "$(git hash-object audit_registry/semantic_classification_blocks/DRTRAINSET21_V21_001_002_v0.1.json)" = "859959b65e06c83dda6b9828f527e18e591f1d34"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "fac917ac884d086a90fb28037cc6075cafbe6fcb"
          test "$(git hash-object audit_registry/drtrainset21_revalidation_evidence_2026-09-06.json)" = "5378874f7948527a76d18a313b1c8879dd2ec981"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTRAINSET21_2026-09-06.md)" = "2c208c72b065f58538729128338af99783b9f310"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/deep_read/TRAINSET_V2.1.md)" = "6d5680f438e7e592aaf1d056e39224e7c2a3f2d9"
          test "$(git hash-object tools/validate_trainset_v21_ev109.py)" = "f88208bff7e39bb38a86a310dc121f486984f807"
          test "$(git hash-object IBIS-IP_TrainSetInformationService_V2.1.xsd)" = "897f373e31b76aa23d8bc206854b042524e4c102"
          test "$(git hash-object IBIS-IP_TrainSetManagementService_V2.1.xsd)" = "add9d1cb37e5759ff7a77855b239108d38373206"
          test "$(git hash-object IBIS-IP_TrainSetDataService_V2.1.xsd)" = "c2cdb73fcae265a2e4e0349ac6072e3548e36d8b"
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-before.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          target={'DRTRAINSET21-001','DRTRAINSET21-002'}
          reg=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert reg['progress']['classified_count']==123
          assert reg['progress']['remaining_count']==69
          assert reg['progress']['latest_block']=='DRTIME10_V10_003'
          assert not ({e['finding_id'] for e in reg['entries']} & target)
          prov=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          states={e['finding_id']:e['revalidation_state'] for e in prov['inventory']['entries'] if e['finding_id'] in target}
          assert states=={'DRTRAINSET21-001':'context_verified','DRTRAINSET21-002':'context_verified'},states
          ev=json.loads(Path('audit_registry/drtrainset21_revalidation_evidence_2026-09-06.json').read_text())
          assert ev['evidence_id']=='EV-148' and ev['result']=='PASS'
          assert ev['authority']['source_id']=='TRAINSET_V2.1'
          assert ev['executable_context']['terminal_state_requires_xml_execution'] is False
          assert ev['executable_context']['EV-109_rerun_in_EV-148_job']=='PASS'
          assert ev['finding_results']['DRTRAINSET21-001']['executable_effect'] is False
          assert ev['finding_results']['DRTRAINSET21-002']['executable_effect'] is False
          assert ev['finding_results']['DRTRAINSET21-002']['likely_intended_reference']=='TrainSetManagementService'
          assert ev['finding_results']['DRTRAINSET21-002']['likely_intended_reference_is_not_used_as_schema_rewrite'] is True
          block=json.loads(Path('audit_registry/semantic_classification_blocks/DRTRAINSET21_V21_001_002_v0.1.json').read_text())
          assert block['block_id']=='DRTRAINSET21_V21_001_002'
          assert [e['finding_id'] for e in block['entries']]==['DRTRAINSET21-001','DRTRAINSET21-002']
          assert all(e['sdk_behavior']=='no_runtime_diagnostic' for e in block['entries'])
          assert all(e['runtime_match']['state']=='not_applicable' for e in block['entries'])
          assert block['entries'][0]['normative_authority']=='contextual_only'
          assert block['entries'][1]['normative_authority']=='selected_xsd'
          print('PASSED: exact DRTRAINSET21-001/002 prestate and documentation-only boundary')
          PY
          git diff --exit-code
      - name: Re-run EV-109 as exact-version counter-context
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_trainset_v21_ev109.py | tee /tmp/ev109.log
          grep -F "PASSED: EV-109 TrainSet V2.1 deep-read evidence completed" /tmp/ev109.log
      - name: Merge two-finding block and validate registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py --block audit_registry/semantic_classification_blocks/DRTRAINSET21_V21_001_002_v0.1.json | tee /tmp/merge.log
          grep -F "PASSED: merged block DRTRAINSET21_V21_001_002; classified=125 remaining=67" /tmp/merge.log
          python tools/validate_finding_semantic_classification.py | tee /tmp/semantic.log
          grep -F "PASSED: semantic classification registry valid; 125 reviewed entries anchored to frozen baseline" /tmp/semantic.log
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          sha256sum ./*.xsd | sort -k2 > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          assert r['progress']['classified_count']==125
          assert r['progress']['remaining_count']==67
          assert r['progress']['latest_block']=='DRTRAINSET21_V21_001_002'
          assert r['progress']['latest_block_file']=='audit_registry/semantic_classification_blocks/DRTRAINSET21_V21_001_002_v0.1.json'
          ids={e['finding_id'] for e in r['entries']}
          assert {'DRTRAINSET21-001','DRTRAINSET21-002'} <= ids
          assert 'DRTRAINSET21-003' not in ids
          print('PASSED: DRTRAINSET21 part 1 poststate 125/192; DRTRAINSET21-003 untouched')
          PY
      - name: Persist exact two-finding boundary
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp_merge_semantic_classification_drtrainset21_v21_001_002.yml
          git add audit_registry/finding_semantic_classification_v0.1.json
          python - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'.github/workflows/temp_merge_semantic_classification_drtrainset21_v21_001_002.yml','audit_registry/finding_semantic_classification_v0.1.json'}
          assert staged==expected,(staged,expected)
          changed=set(subprocess.check_output(['git','diff','--name-only','2b928df4459c601a6d0f52a2a51aaa01653a8400'],text=True).splitlines())
          expected_changed={'audit_registry/finding_semantic_classification_v0.1.json','audit_registry/semantic_classification_blocks/DRTRAINSET21_V21_001_002_v0.1.json'}
          assert changed==expected_changed,(changed,expected_changed)
          print('PASSED: persistent boundary is master registry + DRTRAINSET21-001/002 block only')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit: merge DRTRAINSET21-001 and DRTRAINSET21-002 semantic classification"
          git push origin HEAD:dev/schema-integration
