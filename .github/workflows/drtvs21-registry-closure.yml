name: DRTVS21 registry closure

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/drtvs21-registry-closure.yml
      - audit_registry/drtvs21_revalidation_evidence_2026-09-07.json
      - docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_DRTVS21_003_V21_XSD_SUPPORT_2026-09-07.md

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF and XSD tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --disable-pip-version-check lxml

      - name: Snapshot immutable XSD pool
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-before.sha256
          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test "$(git rev-parse HEAD:audit_registry/drtvs21_revalidation_evidence_2026-09-07.json)" = "79a9d5c2c2861071e942435d4fc9afaf61ef27f4"
          test "$(git rev-parse HEAD:docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_DRTVS21_003_V21_XSD_SUPPORT_2026-09-07.md)" = "0921fc741e132ad7f0c9fcc8cebeaa8fa4eb09a4"
          test "$(git rev-parse HEAD:docs/pdf_xsd_semantic_audit/deep_read/TVS_V2.1.md)" = "d658d818833bfe7a436f92708ff4ec89402b51b3"
          test "$(git rev-parse HEAD:tools/validate_tvs_v21_ev112.py)" = "ac95c53ac1ca1900f51df0b06fe3f0ed623700f5"

      - name: Fetch exact byte-pinned TVS V2.1 PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          sid='TVS_V2.1'
          sources=json.loads(Path('audit_registry/pdf_source_registry_v0.1.json').read_text())
          pins=json.loads(Path('audit_registry/pdf_source_pins_v0.1.json').read_text())
          source=next(x for x in sources['sources'] if x['source_id']==sid)
          pin=next(x for x in pins['sources'] if x['source_id']==sid)
          assert source['official_url']=='https://www.vdv.de/301-2-16-sds-v2-1-ticketvalidation.pdfx'
          assert source['local_filename']=='TVS_V2.1.pdf'
          assert pin['expected_sha256']=='676c05d7615f2f2ce95ec4eb085428cb0c970a4226809566e8968200df69988d'
          assert int(pin['expected_size_bytes'])==752652
          assert str(pin['evidence_run_id'])=='33248946083'
          for attempt in range(4):
              try:
                  req=urllib.request.Request(source['official_url'],headers={
                    'User-Agent':'VDV301-Audit-EV150-Closure/0.1 (+https://github.com/MarcLeinenDE/VDV301)',
                    'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.1'})
                  with urllib.request.urlopen(req,timeout=90) as r: data=r.read()
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(2*(attempt+1))
          sha=hashlib.sha256(data).hexdigest()
          assert data.startswith(b'%PDF-')
          assert sha==pin['expected_sha256']
          assert len(data)==int(pin['expected_size_bytes'])
          target=Path('local_sources/vdv_pdfs')/source['local_filename']
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          print('TVS_V21_PIN_OK',sha,len(data))
          PY

      - name: Re-run EV-150, EV-112 and repository XSD regression pool
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_drtvs21_revalidation_ev150.py --repo-root . --output-dir artifacts/ev150-closure
          python tools/validate_tvs_v21_ev112.py
          python tools/validate_xsd_pool.py --repo-root . --dms-v24-tests
          find . -maxdepth 1 -type f -name '*.xsd' -print0 | sort -z | xargs -0 sha256sum > /tmp/xsd-after.sha256
          diff -u /tmp/xsd-before.sha256 /tmp/xsd-after.sha256

      - name: Close DRTVS21 block atomically
        shell: bash
        env:
          CLOSURE_RUN_ID: ${{ github.run_id }}
          CLOSURE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy,json,os
          from pathlib import Path

          rp=Path('audit_registry/finding_revalidation_registry_v0.1.json')
          sp=Path('00_START_HERE/CURRENT_STATE.json')
          ep=Path('audit_registry/drtvs21_revalidation_evidence_2026-09-07.json')
          correction=Path('docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_DRTVS21_003_V21_XSD_SUPPORT_2026-09-07.md')
          report=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTVS21_2026-09-07.md')
          d=json.loads(rp.read_text(encoding='utf-8'))
          s=json.loads(sp.read_text(encoding='utf-8'))
          e=json.loads(ep.read_text(encoding='utf-8'))
          run_id=os.environ['CLOSURE_RUN_ID']; run_url=os.environ['CLOSURE_RUN_URL']

          scope=['DRTVS21-001','DRTVS21-002','DRTVS21-003','DRTVS21-004']
          states={
            'DRTVS21-001':'executable_confirmed',
            'DRTVS21-002':'context_verified',
            'DRTVS21-003':'context_verified',
            'DRTVS21-004':'context_verified'}

          assert e['evidence_id']=='EV-150' and e['result']=='PASS'
          assert e['scope']==scope
          assert e['successful_run_id']=='34087850644'
          assert e['successful_job_id']=='101635233786'
          assert e['head_sha']=='9e99931b27645f4a45850b6c7a45486f04369825'
          assert e['artifact_id']=='10005814043'
          assert e['artifact_digest']=='sha256:8540e52a7866f8e034f2b5ed1496f2048173d183df58f7d9db42953c5ada579a'
          assert e['authority']['source_id']=='TVS_V2.1'
          assert e['authority']['pdf_sha256']=='676c05d7615f2f2ce95ec4eb085428cb0c970a4226809566e8968200df69988d'
          assert e['authority']['exact_xsd_route']=={
            'IBIS-IP_TicketValidationService_V2.1.xsd':'f6497e6469b82ee19b185c4de749d13a7ca60bed',
            'IBIS-IP_common_V1.0.xsd':'194f73adfb9a62dfff8ce6a7b6a0cdc9b1c6a36c',
            'IBIS-IP_Enumerations_V1.0.xsd':'a9bea5bc73003ed91ded8519db06c32c4067831d'}
          assert e['fresh_visual_evidence']['status']=='PASS'
          assert sorted(map(int,e['fresh_visual_evidence']['physical_pages'].keys()))==[5,10,11,12,13,14,15]
          assert {k:v['recommended_terminal_state'] for k,v in e['finding_results'].items()}==states
          assert e['audit_correction']['required'] is True
          assert e['audit_correction']['finding_survives'] is True
          assert e['xsd_operation_inventory_correction']['SubscribeCurrentStopPoint_present'] is False
          assert e['xsd_operation_inventory_correction']['SubscribeCurrentStop_present'] is False
          assert e['full_xsd_pool']=={'count':50,'result':'PASS','role':'repository-regression-only'}
          assert e['immutable_guards']['xsd_mutated'] is False
          assert e['immutable_guards']['frozen_inventory_mutated'] is False
          assert correction.exists()

          inv=d['inventory']; entries=inv['entries']
          assert inv['state']=='frozen' and inv['entry_count']==192 and len(entries)==192
          assert d['next_revalidation_block']=='DRTVS21'
          pre_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          pre_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (pre_terminal,pre_pending)==(122,70),(pre_terminal,pre_pending)
          by={x['finding_id']:x for x in entries}
          for fid in scope:
              assert by[fid]['revalidation_state']=='pending'
              assert by[fid]['terminal_state_source'] is None
              by[fid]['revalidation_state']=states[fid]
              by[fid]['terminal_state_source']=str(report)

          post_terminal=sum(x['revalidation_state']!='pending' for x in entries)
          post_pending=sum(x['revalidation_state']=='pending' for x in entries)
          assert (post_terminal,post_pending)==(126,66),(post_terminal,post_pending)

          first_pending=next(x['finding_id'] for x in entries if x['revalidation_state']=='pending')
          assert first_pending=='HDS-001', first_pending
          next_block='HDS'
          next_subblock='HDS_V21_V22_V22A_HDS001'
          d['next_revalidation_block']=next_block

          blocks=d['revalidation_blocks']
          assert 'TVS_V2.1_DRTVS21' not in blocks
          prior_trainset=copy.deepcopy(blocks['TRAINSET_V2.2_DRTRAINSET22'])
          blocks['TVS_V2.1_DRTVS21']={
            'date':'2026-09-07',
            'state':'completed',
            'parent_block':'DRTVS21',
            'scope_kind':'frozen_deep_read_findings_subblock',
            'source_id':'TVS_V2.1',
            'publication':'VDV 301-2-16 TicketValidationService V2.1, 07/2018',
            'authority_lane':'byte-pinned official PDF plus exact official mixed-version XSD route TVS V2.1 -> Common V1.0 -> Enumerations V1.0',
            'pdf_sha256':'676c05d7615f2f2ce95ec4eb085428cb0c970a4226809566e8968200df69988d',
            'pdf_size_bytes':752652,
            'original_pin_evidence_run_id':'33248946083',
            'deep_read_blob':'d658d818833bfe7a436f92708ff4ec89402b51b3',
            'evidence_id':'EV-150',
            'evidence_run_id':'34087850644',
            'evidence_job_id':'101635233786',
            'evidence_head_sha':'9e99931b27645f4a45850b6c7a45486f04369825',
            'artifact_id':'10005814043',
            'artifact_digest':'sha256:8540e52a7866f8e034f2b5ed1496f2048173d183df58f7d9db42953c5ada579a',
            'evidence_record':str(ep),
            'closure_run_id':run_id,
            'closure_run_url':run_url,
            'fresh_visual_physical_pages':[5,10,11,12,13,14,15],
            'visual_gap_status':'closed_by_fresh_byte_pinned_render_and_manual_inspection',
            'findings':states,
            'audit_correction':str(correction),
            'drtvs21_003_xsd_support_correction':'exact V2.1 service XSD contains neither local SubscribeCurrentStopPoint nor SubscribeCurrentStop operation/global element; finding survives on same-document PDF evidence',
            'xsd_mutation':False,
            'frozen_inventory_mutation':False,
            'next_block':next_block,
            'next_subblock':next_subblock,
            'terminal_state_source':str(report)
          }
          assert blocks['TRAINSET_V2.2_DRTRAINSET22']==prior_trainset

          a=s['audit']
          assert a['finding_inventory_count']==192
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(122,70)
          assert a['finding_revalidation_next_block']=='DRTVS21'
          assert a['finding_revalidation_current_block']=='TRAINSET_V2.2_DRTRAINSET22'
          assert a['finding_revalidation_latest_completed_block']=='TRAINSET_V2.2_DRTRAINSET22'
          assert a['latest_revalidation_evidence_id']=='EV-149'
          assert 'drtvs21_revalidation' not in a
          a['finding_revalidation_completed_findings']=126
          a['finding_revalidation_pending_findings']=66
          a['finding_revalidation_current_block']='TVS_V2.1_DRTVS21'
          a['finding_revalidation_latest_completed_block']='TVS_V2.1_DRTVS21'
          a['finding_revalidation_next_block']=next_block
          a['finding_revalidation_latest_terminal_state_source']=str(report)
          a['latest_revalidation_evidence_id']='EV-150'
          a['latest_audit_correction']=str(correction)
          a['drtvs21_revalidation']={
            'status':'complete',
            'completed_at_run':run_id,
            'evidence_id':'EV-150',
            'evidence_run_id':'34087850644',
            'evidence_job_id':'101635233786',
            'evidence_head_sha':'9e99931b27645f4a45850b6c7a45486f04369825',
            'artifact_id':'10005814043',
            'artifact_digest':'sha256:8540e52a7866f8e034f2b5ed1496f2048173d183df58f7d9db42953c5ada579a',
            'terminal_states':states,
            'exact_xsd_route':'TVS V2.1 -> Common V1.0 -> Enumerations V1.0',
            'fresh_visual_physical_pages':[5,10,11,12,13,14,15],
            'visual_gap_status':'closed',
            'audit_correction':str(correction),
            'drtvs21_003_finding_survives_after_xsd_support_correction':True,
            'report':str(report),
            'next_block':next_block,
            'next_subblock':next_subblock,
            'xsd_mutation':False,
            'frozen_inventory_mutation':False
          }

          rp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          sp.write_text(json.dumps(s,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          report.write_text(f'''# Finding Revalidation — DRTVS21 / TicketValidationService V2.1\n\nDate: 2026-09-07  \nScope: `DRTVS21-001`, `DRTVS21-002`, `DRTVS21-003`, `DRTVS21-004`  \nEvidence: `EV-150`, successful run `34087850644`, job `101635233786`  \nEvidence commit: `9e99931b27645f4a45850b6c7a45486f04369825`  \nClosure run: `{run_id}`\n\n## Authority route\n\nOfficial byte-pinned VDV 301-2-16 TicketValidationService V2.1 PDF (`676c05d7615f2f2ce95ec4eb085428cb0c970a4226809566e8968200df69988d`, 752652 bytes) plus the exact official mixed-version XSD route `TicketValidationService V2.1 -> Common V1.0 -> Enumerations V1.0`. No latest-wins substitution is permitted.\n\nEV-150 reran EV-112 and the complete 50-root-XSD repository regression pool. No XSD changed. Fresh 180-DPI renders of physical pages 5, 10, 11, 12, 13, 14 and 15 were manually inspected.\n\n## DRTVS21-001 — executable_confirmed\n\nPhysical page 14 visibly prints `IBIS-IP.NMToken` for `CurrentTripRef`. The exact V2.1 XSD declares `IBIS-IP.NMTOKEN`; Common V1.0 contains the exact uppercase type and no `IBIS-IP.NMToken` alias. EV-112 rerun confirms the negative compile boundary for the PDF spelling.\n\n## DRTVS21-002 — context_verified\n\nPhysical page 15 visibly concatenates the GetCurrentLine response display as `TicketValidationServiceCurrentLineData`, while the adjacent structure display preserves a separator and the exact XSD type is `TicketValidationService.CurrentLineDataStructure`. The common PDF convention of omitting `Structure` is retained as context and is not itself classified as the defect; the material anomaly is the missing service-name separator.\n\n## DRTVS21-003 — context_verified with audit correction\n\nFormal PDF material uses `SubscribeCurrentStopPoint` (pages 5, 10, 12 and 14), while German and English flow text use `SubscribeCurrentStop` (pages 11 and 13). The finding survives as a PDF editorial operation-name inconsistency.\n\nOne historical Deep Read support sentence is superseded: the exact V2.1 service XSD operation group does **not** contain `SubscribeCurrentStopPoint`; in fact its local operation/global inventory contains neither Subscribe spelling. Therefore XSD positive support is removed from this finding. The dedicated correction trail is `{correction}`.\n\n## DRTVS21-004 — context_verified\n\nVisible documentation residue is confirmed: page 10 contains `Unscubscribe` and `Unscubscibe` in operation-description prose; page 15 contains `GetrazziaResponsetData` and `Error Respone`. These are non-executable editorial strings and create no XML aliases or validation rules.\n\n## Closure\n\nEV-150 PASS; EV-112 rerun PASS; all 50 root XSDs PASS; exact TVS V2.1 authority retained; frozen 192-finding inventory unchanged; no XSD mutation. Revalidation count is now **126/192 terminal, 66 pending**. The first remaining pending finding is `HDS-001`; next block is `HDS` (`HDS_V21_V22_V22A_HDS001`).\n''',encoding='utf-8')
          print('DRTVS21_CLOSE_WRITE_OK terminal=126 pending=66 next=HDS')
          PY

      - name: Cleanup, verify allowlist, commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/ev150-closure local_sources/vdv_pdfs/TVS_V2.1.pdf tools/__pycache__
          rm .github/workflows/temp_validate_drtvs21_ev150.yml
          rm .github/workflows/drtvs21-registry-closure.yml

          test "$(git rev-parse HEAD:audit_registry/finding_inventory_frozen_2026-09-03.json)" = "02fe0d5f71f2b2674319d37f970ecd2b5bfe27cf"
          test -z "$(git diff --name-only | grep -E '\.xsd$' || true)"

          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.loads(Path('audit_registry/finding_revalidation_registry_v0.1.json').read_text())
          s=json.loads(Path('00_START_HERE/CURRENT_STATE.json').read_text())
          by={x['finding_id']:x for x in d['inventory']['entries']}
          states={
            'DRTVS21-001':'executable_confirmed',
            'DRTVS21-002':'context_verified',
            'DRTVS21-003':'context_verified',
            'DRTVS21-004':'context_verified'}
          assert all(by[f]['revalidation_state']==st for f,st in states.items())
          assert d['revalidation_blocks']['TVS_V2.1_DRTVS21']['state']=='completed'
          assert d['next_revalidation_block']=='HDS'
          first=next(x['finding_id'] for x in d['inventory']['entries'] if x['revalidation_state']=='pending')
          assert first=='HDS-001'
          a=s['audit']
          assert (a['finding_revalidation_completed_findings'],a['finding_revalidation_pending_findings'])==(126,66)
          assert a['finding_revalidation_next_block']=='HDS'
          assert a['finding_revalidation_latest_completed_block']=='TVS_V2.1_DRTVS21'
          assert a['latest_revalidation_evidence_id']=='EV-150'
          assert a['latest_audit_correction']=='docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_DRTVS21_003_V21_XSD_SUPPORT_2026-09-07.md'

          allowed={
            '.github/workflows/temp_validate_drtvs21_ev150.yml',
            '.github/workflows/drtvs21-registry-closure.yml',
            'audit_registry/finding_revalidation_registry_v0.1.json',
            '00_START_HERE/CURRENT_STATE.json',
            'docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_DRTVS21_2026-09-07.md'
          }
          changed=set(subprocess.check_output(['git','status','--porcelain'],text=True).splitlines())
          paths={line[3:] for line in changed if len(line)>=4}
          assert paths==allowed,(paths,allowed)
          print('DRTVS21_POST_CLOSURE_CONSISTENCY_PASS')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit: close DRTVS21 revalidation block [skip ci]'
          git push origin HEAD:dev/schema-integration
