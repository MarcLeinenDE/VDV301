name: TEMP EV-119 Common V2.1 evidence

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - tools/validate_common_v21_ev119.py
      - .github/workflows/temp-ev119-common-v21.yml

permissions:
  contents: read

jobs:
  ev119:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lxml
        run: python -m pip install --disable-pip-version-check lxml
      - name: Run EV-119
        run: python tools/validate_common_v21_ev119.py
