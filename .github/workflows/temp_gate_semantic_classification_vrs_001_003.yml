name: temp-gate-semantic-classification-vrs-001-003

on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp_gate_semantic_classification_vrs_001_003.yml

permissions:
  contents: read

jobs:
  gate-vrs-001-003:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: dev/schema-integration
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema lxml==6.1.2

      - name: Verify exact VRS 001-003 prestate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "45da6e164cdab31f438e714fd2d851db8af17a9c"
          test "$(git hash-object audit_registry/semantic_classification_blocks/VRS_V10_V24_001_003_v0.1.json)" = "67f9a4522f7039185f3a4afabfd8626dfe5059be"
          test "$(git hash-object audit_registry/finding_semantic_classification_v0.1.json)" = "58b731e20f74940a8b2edec1af25f4b7712b95af"
          test "$(git hash-object audit_registry/finding_provenance_baseline_2026-09-14.json)" = "5234317290e094962b9cde9662af856fe1fec6d1"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VRS_2026-09-14.md)" = "21fe2f2d615e5d48b82213c8519ded5978d68750"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_CHOICE_NOTATION_2026-08-29.md)" = "fe024798ba1b9803ec70ee3b97def63ee03d298f"
          test "$(git hash-object docs/pdf_xsd_semantic_audit/VIDEO_RECORDING_SERVICE_FINDINGS_REGISTER_ADDENDUM.md)" = "d9392d85a855717ac8041f9d34b127160244f946"
          test "$(git hash-object IBIS-IP_VideoRecordingService_V2.0.xsd)" = "6ef0dae64ce6f4d3aa4f652d6d166896e71aaac7"
          test "$(git hash-object IBIS-IP_VideoRecordingService_V2.4.xsd)" = "07ff2c41731e63fd85b203e4b8e0186136caaaaf"

      - name: Verify VRS authority and V2.0 compositor boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e IBIS-IP_VideoRecordingService_V1.0.xsd
          python - <<'PY'
          import json
          from pathlib import Path
          from lxml import etree

          registry=json.loads(Path('audit_registry/finding_semantic_classification_v0.1.json').read_text())
          baseline=json.loads(Path('audit_registry/finding_provenance_baseline_2026-09-14.json').read_text())
          block=json.loads(Path('audit_registry/semantic_classification_blocks/VRS_V10_V24_001_003_v0.1.json').read_text())

          assert registry['progress']['classified_count']==181
          assert registry['progress']['remaining_count']==11
          assert registry['progress']['latest_block']=='VLS_V10_V20_001_005'
          assert [e['finding_id'] for e in block['entries']]==['VRS-001','VRS-002','VRS-003']

          frozen={e['finding_id']:e for e in baseline['inventory']['entries']}
          assert frozen['VRS-001']['revalidation_state']=='context_verified'
          assert frozen['VRS-002']['revalidation_state']=='context_verified'
          assert frozen['VRS-003']['revalidation_state']=='executable_confirmed'
          for fid in ('VRS-001','VRS-002','VRS-003'):
              assert frozen[fid]['terminal_state_source']=='docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VRS_2026-09-14.md'

          by={e['finding_id']:e for e in block['entries']}
          for fid in ('VRS-001','VRS-002'):
              assert by[fid]['normative_authority']=='no_strict_xsd_profile'
              assert by[fid]['primary_issue_kind']=='release_authority_gap'
              assert by[fid]['defect_assessment']=='authority_gap'
              assert by[fid]['sdk_behavior']=='unsupported_profile'
          assert by['VRS-003']['normative_authority']=='selected_xsd'
          assert by['VRS-003']['primary_issue_kind']=='structure_mismatch'
          assert by['VRS-003']['defect_assessment']=='cross_artifact_mismatch'
          assert by['VRS-003']['sdk_behavior']=='error_with_advisory'
          assert by['VRS-003']['runtime_match']['state']=='candidate'

          d10=Path('docs/pdf_xsd_semantic_audit/deep_read/VRS_V1.0.md').read_text()
          d24=Path('docs/pdf_xsd_semantic_audit/deep_read/VRS_V2.4.md').read_text()
          correction=Path('docs/pdf_xsd_semantic_audit/AUDIT_CORRECTION_DELTA_CHOICE_NOTATION_2026-08-29.md').read_text()
          ev=Path('docs/pdf_xsd_semantic_audit/24c_executable_validation_video_compositors.md').read_text()

          assert 'no VideoRecordingService V1.0 service XSD' in d10
          assert 'VRS V2.0 or V2.4 XSD must not be substituted for V1.0' in d10
          assert 'state: open' in d24 and 'merged: false' in d24
          assert 'service XSD blob: 07ff2c41731e63fd85b203e4b8e0186136caaaaf' in d24
          assert 'V2.4 XSD authority = candidate/integration only' in d24
          assert 'A prefixed minus sign denotes XML choice.' in correction
          assert 'ordinary required `AlarmArchiveFillLevel` and `OperationErrorMessage` fields plus an `a/b` choice between `State` and `StartStopMode`' in correction

          NS={'xs':'http://www.w3.org/2001/XMLSchema'}
          tree=etree.parse('IBIS-IP_VideoRecordingService_V2.0.xsd')
          etree.XMLSchema(tree)
          names=tree.xpath("/xs:schema/xs:complexType[@name='VideoRecordingService.VideoRecordingStateResponseStructure']/xs:choice/xs:element/@name",namespaces=NS)
          assert names==['State','AlarmArchiveFillLevel','OperationErrorMessage','StartStopMode']
          assert 'PASS: State + AlarmArchiveFillLevel is rejected as expected' in ev
          assert 'VRS-003 remains executable-confirmed for official V2.0.' in ev

          terminal=Path('docs/pdf_xsd_semantic_audit/FINDING_REVALIDATION_VRS_2026-09-14.md').read_text()
          assert 'EV-166' in terminal
          assert '34840970136' in terminal
          assert '34841174977' in terminal
          print('PASSED: VRS-001..003 authority and compositor semantics verified')
          PY

      - name: Simulate merge and validate semantic registry
        shell: bash
        run: |
          set -euo pipefail
          python tools/merge_semantic_classification_block.py \
            --block audit_registry/semantic_classification_blocks/VRS_V10_V24_001_003_v0.1.json \
            --output /tmp/vrs-001-003.json
          python tools/validate_finding_semantic_classification.py --registry /tmp/vrs-001-003.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/vrs-001-003.json',encoding='utf-8'))
          assert r['progress']['classified_count']==184
          assert r['progress']['remaining_count']==8
          assert r['progress']['latest_block']=='VRS_V10_V24_001_003'
          print('PASSED: simulated registry is exactly 184/192')
          PY

      - name: Validate all 50 root XSDs and prove read-only gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name '*.xsd' | wc -l)" -eq 50
          sha256sum ./*.xsd | sort > /tmp/xsd-before.sha256
          python tools/validate_xsd_pool.py --repo-root .
          sha256sum ./*.xsd | sort > /tmp/xsd-after.sha256
          cmp /tmp/xsd-before.sha256 /tmp/xsd-after.sha256
          git diff --exit-code
          echo "PASSED: VRS 001-003 semantic gate complete; repository remains unmodified"
