name: temp-finalize-hds-v22a-close-v2
on:
  push:
    branches:
      - dev/schema-integration
    paths:
      - .github/workflows/temp-finalize-hds-v22a-close-v2.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build closure from reviewed finalizer logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temp-finalize-hds-v22a-close.yml').read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n          git diff --check"
          start = source.index(marker_start) + len(marker_start)
          end = source.index(marker_end, start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          script = '\n'.join(lines)
          old = "report_p.write_text(report.rstrip()+appendix+'\\n',encoding='utf-8')"
          new = "report_p.write_text(report.rstrip()+'\\n'+appendix.strip()+'\\n',encoding='utf-8')"
          if script.count(old) != 1:
              raise SystemExit(f'expected one EOF write expression, got {script.count(old)}')
          script = script.replace(old, new)
          exec(compile(script, 'hds-v22a-finalizer', 'exec'), {})
          PY
          git diff --check
      - name: Commit exact HDS V2.2a closure and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git add 00_START_HERE/CURRENT_STATE.json \
            audit_registry/deep_read_registry_delta_hds_v22a_2026-08-29.json \
            audit_registry/deep_read_findings_delta_hds_v22a_2026-08-29.json \
            audit_registry/finding_revalidation_registry_v0.1.json \
            docs/pdf_xsd_semantic_audit/deep_read/HDS_V2.2a.md \
            docs/pdf_xsd_semantic_audit/HTML_DISPLAY_SERVICE_FINDINGS_REGISTER_ADDENDUM.md \
            docs/pdf_xsd_semantic_audit/validation_backlog.md \
            docs/pdf_xsd_semantic_audit/AUDIT_HANDOFF_DELTA_HDS_V22A_DEEP_READ_2026-08-29.md
          git rm .github/workflows/temp-finalize-hds-v22a-close.yml
          git rm .github/workflows/temp-patch-hds-v22a-finalizer.yml
          git rm .github/workflows/temp-finalize-hds-v22a-close-v2.yml
          if git diff --cached --name-only | grep -E '\.xsd$'; then exit 1; fi
          git config user.name MarcLeinenDE
          git config user.email 34336531+MarcLeinenDE@users.noreply.github.com
          git commit -m 'Deep-read HTMLDisplayService V2.2a and close HDS block'
          git push origin HEAD:dev/schema-integration
